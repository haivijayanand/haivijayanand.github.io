<script>
"use strict";
/* ============================================================
   DATA
   ============================================================ */
const UNITS = [
 {id:"u1", n:1, title:"Concept of Law", short:"What law is, what it does, and how it is classified."},
 {id:"u2", n:2, title:"Sources of Law", short:"Custom, legislation, precedent, the Constitution and equity."},
 {id:"u3", n:3, title:"Legal Systems and Courts", short:"Common law vs civil law; India's court hierarchy; Article 141."},
 {id:"u4", n:4, title:"Reading a Statute", short:"Parts of an Act; literal, golden, mischief and purposive rules."},
 {id:"u5", n:5, title:"Reading a Case", short:"Ratio and obiter; stare decisis; briefing a judgment."},
 {id:"u6", n:6, title:"Legal Research and Citation", short:"Law reports, citations, databases and referencing style."},
 {id:"u7", n:7, title:"Moot Court and Advocacy", short:"Memorials, oral rounds and courtroom etiquette."}
];
const EXTRAS = [
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"maxims", ic:"📜", title:"Latin maxims"},
 {id:"cases", ic:"🏛️", title:"Leading cases"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"brief", ic:"📝", title:"Case brief builder"},
 {id:"refs", ic:"📚", title:"References"}
];

const FLASH = [
 ["Law","A body of rules, recognised and enforced by the State, that governs conduct in society."],
 ["Rule of law","Everyone, including the government, is subject to the law; no arbitrary power (A.V. Dicey)."],
 ["Substantive law","Law that creates rights and duties, e.g. the law of contract or crimes."],
 ["Procedural law","Law that says how rights are enforced in court, e.g. the Code of Civil Procedure."],
 ["Public law","Governs the relation between the State and individuals: constitutional, administrative, criminal law."],
 ["Private law","Governs relations between private persons: contract, torts, property, family law."],
 ["Custom","A rule observed continuously and uniformly for a long time, which has obtained the force of law."],
 ["Legislation","Law made by a competent legislature – Parliament or a State Legislature."],
 ["Delegated legislation","Rules, regulations or bye-laws made by an executive body under power given by a parent Act."],
 ["Precedent","An earlier judicial decision that is followed in later cases on similar facts."],
 ["Stare decisis","'Stand by what has been decided' – courts follow earlier decisions on the same point of law."],
 ["Ratio decidendi","The legal principle on which a case is decided; the binding part of a judgment."],
 ["Obiter dictum","A remark by the judge 'by the way' that is not necessary for the decision; persuasive only."],
 ["Per incuriam","A decision given in ignorance of a binding statute or precedent; it loses its binding force."],
 ["Sub silentio","A point not argued or considered by the court; a decision on it is not a binding precedent."],
 ["Overruling","A higher court (or larger bench) declares that an earlier decision in another case was wrong."],
 ["Reversing","A higher court sets aside the decision of a lower court in the same case, on appeal."],
 ["Distinguishing","Not following a precedent because the material facts of the present case are different."],
 ["Article 141","Law declared by the Supreme Court is binding on all courts within the territory of India."],
 ["Article 13","Laws inconsistent with Fundamental Rights are void; 'law' includes custom and usage."],
 ["Literal rule","Give the words of a statute their plain, ordinary meaning, even if the result seems harsh."],
 ["Golden rule","Depart from the literal meaning only to avoid an absurd or repugnant result."],
 ["Mischief rule","Ask what mischief the Act was meant to cure and interpret it to suppress that mischief (Heydon's Case, 1584)."],
 ["Purposive approach","Interpret the words to carry out the purpose of the legislation as a whole."],
 ["Harmonious construction","Read two conflicting provisions so that both can operate, without one destroying the other."],
 ["Proviso","A clause beginning 'Provided that…' which creates an exception or condition to the main section."],
 ["Primary source","The law itself: Constitution, statutes, rules, judgments."],
 ["Secondary source","Writing about the law: textbooks, commentaries, articles, law reviews."],
 ["Memorial","The written submission of a party in a moot court competition."],
 ["Neutral citation","A court-assigned citation independent of any publisher, e.g. 2023 INSC 1 for the Supreme Court."]
];

const MAXIMS = [
 ["Stare decisis","Stand by what has been decided.","Courts follow earlier decisions on the same point."],
 ["Ratio decidendi","The reason for the decision.","The binding principle of a judgment."],
 ["Obiter dictum (pl. dicta)","Said by the way.","Remarks not needed for the decision; persuasive only."],
 ["Per incuriam","Through lack of care.","A decision that missed a binding statute or precedent."],
 ["Sub silentio","In silence.","A point the court decided without argument or consideration."],
 ["Ubi jus ibi remedium","Where there is a right, there is a remedy.","Basis of many tort and writ remedies (Ashby v White)."],
 ["Audi alteram partem","Hear the other side.","Rule of natural justice: no one is condemned unheard."],
 ["Nemo judex in causa sua","No one should be a judge in their own cause.","Rule against bias in natural justice."],
 ["Ignorantia juris non excusat","Ignorance of the law is no excuse.","A person cannot escape liability by saying they did not know the law."],
 ["Ejusdem generis","Of the same kind.","General words after specific words take their colour: 'cars, buses and other vehicles' means road vehicles."],
 ["Noscitur a sociis","A word is known by the company it keeps.","Read an unclear word in the light of the words around it."],
 ["Expressio unius est exclusio alterius","Expressing one thing excludes the other.","If a law lists items, those not listed are presumed excluded."],
 ["Generalia specialibus non derogant","General provisions do not override special ones.","A special law prevails over a general law on the same subject."],
 ["Lex posterior derogat priori","A later law overrides an earlier one.","When two laws of equal rank conflict, the later one prevails."],
 ["Ut res magis valeat quam pereat","Let the thing rather stand than fall.","Prefer the interpretation that makes a provision work."],
 ["Delegatus non potest delegare","A delegate cannot delegate further.","A body given law-making power cannot hand it on without authority."],
 ["Actus curiae neminem gravabit","An act of the court shall prejudice no one.","Delay or error by the court should not harm a party."],
 ["Res judicata","A matter already judged.","The same issue between the same parties cannot be tried again."],
 ["Ultra vires","Beyond the powers.","Action or rule made outside the legal power given; void."],
 ["Locus standi","Place to stand.","The right of a person to bring a case before the court."],
 ["Amicus curiae","Friend of the court.","A person who assists the court on a point of law."],
 ["Suo motu","On its own motion.","A court acting without anyone filing a case."],
 ["Prima facie","At first sight.","Enough evidence to raise a case, unless rebutted."],
 ["Bona fide","In good faith.","Honest, without fraud or bad intention."],
 ["Inter alia","Among other things.","Used when only some items of a list are mentioned."],
 ["Mutatis mutandis","With necessary changes.","Apply the same rule with changes needed for the new situation."]
];

const CASES = [
 {n:"Heydon's Case", c:"(1584) 3 Co Rep 7a", u:4, p:"Laid down the mischief rule: find the common law before the Act, the mischief it did not cover, the remedy Parliament chose, and the true reason for that remedy."},
 {n:"Whiteley v Chappell", c:"(1868) LR 4 QB 147", u:4, p:"Literal rule. Impersonating 'a person entitled to vote' did not cover impersonating a dead voter, because a dead person is not entitled to vote."},
 {n:"Adler v George", c:"[1964] 2 QB 7", u:4, p:"Golden rule. 'In the vicinity of' a prohibited place was read to include being inside it, to avoid an absurd result."},
 {n:"Smith v Hughes", c:"[1960] 1 WLR 830", u:4, p:"Mischief rule. Soliciting 'in a street' covered women calling from balconies and windows, because the mischief was soliciting that people in the street could see and hear."},
 {n:"Venkataramana Devaru v State of Mysore", c:"AIR 1958 SC 255", u:4, p:"Harmonious construction of Articles 25(2)(b) and 26(b): both provisions given effect without one cancelling the other."},
 {n:"In re Delhi Laws Act", c:"AIR 1951 SC 332", u:2, p:"Legislature may delegate subordinate law-making power but cannot delegate its essential legislative function."},
 {n:"Kesavananda Bharati v State of Kerala", c:"(1973) 4 SCC 225", u:1, p:"Parliament can amend the Constitution but not destroy its basic structure; rule of law and judicial review are part of it."},
 {n:"Indira Nehru Gandhi v Raj Narain", c:"1975 Supp SCC 1", u:1, p:"Free and fair elections and the rule of law are part of the basic structure."},
 {n:"ADM Jabalpur v Shivkant Shukla", c:"(1976) 2 SCC 521", u:5, p:"During the Emergency the majority held that no one could approach courts to enforce Article 21. Later overruled in Puttaswamy – a classic example of overruling."},
 {n:"K.S. Puttaswamy v Union of India", c:"(2017) 10 SCC 1", u:5, p:"Nine-judge bench: privacy is a fundamental right; expressly overruled ADM Jabalpur on Article 21."},
 {n:"Maneka Gandhi v Union of India", c:"(1978) 1 SCC 248 = AIR 1978 SC 597", u:6, p:"'Procedure established by law' under Article 21 must be fair, just and reasonable. Useful for practising parallel citations."},
 {n:"State of U.P. v Synthetics and Chemicals Ltd", c:"(1991) 4 SCC 139", u:5, p:"Explained per incuriam and sub silentio: a decision on a point not argued is not a binding precedent."},

function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}
function animBox(id,title,svg){

}

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Law</b> is a set of rules made or recognised by the State, applied by courts, and backed by sanctions. It aims at order <i>and</i> justice.</div>
 <h4>Definitions to know</h4>
 <table class="t"><tr><th>Jurist</th><th>Definition (in short)</th><th>School</th></tr>
 <tr><td>John Austin</td><td>Law is the command of the sovereign, backed by a sanction.</td><td>Analytical / positivist</td></tr>

 <h4>What law does</h4>
 <ul><li><b>Keeps order</b> – settles disputes peacefully.</li><li><b>Protects rights</b> – life, liberty, property.</li><li><b>Guides behaviour</b> – tells people what they may and may not do.</li><li><b>Brings change</b> – e.g. laws abolishing untouchability (Article 17) or child marriage.</li></ul>
 <h4>Law, morality and justice</h4>
 <p>Law and morality overlap (murder is both illegal and immoral) but are not the same. Lying to a friend is immoral but usually not illegal; parking on the wrong side is illegal but hardly immoral. Justice is the goal law aims at; a law can be valid yet unjust, which is why courts test laws against the Constitution.</p>

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Sources of law</b> are where a legal rule gets its authority. In India today the main sources are the <b>Constitution</b>, <b>legislation</b> and <b>precedent</b>; <b>custom</b> and <b>equity</b> fill gaps.</div>
 <h4>1. The Constitution – the highest source</h4>
 <p>Every other law must agree with it. Under <b>Article 13</b>, any law that takes away Fundamental Rights is void, and 'law' here expressly includes custom and usage having the force of law.</p>
 <h4>2. Legislation</h4>
 <ul><li><b>Supreme legislation</b>: Acts of Parliament and State Legislatures, within the subjects given to them by the Seventh Schedule (Union, State and Concurrent Lists).</li>
 <li><b>Delegated (subordinate) legislation</b>: rules, regulations, notifications and bye-laws made by the executive under power given by an Act. It must stay within that Act (<i>ultra vires</i> otherwise). The legislature cannot hand over its <i>essential</i> law-making function (<i>In re Delhi Laws Act</i>, 1951).</li></ul>
 <h4>3. Precedent</h4><p>Decisions of higher courts bind lower courts (stare decisis). Article 141 makes Supreme Court law binding everywhere in India. Studied in detail in Unit 5.</p>

 <p>Kinds: <b>general</b> custom (whole country), <b>local</b> custom (a region), <b>family</b> custom, and <b>conventional usage</b> (trade practice that becomes part of contracts).</p>
 <h4>5. Justice, equity and good conscience</h4><p>Where no statute, precedent or custom applies, Indian courts decided cases by 'justice, equity and good conscience' – a residuary source going back to colonial regulations.</p>
 <h4>Secondary influences</h4><p>Writings of jurists, foreign judgments, international conventions and reports of the Law Commission of India do not bind courts but often persuade them.</p></div>
</div><div>

 <tr><td>Central law vs State law (Concurrent List)</td><td>Central law generally prevails – Article 254.</td></tr></table></div>

function bindingAnswer(s,t){
  const [ , sc, ss]=SRC[s], [ , tc, ts]=TGT[t];
  if(sc==="SC"){
    if(tc!=="SC") return ["Binding","Article 141: law declared by the Supreme Court binds all courts in India."];
    if(ss>ts) return ["Binding","A decision of a larger bench binds a smaller bench of the same court."];
    if(ss===ts) return ["Binding (refer if in doubt)","A coordinate bench is bound; if it disagrees it must refer the question to a larger bench (Dawoodi Bohra, 2005)."];
    return ["Not binding","A larger bench is not bound by a smaller bench and may overrule it."];
  }

    if(tc==="SC") return ["Persuasive only","A High Court decision never binds the Supreme Court."];
    if(tc==="BHC") return ["Persuasive only","One High Court's decision does not bind another High Court."];
    if(tc==="MHC"){ if(ss>ts) return ["Binding","A Division Bench binds a single judge of the same High Court."]; if(ss===ts) return ["Binding (refer if in doubt)","A coordinate bench of the same High Court is followed; doubts go to a larger bench."]; return ["Not binding","A larger bench may overrule a single judge."]; }
    return ["Binding","Courts subordinate to the Madras High Court in Tamil Nadu must follow its decisions."];
  }

    if(tc==="BHC") return ["Binding on its own benches","Follow the bench-strength rule within the Bombay High Court."];
    return ["Persuasive only","A High Court binds only courts subordinate to it; elsewhere its view is persuasive."];
  }
  return ["Not a binding precedent","Trial court decisions bind the parties in that case but are not binding precedents for other courts."];
}

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Stare decisis</b>: like cases are decided alike. Only the <b>ratio decidendi</b> of a higher court binds; everything else in the judgment is at most persuasive.</div>
 <h4>Parts of a judgment</h4><p>Cause title (parties, court, date) → facts → issues → arguments of both sides → analysis of law and precedents → <b>ratio</b> → decision and order. Separate concurring or dissenting opinions may follow.</p>
 <h4>Ratio vs obiter</h4>
 <table class="t"><tr><th>Ratio decidendi</th><th>Obiter dictum</th></tr>
 <tr><td>The principle necessary for the decision on the material facts</td><td>Statements not needed for the decision – hypotheticals, wider remarks</td></tr>
 <tr><td>Binding on lower courts (and coordinate benches)</td><td>Persuasive; Supreme Court obiter is given great weight by lower courts</td></tr></table>
 <h4>When a precedent loses force</h4>
 <ul><li><b>Overruled</b> – a higher court or larger bench declares it wrong (e.g. <i>Puttaswamy</i>, 2017, overruled <i>ADM Jabalpur</i>, 1976).</li>
 <li><b>Reversed</b> – set aside on appeal in the same case.</li>
 <li><b>Distinguished</b> – the material facts are different, so it does not apply.</li>
 <li><b>Per incuriam</b> – given in ignorance of a binding statute or precedent.</li>
 <li><b>Sub silentio</b> – the point was not argued or considered (<i>State of U.P. v Synthetics and Chemicals</i>, 1991).</li>
 <li><b>Changed by statute</b> – the legislature alters the law the decision applied.</li></ul>
 <h4>Briefing a case (FIRAC)</h4><p><b>F</b>acts · <b>I</b>ssues · <b>R</b>ule (law applied) · <b>A</b>nalysis (court's reasoning) · <b>C</b>onclusion. Use the <a href="#brief" data-go="brief">case brief builder</a> for every case taught in class.</p></div>
 ${animBox("goodAnim","Finding the ratio: Goodhart's method",`<svg viewBox="0 0 800 220"><g id="g0" class="node fade"><rect x="10" y="20" width="180" height="70" rx="10"/><text x="100" y="52" text-anchor="middle">All facts</text><text x="100" y="72" text-anchor="middle" class="sub">as stated by the judge</text></g><g id="g1" class="node fade"><rect x="210" y="20" width="180" height="70" rx="10"/><text x="300" y="52" text-anchor="middle">Material facts</text><text x="300" y="72" text-anchor="middle" class="sub">the ones that matter</text></g><g id="g2" class="node fade"><rect x="410" y="20" width="180" height="70" rx="10"/><text x="500" y="52" text-anchor="middle">Decision</text><text x="500" y="72" text-anchor="middle" class="sub">on those facts</text></g><g id="g3" class="node fade"><rect x="610" y="20" width="180" height="70" rx="10"/><text x="700" y="52" text-anchor="middle">Ratio</text><text x="700" y="72" text-anchor="middle" class="sub">facts + decision → rule</text></g><g id="g4" class="node fade"><rect x="210" y="130" width="380" height="70" rx="10"/><text x="400" y="162" text-anchor="middle">Inversion test (Wambaugh)</text><text x="400" y="182" text-anchor="middle" class="sub">reverse it – does the result change?</text></g></svg>`)}
</div><div>
 <div class="card lab"><h3>Tag the judgment</h3><p>A short, made-up judgment based on the idea in <i>Donoghue v Stevenson</i>. Label each sentence.</p><div id="judg"></div>
 <div class="row"><button class="btn" id="jCheck">Check</button><button class="btn sec" id="jReset">Reset</button><span id="jScore"></span></div></div>
 <div class="card"><h3>Overruling vs reversing</h3>
 <table class="t"><tr><th></th><th>Overruling</th><th>Reversing</th></tr>
 <tr><td>Which case?</td><td>An earlier, different case</td><td>The same case, on appeal</td></tr>
 <tr><td>Who?</td><td>Higher court or larger bench</td><td>Appellate court</td></tr>
 <tr><td>Effect on parties of old case</td><td>Not reopened</td><td>Lower court's order set aside</td></tr></table>
 <div class="ex">Prospective overruling: in <i>I.C. Golaknath v State of Punjab</i> (1967) the Supreme Court applied its new rule only to the future, so earlier amendments were left untouched.</div></div>
</div></div>`+unitFoot(5)+footer(); },
 init(){
  const build=()=>{ $("#judg").innerHTML = JUDG.map((s,i)=>`<div class="sentence" data-i="${i}"><div>${i+1}. ${esc(s[0])}</div><select><option value="">Label…</option>${Object.entries(TAGN).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select><div class="why" hidden>${esc(s[2])}</div></div>`).join(""); $("#jScore").textContent=""; };

const REPORTERS = {SCC:"Supreme Court Cases (Eastern Book Company)",SCR:"Supreme Court Reports (official reporter)",AIR:"All India Reporter",MLJ:"Madras Law Journal",SCALE:"Supreme Court Almanac (SCALE)",JT:"Judgments Today",INSC:"Supreme Court neutral citation",AC:"Appeal Cases (UK, House of Lords / Privy Council)",QB:"Queen's Bench (UK)",WLR:"Weekly Law Reports (UK)"};
const COURTS = {SC:"Supreme Court of India",Mad:"Madras High Court",Bom:"Bombay High Court",Cal:"Calcutta High Court",Del:"Delhi High Court",Ker:"Kerala High Court",Kar:"Karnataka High Court",All:"Allahabad High Court",PC:"Privy Council"};
function decodeCitation(s){
  s=s.trim(); let m;
  if((m=s.match(/^\(?(\d{4})\)?\s*(\d+)\s*(SCC|SCR|MLJ|SCALE|JT)\s*(\d+)$/i))) return {Year:m[1],Volume:m[2],Reporter:REPORTERS[m[3].toUpperCase()]||m[3],Page:m[4],Note:"Read as: year, volume of that year, report series, first page."};
  if((m=s.match(/^\[(\d{4})\]\s*(\d+)?\s*(SCR|AC|QB|WLR)\s*(\d+)$/i))) return {Year:m[1],Volume:m[2]||"–",Reporter:REPORTERS[m[3].toUpperCase()]||m[3],Page:m[4],Note:"Square brackets: the year is needed to find the volume."};
  if((m=s.match(/^(\d{4})\s*Supp\s*(SCC)\s*(\d+)$/i))) return {Year:m[1],Volume:"Supplement",Reporter:REPORTERS.SCC,Page:m[3],Note:"Supp = supplementary volume of that year."};
  if((m=s.match(/^AIR\s*(\d{4})\s*([A-Za-z]+)\s*(\d+)$/i))) return {Year:m[1],Court:COURTS[m[2][0].toUpperCase()+m[2].slice(1).toLowerCase()]||COURTS[m[2].toUpperCase()]||m[2],Reporter:REPORTERS.AIR,Page:m[3],Note:"AIR: year, court, page. No volume number."};
  if((m=s.match(/^(\d{4})\s*INSC\s*(\d+)$/i))) return {Year:m[1],Court:"Supreme Court of India",Number:m[2],Reporter:REPORTERS.INSC,Note:"Neutral citation: assigned by the court, the same in every database."};
  if((m=s.match(/^\(?(\d{4})\)?\s*(\d+)?\s*(LR)\s*(\d+)\s*(QB|IA)\s*(\d+)$/i))) return {Year:m[1],Volume:m[4],Reporter:"Law Reports, "+m[5].toUpperCase(),Page:m[6],Note:"Older English Law Reports."};
  return null;
}
VIEWS.u6 = { html(){ return unitHead(6)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Research</b> means finding the current, authoritative law and showing exactly where it comes from. Start with <b>primary sources</b>, use <b>secondary sources</b> to understand them, and <b>cite</b> every one.</div>
 <table class="t"><tr><th>Primary sources</th><th>Secondary sources</th></tr>
 <tr><td>Constitution, Acts, rules, notifications, judgments, treaties</td><td>Textbooks, commentaries, journal articles, Law Commission reports, encyclopaedias, dictionaries</td></tr></table>
 <h4>Law reports</h4>
 <table class="t"><tr><th>Abbreviation</th><th>Report</th></tr>${Object.entries(REPORTERS).slice(0,7).map(([k,v])=>`<tr><td><b>${k}</b></td><td>${v}</td></tr>`).join("")}</table>
 <p>One case is often reported in several series. <i>Maneka Gandhi</i> is <b>(1978) 1 SCC 248</b> and also <b>AIR 1978 SC 597</b> – these are <i>parallel citations</i>.</p>
 <h4>Databases</h4>
 <ul><li><b>Free</b>: India Code (Acts), Indian Kanoon (judgments), Supreme Court and High Court websites, eCourts services.</li>
 <li><b>Subscription (via the TNNLU library)</b>: SCC Online, Manupatra, and international databases such as Westlaw, LexisNexis, HeinOnline and JSTOR.</li></ul>
 <h4>Research steps</h4><ol><li>Frame the question precisely.</li><li>Read a textbook chapter for the big picture.</li><li>Find the statute and check amendments on India Code.</li><li>Find leading cases; check whether they are still good law (later citing cases).</li><li>Write it up, citing every source in one consistent style.</li></ol>
 <h4>Citation style</h4><p>Law schools commonly use <b>OSCOLA</b> or the <b>Bluebook</b>. Follow whichever your course outline or moot rules require, and keep it consistent. Footnotes go at the end of the sentence they support. Copying without citing is plagiarism and is treated seriously.</p></div>
</div><div>
 <div class="card lab"><h3>Citation decoder</h3><p>Type a citation or pick an example.</p>
 <div class="row"><input type="text" id="citIn" placeholder="e.g. (1973) 4 SCC 225" style="flex:1"><button class="btn" id="citGo">Decode</button></div>
 <div class="row" style="margin-top:6px">${["(1973) 4 SCC 225","AIR 1978 SC 597","2023 INSC 1","1975 Supp SCC 1","[1932] AC 562","AIR 1958 SC 255"].map(c=>`<button class="btn sm sec" data-cit="${c}">${c}</button>`).join("")}</div>
 <div id="citOut"></div></div>
 <div class="card"><h3>OSCOLA in brief</h3>
 <table class="t"><tr><th>Source</th><th>Pattern</th></tr>
 <tr><td>Case</td><td><i>Maneka Gandhi v Union of India</i> (1978) 1 SCC 248</td></tr>
 <tr><td>Pinpoint</td><td><i>Maneka Gandhi v Union of India</i> (1978) 1 SCC 248 [56]</td></tr>
 <tr><td>Statute</td><td>Indian Contract Act 1872, s 10</td></tr>
 <tr><td>Constitution</td><td>Constitution of India, art 21</td></tr>
 <tr><td>Book</td><td>Glanville Williams, <i>Learning the Law</i> (17th edn, Sweet &amp; Maxwell 2020) 45</td></tr>
 <tr><td>Article</td><td>AL Goodhart, 'Determining the Ratio Decidendi of a Case' (1930) 40 Yale LJ 161</td></tr></table>
 <p style="font-size:14px;color:var(--muted)">Case names in italics; no full stops in abbreviations; pinpoint page or paragraph at the end.</p></div>
</div></div>`+unitFoot(6)+footer(); },
 init(){
  const run=v=>{ const r=decodeCitation(v); $("#citOut").innerHTML = r ? `<div class="decode">${Object.entries(r).filter(([k])=>k!=="Note").map(([k,x])=>`<div><small>${k}</small><b>${esc(x)}</b></div>`).join("")}</div><div class="fb info">${r.Note}</div>` : `<div class="fb bad">Pattern not recognised. Try forms like (1973) 4 SCC 225, AIR 1978 SC 597 or 2023 INSC 1.</div>`; };
  $("#citGo").onclick=()=>run($("#citIn").value);
  $("#citIn").onkeydown=e=>{ if(e.key==="Enter") run(e.target.value); };
  $$("[data-cit]").forEach(b=>b.onclick=()=>{ $("#citIn").value=b.dataset.cit; run(b.dataset.cit); });
  miniQuiz(6);

VIEWS.u7 = { html(){ return unitHead(7)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>A moot</b> is a mock appeal on a hypothetical problem. Teams write a <b>memorial</b> for each side and argue before judges. It trains research, writing and oral advocacy together.</div>
 <h4>The process</h4><ol><li><b>Read the problem</b> several times; list facts, dates, parties and the court.</li><li><b>Frame issues</b> – usually 3 or 4 questions of law.</li><li><b>Research</b> statutes, cases and articles for both sides.</li><li><b>Write the memorial</b> in the prescribed format and word limit.</li><li><b>Prepare oral arguments</b>: a road-map, key authorities, answers to likely questions.</li><li><b>Argue</b>: petitioner first, then respondent, then rebuttal and sur-rebuttal where allowed.</li></ol>
 <h4>Oral rounds – practical tips</h4>
 <ul><li>Begin by introducing yourself and your co-counsel, and seek permission to proceed.</li><li>Give a road-map: "I will address two issues: first…, second…".</li><li>Answer the judge's question directly, then return to your argument.</li><li>Cite authority briefly: case name, court, year and the proposition – not long quotations.</li><li>Watch time; ask for extra time politely if needed.</li><li>Address the bench respectfully. The Bar Council of India has suggested "Your Honour" or "Hon'ble Court"; many Indian courts still hear "My Lord" or "Your Lordship". Follow the competition's rules.</li></ul>
 <h4>Dress and conduct</h4><p>Advocates wear a black coat or gown with white bands; students in moots usually wear formal black and white. Stand when addressing the bench and never interrupt opposing counsel.</p></div>
</div><div>
 <div class="card lab"><h3>Order the memorial</h3><p>Use the arrows to put the parts of a memorial in the right order.</p><ul class="order" id="memo" style="list-style:none;padding:0"></ul>
 <div class="row"><button class="btn" id="mCheck">Check order</button><button class="btn sec" id="mShuf">Shuffle again</button><span id="mScore"></span></div></div>
 <div class="card"><h3>What each part does</h3><table class="t">
 <tr><td><b>Index of authorities</b></td><td>Lists every case, statute and book cited, with page numbers.</td></tr>
 <tr><td><b>Statement of jurisdiction</b></td><td>The provision under which the court hears the matter (e.g. Article 32 or Article 136).</td></tr>
 <tr><td><b>Statement of facts</b></td><td>Neutral, concise facts from the problem – no arguments.</td></tr>
 <tr><td><b>Issues raised</b></td><td>The questions of law, framed as questions.</td></tr>
 <tr><td><b>Summary of arguments</b></td><td>One paragraph per issue giving your answer.</td></tr>
 <tr><td><b>Arguments advanced</b></td><td>The detailed reasoning with authorities.</td></tr>
 <tr><td><b>Prayer</b></td><td>The exact relief asked for, "and pass any other order this Hon'ble Court may deem fit".</td></tr></table></div>
</div></div>`+unitFoot(7)+footer(); },
 init(){
  let items = shuffle(MEMORIAL);
  const draw=()=>{ $("#memo").innerHTML = items.map((t,i)=>`<li data-t="${esc(t)}"><b>${i+1}.</b><span>${esc(t)}</span><button class="btn sm sec" data-up="${i}" ${i===0?"disabled":""}>▲</button><button class="btn sm sec" data-dn="${i}" ${i===items.length-1?"disabled":""}>▼</button></li>`).join("");
    $$("[data-up]").forEach(b=>b.onclick=()=>{const i=+b.dataset.up; [items[i-1],items[i]]=[items[i],items[i-1]]; draw();});
    $$("[data-dn]").forEach(b=>b.onclick=()=>{const i=+b.dataset.dn; [items[i+1],items[i]]=[items[i],items[i+1]]; draw();}); };
  draw();
  $("#mCheck").onclick=()=>{ let s=0; $$("#memo li").forEach((li,i)=>{ const ok=items[i]===MEMORIAL[i]; li.classList.toggle("ok",ok); li.classList.toggle("bad",!ok); if(ok) s++; }); $("#mScore").textContent = s===MEMORIAL.length ? "All in order. Well done!" : `${s} / ${MEMORIAL.length} in the right place`; };
  $("#mShuf").onclick=()=>{ items=shuffle(MEMORIAL); draw(); $("#mScore").textContent=""; };
  miniQuiz(7);
 }};

   $$("[data-ed]").forEach(btn=>btn.onclick=()=>{ briefEdit=+btn.dataset.ed; const x=S.d.briefs[briefEdit]; BF.forEach(([k])=>$("#bf_"+k).value=x[k]||""); $("#bfTitle").textContent="Editing: "+x.name; });
   $$("[data-del]").forEach(btn=>btn.onclick=()=>{ S.d.briefs.splice(+btn.dataset.del,1); S.save(); briefEdit=-1; this.list(); }); },
 dl(){ const o=this.collect(); const txt=BF.map(([k,l])=>l.toUpperCase()+"\n"+(o[k]||"-")+"\n").join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=(o.name||"case-brief").replace(/[^\w\- ]+/g,"").slice(0,60)+".txt"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
};

document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
