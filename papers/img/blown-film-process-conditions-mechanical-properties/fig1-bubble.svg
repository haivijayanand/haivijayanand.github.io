<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" font-family="DejaVu Sans, Segoe UI, Arial, sans-serif" font-size="14">
 <defs>
  <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52514e"/></marker>
  <marker id="b" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto"><path d="M9,0 L0,4.5 L9,9 z" fill="#52514e"/></marker>
 </defs>
 <rect width="1000" height="430" fill="#ffffff"/>
 <!-- POCKET -->
 <text x="40" y="26" font-weight="600" fill="#1f5fa8">(a) Pocket bubble — LDPE, LLDPE, mLLDPE</text>
 <rect x="130" y="370" width="120" height="26" fill="#d9d8d2" stroke="#8a8984"/>
 <text x="190" y="388" text-anchor="middle" font-size="12">die</text>
 <path d="M135,370 C135,330 70,300 62,250 L62,70 M245,370 C245,330 310,300 318,250 L318,70" fill="none" stroke="#2a78d6" stroke-width="3"/>
 <line x1="55" y1="250" x2="325" y2="250" stroke="#eb6834" stroke-width="2" stroke-dasharray="7 5"/>
 <text x="330" y="246" font-size="12" fill="#52514e">frost line</text>
 <line x1="345" y1="370" x2="345" y2="252" stroke="#52514e" marker-start="url(#b)" marker-end="url(#a)"/>
 <text x="352" y="318" font-size="12" fill="#52514e">FLH</text>
 <text x="352" y="333" font-size="12" fill="#52514e">2–4 D</text>
 <line x1="64" y1="110" x2="316" y2="110" stroke="#52514e" marker-start="url(#b)" marker-end="url(#a)"/>
 <text x="190" y="104" text-anchor="middle" font-size="13">D<tspan baseline-shift="sub" font-size="10">b</tspan> = BUR × D</text>
 <line x1="130" y1="410" x2="250" y2="410" stroke="#52514e" marker-start="url(#b)" marker-end="url(#a)"/>
 <text x="190" y="426" text-anchor="middle" font-size="12">D</text>
 <rect x="80" y="45" width="220" height="14" rx="7" fill="#bdbcb6"/><rect x="80" y="30" width="220" height="14" rx="7" fill="#bdbcb6"/>
 <text x="310" y="46" font-size="12" fill="#52514e">nip: layflat = π D<tspan baseline-shift="sub" font-size="9">b</tspan> / 2</text>
 <!-- STALK -->
 <text x="450" y="26" font-weight="600" fill="#1f5fa8">(b) High stalk — HMW-HDPE</text>
 <rect x="540" y="370" width="90" height="26" fill="#d9d8d2" stroke="#8a8984"/>
 <text x="585" y="388" text-anchor="middle" font-size="12">die</text>
 <path d="M545,370 L545,215 C545,170 470,160 462,120 L462,70 M625,370 L625,215 C625,170 700,160 708,120 L708,70" fill="none" stroke="#2a78d6" stroke-width="3"/>
 <line x1="455" y1="122" x2="715" y2="122" stroke="#eb6834" stroke-width="2" stroke-dasharray="7 5"/>
 <text x="450" y="118" font-size="12" fill="#52514e" text-anchor="end">frost line</text>
 <line x1="655" y1="370" x2="655" y2="217" stroke="#52514e" marker-start="url(#b)" marker-end="url(#a)"/>
 <text x="662" y="300" font-size="12" fill="#52514e">neck</text>
 <text x="662" y="315" font-size="12" fill="#52514e">6–9 D</text>
 <line x1="464" y1="95" x2="706" y2="95" stroke="#52514e" marker-start="url(#b)" marker-end="url(#a)"/>
 <text x="585" y="89" text-anchor="middle" font-size="13">BUR 3.5–5</text>
 <rect x="480" y="45" width="210" height="14" rx="7" fill="#bdbcb6"/><rect x="480" y="30" width="210" height="14" rx="7" fill="#bdbcb6"/>
 <!-- die gap detail and formulas -->
 <rect x="770" y="40" width="215" height="350" rx="8" fill="#f6f5f1" stroke="#bdbcb6"/>
 <text x="785" y="66" font-weight="600">Definitions</text>
 <text x="785" y="94" font-size="13">BUR = D<tspan baseline-shift="sub" font-size="10">b</tspan> / D</text>
 <text x="785" y="120" font-size="13">DDR = h / (t × BUR)</text>
 <text x="797" y="138" font-size="11" fill="#52514e">h die gap, t film gauge</text>
 <text x="785" y="164" font-size="13">TD stretch ≈ BUR</text>
 <text x="785" y="188" font-size="13">MD stretch ≈ DDR</text>
 <text x="785" y="214" font-size="13">v<tspan baseline-shift="sub" font-size="10">line</tspan> = Q / (ρ π D<tspan baseline-shift="sub" font-size="10">b</tspan> t)</text>
 <text x="785" y="240" font-size="13">γ̇<tspan baseline-shift="sub" font-size="10">w</tspan> = 6 Q<tspan baseline-shift="sub" font-size="10">v</tspan> / (π D h²)</text>
 <text x="797" y="258" font-size="11" fill="#52514e">die wall shear rate</text>
 <text x="785" y="286" font-size="13">Sharkskin if γ̇<tspan baseline-shift="sub" font-size="10">w</tspan> &gt; γ̇<tspan baseline-shift="sub" font-size="10">crit</tspan></text>
 <text x="785" y="312" font-size="12" fill="#52514e">LLDPE ≈ 200 s⁻¹ (no PPA)</text>
 <text x="785" y="336" font-size="12" fill="#52514e">MD ↑ (machine direction)</text>
 <text x="785" y="356" font-size="12" fill="#52514e">TD ↔ (around the bubble)</text>
</svg>
