<!--
  TOOL:    _includes/update-list.html — side panel "Recently Added" (overrides Chirpy 7.6)
  FAMILY:  SITE
  VERSION: 1.0.0
  DATE:    2026-11-16
  CHAT:    Combine Engineering Articles with Technical Papers (side panel: recent and trending)
  CHANGES: 1.0.0 - lists the newest pages from the whole site (courses, series, tools, papers, posts) using
                   _data/site_panel.json from _scripts/build_search_index.py, not only the blog posts
-->
{% assign recent = site.data.site_panel.recent %}
{% if recent and recent.size > 0 %}
  <section id="access-lastmod">
    <h2 class="panel-heading">Recently Added</h2>
    <ul class="content list-unstyled ps-0 pb-1 ms-1 mt-2">
      {% for item in recent %}
        <li class="text-truncate lh-lg">
          <a href="{{ item.url | relative_url }}" title="{{ item.section | escape }} · {{ item.title | escape }}">{{ item.title }}</a>
        </li>
      {% endfor %}
    </ul>
  </section>
  <!-- #access-lastmod -->
{% endif %}
