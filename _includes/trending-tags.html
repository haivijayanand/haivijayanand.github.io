<!--
  TOOL:    _includes/trending-tags.html — side panel "Trending Topics" (overrides Chirpy 7.6)
  FAMILY:  SITE
  VERSION: 1.0.0
  DATE:    2026-11-16
  CHAT:    Combine Engineering Articles with Technical Papers (side panel: recent and trending)
  CHANGES: 1.0.0 - site sections ranked by pages added in the last 30 days (then by size), linking to each
                   section, from _data/site_panel.json; the theme version only knew the two blog posts' tags
-->
{% assign topics = site.data.site_panel.trending %}
{% if topics and topics.size > 0 %}
  <section>
    <h2 class="panel-heading">Trending Topics</h2>
    <div class="d-flex flex-wrap mt-3 mb-1 me-3">
      {% for t in topics %}
        <a class="post-tag btn btn-outline-primary" href="{{ t.url | relative_url }}" title="{{ t.count }} pages">{{ t.name }}</a>
      {% endfor %}
    </div>
  </section>
{% endif %}
