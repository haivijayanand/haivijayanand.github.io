"use strict";
/* ============================================================
   DATA AND UNIT PAGES (Research Tools for Business Decision Making)
   ============================================================ */
/*
TOOL:    research/content.js — course data and unit pages, assembled by build.py
FAMILY:  law-explorers
VERSION: 1.0.0
DATE:    2026-11-22
CHAT:    Kaavya Study Materials – TNNLU B.Com. LL.B. Semester II explorers (claude.ai, 2026-11-22)
CHANGES: 1.0.0 - first version
*/
const UNITS = [
 {id:"u1", n:1, title:"Research, Data and Sampling", short:"Research process and design, data sources, questionnaires, scales, sampling methods and errors."},
 {id:"u2", n:2, title:"Describing Data and Averages", short:"Frequency tables and charts; mean, median, mode, quartiles – and when to use which."},
 {id:"u3", n:3, title:"Dispersion and Shape", short:"Range, quartile deviation, standard deviation, coefficient of variation, skewness, box plots."},
 {id:"u4", n:4, title:"Correlation and Regression", short:"Scatter diagrams, Pearson's r, Spearman's rank, least-squares lines and prediction."},
 {id:"u5", n:5, title:"Probability and Distributions", short:"Rules of probability, Bayes' theorem and the prosecutor's fallacy, binomial, Poisson, normal."},
 {id:"u6", n:6, title:"Hypothesis Tests, Index Numbers, Time Series", short:"Type I and II errors, p-values, z, t and chi-square tests; price indices; trends."}
];
const EXTRAS = [
 {id:"formulas", ic:"🧮", title:"Formula sheet"},
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"refs", ic:"📚", title:"References"}
];
const CASES = [], MAXIMS = [];

const FLASH = [
 ["Research","Systematic, objective collection and analysis of information to answer a question or solve a problem."],
 ["Exploratory research","Early research to understand a problem and form hypotheses – interviews, focus groups, literature review."],
 ["Descriptive research","Describes characteristics of a population – surveys, census data."],
 ["Causal research","Tests cause and effect, usually by experiment."],
 ["Hypothesis","A testable statement about a relationship – e.g. 'online ads increase sales'."],
 ["Primary data","Collected first-hand for the present study – survey, interview, observation, experiment."],
 ["Secondary data","Already collected by others – Census, RBI, NSO, company reports, case law databases."],
 ["Likert scale","Agreement on a scale, typically 1 (strongly disagree) to 5 (strongly agree)."],
 ["Levels of measurement","Nominal (labels), ordinal (order), interval (equal gaps, no true zero), ratio (true zero)."],
 ["Population and sample","Population: everyone of interest. Sample: the part actually studied."],
 ["Simple random sampling","Every member has an equal chance of selection – lottery or random numbers."],
 ["Stratified sampling","Divide the population into groups (strata) and sample randomly from each."],
 ["Systematic sampling","Pick every k-th item from a list after a random start."],
 ["Cluster sampling","Randomly select whole groups (e.g. colleges) and study everyone in them."],
 ["Sampling error","Difference between a sample result and the population value, due only to chance – falls as sample size grows."],
 ["Non-sampling error","Errors from bad questions, non-response, recording mistakes, bias – not reduced by a bigger sample."],
 ["Arithmetic mean","Sum of values ÷ number of values. Affected by extreme values."],
 ["Median","Middle value of ordered data. Not affected by outliers – best for incomes."],
 ["Mode","Most frequent value. Useful for sizes, preferences, nominal data."],
 ["Standard deviation","Square root of the average squared deviation from the mean – the typical distance from the mean."],
 ["Coefficient of variation","SD ÷ mean × 100. Compares consistency across data sets with different units or means."],
 ["Skewness","Lack of symmetry. Positive: long right tail, mean > median (e.g. incomes)."],

   ============================================================ */
function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}

  let got=0, ans=0;
  $$(".q",box).forEach(q=>$$("[data-k]",q).forEach(b=>b.onclick=()=>{

}

 <div class="card"><h3>Key idea</h3><div class="key">Raw data must be <b>organised</b> (tables, frequency distributions, charts) and <b>summarised</b>. An <b>average</b> (measure of central tendency) gives one value that represents the whole set.</div>

VIEWS.u3 = { html(){ return unitHead(3)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">Two classes can have the same average but very different spreads. <b>Dispersion</b> measures how widely values scatter around the centre; <b>skewness</b> and <b>kurtosis</b> describe the shape.</div>
 <table class="t"><tr><th>Measure</th><th>Formula</th><th>Notes</th></tr>
 <tr><td>Range</td><td>Max − Min</td><td>Quick; depends only on two values</td></tr>
 <tr><td>Quartile deviation</td><td>(Q3 − Q1) ÷ 2</td><td>Ignores the extreme quarters; good for open-ended classes</td></tr>
 <tr><td>Mean deviation</td><td>Σ|x − mean| ÷ n</td><td>Uses all values; ignores signs</td></tr>
 <tr><td>Standard deviation</td><td>√[Σ(x − mean)² ÷ n]</td><td>The most used; basis of tests</td></tr>
 <tr><td>Variance</td><td>σ²</td><td>Adds across independent sources</td></tr>
 <tr><td>Coefficient of variation</td><td>σ ÷ mean × 100</td><td>Relative – compares consistency</td></tr></table>
 <h4>Absolute and relative measures</h4><p>Absolute measures are in the units of the data (rupees, marks). Relative measures – coefficient of range, of quartile deviation, of variation – are pure numbers, so different data sets can be compared.</p>
 <h4>Shape</h4><ul><li><b>Positive skew</b>: long right tail; mean &gt; median &gt; mode (incomes, case durations).</li><li><b>Negative skew</b>: long left tail; mean &lt; median &lt; mode (marks in an easy test).</li><li>Karl Pearson's coefficient: Sk = (Mean − Mode) ÷ σ, or 3(Mean − Median) ÷ σ.</li><li><b>Kurtosis</b>: peakedness – leptokurtic (peaked), mesokurtic (normal), platykurtic (flat).</li></ul>
 <h4>Box plot</h4><p>The five-number summary – minimum, Q1, median, Q3, maximum. Points beyond 1.5 × IQR from the box are flagged as outliers. Try it in the Unit 2 calculator.</p></div>

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Correlation</b> measures how closely two variables move together; <b>regression</b> fits a line to predict one from the other. Neither proves that one causes the other.</div>
 <h4>Karl Pearson's coefficient</h4><p>r = Σ(x − x̄)(y − ȳ) ÷ √[Σ(x − x̄)² · Σ(y − ȳ)²]. It ranges from −1 (perfect negative) through 0 (no linear relation) to +1 (perfect positive). Rough guide: above 0.7 strong, 0.3–0.7 moderate, below 0.3 weak.</p>
 <h4>Spearman's rank correlation</h4><p>For ranks or ordinal data: R = 1 − 6Σd² ÷ [n(n² − 1)], where d is the difference in ranks. Example: do two judges rank moot-court teams similarly?</p>
 <h4>Regression</h4><ul><li>Line of Y on X: Y = a + bX, with b = Σ(x − x̄)(y − ȳ) ÷ Σ(x − x̄)² and a = ȳ − b x̄.</li><li>It minimises the sum of squared vertical distances (<b>least squares</b>).</li><li>r² (coefficient of determination) = share of variation in Y explained by X.</li><li>Predict only within the range of the data – extrapolation is risky.</li></ul>
 <h4>Correlation is not causation</h4><p>A third factor may drive both (ice-cream sales and drownings both rise in summer), the direction may be reversed, or the link may be chance in a small sample. In law, a statistical association – say between a community and arrests – needs careful explanation before it is called proof of anything.</p></div>

VIEWS.u5 = { html(){ return unitHead(5)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Probability</b> measures uncertainty on a scale from 0 (impossible) to 1 (certain). Business forecasts, insurance premiums and forensic evidence all rest on it – and on not misreading it.</div>
 <h4>Approaches</h4><p><b>Classical</b> (equally likely outcomes – a die), <b>relative frequency</b> (past data – 2% of parcels are lost), <b>subjective</b> (expert judgment), <b>axiomatic</b> (Kolmogorov).</p>
 <h4>Rules</h4><table class="t"><tr><th>Rule</th><th>Formula</th></tr>
 <tr><td>Complement</td><td>P(not A) = 1 − P(A)</td></tr><tr><td>Addition</td><td>P(A or B) = P(A) + P(B) − P(A and B)</td></tr>
 <tr><td>Multiplication (independent)</td><td>P(A and B) = P(A) × P(B)</td></tr><tr><td>Conditional</td><td>P(A | B) = P(A and B) ÷ P(B)</td></tr>
 <tr><td>Bayes' theorem</td><td>P(A | B) = P(B | A) P(A) ÷ P(B)</td></tr></table>
 <h4>The prosecutor's fallacy</h4><p>"Only 1 in a million people would match this DNA, so there is a 1 in a million chance the accused is innocent." Wrong: in a city of 10 million, about 10 innocent people would match. Without other evidence, the matching accused is just one of about 11 people who match. Courts must weigh such evidence with the rest of the case – the famous English example is <i>R v Sally Clark</i> (2003), where misused statistics led to a wrongful conviction.</p>
 <h4>Distributions</h4><table class="t"><tr><th>Distribution</th><th>Use</th><th>Mean, variance</th></tr>
 <tr><td>Binomial</td><td>Number of successes in n independent trials (defective items in a batch)</td><td>np, npq</td></tr>
 <tr><td>Poisson</td><td>Count of rare events in an interval (accidents per week, calls per minute)</td><td>m, m</td></tr>
 <tr><td>Normal</td><td>Continuous, symmetric – heights, measurement errors, sample means</td><td>μ, σ²</td></tr></table>
 <p><b>z-score</b> = (x − μ) ÷ σ. About 68% of values lie within 1σ, 95% within 2σ (more exactly 1.96σ) and 99.7% within 3σ.</p></div>
</div><div>
 <div class="card lab"><h3>DNA evidence – Bayes calculator</h3>
  <div class="row"><label>People who could have committed the crime <input type="text" id="byN" value="1000000" style="width:110px"></label></div>
  <div class="row" style="margin-top:6px"><label>Random match probability: 1 in <input type="text" id="byR" value="100000" style="width:100px"></label></div>
  <div class="row" style="margin-top:6px"><label>Other evidence makes the accused <select id="byO"><option value="1">no more likely than anyone else</option><option value="100">100 times more likely</option><option value="10000">10,000 times more likely</option></select></label><button class="btn" id="byGo">Work it out</button></div>
  <div id="byOut"></div></div>
 <div class="card lab"><h3>Normal curve: area under the curve</h3>
  <div class="row"><label>Mean <input type="text" id="nzM" value="60" style="width:60px"></label><label>SD <input type="text" id="nzS" value="10" style="width:60px"></label><label>Between <input type="text" id="nzA" value="50" style="width:60px"></label><label>and <input type="text" id="nzB" value="80" style="width:60px"></label><button class="btn" id="nzGo">Shade</button></div>
  <svg viewBox="0 0 640 230" class="lg graph" id="nzSvg"></svg><div id="nzOut"></div></div>
</div></div>`+unitFoot(5)+footer(); },
 init(){

    const innocentMatches=(N-1)/R;            // expected innocent people who match

    let curve="", area=`M${X(Math.max(a,lo))},200 `;
    for(let i=0;i<=200;i++){ const x=lo+(hi-lo)*i/200; curve+=`${X(x)},${Y(pdf(x))} `; }
    for(let i=0;i<=100;i++){ const x=Math.max(a,lo)+(Math.min(b,hi)-Math.max(a,lo))*i/100; area+=`L${X(x)},${Y(pdf(x))} `; }
    area+=`L${X(Math.min(b,hi))},200 Z`;
    const p=Phi((b-m)/s)-Phi((a-m)/s);
    $("#nzSvg").innerHTML=`<path d="${area}" class="boxp"/><polyline points="${curve}" class="cD"/><line x1="30" y1="200" x2="610" y2="200" class="axis"/>${[-3,-2,-1,0,1,2,3].map(k=>`<text x="${X(m+k*s)}" y="220" text-anchor="middle" class="tick">${fmt(m+k*s,1)}</text>`).join("")}`;
    $("#nzOut").innerHTML=`<div class="fb info">z for ${a} = ${fmt((a-m)/s)}, z for ${b} = ${fmt((b-m)/s)}. <b>Area = ${fmt(p*100,1)}%</b> of values lie between ${a} and ${b}.</div>`;
  };
  $("#nzGo").onclick=draw; draw();
  miniQuiz(5);
 }};

const HT_SVG=`<svg viewBox="0 0 640 380" class="lg" role="img" aria-label="Hypothesis test as a trial">
<defs><marker id="ht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
${[["H0: no effect","presumed innocent"],["Choose α = 0.05","standard of proof"],["Collect data, compute test statistic","evidence"],["Find p-value","how surprising if innocent?"],["p < α → reject H0","convict"],["p ≥ α → do not reject","acquit (not 'innocent')"]].map((t,i)=>`<g id="h${i}" class="node fade"><rect x="${i<4?110:(i===4?30:340)}" y="${i<4?8+i*68:290}" width="${i<4?420:270}" height="54" rx="12"/><text x="${i<4?320:(i===4?165:475)}" y="${i<4?33+i*68:315}" text-anchor="middle" style="font-size:18px">${t[0]}</text><text x="${i<4?320:(i===4?165:475)}" y="${i<4?54+i*68:336}" text-anchor="middle" class="sub">${t[1]}</text></g>`).join("")}
${[0,1,2].map(i=>`<path id="ha${i}" class="edge fade" d="M320 ${63+i*68} V${76+i*68}" marker-end="url(#ht)" style="color:var(--muted)"/>`).join("")}
<path id="ha3" class="edge fade" d="M260 268 L180 288" marker-end="url(#ht)" style="color:var(--muted)"/><path id="ha4" class="edge fade" d="M380 268 L460 288" marker-end="url(#ht)" style="color:var(--muted)"/>
</svg>`;
const HT_STEPS=[
 "<b>Null hypothesis H0</b>: no effect, no difference – like the presumption of innocence. The alternative H1 is what we suspect (the drug works; the groups differ).",
 "Fix the <b>significance level α</b> before looking at the data – usually 5%. It is the risk of a Type I error we accept, like a standard of proof.",
 "Collect the sample and compute a <b>test statistic</b> – z, t or χ² – measuring how far the data are from what H0 predicts.",
 "The <b>p-value</b> is the probability of data at least this extreme if H0 were true. A small p-value means the data would be surprising under H0.",
 "If p < α, <b>reject H0</b> – the result is 'statistically significant'. Risk: a Type I error (convicting the innocent).",
 "If p ≥ α, we <b>fail to reject H0</b> – not proof that H0 is true, just like an acquittal is not a declaration of innocence. Risk: a Type II error (letting the guilty go)."
];
VIEWS.u6 = { html(){ return unitHead(6)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">A <b>hypothesis test</b> asks whether a sample result is too large to be explained by chance alone. Its logic mirrors a criminal trial: assume H0, look at the evidence, and reject H0 only if the evidence is strong enough.</div>
 <h4>Errors</h4><table class="t"><tr><th></th><th>H0 true (innocent)</th><th>H0 false (guilty)</th></tr><tr><td>Reject H0 (convict)</td><td>Type I error (α)</td><td>Correct (power = 1 − β)</td></tr><tr><td>Do not reject (acquit)</td><td>Correct</td><td>Type II error (β)</td></tr></table>
 <h4>Which test?</h4><table class="t"><tr><th>Test</th><th>Use</th></tr>
 <tr><td>z-test</td><td>Mean or proportion, large sample (n ≥ 30) or known σ</td></tr>
 <tr><td>t-test</td><td>Mean, small sample, σ unknown; paired t for before-and-after</td></tr>
 <tr><td>Chi-square (χ²)</td><td>Independence of two categorical variables; goodness of fit</td></tr>
 <tr><td>F-test / ANOVA</td><td>Comparing variances, or means of three or more groups</td></tr></table>
 <h4>Index numbers</h4><p>Measure change relative to a base period = 100. <b>Laspeyres</b> = Σp1q0 ÷ Σp0q0 × 100 (base-year quantities); <b>Paasche</b> = Σp1q1 ÷ Σp0q1 × 100 (current quantities); <b>Fisher</b> = √(L × P), the 'ideal' index. India's CPI (base 2012) is published monthly by the NSO; dearness allowance and rent clauses often link to it.</p>
 <h4>Time series</h4><p>Components: <b>trend</b> (long-term direction), <b>seasonal</b> (within a year – festival sales), <b>cyclical</b> (business cycles), <b>irregular</b> (floods, pandemics). Trend is found by moving averages or the least-squares method.</p></div>
 <div class="card lab"><h3>Price index calculator</h3><table class="t" id="ixTab"><tr><th>Item</th><th>Base price</th><th>Base qty</th><th>Current price</th><th>Current qty</th></tr>
 ${[["Rice (kg)",40,50,52,48],["Milk (litre)",48,30,58,32],["Bus pass (month)",500,1,650,1]].map((r,i)=>`<tr><td>${r[0]}</td>${r.slice(1).map((v,j)=>`<td><input type="text" id="ix${i}_${j}" value="${v}" style="width:70px"></td>`).join("")}</tr>`).join("")}</table>
 <div class="row"><button class="btn" id="ixGo">Calculate</button></div><div id="ixOut"></div></div>
</div><div>
 ${animBox("htAnim","A hypothesis test is like a trial",HT_SVG)}
 <div class="card lab"><h3>Chi-square test of independence (2 × 2)</h3><p>Is preferring an online class related to year of study? Enter counts.</p>
  <table class="t"><tr><th></th><th>Prefer online</th><th>Prefer offline</th></tr>
  <tr><td>First year</td><td><input type="text" id="cs00" value="30" style="width:70px"></td><td><input type="text" id="cs01" value="20" style="width:70px"></td></tr>
  <tr><td>Final year</td><td><input type="text" id="cs10" value="15" style="width:70px"></td><td><input type="text" id="cs11" value="35" style="width:70px"></td></tr></table>
  <div class="row"><button class="btn" id="csGo">Test at 5%</button></div><div id="csOut"></div></div>
 <div class="card lab"><h3>Type I or Type II?</h3><div id="lab6"></div></div>
</div></div>`+unitFoot(6)+footer(); },
 init(){
  anim = makeAnim("#htAnim", HT_STEPS, i=>{
    for(let k=0;k<6;k++) document.getElementById("h"+k).classList.toggle("show",k<=i);
    for(let k=0;k<5;k++) document.getElementById("ha"+k).classList.toggle("show",k<i);
  });
  const v=id=>Math.max(0,+$("#"+id).value||0);
  $("#csGo").onclick=()=>{
    const o=[[v("cs00"),v("cs01")],[v("cs10"),v("cs11")]], R=[o[0][0]+o[0][1],o[1][0]+o[1][1]], C=[o[0][0]+o[1][0],o[0][1]+o[1][1]], N=R[0]+R[1];
    if(!N||!R[0]||!R[1]||!C[0]||!C[1]){ $("#csOut").innerHTML=`<div class="fb bad">Every row and column needs some counts.</div>`; return; }
    let chi=0, ex=[]; for(let i=0;i<2;i++) for(let j=0;j<2;j++){ const e=R[i]*C[j]/N; ex.push(e.toFixed(1)); chi+=(o[i][j]-e)**2/e; }
    const p=2*(1-Phi(Math.sqrt(chi)));
    $("#csOut").innerHTML=`<div class="fb info">Expected counts if independent: ${ex.join(", ")}.<br>χ² = <b>${chi.toFixed(2)}</b> with 1 degree of freedom (critical value 3.84 at 5%). p = <b>${p<0.001?"&lt; 0.001":p.toFixed(3)}</b>.<br>${chi>3.84?"<b>Reject H0</b> – preference appears related to year of study.":"<b>Do not reject H0</b> – no significant relationship shown."}${ex.some(e=>e<5)?"<br>Caution: an expected count is below 5; the test is unreliable.":""}</div>`;
  };
  $("#csGo").click();
  $("#ixGo").onclick=()=>{
    let a=0,b=0,c=0,d=0; for(let i=0;i<3;i++){ const [p0,q0,p1,q1]=[0,1,2,3].map(j=>+$("#ix"+i+"_"+j).value||0); a+=p1*q0; b+=p0*q0; c+=p1*q1; d+=p0*q1; }
    const L=a/b*100, P=c/d*100, F=Math.sqrt(L*P);
    $("#ixOut").innerHTML=`<div class="fb info">Laspeyres <b>${L.toFixed(1)}</b> · Paasche <b>${P.toFixed(1)}</b> · Fisher <b>${F.toFixed(1)}</b><br>Prices have risen about ${(F-100).toFixed(1)}% since the base period. Laspeyres usually comes out a little higher because it ignores people switching to goods whose prices rose less.</div>`;
  };
  $("#ixGo").click();
  choiceLab("#lab6",[
   ["A court convicts a person who did not commit the crime.","T1","Rejecting a true H0 (innocence)."],
   ["A quality check passes a batch of faulty medicines.","T2","Failing to detect a real problem."],
   ["A study concludes a new teaching method works when in truth it has no effect.","T1","A false positive."],
   ["A screening test misses a disease the patient actually has.","T2","A false negative."]
  ],{T1:"Type I error",T2:"Type II error"});
  miniQuiz(6);
 }};

VIEWS.formulas = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Formula sheet</h2><p>All the formulas of the course. Print it (Ctrl+P) for revision.</p></div>
 <div class="two"><div class="card"><h3>Averages and dispersion</h3><table class="t">
 <tr><td>Mean</td><td>x̄ = Σx ÷ n; grouped: Σfx ÷ Σf</td></tr><tr><td>Weighted mean</td><td>Σwx ÷ Σw</td></tr>
 <tr><td>Median (grouped)</td><td>L + [(N/2 − cf) ÷ f] × h</td></tr><tr><td>Mode (grouped)</td><td>L + [(f1 − f0) ÷ (2f1 − f0 − f2)] × h</td></tr>
 <tr><td>Empirical relation</td><td>Mode ≈ 3 Median − 2 Mean</td></tr><tr><td>Geometric mean</td><td>(x1·x2·…·xn)^(1/n)</td></tr>
 <tr><td>Quartile deviation</td><td>(Q3 − Q1) ÷ 2</td></tr><tr><td>Mean deviation</td><td>Σ|x − x̄| ÷ n</td></tr>
 <tr><td>Standard deviation</td><td>σ = √[Σ(x − x̄)² ÷ n]; sample s uses n − 1</td></tr><tr><td>Coefficient of variation</td><td>σ ÷ x̄ × 100</td></tr>
 <tr><td>Skewness (Pearson)</td><td>(Mean − Mode) ÷ σ or 3(Mean − Median) ÷ σ</td></tr></table>
 <h3 style="margin-top:14px">Correlation and regression</h3><table class="t">
 <tr><td>Pearson r</td><td>Σ(x − x̄)(y − ȳ) ÷ √[Σ(x − x̄)² Σ(y − ȳ)²]</td></tr><tr><td>Spearman R</td><td>1 − 6Σd² ÷ [n(n² − 1)]</td></tr>
 <tr><td>Regression Y on X</td><td>b = Σ(x − x̄)(y − ȳ) ÷ Σ(x − x̄)²; a = ȳ − b x̄</td></tr><tr><td>Coefficient of determination</td><td>r²</td></tr></table></div>
 <div class="card"><h3>Probability and distributions</h3><table class="t">
 <tr><td>Addition</td><td>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)</td></tr><tr><td>Multiplication</td><td>P(A ∩ B) = P(A) P(B | A)</td></tr>
 <tr><td>Bayes</td><td>P(A | B) = P(B | A) P(A) ÷ P(B)</td></tr><tr><td>Binomial</td><td>P(x) = nCx p^x q^(n−x); mean np; variance npq</td></tr>
 <tr><td>Poisson</td><td>P(x) = e^(−m) m^x ÷ x!; mean = variance = m</td></tr><tr><td>z-score</td><td>(x − μ) ÷ σ</td></tr>
 <tr><td>Standard error of mean</td><td>σ ÷ √n</td></tr></table>
 <h3 style="margin-top:14px">Tests and indices</h3><table class="t">
 <tr><td>z for a mean</td><td>(x̄ − μ) ÷ (σ ÷ √n)</td></tr><tr><td>t for a mean</td><td>(x̄ − μ) ÷ (s ÷ √n), df = n − 1</td></tr>
 <tr><td>Chi-square</td><td>Σ(O − E)² ÷ E; E = row total × column total ÷ N; df = (r − 1)(c − 1)</td></tr>
 <tr><td>Laspeyres</td><td>Σp1q0 ÷ Σp0q0 × 100</td></tr><tr><td>Paasche</td><td>Σp1q1 ÷ Σp0q1 × 100</td></tr><tr><td>Fisher</td><td>√(Laspeyres × Paasche)</td></tr></table></div></div>`+footer(); }};

 collect(){ const o={}; BF.forEach(([k])=>o[k]=$("#bf_"+k).value.trim()); return o; },
 save(){ const o=this.collect(); if(!o.name){toast("Add a case name first"); return;} if(briefEdit>=0) S.d.briefs[briefEdit]=o; else S.d.briefs.push(o); S.save(); briefEdit=S.d.briefs.indexOf(o); toast("Brief saved"); this.list(); },
 list(){ const b=S.d.briefs; $("#bfList").innerHTML = b.length ? b.map((x,i)=>`<div class="row" style="border-bottom:1px solid var(--rule);padding:6px 0"><span style="flex:1"><b>${esc(x.name)}</b><br><small style="color:var(--muted)">${esc(x.cit||"")}</small></span><button class="btn sm sec" data-ed="${i}">Open</button><button class="btn sm sec" data-del="${i}">Delete</button></div>`).join("") : `<p style="color:var(--muted)">No briefs yet.</p>`;
   $$("[data-ed]").forEach(btn=>btn.onclick=()=>{ briefEdit=+btn.dataset.ed; const x=S.d.briefs[briefEdit]; BF.forEach(([k])=>$("#bf_"+k).value=x[k]||""); $("#bfTitle").textContent="Editing: "+x.name; });
   $$("[data-del]").forEach(btn=>btn.onclick=()=>{ S.d.briefs.splice(+btn.dataset.del,1); S.save(); briefEdit=-1; this.list(); }); },
 dl(){ const o=this.collect(); const txt=BF.map(([k,l])=>l.toUpperCase()+"\n"+(o[k]||"-")+"\n").join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=(o.name||"case-brief").replace(/[^\w\- ]+/g,"").slice(0,60)+".txt"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
};

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
