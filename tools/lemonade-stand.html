<style>
/* Layout: one narrow column like a phone ledger; sticky status bar on top, one phase card at a time, big thumb buttons */
:root{
  --bg:#e9f4f1; --card:#ffffff; --ink:#15322d; --muted:#5b746e; --line:#cfe1dc;
  --lemon:#f6cf1d; --lemon-ink:#3a2f00; --leaf:#22844a; --bad:#c2412d; --sky:#2a7f9e;
  --chip:#f2f8f6;

  --f-display:"Gluten","Comic Sans MS",cursive; --f-body:"Nunito",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1d1a; --card:#162b27; --ink:#e6f2ee; --muted:#9bb5ae; --line:#2a4540;
  --lemon:#f3cc2a; --lemon-ink:#2a2200; --leaf:#4cc27a; --bad:#ff7a63; --sky:#64bfdc; --chip:#1c3530; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1d1a; --card:#162b27; --ink:#e6f2ee; --muted:#9bb5ae; --line:#2a4540;
  --lemon:#f3cc2a; --lemon-ink:#2a2200; --leaf:#4cc27a; --bad:#ff7a63; --sky:#64bfdc; --chip:#1c3530; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:10px}

.meter{height:6px;background:var(--chip);border-radius:6px;margin-top:4px;overflow:hidden}

.tblwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.tt{width:100%;border-collapse:collapse;font-size:14px;min-width:300px}
.tt th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:800}

svg .ax{font-family:var(--f-num);font-size:11px;fill:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap}

/* ---- animated street ---- */
.stagewrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#cdeefc}

.ovc{display:flex;gap:10px;align-items:flex-start}
.ove{font-size:32px;line-height:1}

.ovl .big{font-size:18px;padding:10px}

.ctl{display:flex;flex-direction:column;gap:8px}
.ctlrow{display:flex;gap:8px}

.cbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 6px;font-weight:800;cursor:pointer;min-height:44px}

.voices{display:flex;flex-direction:column}

.vemo{font-size:24px;line-height:1}
.vtx{min-width:0;font-size:14px}.vtx p{margin:2px 0 0}

</style>

<script>
"use strict";
const VERSION="1.2.0";
const START_CASH=300, CUPS_PER_PITCHER=10, POSTER_COST=10;
const HOURS=[9,10,11,12,13,14,15,16];
const HOUR_SHAPE=[0.6,0.8,1.0,1.25,1.3,1.1,0.9,0.75];
const PACKS={lemons:[[12,48],[30,108],[60,198]],sugar:[[25,20],[60,42],[150,90]],cups:[[25,25],[60,54],[150,120]],ice:[[50,20],[120,42],[300,90]]};
const ITEMS={lemons:{label:"Lemons",unit:"lemons",note:"About 1 in 7 go bad each night"},sugar:{label:"Sugar",unit:"spoons",note:"Keeps fine"},cups:{label:"Paper cups",unit:"cups",note:"One per sale"},ice:{label:"Ice",unit:"cubes",note:"Melts every night"}};
const WX={
  sunny:{name:"Sunny",t:[30,34],mult:1.0},
  hot:{name:"Scorching",t:[36,41],mult:1.35},
  cloudy:{name:"Cloudy",t:[25,29],mult:0.72},
  rain:{name:"Rainy",t:[22,26],mult:0.38},
  storm:{name:"Thunderstorms",t:[21,24],mult:0.5}
};
const WX_ORDER=["hot","sunny","cloudy","rain","storm"];
const WX_WEIGHT={sunny:34,hot:20,cloudy:26,rain:14,storm:6};
const EVENTS=[
  {id:"cricket",text:"Street cricket final at the maidan today. Expect a big, thirsty crowd.",mult:1.6},
  {id:"festival",text:"The temple festival procession passes your corner this afternoon.",mult:1.8},
  {id:"digging",text:"The corporation is digging up your road. Fewer people will walk past.",mult:0.5},
  {id:"holiday",text:"School holiday. Lots of kids about, but they carry less money.",mult:1.3,priceMult:0.8}
];
const PEOPLE=["An auto driver","A college student","A jogger","The postman","Two schoolkids","A vegetable vendor","A delivery rider","An office-goer","A grandmother","A cricket fan","A tired tourist","The security guard next door"];
const SAYS={
  perfect:["Perfect. I'll be back tomorrow.","Best nimbu pani on this street!","Just right. Here, keep the change."],
  good:["Nice and refreshing.","Good stuff.","That hit the spot."],
  watery:["Tastes like water with a rumour of lemon.","Is there any lemon in this?"],
  sour:["Aiyo, too sour!","My whole face just folded."],
  plain:["Needs more sugar.","Bit flat. Sweeten it up."],
  sweet:["Way too sweet.","This is sugar syrup, not lemonade."],
  warm:["It's warm! Get some ice.","Lukewarm lemonade on a day like this?"],
  icy:["All ice, no drink.","My teeth are freezing."],
  price:["frowns at the price and walks on.","checks the board, shakes their head, keeps walking."]
};

let s=null, view="title", sel=30, revealTimer=null, confirmNew=null;
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const money=x=>(x<0?"−":"")+"₹"+Math.abs(Math.round(x)).toLocaleString("en-IN");
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function poisson(l){if(l<=0)return 0;if(l>40)return Math.max(0,Math.round(l+Math.sqrt(l)*(Math.random()+Math.random()+Math.random()-1.5)*1.4));let L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1}
function weighted(w){let t=0;for(const k in w)t+=w[k];let r=Math.random()*t;for(const k in w){r-=w[k];if(r<=0)return k}return Object.keys(w)[0]}

/* ---------- storage (wrapped: may be unavailable) ---------- */
const LS={get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const K_AUTO="lemonade.auto", K_SLOTS="lemonade.slots", K_BEST="lemonade.best";
function autosave(){if(s)LS.set(K_AUTO,Object.assign({},s,{savedAt:Date.now()}))}
function slots(){return LS.get(K_SLOTS)||{}}
function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

/* ---------- game setup ---------- */
function newGame(days){
  s={v:1,days,day:1,cash:START_CASH,rep:0.3,inv:{lemons:0,sugar:0,cups:0,ice:0},
     recipe:{lemons:4,sugar:4,ice:3},price:15,posters:2,
     totals:{cups:0,revenue:0,spent:0},history:[],phase:"morning",today:{spent:0},log:[],shown:0,report:null};
  startDay();view="game";autosave();render();
}
function startDay(){
  s.forecast=weighted(WX_WEIGHT);
  s.event=Math.random()<0.22?pick(EVENTS).id:null;
  s.phase="morning";s.today={spent:0};s.log=[];s.shown=0;s.report=null;s.crowd=null;s.anim=null;
}
function cupsPossible(){
  const r=s.recipe,i=s.inv;
  const byL=Math.floor(i.lemons/r.lemons)*CUPS_PER_PITCHER;
  const byS=r.sugar>0?Math.floor(i.sugar/r.sugar)*CUPS_PER_PITCHER:Infinity;
  return Math.min(byL,byS,i.cups);
}
function unitCost(){
  const u=k=>PACKS[k][0][1]/PACKS[k][0][0];
  return (s.recipe.lemons*u("lemons")+s.recipe.sugar*u("sugar"))/CUPS_PER_PITCHER+u("cups")+s.recipe.ice*u("ice");
}
function buy(item,idx){
  const [n,c]=PACKS[item][idx];
  if(s.cash<c){toast("Not enough cash");return}
  s.cash-=c;s.inv[item]+=n;s.today.spent+=c;s.totals.spent+=c;autosave();render();
}

/* ---------- the day's simulation ---------- */
function shiftWx(f){const i=WX_ORDER.indexOf(f);const j=clamp(i+(Math.random()<0.5?-1:1),0,WX_ORDER.length-1);return WX_ORDER[j]}
function idealIce(t){return t>=36?4:t>=30?3:t>=26?2:1}
function taste(ice,temp){
  const r=s.recipe,dl=r.lemons-4,ds=r.sugar-4,di=ice-idealIce(temp);
  const sc=clamp(1-0.11*Math.abs(dl)-0.09*Math.abs(ds)-0.1*Math.abs(di),0,1);
  const faults=[[Math.abs(dl)*1.1,dl<0?"watery":"sour"],[Math.abs(ds),ds<0?"plain":"sweet"],[Math.abs(di),di<0?"warm":"icy"]].sort((a,b)=>b[0]-a[0]);
  const why=faults[0][0]>=2?faults[0][1]:sc>0.86?"perfect":"good";
  return {sc,why};
}
function openStand(){
  const posterCost=s.posters*POSTER_COST;
  if(posterCost>s.cash){toast("Not enough cash for that many posters");return}
  s.cash-=posterCost;s.today.spent+=posterCost;s.totals.spent+=posterCost;
  const actual=Math.random()<0.75?s.forecast:shiftWx(s.forecast);
  const w=WX[actual],temp=rint(w.t[0],w.t[1]);
  const ev=EVENTS.find(e=>e.id===s.event);
  const crowd=w.mult*(ev?ev.mult:1);
  const ads=1+0.55*(1-Math.exp(-s.posters/4));
  const fair=(8+Math.max(0,temp-22)*0.7)*(ev&&ev.priceMult||1);
  const surprise=Math.random()<0.14?pick(["rival","blogger","ants"]):null;
  const rep0=s.rep,inv0=Object.assign({},s.inv);
  const people=[],moods=[0,0,0];let closeAt=480;
  const log=[];let pitcher=0,pitchers=0,sold=0,rev=0,soldOut=null,noIce=0,tasteSum=0,passers=0;
  log.push({t:"8:30",x:`You set up the stand. It's ${w.name.toLowerCase()}, ${temp}°C.`+(actual!==s.forecast?` (The forecast said ${WX[s.forecast].name.toLowerCase()}.)`:""),c:actual!==s.forecast?"warn":""});
  if(s.posters>0)log.push({t:"8:45",x:`${s.posters} poster${s.posters>1?"s":""} go up on the lamp posts nearby.`});
  for(let h=0;h<HOURS.length;h++){
    const hr=HOURS[h];
    if(actual==="storm"&&hr>=13){log.push({t:hr+":00",x:"Thunder cracks overhead. Everyone runs for cover and you pack up early.",c:"warn"});closeAt=h*60;break}
    if(surprise==="rival"&&hr===12)log.push({t:"12:00",x:"A rival cart sets up across the road, selling cheaper sherbet.",c:"warn"});
    const n=poisson(13*crowd*ads*(0.6+0.8*s.rep)*HOUR_SHAPE[h]);passers+=n;
    const mins=Array.from({length:n},()=>h*60+Math.random()*60).sort((a,b)=>a-b);
    let buyers=0,quote=null;
    for(let i=0;i<n;i++){
      const P=newPerson(mins[i],hr,actual);people.push(P);
      let p=1/(1+Math.exp((s.price-fair*1.15)/(fair*0.2)))*(0.72+0.38*s.rep);
      if(surprise==="rival"&&hr>=12)p*=0.7;
      if(Math.random()>=p){if(!quote&&s.price>fair*1.4&&Math.random()<0.05)quote={x:`${pick(PEOPLE)} ${pick(SAYS.price)}`};
        if(s.price>fair*1.2&&Math.random()<0.15){P.say=grumble(P);P.why="price"}continue}
      if(pitcher===0){
        if(s.inv.lemons>=s.recipe.lemons&&s.inv.sugar>=s.recipe.sugar){s.inv.lemons-=s.recipe.lemons;s.inv.sugar-=s.recipe.sugar;pitcher=CUPS_PER_PITCHER;pitchers++}
        else{soldOut=s.inv.lemons<s.recipe.lemons?"lemons":"sugar";Object.assign(P,{b:1,mood:-2,why:"soldout",say:pick(SOLD_SAYS)});closeAt=P.m;break}
      }
      if(s.inv.cups<1){soldOut="cups";Object.assign(P,{b:1,mood:-2,why:"soldout",say:pick(SOLD_SAYS)});closeAt=P.m;break}
      let ice=0;if(s.inv.ice>=s.recipe.ice){ice=s.recipe.ice;s.inv.ice-=ice}else if(s.recipe.ice>0)noIce++;
      s.inv.cups--;pitcher--;sold++;rev+=s.price;buyers++;
      const tt=taste(ice,temp);tasteSum+=tt.sc;
      const over=s.price>fair*1.35;
      s.rep=clamp(s.rep+(tt.sc-0.62)*0.012-(over?0.004:0),0.05,1);
      P.b=1;P.mood=tt.sc>=0.86?2:tt.sc>=0.62?1:0;if(over&&P.mood>0)P.mood--;P.why=tt.why;P.over=over?1:0;P.say=buyerSay(P,tt.why,over);moods[2-P.mood]++;
      if(!quote&&Math.random()<0.14)quote={x:`${pick(PEOPLE)}: “${pick(SAYS[tt.why])}”`,c:tt.why==="perfect"?"good":["good"].includes(tt.why)?"":"warn"};
    }
    let line=`${n} walked past, ${buyers} bought.`;
    log.push({t:hr+":00",x:line,q:quote});
    if(soldOut){log.push({t:(hr+1)+":00",x:`Out of ${soldOut}. You close the stand early.`,c:"warn"});break}
  }
  if(noIce>0&&s.recipe.ice>0)log.push({t:"—",x:`${noIce} cup${noIce>1?"s":""} went out without ice after it ran out.`,c:"warn"});
  const avgTaste=sold?tasteSum/sold:0;
  if(surprise==="blogger"&&sold>0){
    if(closeAt>450){const B=newPerson(450,16,actual);B.t="blogger";Object.assign(B,{b:2,mood:avgTaste>0.75?2:0,why:avgTaste>0.75?"perfect":"blog",say:avgTaste>0.75?"Wow! My followers will love this stand!":"Hmm, not great. I'll post an honest review."});people.push(B)}
    if(avgTaste>0.75){s.rep=clamp(s.rep+0.12,0.05,1);log.push({t:"16:30",x:"A food blogger films your lemonade and loves it. Word will spread.",c:"good"})}
    else{s.rep=clamp(s.rep-0.08,0.05,1);log.push({t:"16:30",x:"A food blogger tries a cup, pulls a face, and posts about it.",c:"warn"})}
  }
  // night
  const melt=s.inv.ice;s.inv.ice=0;
  const rot=Math.floor(s.inv.lemons*0.15);s.inv.lemons-=rot;
  let ants=0;if(surprise==="ants"){ants=Math.floor(s.inv.sugar*0.4);s.inv.sugar-=ants;}
  const wasted=pitcher;
  log.push({t:"17:00",x:`Closing time. ${sold} cups sold for ${money(rev)}.`,c:"good"});
  s.cash+=rev;s.totals.cups+=sold;s.totals.revenue+=rev;
  const used={lemons:inv0.lemons-s.inv.lemons-rot,sugar:inv0.sugar-s.inv.sugar-ants,cups:inv0.cups-s.inv.cups};
  s.report={wx:actual,temp,passers,sold,rev,spent:s.today.spent,profit:rev-s.today.spent,melt,rot,ants,wasted,pitchers,soldOut,rep0,rep1:s.rep,avgTaste,fair,used,moods};
  s.history.push({day:s.day,wx:actual,sold,rev,profit:rev-s.today.spent});
  s.crowd=people.sort((a,b)=>a.m-b.m);s.dayFx={wx:actual,temp,ev:s.event,rival:surprise==="rival",closeAt,storm:actual==="storm",price:s.price,posters:s.posters};
  s.anim={h:0,voices:[]};s.dayId=Date.now();
  s.log=log;s.shown=0;s.phase="selling";autosave();render();if(!animMode())runReveal();
}
function runReveal(){
  clearTimeout(revealTimer);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce){s.shown=s.log.length;render();return}
  const step=()=>{if(s.phase!=="selling"||s.shown>=s.log.length){render();return}s.shown++;renderSelling();revealTimer=setTimeout(step,520)};
  step();
}
function finishDay(){clearTimeout(revealTimer);
  if(s.report&&s.anim&&s.report.acks==null){const v=s.anim.voices||[],acks=v.filter(x=>x.ack).length,bonus=Math.min(0.04,acks*0.004);s.rep=clamp(s.rep+bonus,0.05,1);Object.assign(s.report,{rep1:s.rep,acks,voices:v.length,bonus})}
  s.crowd=null;s.anim=null;A.key=null;s.phase=s.day>=s.days?"final":"evening";if(s.phase==="final")recordBest();autosave();render()}
function nextDay(){s.day++;startDay();autosave();render();window.scrollTo(0,0)}
function recordBest(){
  const best=LS.get(K_BEST)||{};const k=String(s.days);const prof=s.cash-START_CASH;
  if(best[k]==null||prof>best[k]){best[k]=prof;LS.set(K_BEST,best);s.newBest=true}
}

/* ---------- weather icons ---------- */
function wxIcon(t){
  const sun='<circle cx="30" cy="30" r="12" fill="var(--lemon)"/><g stroke="var(--lemon)" stroke-width="4" stroke-linecap="round">'+[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<line x1="${30+Math.cos(r)*18}" y1="${30+Math.sin(r)*18}" x2="${30+Math.cos(r)*25}" y2="${30+Math.sin(r)*25}"/>`}).join("")+'</g>';
  const cloud=(y,c)=>`<path d="M14 ${y+16}h30a9 9 0 0 0 0-18 13 13 0 0 0-25-3 8 8 0 0 0-5 21z" fill="${c}"/>`;
  const svg=b=>`<svg viewBox="0 0 60 60" aria-hidden="true">${b}</svg>`;
  if(t==="sunny")return svg(sun);
  if(t==="hot")return svg(sun.replace('r="12" fill="var(--lemon)"','r="13" fill="#f08a24"')+'<circle cx="30" cy="30" r="7" fill="var(--lemon)"/>');
  if(t==="cloudy")return svg('<g transform="translate(8 -6) scale(.7)">'+sun+'</g>'+cloud(26,"var(--muted)"));
  if(t==="rain")return svg(cloud(14,"var(--muted)")+'<g stroke="var(--sky)" stroke-width="3" stroke-linecap="round"><line x1="20" y1="38" x2="17" y2="46"/><line x1="30" y1="38" x2="27" y2="48"/><line x1="40" y1="38" x2="37" y2="46"/></g>');
  return svg(cloud(14,"var(--ink)")+'<path d="M31 34l-7 12h6l-3 10 10-14h-6l4-8z" fill="var(--lemon)"/>');
}

/* ---------- rendering ---------- */
function stats(){
  if(!s)return"";
  return `<div class="stat"><div class="lbl">Day</div><b>${s.day}/${s.days}</b></div>
  <div class="stat"><div class="lbl">Cash</div><b class="${s.cash<START_CASH?"":""}">${money(s.cash)}</b></div>
  <div class="stat"><div class="lbl">Popularity</div><b>${Math.round(s.rep*100)}%</b><div class="meter"><i style="width:${Math.round(s.rep*100)}%"></i></div></div>`;
}
function stepper(id,label,sub,val,suffix){
  return `<div class="step"><div class="txt"><b>${label}</b><div class="small muted">${sub}</div></div>
  <div class="ctl"><button data-act="dec" data-k="${id}" aria-label="Less ${label}">−</button><output id="o_${id}">${val}${suffix||""}</output><button data-act="inc" data-k="${id}" aria-label="More ${label}">+</button></div></div>`;
}
function renderMorning(){
  const f=WX[s.forecast],ev=EVENTS.find(e=>e.id===s.event),r=s.recipe;
  const can=cupsPossible(),uc=unitCost(),margin=s.price-uc;
  const low=k=>{const need={lemons:r.lemons,sugar:r.sugar,cups:10,ice:r.ice*10}[k];return s.inv[k]<need};
  return `<section>
  <div class="card"><h3>Morning of day ${s.day}</h3>
    <div class="wx">${wxIcon(s.forecast)}<div><h2>${f.name}, ${f.t[0]}–${f.t[1]}°C</h2><p class="small muted">The radio forecast is right about 3 days in 4.</p></div></div>
    ${ev?`<div class="event">${esc(ev.text)}</div>`:""}
  </div>
  <div class="card"><h3>In your crate</h3>
    <div class="stock">${Object.keys(ITEMS).map(k=>`<div class="chip ${low(k)?"low":""}"><b>${s.inv[k]}</b><span class="small muted">${ITEMS[k].unit}</span></div>`).join("")}</div>
    <p class="small ${can<10?"neg":"muted"}" style="margin-top:8px">Enough to sell about <b class="num">${can}</b> cups with today's recipe${s.inv.ice<r.ice*Math.min(can,40)&&r.ice>0?". Ice will run short":""}.</p>
  </div>
  <div class="card"><h3>Market</h3>
    ${Object.keys(ITEMS).map(k=>`<div class="shoprow"><div class="top"><b>${ITEMS[k].label}</b><span class="small muted">${ITEMS[k].note}</span></div>
      <div class="packs">${PACKS[k].map((p,i)=>`<button class="pack" data-act="buy" data-k="${k}" data-i="${i}" ${s.cash<p[1]?"disabled":""}>${p[0]} ${ITEMS[k].unit}<small>${money(p[1])}</small></button>`).join("")}</div></div>`).join("")}
  </div>
  <div class="card"><h3>Recipe</h3><p class="small muted">One pitcher fills ${CUPS_PER_PITCHER} cups.</p>
    ${stepper("lemons","Lemons","per pitcher",r.lemons)}
    ${stepper("sugar","Sugar","spoons per pitcher",r.sugar)}
    ${stepper("ice","Ice","cubes per cup",r.ice)}
  </div>
  <div class="card"><h3>Selling</h3>
    ${stepper("price","Price","per cup · costs you about "+money(uc),money(s.price))}
    ${stepper("posters","Posters","₹"+POSTER_COST+" each, today only",s.posters)}
    <p class="small ${margin<0?"neg":"muted"}">Margin about ${money(margin)} a cup.</p>
  </div>
  <div class="segrow"><span>Watch the day as</span><div class="seg"><button data-act="setview" data-v="anim" aria-pressed="${animMode()}">Animated street</button><button data-act="setview" data-v="story" aria-pressed="${!animMode()}">Story text</button></div></div>
  <button class="big" data-act="open">Open the stand${s.posters?` · ${money(s.posters*POSTER_COST)} posters`:""}</button>
  </section>`;
}
function logHTML(n){
  return s.log.slice(0,n).map(l=>`<div class="h"><span class="t">${esc(l.t)}</span><div><div class="${l.c||""}">${esc(l.x)}</div>${l.q?`<div class="q ${l.q.c||""}">${esc(l.q.x)}</div>`:""}</div></div>`).join("");
}
function renderSellingInner(){
  const done=s.shown>=s.log.length;
  return `<div class="card"><h3>Day ${s.day} at the stand</h3><div class="log" id="log">${logHTML(s.shown)}</div></div>
  ${done?`<button class="big alt" data-act="finish">See today's accounts</button>`:`<button class="ghost" data-act="skip">Skip ahead</button>`}
  ${s.crowd?`<button class="ghost" data-act="viewanim">Watch the animated street</button>`:""}`;
}
function renderSelling(){
  if(view!=="game"||s.phase!=="selling"||(animMode()&&s.crowd))return;
  const sec=$("sellsec");if(!sec){render();return}
  sec.innerHTML=renderSellingInner();
  const last=sec.querySelector(".log .h:last-child");if(last&&last.scrollIntoView)last.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function advice(r){
  const tips=[];
  if(r.soldOut)tips.push(`You ran out of ${r.soldOut}. Buy more before opening tomorrow.`);
  if(r.sold>0&&r.avgTaste<0.7)tips.push("Customers weren't happy with the taste. Check the comments and adjust the recipe.");
  if(s.price>r.fair*1.35)tips.push("Many people thought your price was too high for the weather.");
  else if(s.price<r.fair*0.8&&r.sold>20)tips.push("People bought happily. You could probably charge a bit more.");
  if(r.melt>40)tips.push(`${r.melt} ice cubes melted overnight. Buy ice to match the day.`);
  if(r.voices&&r.acks<r.voices)tips.push("Listen to what customers say. Each comment you acknowledge raises popularity a little.");
  if(!tips.length)tips.push("Steady day. Watch tomorrow's forecast and plan stock to match.");
  return tips;
}
function renderEvening(){
  const r=s.report,d=r.rep1-r.rep0;
  return `<section>
  <div class="card"><h3>Evening of day ${s.day}</h3>
    <div class="wx">${wxIcon(r.wx)}<div><h2>${r.sold} cups sold</h2><p class="small muted">${WX[r.wx].name}, ${r.temp}°C · ${r.passers} people walked past · ${r.pitchers} pitcher${r.pitchers===1?"":"s"} made</p></div></div>
  </div>
  <div class="card"><h3>Accounts</h3><table>
    <tr><td>Sales (${r.sold} × ${money(s.price)})</td><td class="pos">${money(r.rev)}</td></tr>
    <tr><td>Spent on stock and posters</td><td class="neg">${money(-r.spent)}</td></tr>
    <tr class="total"><td>Today's profit</td><td class="${r.profit>=0?"pos":"neg"}">${money(r.profit)}</td></tr>
    <tr><td>Cash in the tin</td><td>${money(s.cash)}</td></tr>
    <tr><td>Popularity</td><td class="${d>=0?"pos":"neg"}">${Math.round(r.rep0*100)}% → ${Math.round(r.rep1*100)}%</td></tr>
    ${r.moods?`<tr><td>Customer moods</td><td>😀 ${r.moods[0]} · 😐 ${r.moods[1]} · ☹️ ${r.moods[2]}</td></tr>`:""}
    ${r.voices?`<tr><td>Comments you listened to</td><td>⭐ ${r.acks} of ${r.voices}${r.bonus>0?` (+${(r.bonus*100).toFixed(1)}%)`:""}</td></tr>`:""}
  </table></div>
  <div class="card"><h3>Overnight</h3><table>
    <tr><td>Ice melted</td><td>${r.melt} cubes</td></tr>
    <tr><td>Lemons gone bad</td><td>${r.rot}</td></tr>
    ${r.ants?`<tr><td class="neg">Ants got into the sugar</td><td class="neg">${r.ants} spoons</td></tr>`:""}
    ${r.wasted?`<tr><td>Lemonade poured away</td><td>${r.wasted} cups</td></tr>`:""}
  </table></div>
  <div class="card"><h3>Notes for tomorrow</h3>${advice(r).map(t=>`<p style="margin-bottom:6px">${esc(t)}</p>`).join("")}</div>
  <button class="big" data-act="next">Start day ${s.day+1}</button>
  </section>`;
}
function renderFinal(){
  const prof=s.cash-START_CASH,best=(LS.get(K_BEST)||{})[String(s.days)];
  const grade=prof>s.days*400?"Lemonade tycoon":prof>s.days*200?"Street favourite":prof>s.days*60?"Steady seller":prof>0?"Small earner":"Back to the drawing board";
  const max=Math.max(1,...s.history.map(h=>Math.abs(h.profit)));
  return `<section>
  <div class="card title-card"><div class="lbl">Season over · ${s.days} days</div><h1>${grade}</h1>
    <p>You finished with <b class="num">${money(s.cash)}</b>, a profit of <b class="num ${prof>=0?"pos":"neg"}">${money(prof)}</b>.</p>
    <p class="small muted" style="margin-top:6px">${s.totals.cups} cups sold · ${money(s.totals.revenue)} taken · best ${s.days}-day profit on this phone: ${best!=null?money(best):"—"}${s.newBest?" (new record!)":""}</p></div>
  <div class="card"><h3>Profit by day</h3><div class="hist">${s.history.map(h=>`<div class="r"><span class="num muted">D${h.day}</span><div class="b" style="width:${Math.max(3,Math.abs(h.profit)/max*100)}%;background:${h.profit>=0?"var(--leaf)":"var(--bad)"}"></div><span class="num" style="text-align:right">${money(h.profit)}</span></div>`).join("")}</div></div>
  <button class="big" data-act="title">Play again</button>
  </section>`;
}
function renderTitle(){
  const auto=LS.get(K_AUTO),best=LS.get(K_BEST)||{};
  const canResume=auto&&auto.phase!=="final";
  return `<section>
  <div class="card title-card">
    <div class="lbl">A summer business game</div>
    <h1><span style="background:var(--lemon);color:var(--lemon-ink);padding:0 10px;border-radius:12px;display:inline-block;transform:rotate(-2deg)">Lemonade</span><br>Stand</h1>
    <p class="muted">You have ${money(START_CASH)} and a folding table. Buy lemons, sugar, cups and ice, set your recipe and price, and watch the street decide.</p>
  </div>
  ${canResume?`<button class="big alt" data-act="resume">Continue · day ${auto.day} of ${auto.days}, ${money(auto.cash)}</button>`:""}
  <div class="card"><h3>New season</h3>
    <div class="lenpick">${[7,14,30].map(d=>`<button data-act="len" data-d="${d}" aria-pressed="${sel===d}">${d} days${best[d]!=null?`<br><span class="small muted num">best ${money(best[d])}</span>`:""}</button>`).join("")}</div>

function pickType(hr,ev,wx){
  const w={boy:4,girl:4,schoolboy:0,schoolgirl:0,teen:5,man:8,woman:8,uncle:7,aunty:7,grandpa:4,grandma:4,cricketer:1,footballer:1,jogger:2,auto:3,postman:2,rider:3,office:4,officew:4,tourist:2};

  if(hr>=15){w.schoolboy=7;w.schoolgirl=7;w.footballer*=3;w.cricketer*=2}
  if(ev==="cricket"){w.cricketer=25;w.teen*=2}

  if(wx==="rain"||wx==="storm"){w.jogger=0;w.footballer=0;w.cricketer=ev==="cricket"?10:0}

  if(P.mood===1){if(over)P.why="price";return r<0.45?(over?pick(OVER_SAYS):pick(SAYS[why==="perfect"?"good":why])):""}

const A={key:null,speed:1,raf:0};
function startAnim(from){
  const fx=s.dayFx||{};
  Object.assign(A,{key:s.dayId,gm:from,ffTo:null,paused:false,done:false,next:0,sprites:[],queue:[],server:{cur:null,ph:"",t:0},
    bubbles:[],floats:[],earned:0,sold:0,moods:[0,0,0],soldOut:false,veh:[],vehT:0.5,flash:0,ltT:3,lastSave:Math.floor(from/60),pending:null,fx,bg:null,sky:null,grumbles:0});
  const bh=new Array(8).fill(0);for(const P of s.crowd)if(P.b)bh[Math.min(7,Math.floor(P.m/60))]++;
  A.svc=bh.map(n=>clamp(50/Math.max(1,n),0.6,3.6));
  while(A.next<s.crowd.length&&s.crowd[A.next].m<from){const P=s.crowd[A.next++];if(P.b===1&&P.mood>=0){A.earned+=fx.price;A.sold++;A.moods[2-P.mood]++}if(P.mood===-2)A.soldOut=true}
  const nc={sunny:2,hot:1,cloudy:6,rain:7,storm:8}[fx.wx]||3;
  A.clouds=Array.from({length:nc},()=>({x:Math.random()*SW,y:10+Math.random()*44,s:0.6+Math.random()*0.7}));
  A.rain=Array.from({length:fx.wx==="storm"?120:70},()=>({x:Math.random()*SW,y:Math.random()*SH,v:200+Math.random()*120}));

function mountAnim(){
  const cv=$("stage");if(!cv)return;
  if(A.key!==s.dayId)startAnim(Math.min(8,(s.anim&&s.anim.h)||0)*60);
  A.cv=cv;A.ctx=cv.getContext("2d");sizeStage();
  cv.onpointerdown=stageTap;

  if(!A.raf){A.lastT=performance.now();A.raf=requestAnimationFrame(loop)}
}
function sizeStage(){if(!A.cv)return;const w=A.cv.parentElement.clientWidth||360,dpr=Math.min(2,window.devicePixelRatio||1);A.k=w/SW;A.dpr=dpr;A.w=w;
  A.cv.width=Math.round(w*dpr);A.cv.height=Math.round(w*SH/SW*dpr);A.cv.style.height=Math.round(w*SH/SW)+"px";A.bg=null;A.sky=null}
window.addEventListener("resize",()=>{if(A.cv&&document.body.contains(A.cv)&&Math.abs(A.cv.parentElement.clientWidth-A.w)>4)sizeStage()});
function loop(t){
  A.raf=0;
  if(!s||s.phase!=="selling"||!animMode()||view!=="game"||!s.crowd)return;
  if(!A.cv||!document.body.contains(A.cv))return;
  const dt=Math.min(0.1,(t-A.lastT)/1000);A.lastT=t;
  if(tab==="play"){
    if(!A.paused&&!A.done)advance(dt);
    if(!A.paused)ambient(dt);
    draw();
  }
  A.raf=requestAnimationFrame(loop);
}
const effSpeed=()=>A.ffTo!=null?(A.ffTo===Infinity?FF_DAY:FF_HOUR):A.speed;
function advance(dt){
  const dg=dt*GM_PER_SEC*effSpeed(),n=Math.ceil(dg/0.5),st=dg/n;
  for(let i=0;i<n&&!A.paused&&!A.done;i++)stepSim(st);
  for(const b of A.bubbles)b.age+=dt*1000;
  A.bubbles=A.bubbles.filter(b=>b.age<b.life&&!b.p.gone);
  for(const f of A.floats)f.age+=dt;
  A.floats=A.floats.filter(f=>f.age<1.3);
  const hNow=Math.min(7,Math.floor(A.gm/60));
  if(hNow!==A.lastSave&&!A.done){A.lastSave=hNow;s.anim.h=hNow;autosave()}
  if(A.ffTo!=null&&A.ffTo!==Infinity&&A.gm>=A.ffTo){A.ffTo=null;updateCtl()}
}
function stepSim(d){
  const end=Math.min(480,A.fx.closeAt),allIn=A.next>=s.crowd.length;
  if(A.gm<480&&!(A.soldOut&&allIn))A.gm=Math.min(480,A.gm+d);
  while(A.next<s.crowd.length&&s.crowd[A.next].m<=A.gm){spawn(s.crowd[A.next],A.next);A.next++}
  for(const p of A.sprites)moveSprite(p,d);
  A.sprites=A.sprites.filter(p=>!p.gone);
  serverStep(d);
  if(allIn&&!A.sprites.length&&!A.server.cur&&(A.gm>=end||A.soldOut)){A.done=true;s.anim.h=8;autosave();updateCtl();renderDone()}
}
function spawn(P,i){
  const T=PT[P.t]||PT.man,dir=Math.random()<0.5?1:-1,rainy=A.fx.wx==="rain"||A.fx.wx==="storm";
  A.sprites.push({P,i,T,dir,x:dir>0?-14:SW+14,y:202+Math.random()*20,ph:Math.random()*6,sp:(T.sp||14)*(0.9+Math.random()*0.2)*(rainy?1.2:1),
    st:P.b?"approach":"walk",umb:rainy&&!T.helmet&&Math.random()<0.75,umbC:COLS[rint(0,9)][1],cup:0,mood:null,t:0,mv:1});
}
function slotPos(k){if(k<8)return{x:184-19*k,y:192+(k%2)*3};const j=k-8;return{x:174-19*(j%8),y:206+(j%2)*3}}
function goTo(p,x,y,v){const dx=x-p.x,dy=y-p.y,L=Math.hypot(dx,dy);if(L<=v||L<0.4){p.x=x;p.y=y;return true}p.x+=dx/L*v;p.y+=dy/L*v;p.ph+=v*0.35;p.mv=1;return false}
function moveSprite(p,d){
  const v=p.sp*d;p.mv=0;
  if(p.st==="walk"||p.st==="leave"){
    p.x+=p.dir*v;p.ph+=v*0.35;p.mv=1;
    if(p.ly!=null)p.y+=(p.ly-p.y)*Math.min(1,d*1.5);
    if(p.st==="walk"&&p.P.say&&!p.said&&Math.abs(p.x-BOARD_X)<v+1){p.st="look";p.t=1.4;p.said=1;p.mood=p.P.mood;speak(p)}
    if(p.x<-34||p.x>SW+34)p.gone=true;
  }else if(p.st==="look"){p.t-=d;if(p.t<=0)p.st="walk"}
  else if(p.st==="approach"){const tg=slotPos(A.queue.length);if(goTo(p,tg.x,tg.y,v)){p.st="queue";A.queue.push(p)}}
  else if(p.st==="queue"){const tg=slotPos(A.queue.indexOf(p));goTo(p,tg.x,tg.y,v*1.3)}
}
function serverStep(d){
  const S=A.server;
  if(!S.cur){const h=A.queue[0];if(h&&h.st==="queue"){const tg=slotPos(0);if(Math.abs(h.x-tg.x)<0.6&&Math.abs(h.y-tg.y)<0.6){S.cur=h;S.ph="ask";S.t=0;h.st="served";bubble(h,pick(ASKS),1300,true)}}return}
  const h=S.cur,T=A.svc[Math.min(7,Math.floor(h.P.m/60))];S.t+=d;
  if(S.ph==="ask"&&S.t>=T*0.25){if(h.P.mood===-2){A.queue.shift();S.cur=null;A.soldOut=true;leave(h);return}S.ph="pour";S.t=0}
  else if(S.ph==="pour"&&S.t>=T*0.55){S.ph="hand";S.t=0}

function ambient(dt){
  for(const c of A.clouds){c.x+=5*c.s*dt;if(c.x>SW+40)c.x=-40}
  if(A.fx.wx==="rain"||A.fx.wx==="storm")for(const r of A.rain){r.y+=r.v*dt;r.x-=40*dt;if(r.y>SH){r.y=-8;r.x=Math.random()*(SW+40)}}
  if(A.fx.wx==="storm"){A.ltT-=dt;if(A.ltT<=0){A.flash=0.2;A.ltT=2.5+Math.random()*5}}

}

function animAction(a,b){
  switch(a){
    case "apause":if(!A.pending){A.paused=!A.paused;updateCtl()}return true;
    case "aspd":A.speed=+b.dataset.v;A.ffTo=null;if(!A.pending)A.paused=false;updateCtl();return true;
    case "affh":A.ffTo=Math.min(480,(Math.floor(A.gm/60)+1)*60);if(!A.pending)A.paused=false;updateCtl();return true;
    case "affd":A.ffTo=Infinity;if(!A.pending)A.paused=false;updateCtl();return true;
    case "astop":stopPref=b.dataset.v;LS.set(STOP_KEY,stopPref);updateCtl();return true;
    case "aack":ackVoice(A.pending);A.pending=null;A.paused=false;showOverlay();updateCtl();renderDone();return true;
    case "aackskip":A.pending=null;A.paused=false;showOverlay();updateCtl();return true;
    case "aackv":{const v=s.anim.voices[+b.dataset.i];ackVoice(v);if(A.pending===v){A.pending=null;A.paused=false;showOverlay();updateCtl()}renderDone();return true}
    case "skipanim":finishAnimNow();return true;
    case "viewstory":viewPref="story";LS.set(VIEW_KEY,viewPref);s.shown=s.log.length;render();return true;
    case "viewanim":viewPref="anim";LS.set(VIEW_KEY,viewPref);clearTimeout(revealTimer);render();return true;
    case "setview":viewPref=b.dataset.v;LS.set(VIEW_KEY,viewPref);render();return true;
  }
  return false;
}

  Object.assign(T,{startCash:Math.round(clamp(g.cash,100,5000)/50)*50,startRep:Math.round(g.rep*100),lemons:g.recipe.lemons,sugar:g.recipe.sugar,ice:g.recipe.ice,adapt:0,mode:"fixed",fixed:g.price,posters:g.posters});

/* ---- model pieces (mirror the game engine) ---- */
const SHAPE_SUM=HOUR_SHAPE.reduce((a,b)=>a+b,0);                                  // 7.7 "hour-equivalents" a day
const STORM_FRAC=HOUR_SHAPE.slice(0,4).reduce((a,b)=>a+b,0)/SHAPE_SUM;              // storm closes at 13:00
const RIVAL_F=1-0.3*HOUR_SHAPE.slice(3).reduce((a,b)=>a+b,0)/SHAPE_SUM;             // rival from 12:00, -30% buying
const P_SUR=0.14/3;                                                                  // each surprise (rival/blogger/ants)
const RIVAL_MEAN=1-P_SUR*(1-RIVAL_F);
const BASE=13*SHAPE_SUM;
const fairOf=(temp,ev)=>(8+Math.max(0,temp-22)*0.7)*(ev&&ev.priceMult||1);
const buyP=(price,f,rep)=>1/(1+Math.exp((price-1.15*f)/(0.2*f)))*(0.72+0.38*rep);
const adsF=P=>1+0.55*(1-Math.exp(-P/4));
const midT=w=>(WX[w].t[0]+WX[w].t[1])/2;
const crowdOf=(w,ev)=>(w==="storm"?WX.storm.mult*STORM_FRAC:WX[w].mult)*(ev?ev.mult:1);
const tierFor=c=>c>=1200?2:c>=500?1:0;
const TIER_NAME=["small","medium","large"];
function tasteOf(ice,temp){const dl=T.lemons-4,ds=T.sugar-4,di=ice-idealIce(temp);return clamp(1-0.11*Math.abs(dl)-0.09*Math.abs(ds)-0.1*Math.abs(di),0,1)}
function priceFor(tPlan,ev){return T.mode==="fair"?Math.max(1,Math.round(T.k/100*fairOf(tPlan,ev))):T.fixed}
function iceFor(tPlan){return T.adapt?idealIce(tPlan):T.ice}
function costs(tier,ice){const u=k=>PACKS[k][tier][1]/PACKS[k][tier][0];
  const c={L:T.lemons*u("lemons")/CUPS_PER_PITCHER,S:T.sugar*u("sugar")/CUPS_PER_PITCHER,C:u("cups"),I:ice*u("ice")};c.all=c.L+c.S+c.C+c.I;c.dry=c.L+c.S+c.C;return c}
const SCN=(()=>{const out=[],evs=[[null,0.78]].concat(EVENTS.map(e=>[e,0.22/EVENTS.length]));
  for(const w in WX){const pw=WX_WEIGHT[w]/100,[a,b]=WX[w].t,n=b-a+1;for(const [ev,pe] of evs)for(let t=a;t<=b;t++)out.push({w,ev,temp:t,p:pw*pe/n})}return out})();

/* Steady state: known weather each morning, enough stock, given popularity. Poisson mixture moments. */
function steady(rep,P,tier,priceOverride){
  let ES=0,ES2=0,EM=0,EM2=0,Q=0,over=0;const byW={};
  for(const sc of SCN){
    const tp=midT(sc.w),price=priceOverride||priceFor(tp,sc.ev),ice=iceFor(tp),c=costs(tier,ice),f=fairOf(sc.temp,sc.ev);
    const lam=BASE*crowdOf(sc.w,sc.ev)*adsF(P)*(0.6+0.8*rep)*buyP(price,f,rep)*RIVAL_MEAN;
    const m=price-c.all;
    ES+=sc.p*lam;ES2+=sc.p*(lam+lam*lam);EM+=sc.p*m*lam;EM2+=sc.p*m*m*(lam+lam*lam);
    Q+=sc.p*lam*tasteOf(ice,sc.temp);if(price>1.35*f)over+=sc.p*lam;
    const g=byW[sc.w]||(byW[sc.w]={p:0,S:0,Y:0,price:0});g.p+=sc.p;g.S+=sc.p*lam;g.Y+=sc.p*m*lam;g.price+=sc.p*price;
  }
  const F=P*POSTER_COST;
  for(const w in byW){const g=byW[w];g.S/=g.p;g.Y=g.Y/g.p-F;g.price/=g.p}
  return {ES,sdS:Math.sqrt(Math.max(0,ES2-ES*ES)),EY:EM-F,sdY:Math.sqrt(Math.max(0,EM2-EM*EM)),q:ES?Q/ES:0,overShare:ES?over/ES:0,byW};
}
function profitAtPrice(price,P,onlyW){let y=0,pw=0;
  for(const sc of SCN){if(onlyW&&sc.w!==onlyW)continue;const tp=midT(sc.w),c=costs(2,iceFor(tp));
    y+=sc.p*((price-c.all)*BASE*crowdOf(sc.w,sc.ev)*adsF(P)*1.4*buyP(price,fairOf(sc.temp,sc.ev),1)*RIVAL_MEAN);pw+=sc.p}
  return y/pw-P*POSTER_COST}
function popDays(){ // deterministic popularity path from the start value
  const pts=[T.startRep/100];let r=pts[0];
  for(let d=0;d<60;d++){const st=steady(r,T.posters,d<3?0:2);const dr=st.ES*(0.012*(st.q-0.62)-0.004*st.overShare);r=clamp(r+dr,0.05,1);pts.push(r)}
  return pts}
function normCdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}

/* ---- Monte Carlo ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function poisR(l,r){if(l<=0)return 0;if(l>30){const u=1-r(),v=r();return Math.max(0,Math.round(l+Math.sqrt(l)*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)))}
  const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L);return k-1}
function wR(r){let x=r()*100;for(const k in WX_WEIGHT){x-=WX_WEIGHT[k];if(x<=0)return k}return"sunny"}
function dayCtx(r){const fc=wR(r);let act=fc;if(r()>=0.75){const i=WX_ORDER.indexOf(fc);act=WX_ORDER[clamp(i+(r()<0.5?-1:1),0,4)]}
  const w=WX[act];return{fc,act,temp:w.t[0]+Math.floor(r()*(w.t[1]-w.t[0]+1)),ev:r()<0.22?EVENTS[Math.floor(r()*EVENTS.length)]:null}}
function shopDay(sh,ctx,cash,r,foot,dm){
  const tp=midT(ctx.fc),price=priceFor(tp,ctx.ev),ice=iceFor(tp),c=costs(tierFor(cash.v),ice);
  const posters=Math.max(0,Math.min(T.posters,Math.floor(cash.v/POSTER_COST)));
  const k=BASE*foot*dm*adsF(posters);
  const expD=k*crowdOf(ctx.fc,ctx.ev)*(0.6+0.8*sh.rep)*buyP(price,fairOf(tp,ctx.ev),sh.rep);
  const afford=Math.floor((cash.v-posters*POSTER_COST+sh.carry*c.dry)/(c.dry+c.I));
  const target=Math.max(0,Math.min(Math.ceil(T.buffer/100*expD),afford));
  const need=Math.max(0,target-sh.carry),stock=sh.carry+need;
  let spend=posters*POSTER_COST+need*c.dry+target*c.I;
  const f=fairOf(ctx.temp,ctx.ev),x=r(),sur=x<P_SUR?"rival":x<2*P_SUR?"blogger":x<3*P_SUR?"ants":null;
  let p=buyP(price,f,sh.rep);if(sur==="rival")p*=RIVAL_F;
  const crowd=crowdOf(ctx.act,ctx.ev),D=poisR(k*crowd*(0.6+0.8*sh.rep)*p,r),sales=Math.min(D,target);
  const used=Math.min(stock,Math.ceil(sales/CUPS_PER_PITCHER)*CUPS_PER_PITCHER);
  sh.carry=stock-used;
  spend+=(used-sales)*(c.L+c.S)+0.15*sh.carry*c.L+(sur==="ants"?0.4*sh.carry*c.S:0);   // poured away, rotten lemons, ants
  const q=tasteOf(ice,ctx.temp);
  sh.rep=clamp(sh.rep+sales*(0.012*(q-0.62)-(price>1.35*f?0.004:0))+(sur==="blogger"&&sales>0?(q>0.75?0.12:-0.08):0),0.05,1);
  const rev=sales*price;cash.v+=rev-spend;
  const cap=k*crowd*1.4*buyP(price,f,1)*(sur==="rival"?RIVAL_F:1);
  return{sales,rev,spend,cap,short:D>target}
}
function runOne(seed,two){
  const cash={v:T.startCash},s1={rep:T.startRep/100,carry:0};let s2=null,net2=0;const util=[];
  const o={sales:new Float32Array(T.horizon),profit:new Float32Array(T.horizon),open:-1,pay:-1,crunch:false,short:0};
  for(let d=0;d<T.horizon;d++){
    const r=mulberry32(seed*7919+d*104729+1),r2=mulberry32(seed*7919+d*104729+55555);
    const ctx=dayCtx(r),c0=cash.v;
    if(two&&!s2&&d>=7){const u=util.slice(-7).reduce((a,b)=>a+b,0)/7;
      if(u>=T.trigger/100&&cash.v>=T.setup+T.reserve){cash.v-=T.setup;s2={rep:s1.rep*T.carry/100,carry:0};o.open=d;net2=-T.setup}}
    const a=shopDay(s1,ctx,cash,r,1,s2?1-T.cann/100:1);
    util.push(a.cap>0?a.sales/a.cap:1);if(a.short)o.short++;
    let sold=a.sales;
    if(s2){const b=shopDay(s2,ctx,cash,r2,T.foot2/100,1);cash.v-=T.wage;sold+=b.sales;
      net2+=b.rev-b.spend-T.wage; if(o.pay<0&&net2>=0)o.pay=d-o.open}
    if(cash.v<0)o.crunch=true;
    o.sales[d]=sold;o.profit[d]=cash.v-c0;
  }
  o.end=cash.v;return o;
}
function pct(a,q){if(!a.length)return NaN;const b=Float64Array.from(a).sort();const i=(b.length-1)*q,lo=Math.floor(i);return b[lo]+(b[Math.min(lo+1,b.length-1)]-b[lo])*(i-lo)}
function simulate(){
  const N=T.runs,base=[],two=[];
  for(let i=0;i<N;i++){base.push(runOne(i+1,false));if(T.shop2)two.push(runOne(i+1,true))}
  return{base,two:T.shop2?two:null};
}

const kfmt=v=>Math.abs(v)>=1000?(v<0?"−":"")+"₹"+(Math.abs(v)/1000).toFixed(Math.abs(v)>=10000?0:1).replace(/\.0$/,"")+"k":money(v);
function chartFrame(el,H){const W=Math.max(280,Math.round(el.clientWidth||340));return{W,H,l:46,r:12,t:12,b:28}}

  const svg=el.querySelector("svg"),out=el.querySelector(".readout"),g=svg.querySelector(".guide");out.textContent=def;
  const move=e=>{const bb=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,x=(e.clientX-bb.left)*vb.width/bb.width;const h=pick(x);if(!h)return;

  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Distribution of monthly profit across simulated runs">`;
  ticks(mx,3).forEach(v=>svg+=`<line class="grid" x1="${f.l}" x2="${f.W-f.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${f.l-6}" y="${Y(v)+4}" text-anchor="end">${(v/Pf.length*100).toFixed(0)}%</text>`);
  bins.forEach((c,i)=>{if(!c)return;const x=f.l+i*bwp+1,y=Y(c),h=f.H-f.b-y,r=Math.min(3,h/2),bw=bwp-2,mid=lo+(i+.5)*w;
    svg+=`<path d="M${x} ${f.H-f.b}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${f.H-f.b}Z" fill="var(--s1)" opacity="${mid>=T.target?1:.45}"/>`});
  [lo,(lo+hi)/2,hi].forEach((v,i)=>svg+=`<text class="ax" x="${X(v)}" y="${f.H-8}" text-anchor="${["start","middle","end"][i]}">${kfmt(v)}</text>`);
  if(T.target>lo&&T.target<hi)svg+=`<line x1="${X(T.target)}" x2="${X(T.target)}" y1="${f.t}" y2="${f.H-f.b}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/><text class="lab" x="${X(T.target)+(X(T.target)>f.W*0.7?-4:4)}" y="${f.t+12}" text-anchor="${X(T.target)>f.W*0.7?"end":"start"}">Target</text>`;
  svg+=`<line class="guide" y1="${f.t}" y2="${f.H-f.b}" style="display:none"/></svg>`;
  const pHit=Pf.filter(v=>v>=T.target).length/Pf.length;
  el.innerHTML=`${svg}<div class="readout"></div>`;
  hookHover(el,x=>{const i=clamp(Math.floor((x-f.l)/bwp),0,B-1);return{x:f.l+(i+.5)*bwp,text:`${kfmt(lo+i*w)} to ${kfmt(lo+(i+1)*w)}: ${(bins[i]/Pf.length*100).toFixed(1)}% of runs`}},
    `Darker bars reach the target. ${(pHit*100).toFixed(0)}% of runs make at least ${money(T.target)} in month ${T.month}.`);
}

/* ---- tab layout ---- */
const SLF={};
function sl(id,label,min,max,step,fmt,hint){SLF[id]=fmt;return `<div class="fld"><label for="t_${id}"><span>${label}</span><output id="v_${id}">${fmt(T[id])}</output></label><input type="range" id="t_${id}" data-t="${id}" min="${min}" max="${max}" step="${step}" value="${T[id]}">${hint?`<div class="small muted">${hint}</div>`:""}</div>`}
function seg(k,label,opts){return `<div class="segrow"><span>${label}</span><div class="seg">${opts.map(([v,n])=>`<button data-act="tset" data-k="${k}" data-v="${v}" aria-pressed="${String(T[k])===String(v)}">${n}</button>`).join("")}</div></div>`}
const pctf=v=>v+"%",rs=v=>money(v),nf=v=>String(v);
function renderTech(){
  const el=$("tech");if(tab!=="tech")return;
  const M=Math.floor(T.horizon/30);if(T.month>M)T.month=M;
  el.innerHTML=`
  <div class="card"><div class="prose"><h2>Running the stand as a business</h2>
    <p class="muted">Every number on this tab comes from the same rules the game uses: the hourly crowd, the price-sensitivity curve, weather odds, spoilage and popularity. Change an input and the analysis reruns.</p></div>
    <div class="btnrow" style="margin-top:10px"><button class="ghost" data-act="tload">Use my current game</button><button class="ghost" data-act="treset">Reset inputs</button></div></div>

  <div class="card"><div class="sec-n">1 · STARTING POINT</div><h2>Initial constraints</h2>
    <div class="flds">${sl("startCash","Starting cash",100,3000,50,rs)}${sl("startRep","Starting popularity",5,100,5,pctf)}</div>
    <div class="tblwrap"><table class="tt" id="o_cons"></table></div>
    <div id="o_bind" style="margin-top:10px"></div></div>

  <div class="card"><div class="sec-n">2 · UNIT ECONOMICS</div><h2>What one cup earns</h2>
    <div class="flds">${sl("lemons","Lemons per pitcher",1,10,1,nf)}${sl("sugar","Sugar spoons per pitcher",0,12,1,nf)}</div>
    ${seg("adapt","Ice per cup",[[1,"Match the forecast"],[0,"Fixed"]])}
    ${T.adapt?"":sl("ice","Ice cubes per cup",0,6,1,nf)}
    ${seg("mode","Pricing",[["fair","Follow the weather"],["fixed","One fixed price"]])}
    ${T.mode==="fair"?sl("k","Price as % of the fair price",60,160,5,pctf,"Fair price = ₹8 + ₹0.70 for every °C above 22 °C"):sl("fixed","Price per cup",5,40,1,rs)}
    ${sl("posters","Posters per day",0,12,1,nf,"₹10 each")}
    <div class="tblwrap" style="margin-top:6px"><table class="tt" id="o_unit"></table></div>
    <div class="kpis" id="o_unitk" style="margin-top:10px"></div>
    <h3 style="margin-top:16px">Profit per day against price, once popular</h3>
    <div class="chart" id="c_price"></div>
    <p class="small muted" id="o_pricenote"></p></div>

  <div class="card"><div class="sec-n">3 · DEMAND AS A PROBABILITY</div><h2>Why sales are random, and how random</h2>
    <div class="prose small"><p>People pass the stand at random, so the count in an hour follows a Poisson distribution. Each passer buys with a probability that falls as the price rises above what the weather makes fair. Picking buyers at random from a Poisson stream gives another Poisson stream, so <b>cups per day, for a given weather, are Poisson</b>. Weather and street events then mix those days together, and a month adds up 30 of them, which by the central limit theorem is close to a normal curve.</p></div>
    <div class="formula" style="margin-top:10px">λ  = 13 × 7.7 × crowd(weather, event) × ads(posters) × (0.6 + 0.8·pop)
p  = 1 / (1 + e^((price − 1.15F) / 0.2F)) × (0.72 + 0.38·pop)
cups/day | weather ~ Poisson(λ·p)
month ≈ Normal(30·μ, 30·σ²)</div>
    <div class="tblwrap" style="margin-top:10px"><table class="tt" id="o_wx"></table></div>
    ${sl("target","Monthly profit target",0,100000,1000,rs)}
    <div class="kpis" id="o_clt"></div>
    <p class="small muted" style="margin-top:8px">The theory column assumes full popularity, the right stock every morning and a correct forecast. The simulation column plays the real game rules: forecasts that miss, cash limits, stock-outs, melted ice and poured-away lemonade.</p></div>

  <div class="card"><div class="sec-n">4 · GROWTH MONTH BY MONTH</div><h2>Monte Carlo of the season</h2>
    <div class="prose small" id="o_pop"></div>
    <div class="flds">${sl("runs","Simulated runs",200,4000,200,nf)}${sl("horizon","Days to simulate",30,180,30,v=>v+" days")}${sl("buffer","Stock bought vs expected demand",80,200,10,pctf,"Above 100% avoids running out but wastes more ice and lemons")}</div>
    <h3 style="margin-top:10px">Cups sold per week</h3><div class="chart" id="c_fan"></div>
    <div class="tblwrap"><table class="tt" id="o_month"></table></div>
    <h3 style="margin-top:14px">Spread of monthly profit</h3>
    <div class="chips">${Array.from({length:M},(_,i)=>`<button data-act="tset" data-k="month" data-v="${i+1}" aria-pressed="${T.month===i+1}">Month ${i+1}</button>`).join("")}</div>
    <div class="chart" id="c_hist" style="margin-top:6px"></div></div>

  <div class="card"><div class="sec-n">5 · MARKET CAPACITY</div><h2>When one street is full, open a second shop</h2>
    <div class="prose small" id="o_cap"></div>
    ${seg("shop2","Second shop",[[1,"Model it"],[0,"Single shop only"]])}
    ${T.shop2?`<div class="flds">
      ${sl("trigger","Open when last 7 days reach this % of capacity",50,100,5,pctf)}
      ${sl("reserve","…and cash left after setup is at least",0,10000,500,rs)}
      ${sl("setup","Setup cost (table, cooler, signboard)",500,10000,500,rs)}
      ${sl("wage","Helper's wage per day",0,800,50,rs)}
      ${sl("foot2","Second street footfall vs first",30,150,10,pctf)}
      ${sl("carry","Popularity carried to the new shop",0,100,10,pctf)}
      ${sl("cann","Customers shop 1 loses to shop 2",0,50,5,pctf)}</div>`:""}
    <div class="kpis" id="o_exp" style="margin-top:8px"></div>
    <h3 style="margin-top:14px">Median profit per month</h3><div class="chart" id="c_month"></div></div>

  <div class="card"><div class="sec-n">6 · STRATEGY</div><h2>SWOT</h2>
    <p class="small muted" style="margin-bottom:10px">Figures update with the inputs above.</p><div class="swot" id="o_swot"></div></div>`;
  updateTech();
}
let techTimer=null;
function scheduleTech(){clearTimeout(techTimer);techTimer=setTimeout(updateTech,160)}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.t;if(!k)return;T[k]=+e.target.value;const o=$("v_"+k);if(o)o.textContent=SLF[k](T[k]);saveT();scheduleTech()});
let lastRW=0;window.addEventListener("resize",()=>{if(tab!=="tech")return;const w=$("tech").clientWidth;if(Math.abs(w-lastRW)>20){lastRW=w;scheduleTech()}});

function verdict(cls,tag,html){return `<div class="verdict ${cls}"><i>${tag}</i><div>${html}</div></div>`}
function kpi(v,l,sub){return `<div class="kpi"><span class="lbl">${l}</span><b>${v}</b>${sub?`<span class="small muted">${sub}</span>`:""}</div>`}
const P100=x=>isFinite(x)?(x*100<1&&x>0?"<1%":x*100>99&&x<1?">99%":Math.round(x*100)+"%"):"—";

function updateTech(){
  if(tab!=="tech"||!$("o_cons"))return;
  lastRW=$("tech").clientWidth;
  const ref=32,refPrice=priceFor(ref,null),refIce=iceFor(ref),c0=costs(0,refIce),c2=costs(2,refIce);
  const st=steady(1,T.posters,2),st0=steady(T.startRep/100,T.posters,0);

  /* 1 constraints */
  const d1cap=Math.max(0,Math.floor((T.startCash-T.posters*POSTER_COST)/c0.all));
  const d1dem=BASE*crowdOf("sunny",null)*adsF(T.posters)*(0.6+0.8*T.startRep/100)*buyP(refPrice,fairOf(ref,null),T.startRep/100);
  const bulkCash=["lemons","sugar","cups","ice"].reduce((a,k)=>a+PACKS[k][2][1],0);
  $("o_cons").innerHTML=`<tr><th>Constraint</th><th>Value</th><th>Effect</th></tr>
   <tr><td>Starting cash</td><td>${money(T.startCash)}</td><td>${d1cap} cups of stock</td></tr>
   <tr><td>Bulk-pack premium</td><td>+${Math.round((c0.all/c2.all-1)*100)}%</td><td>needs ${money(bulkCash)} at once</td></tr>
   <tr><td>Ice melts overnight</td><td>100%</td><td>${money(c0.I)}/cup lost if unsold</td></tr>
   <tr><td>Lemons spoil overnight</td><td>15%</td><td>leftovers lose value</td></tr>
   <tr><td>Pitcher size</td><td>10 cups</td><td>up to 9 poured away</td></tr>
   <tr><td>Selling hours</td><td>9–17</td><td>storm closes at 13:00</td></tr>
   <tr><td>One street's footfall</td><td>${Math.round(BASE*adsF(T.posters)*1.4)}/day</td><td>sunny, full popularity</td></tr>`;
  $("o_bind").innerHTML=d1cap<d1dem
    ?verdict("no","CASH","On a sunny first day about <b>"+Math.round(d1dem)+"</b> people want a cup at "+money(refPrice)+", but "+money(T.startCash)+" only stocks <b>"+d1cap+"</b>. Cash is the limit, so keep posters low until the tin fills up.")
    :d1cap<d1dem*1.4?verdict("mid","TIGHT","Your cash stocks <b>"+d1cap+"</b> cups against about <b>"+Math.round(d1dem)+"</b> sunny-day buyers. That just covers a normal day, but a scorching day or a festival (up to 1.8× the crowd) will sell you out. Cash and demand are both limits until the first good day.")
    :verdict("ok","DEMAND","Your cash stocks <b>"+d1cap+"</b> cups and a sunny first day brings about <b>"+Math.round(d1dem)+"</b> buyers, so demand is the limit. The job early on is raising popularity.");

  /* 2 unit economics */
  const row=(n,a,b)=>`<tr><td>${n}</td><td>${money2(a)}</td><td>${money2(b)}</td></tr>`;
  $("o_unit").innerHTML=`<tr><th>Per cup (sunny, 32 °C)</th><th>Small packs</th><th>Large packs</th></tr>
    ${row("Lemons",c0.L,c2.L)}${row("Sugar",c0.S,c2.S)}${row("Paper cup",c0.C,c2.C)}${row("Ice ("+refIce+" cubes)",c0.I,c2.I)}
    <tr class="sum"><td>Ingredient cost</td><td>${money2(c0.all)}</td><td>${money2(c2.all)}</td></tr>
    <tr><td>Your price</td><td>${money2(refPrice)}</td><td>${money2(refPrice)}</td></tr>
    <tr class="sum"><td>Margin per cup</td><td class="${refPrice>c0.all?"pos":"neg"}">${money2(refPrice-c0.all)}</td><td class="${refPrice>c2.all?"pos":"neg"}">${money2(refPrice-c2.all)}</td></tr>`;
  const gm=(refPrice-c2.all)/refPrice,be=T.posters*POSTER_COST/Math.max(.01,refPrice-c0.all);
  $("o_unitk").innerHTML=kpi(Math.round(gm*100)+"%","Gross margin","large packs, before waste")+kpi(refPrice>c0.all?Math.ceil(be)+" cups":"never","Break-even per day","covers "+money(T.posters*POSTER_COST)+" of posters")
    +kpi(money(st.EY),"Expected profit/day","full popularity, all weather")+kpi(Math.round(st.q*100)+"%","Customer taste score","popularity grows above 62%");
  const best=drawPrice($("c_price"));
  $("o_pricenote").textContent=`Your current pricing earns ${money(st.EY)}/day on average once popular; the best single price is ₹${best} (${money(profitAtPrice(best,T.posters))}). Following the weather beats one fixed price because a scorching day can carry about ₹${Math.round(fairOf(38)-fairOf(24))} more per cup than a rainy one.`;

  /* 3 probability */
  const names={hot:"Scorching",sunny:"Sunny",cloudy:"Cloudy",rain:"Rainy",storm:"Storm"};
  $("o_wx").innerHTML=`<tr><th>Weather</th><th>Chance</th><th>Avg price</th><th>Cups/day</th><th>Profit/day</th></tr>`+
    WX_ORDER.map(w=>{const g=st.byW[w];return `<tr><td>${names[w]}</td><td>${WX_WEIGHT[w]}%</td><td>${money(g.price)}</td><td>${Math.round(g.S)}</td><td class="${g.Y>=0?"":"neg"}">${money(g.Y)}</td></tr>`}).join("")+
    `<tr class="sum"><td>Blended day</td><td>100%</td><td></td><td>${Math.round(st.ES)} ± ${Math.round(st.sdS)}</td><td>${money(st.EY)} ± ${money(st.sdY)}</td></tr>`;

  const sim=simulate(),runs=sim.two||sim.base,M=Math.floor(T.horizon/30);
  const lastB=monthStats(sim.base,M-1).Pf,mu=30*st.EY,sg=Math.sqrt(30)*st.sdY,pTheory=1-normCdf((T.target-mu)/sg);
  const pSim=lastB.filter(v=>v>=T.target).length/lastB.length;
  let lossDays=0,nd=0;for(const o of sim.base)for(let d=Math.max(0,T.horizon-30);d<T.horizon;d++){nd++;if(o.profit[d]<0)lossDays++}
  $("o_clt").innerHTML=kpi(money(mu),"Month, theory","± "+money(sg)+" (1 σ)")+kpi(money(pct(lastB,.5)),"Month "+M+", simulated","median, one shop")
    +kpi(P100(pTheory),"P(≥ target), theory","normal approximation")+kpi(P100(pSim),"P(≥ target), simulated","month "+M+", one shop")
    +kpi(P100(lossDays/nd),"Chance a day loses money","month "+M+", one shop")+kpi(money(mu-1.645*sg),"Bad month (1 in 20)","theory, 5th percentile");

  /* 4 growth */
  const pp=popDays(),d90=pp.findIndex(r=>r>=0.9),dr0=pp[1]-pp[0];
  $("o_pop").innerHTML=`<p>Popularity is what grows. Each cup moves it by <span class="num">0.012 × (taste − 0.62)</span>, minus <span class="num">0.004</span> if the price is more than 1.35× fair. More popularity brings more passers and more buyers, which means more cups and faster growth: an S-curve that flattens at 100%.</p>`+
    (dr0<0?verdict("no","SHRINK","Your recipe and price score "+Math.round(st.q*100)+"%, below the 62% line, so popularity <b>falls</b> every day you sell. Fix the recipe before anything else.")
    :d90<0?verdict("mid","SLOW","Popularity rises, but it won't reach 90% within 60 days at this taste score ("+Math.round(st.q*100)+"%).")
    :verdict("ok",d90+" DAYS","From "+T.startRep+"% popularity you reach 90% in about <b>"+d90+" days</b>. After that, one street's sales stop growing. Monthly growth then comes only from price, events, or a second shop."));
  const cap1=st.ES,cap2=cap1*(1-T.cann/100)+st.ES*T.foot2/100;
  drawFan($("c_fan"),sim,cap1,cap2);
  let prev=null;
  $("o_month").innerHTML=`<tr><th>${sim.two?"With rule":"One shop"}</th><th>Cups</th><th>Profit</th><th>Growth</th><th>P(≥ target)</th><th>P(loss)</th></tr>`+
    Array.from({length:M},(_,m)=>{const {S,Pf}=monthStats(runs,m),med=pct(Pf,.5),g=prev==null?"—":((med/prev-1)*100>=0?"+":"")+Math.round((med/prev-1)*100)+"%";prev=med;
      return `<tr><td>Month ${m+1}</td><td>${Math.round(pct(S,.5))}</td><td>${money(med)}</td><td>${g}</td><td>${P100(Pf.filter(v=>v>=T.target).length/Pf.length)}</td><td>${P100(Pf.filter(v=>v<0).length/Pf.length)}</td></tr>`}).join("");
  drawHist($("c_hist"),runs);

  /* 5 capacity + expansion */
  const margin=refPrice-c2.all,dPoster=steady(1,T.posters+1,2).ES-st.ES;
  let stopP=0;for(let P=0;P<20;P++){if((steady(1,P+1,2).ES-steady(1,P,2).ES)*margin<POSTER_COST){stopP=P;break}}
  $("o_cap").innerHTML=`<p>The street's ceiling is the expected demand at full popularity with your price and posters: about <b class="num">${Math.round(st.ES)}</b> cups a day, or <b class="num">${money(30*st.EY)}</b> profit a month. Below it, the cheapest growth is a better recipe and price. Near it, the only levers left are more posters, which stop paying for themselves after about <b class="num">${stopP}</b> (the next one adds ${dPoster.toFixed(1)} cups/day, worth ${money(dPoster*margin)}, for ₹10), and new customers on a new street.</p>`;
  if(sim.two){
    const tw=sim.two,opened=tw.filter(o=>o.open>=0),od=opened.map(o=>o.open),by30=tw.filter(o=>o.open>=0&&o.open<30).length/tw.length;
    const paid=opened.filter(o=>o.pay>=0&&o.pay<=60).length/(opened.length||1),pays=opened.filter(o=>o.pay>=0).map(o=>o.pay);
    let win=0;for(let i=0;i<tw.length;i++)if(tw[i].end>sim.base[i].end)win++;
    $("o_exp").innerHTML=kpi(P100(opened.length/tw.length),"Opens within "+T.horizon+" days",od.length?"median day "+Math.round(pct(od,.5)+1):"rule never met")
      +kpi(P100(by30),"Opens in month 1","")
      +kpi(opened.length?P100(paid):"—","Pays back setup in 60 days",pays.length?"median "+Math.round(pct(pays,.5))+" days":"")
      +kpi(P100(win/tw.length),"Two shops end richer","same weather, day "+T.horizon)
      +kpi(money(pct(sim.base.map(o=>o.end),.5)),"Cash at end, one shop","median")+kpi(money(pct(tw.map(o=>o.end),.5)),"Cash at end, with rule","median")
      +kpi(P100(tw.filter(o=>o.crunch).length/tw.length),"Cash runs out some day","wages and stock exceed the tin")+kpi(P100(tw.reduce((a,o)=>a+o.short,0)/tw.length/T.horizon),"Shop 1 sells out","share of days");
  }else{
    $("o_exp").innerHTML=kpi(money(pct(sim.base.map(o=>o.end),.5)),"Cash at end","median, day "+T.horizon)+kpi(P100(sim.base.reduce((a,o)=>a+o.short,0)/sim.base.length/T.horizon),"Sells out","share of days");
  }
  drawMonths($("c_month"),sim);

  /* 6 SWOT */
  const pBad=(WX_WEIGHT.rain+WX_WEIGHT.storm)/100,evUp=0.22*0.5,ex=sim.two?(()=>{let w=0;for(let i=0;i<sim.two.length;i++)if(sim.two[i].end>sim.base[i].end)w++;return w/sim.two.length})():null;
  $("o_swot").innerHTML=`
   <div class="S"><h4>Strengths</h4><ul><li>${Math.round(gm*100)}% gross margin per cup at bulk prices</li><li>Starts with only ${money(T.startCash)}; no rent or wages</li><li>Popularity compounds: ${d90>0?d90+" days":"weeks"} to 90% with a good recipe</li><li>Price can follow the weather every morning</li></ul></div>
   <div class="W"><h4>Weaknesses</h4><ul><li>Ice is lost every night; lemons lose 15%</li><li>Small packs cost ${Math.round((c0.all/c2.all-1)*100)}% more until cash reaches about ${money(bulkCash)}</li><li>One street caps sales near ${Math.round(st.ES)} cups/day</li><li>${P100(lossDays/nd)} of days lose money even when popular</li></ul></div>
   <div class="O"><h4>Opportunities</h4><ul><li>Festivals and cricket finals lift crowds 60–80% (${P100(evUp)} of days)</li><li>Scorching days (20%) allow ₹${Math.round(fairOf(38)-fairOf(32))} more per cup</li><li>Bulk buying cuts cost per cup to ${money2(c2.all)}</li><li>${ex!=null?"A second street beats staying put in "+P100(ex)+" of runs":"A second street can lift the ceiling"}</li></ul></div>
   <div class="T"><h4>Threats</h4><ul><li>Rain or storm on ${P100(pBad)} of days; storms close at 13:00</li><li>The forecast is wrong 1 day in 4</li><li>Rival carts cut afternoon buying by 30%</li><li>Bad taste or greedy prices drain popularity; a blogger can swing it ±10%</li></ul></div>`;
}
function money2(x){return (x<0?"−":"")+"₹"+Math.abs(x).toFixed(2)}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.s){s=data.s;view=data.view||"game"}
  else{const au=LS.get(K_AUTO);if(au&&au.v===1){s=au;view="title"}}
  render();
  if(tab==="tech")renderTech();
  if(view==="game"&&s&&s.phase==="selling"&&!(animMode()&&s.crowd))runReveal();
}
window.claude?.hot?.snapshot?.(()=>({s,view}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
