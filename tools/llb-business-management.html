.flash{perspective:1200px;max-width:720px;margin:10px auto}

.fc .front{background:var(--card)}
.fc .front b{font-family:Georgia,serif;font-size:30px;color:var(--accent)}
.fc .back{background:var(--hl);transform:rotateY(180deg);font-size:18px}
.fc small{color:var(--muted);margin-top:10px;font-size:13px}
.q{margin:12px 0;padding:12px 16px;background:var(--bg);border:1px solid var(--rule);border-radius:10px}

.opt{text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;color:var(--ink)}

.score{font-size:22px;font-family:Georgia,serif}

.casecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px}

.cc .cit{font:13px ui-monospace,Consolas,monospace;color:var(--muted);display:block;margin:2px 0 6px}

.search{width:100%;max-width:420px}
.foot{margin-top:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule);padding-top:10px}

@media print{#top,#side,.noprint{display:none!important}#main{padding:0}.card{break-inside:avoid;box-shadow:none}}
</style>

<script>
"use strict";
/* ============================================================
   DATA
   ============================================================ */
const UNITS = [
 {id:"u1", n:1, title:"Nature of Business", short:"Business, industry and commerce; objectives; environment; social responsibility."},
 {id:"u2", n:2, title:"Forms of Business Organisation", short:"Sole trader, partnership, LLP, HUF, companies, co-operatives, public enterprises."},
 {id:"u3", n:3, title:"Nature of Management", short:"Meaning, levels, roles; Taylor, Fayol and the evolution of management thought."},
 {id:"u4", n:4, title:"Planning, Decisions and Organising", short:"Planning and MBO, decision-making, organisation structures, delegation."},
 {id:"u5", n:5, title:"Staffing, Directing and Controlling", short:"Recruitment and selection, motivation, leadership, communication, control."}
];
const EXTRAS = [
 {id:"thinkers", ic:"🧠", title:"Management thinkers"},
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"glossary", ic:"📖", title:"Glossary"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"refs", ic:"📚", title:"References"}
];

const FLASH = [
 ["Business","Regular production or purchase and sale of goods and services with the aim of earning profit."],
 ["Industry","Activities that produce or process goods: extractive, genetic, manufacturing, construction."],
 ["Commerce","Trade plus the aids to trade (transport, banking, insurance, warehousing, advertising) that remove hindrances in exchange."],
 ["Aids to trade","Services that help trade: transport (place), warehousing (time), banking (finance), insurance (risk), advertising (information)."],
 ["Social responsibility","The obligation of business to act in the interests of society, not only its owners."],
 ["CSR under Section 135","Companies above set thresholds must spend 2% of average net profit of the last three years on CSR activities in Schedule VII."],
 ["Sole proprietorship","Business owned and controlled by one person with unlimited liability."],
 ["Partnership","Relation between persons who agree to share the profits of a business carried on by all or any of them acting for all (Sec. 4, Partnership Act, 1932)."],
 ["Mutual agency","Each partner is both an agent and a principal of the firm."],
 ["LLP","Limited Liability Partnership: a body corporate with separate legal entity, partners' liability limited (LLP Act, 2008)."],
 ["Karta","The senior-most member who manages a Joint Hindu Family business; only he has unlimited liability."],
 ["Company","An artificial person created by law, with separate legal entity, perpetual succession and limited liability."],
 ["Private company","Restricts transfer of shares, maximum 200 members, cannot invite the public to subscribe."],
 ["One Person Company","A company with only one member, who must be an individual and an Indian citizen."],
 ["Government company","A company in which at least 51% of the paid-up share capital is held by the Central and/or State Governments."],
 ["Management","Getting things done through others, effectively and efficiently, by planning, organising, staffing, directing and controlling."],
 ["Effectiveness vs efficiency","Effectiveness: doing the right things (achieving goals). Efficiency: doing things right (minimum cost)."],
 ["Scientific management","F.W. Taylor's approach: replace rule of thumb with scientific study of work."],
 ["Functional foremanship","Taylor's technique: eight specialist foremen supervise a worker instead of one."],
 ["Unity of command","Fayol: each employee receives orders from one superior only."],
 ["Scalar chain","Fayol: the formal line of authority from top to bottom; 'gang plank' allows direct contact between equals."],
 ["Hawthorne studies","Elton Mayo's experiments (1924–32) showing that social and human factors affect productivity."],
 ["MBO","Management by Objectives (Drucker, 1954): superior and subordinate jointly set goals and review performance against them."],
 ["Delegation","Passing authority to a subordinate. Authority can be delegated; accountability cannot."],
 ["Span of control","The number of subordinates a manager can supervise effectively."],
 ["Matrix structure","Employees report to both a functional head and a project manager."],
 ["Maslow's hierarchy","Physiological → safety → social → esteem → self-actualisation needs."],
 ["Hygiene factors","Herzberg: factors whose absence causes dissatisfaction but whose presence does not motivate – pay, policy, working conditions."],
 ["Theory X and Y","McGregor: X assumes people dislike work and need control; Y assumes people seek responsibility and self-direction."],
 ["Grapevine","Informal channel of communication spreading through social relationships."],
 ["Management by exception","Only significant deviations from plans are reported to top management."],
 ["Controlling","Ensuring that actual performance matches planned performance and taking corrective action."]
];

const GLOSSARY = [
 ["Entrepreneur","Person who sets up a business, bears its risk and organises resources.","Innovation is central (Schumpeter)."],
 ["PESTLE","Political, Economic, Social, Technological, Legal and Environmental factors of the business environment.","Used to scan the environment."],
 ["Liberalisation, Privatisation, Globalisation (LPG)","India's economic reforms from 1991.","Changed the business environment."],
 ["Unlimited liability","Owner's personal property can be used to pay business debts.","Sole trader, general partners, karta."],
 ["Limited liability","Owner's loss is limited to the capital invested or guaranteed.","Company shareholders, LLP partners."],
 ["Perpetual succession","The company continues regardless of changes in members.","'Members may come and go.'"],
 ["Separate legal entity","The company is a person distinct from its members.","Salomon v Salomon & Co (1897)."],
 ["Memorandum of Association","Charter of a company: name, registered office, objects, liability, capital.","Defines the company's powers."],
 ["Articles of Association","Rules for internal management of a company.","Subordinate to the memorandum."],
 ["Statutory corporation","Public enterprise created by a special Act of Parliament or State Legislature.","e.g. LIC (LIC Act, 1956)."],
 ["Departmental undertaking","Public enterprise run as a government department.","e.g. Indian Railways."],
 ["Co-operative society","Voluntary association for mutual help, 'one member one vote'.","e.g. Amul (dairy co-operative)."],
 ["Policy","General guide to thinking and decision-making.","'We promote from within.'"],
 ["Procedure","Sequence of steps to carry out an activity.","How to apply for leave."],
 ["Rule","Specific statement of what must or must not be done; no discretion.","'No smoking.'"],
 ["Budget","Plan expressed in numbers for a future period.","Sales budget, cash budget."],
 ["Programme","Comprehensive plan for a project combining objectives, policies, procedures and budgets.","Launching a new product."],
 ["Authority","Right to give orders and expect obedience.","Flows downward."],
 ["Responsibility","Obligation to perform the assigned duty.","Flows upward."],
 ["Accountability","Answerability for the outcome.","Cannot be delegated."],
 ["Recruitment","Searching for prospective employees and encouraging them to apply.","Positive process."],
 ["Selection","Choosing the best candidate from those who applied.","Negative process – rejects many."],
 ["Induction","Introducing a new employee to the job and the organisation.","Part of training."],
 ["Leadership","Influencing people to work willingly towards goals.","Autocratic, democratic, laissez-faire styles."],
 ["Critical point control","Focus control on key result areas that affect the whole organisation.","With management by exception."]
];

const THINKERS = [
 {n:"F.W. Taylor (1856–1915)", t:"Father of scientific management", p:"Principles: science not rule of thumb; harmony not discord; co-operation not individualism; development of each person to greatest efficiency. Techniques: time, motion and fatigue study, standardisation, differential piece-rate wages, functional foremanship.", w:"The Principles of Scientific Management (1911)"},
 {n:"Henri Fayol (1841–1925)", t:"Father of modern (general) management", p:"Five functions (plan, organise, command, co-ordinate, control) and 14 principles: division of work, authority and responsibility, discipline, unity of command, unity of direction, subordination of individual interest, remuneration, centralisation, scalar chain, order, equity, stability of tenure, initiative, esprit de corps.", w:"General and Industrial Management (1916)"},
 {n:"Max Weber (1864–1920)", t:"Bureaucracy", p:"An ideal organisation based on hierarchy, written rules, specialisation, impersonality and appointment on merit.", w:"Economy and Society"},
 {n:"Elton Mayo (1880–1949)", t:"Human relations movement", p:"Hawthorne experiments at Western Electric (1924–32): social needs, group norms and attention from supervisors affect productivity more than physical conditions alone.", w:"The Human Problems of an Industrial Civilization (1933)"},
 {n:"Abraham Maslow (1908–1970)", t:"Hierarchy of needs", p:"Physiological, safety, social, esteem and self-actualisation needs; a satisfied need no longer motivates.", w:"'A Theory of Human Motivation' (1943)"},
 {n:"Frederick Herzberg (1923–2000)", t:"Two-factor theory", p:"Hygiene factors (pay, policy, supervision, conditions) prevent dissatisfaction; motivators (achievement, recognition, the work itself, responsibility, growth) create satisfaction.", w:"The Motivation to Work (1959)"},
 {n:"Douglas McGregor (1906–1964)", t:"Theory X and Theory Y", p:"Managers' assumptions shape their style: X – people avoid work and need control; Y – people find work natural and seek responsibility.", w:"The Human Side of Enterprise (1960)"},

/* ============================================================
   STEP ANIMATION ENGINE  (P play · S step · X pause)
   ============================================================ */
function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}
function animBox(id,title,svg){

}

   + `<div class="row"><span class="score" style="font-size:17px" id="${id}Score"></span><button class="btn sm sec" id="${id}Again">Try again</button></div>`;
  let got=0, ans=0;
  $$(".q",box).forEach(q=>$$("[data-k]",q).forEach(b=>b.onclick=()=>{
    const it=items[+q.dataset.i]; if(q.dataset.answered) return; q.dataset.answered=1; ans++;
    const ok=b.dataset.k===it[1]; if(ok) got++;
    $$("[data-k]",q).forEach(x=>{ x.disabled=true; if(x.dataset.k===it[1]) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    $(".out",q).innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Correct.":"Answer: "+opts[it[1]]+"."} ${esc(it[2])}</div>`;
    $("#"+id+"Score").textContent=`${got} / ${ans} correct` + (ans===items.length?" – all done":"");
  }));

}

function adviseForm(o){
  if(o.purpose==="mutual") return ["Co-operative society","Members join for mutual benefit on 'one member, one vote'; governed by the State Co-operative Societies Act or the Multi-State Co-operative Societies Act, 2002."];
  if(o.family==="huf") return ["Joint Hindu Family (HUF) business","Membership by birth in the family; managed by the karta, whose liability alone is unlimited."];
  if(o.public==="yes") return ["Public limited company","Only a public company can invite the public to subscribe to its shares; minimum seven members, shares freely transferable."];
  if(o.owners==="1") return o.liab==="limited" ? ["One Person Company (OPC)","A single owner who wants limited liability and a separate legal entity; the member must be an individual and an Indian citizen."] : ["Sole proprietorship","Easiest and cheapest to start, full control and secrecy, but unlimited liability."];

    if(o.liab==="limited") return o.capital==="large" ? ["Private limited company","Limited liability, separate entity and the ability to bring in investors as shareholders; up to 200 members."] : ["Limited Liability Partnership (LLP)","Partners keep flexibility of a partnership but with limited liability; at least two designated partners."];
    return ["Partnership firm","Two to 50 partners share profits and management; simple to form but liability is unlimited and joint and several."];
  }
  return ["Private limited company","More than 50 owners rules out a partnership; a private company allows up to 200 members with limited liability."];
}

 <h4>Partnership</h4><p>Section 4 of the 1932 Act: the relation between persons who have agreed to share the profits of a business carried on by all or any of them acting for all. Essentials: agreement, two or more persons, business, sharing of profits, <b>mutual agency</b>. Types of partners: active, sleeping, nominal, partner by estoppel, minor admitted to benefits (Sec. 30).</p>
 <h4>Joint Hindu Family business</h4><p>Governed by Hindu law (Mitakshara or Dayabhaga); membership by birth; managed by the <b>karta</b>.</p>
 <h4>Company</h4><p>An artificial person with <b>separate legal entity</b> (<i>Salomon v Salomon &amp; Co</i>, 1897), <b>perpetual succession</b>, a common seal (now optional) and <b>limited liability</b>. Formation: promotion → incorporation (certificate of incorporation from the Registrar of Companies) → capital subscription (public company). Key documents: Memorandum and Articles of Association.</p>

 <h4>Nature of management</h4><ul><li><b>Science</b> – it has a systematic body of knowledge and principles, though they are not as exact as physical laws.</li><li><b>Art</b> – its application depends on personal skill and creativity.</li><li><b>Profession?</b> – it has knowledge and formal training, but no compulsory qualification or single licensing body (unlike law or medicine), so it is only partly a profession.</li></ul>

VIEWS.u4 = { html(){ return unitHead(4)+`
<div class="two"><div>
 <div class="card"><h3>Planning</h3><div class="key"><b>Planning</b> is deciding in advance what to do, how, when and by whom. It is the primary function – every other function follows from it.</div>
 <p><b>Steps</b>: set objectives → develop premises (assumptions about the future) → identify alternatives → evaluate them → select the best → implement → follow up.</p>
 <p><b>Types of plans</b>: objectives · strategies · policies · procedures · methods · rules · programmes · budgets (see glossary for examples).</p>
 <p><b>MBO</b> (Drucker, 1954): superior and subordinate jointly set clear, measurable objectives, then review progress and appraise performance against them.</p>
 <h4>Decision-making</h4><p>Identify the problem → gather information → develop alternatives → evaluate → choose → implement → review. Decisions may be programmed (routine) or non-programmed (new, one-off).</p></div>
 <div class="card"><h3>Organising</h3>
 <p><b>Process</b>: identify activities → group them into departments → assign duties → establish authority relationships.</p>
 <p><b>Formal organisation</b> is the official structure; <b>informal organisation</b> arises from social relationships (friendships, the grapevine).</p>
 <h4>Delegation</h4><table class="t"><tr><td><b>Authority</b></td><td>Right to command – can be delegated</td></tr><tr><td><b>Responsibility</b></td><td>Obligation to perform – arises from delegated work</td></tr><tr><td><b>Accountability</b></td><td>Answerability for results – cannot be delegated</td></tr></table>
 <p><b>Centralisation</b> keeps decision-making at the top; <b>decentralisation</b> spreads it to lower levels. Decentralisation is delegation extended systematically to all levels.</p>
 <p><b>Span of control</b>: narrow span → tall structure, close supervision; wide span → flat structure, more autonomy.</p></div>
</div><div>
 ${animBox("orgAnim","Five ways to structure an organisation",`<svg viewBox="0 0 900 310" id="orgSvg"></svg>`)}
 <div class="card lab"><h3>Pick the structure</h3><div id="lab4"></div></div>
</div></div>`+unitFoot(4)+footer(); },

VIEWS.u5 = { html(){ return unitHead(5)+`
<div class="two"><div>
 <div class="card"><h3>Staffing</h3><div class="key"><b>Staffing</b> is filling and keeping filled the positions in the organisation with the right people.</div>
 <p><b>Process</b>: manpower planning → recruitment → selection → placement and induction → training and development → performance appraisal → promotion, transfer, compensation.</p>
 <p><b>Sources of recruitment</b>: internal (promotion, transfer – boosts morale, cheaper) and external (advertisements, campus recruitment, employment exchanges, placement agencies, online portals, employee referrals – brings fresh talent).</p>
 <p><b>Selection process</b>: preliminary screening → tests (aptitude, personality, trade) → interview → reference and background check → medical test → job offer → contract.</p>
 <p><b>Training</b>: on-the-job (apprenticeship, job rotation, coaching) and off-the-job (lectures, case studies, simulation, vestibule training).</p></div>
 <div class="card"><h3>Directing</h3><p>Directing guides and inspires people. Its elements: <b>supervision</b>, <b>motivation</b>, <b>leadership</b> and <b>communication</b>.</p>
 <h4>Motivation theories</h4><ul><li><b>Maslow</b> – five needs in a hierarchy; a satisfied need stops motivating (see animation).</li><li><b>Herzberg</b> – hygiene factors versus motivators.</li><li><b>McGregor</b> – Theory X (close control) vs Theory Y (trust and participation).</li></ul>
 <p>Incentives may be <b>financial</b> (pay, bonus, profit sharing, stock options) or <b>non-financial</b> (status, recognition, job security, job enrichment, participation).</p>
 <h4>Leadership styles</h4><table class="t"><tr><td><b>Autocratic</b></td><td>Leader decides alone; quick decisions; useful in crises</td></tr><tr><td><b>Democratic</b></td><td>Consults the group; higher morale and commitment</td></tr><tr><td><b>Laissez-faire</b></td><td>Leaves decisions to the group; suits expert teams</td></tr></table>
 <h4>Communication</h4><p>Process: sender → encoding → message → channel → decoding → receiver → feedback. Formal (vertical, horizontal) and informal (grapevine). Barriers: semantic (language, jargon), psychological (distrust, premature evaluation), organisational (rigid rules, too many levels), personal.</p></div>
 <div class="card"><h3>Controlling</h3><p>Ensuring that actual performance conforms to plans. <b>Planning and controlling</b> are inseparable – planning sets standards, controlling checks them.</p>
 <p><b>Process</b>: set standards → measure actual performance → compare → analyse deviations (critical point control and management by exception) → take corrective action.</p>
 <p><b>Techniques</b>: traditional – personal observation, statistical reports, break-even analysis, budgetary control; modern – return on investment, ratio analysis, responsibility accounting, management audit, PERT and CPM.</p></div>
</div><div>
 ${animBox("mzAnim","Maslow's hierarchy of needs",MASLOW_SVG)}
 <div class="card lab"><h3>Hygiene factor or motivator?</h3><div id="lab5"></div></div>
</div></div>`+unitFoot(5)+footer(); },

 }};

function footer(){ return `<div class="foot">Business Organisation &amp; Management explorer · v1.0.0 · Reference material for first-semester B.Com. LL.B. students, based on the standard first-year B.Com. syllabus. Always check against your own course outline and the current law.</div>`; }

/* ---------------- FLASHCARDS ---------------- */
let fIdx=0, fDeck=FLASH.slice();
VIEWS.flash = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Flashcards</h2><p>${FLASH.length} key terms. Click the card or press Space to flip; use ← → to move.</p></div>
 <div class="card"><div class="flash"><div class="fc" id="fc"><div class="front"><b id="fFront"></b><small>Click or Space to see the meaning</small></div><div class="back"><div id="fBack"></div><small id="fCount"></small></div></div></div>
 <div class="row" style="justify-content:center"><button class="btn sec" id="fPrev">← Previous</button><button class="btn" id="fFlip">Flip</button><button class="btn sec" id="fNext">Next →</button><button class="btn sec" id="fShuf">Shuffle</button><span id="fPos" style="margin-left:10px;color:var(--muted)"></span></div></div>`+footer(); },
 init(){ fIdx=0; this.show(); $("#fc").onclick=()=>$("#fc").classList.toggle("flip"); $("#fFlip").onclick=()=>$("#fc").classList.toggle("flip"); $("#fPrev").onclick=()=>this.move(-1); $("#fNext").onclick=()=>this.move(1); $("#fShuf").onclick=()=>{fDeck=shuffle(FLASH); fIdx=0; this.show();}; },
 show(){ const c=fDeck[fIdx]; $("#fc").classList.remove("flip"); $("#fFront").textContent=c[0]; $("#fBack").textContent=c[1]; $("#fPos").textContent=`${fIdx+1} / ${fDeck.length}`; },
 move(d){ fIdx=(fIdx+d+fDeck.length)%fDeck.length; this.show(); }
};

/* ---------------- QUIZ ---------------- */
VIEWS.quiz = { html(){ return `<div class="unitban"><div class="k">Test yourself</div><h2>Quiz</h2><p>${QUIZ.length} questions in the bank. Pick a unit or take a mixed set of 10.</p></div>
 <div class="card"><div class="row"><select id="qU"><option value="0">All units (10 random)</option>${UNITS.map(u=>`<option value="${u.n}">Unit ${u.n}: ${u.title}</option>`).join("")}</select><button class="btn" id="qStart">Start</button><span id="qBest" style="color:var(--muted)"></span></div></div>
 <div class="card" id="qBox" hidden><div id="qList"></div><div class="row" style="margin-top:10px"><span class="score" id="qScore"></span></div></div>`+footer(); },
 init(){
  const best=()=>{ const b=S.d.best, u=$("#qU").value; $("#qBest").textContent = b[u]!=null ? `Best: ${b[u]}%` : ""; };
  $("#qU").onchange=best; best();
  $("#qStart").onclick=()=>{
    const u=+$("#qU").value; const pool = u? QUIZ.filter(q=>q[0]===u) : QUIZ; const set = shuffle(pool).slice(0, u?pool.length:10);
    let got=0, ans=0; $("#qBox").hidden=false; $("#qList").innerHTML=set.map((q,i)=>qHTML(q,"q"+i)).join(""); $("#qScore").textContent=`0 / ${set.length}`;
    bindQ($("#qList"), ok=>{ ans++; if(ok) got++; $("#qScore").textContent=`${got} / ${set.length}` + (ans===set.length?`  ·  ${Math.round(100*got/set.length)}%`:"");
      if(ans===set.length){ const pct=Math.round(100*got/set.length), k=String(u); if(S.d.best[k]==null||pct>S.d.best[k]){S.d.best[k]=pct; S.save();} best(); toast(pct>=80?"Excellent!":pct>=50?"Good – revise the ones you missed.":"Revisit the units and try again."); } });
  };
 }};


/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
</body>
</html>
