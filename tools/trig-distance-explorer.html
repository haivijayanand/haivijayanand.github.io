<script>
"use strict";
const __version__ = "1.0.1";
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const R_E = 6371000, AU_KM = 149597870.7, MOON_KM = 384400;
const sind = a => Math.sin(a * D2R), cosd = a => Math.cos(a * D2R), tand = a => Math.tan(a * D2R);

/* ---------- formatting ---------- */
function f(x, d = 2) { if (!isFinite(x)) return '—'; return x.toLocaleString('en-US', { maximumFractionDigits: d, minimumFractionDigits: 0 }); }
function f4(x) { return isFinite(x) ? x.toFixed(4) : '—'; }
function sup(n) { const m = '⁰¹²³⁴⁵⁶⁷⁸⁹'; return String(n).split('').map(c => c === '-' ? '⁻' : m[+c]).join(''); }
function sci(x, sig = 3) {
  if (!isFinite(x)) return '—';
  const a = Math.abs(x);
  if (a === 0) return '0';
  if (a < 1e7 && a >= 0.01) return f(x, a < 10 ? 3 : a < 1000 ? 2 : 0);
  const e = Math.floor(Math.log10(a)); return (x / 10 ** e).toFixed(sig - 1) + ' × 10' + sup(e);
}
function dist(m) { return Math.abs(m) >= 1000 ? f(m / 1000, Math.abs(m) < 1e5 ? 2 : 0) + ' km' : f(m, 2) + ' m'; }
function pct(a, b) { return f(100 * (a - b) / b, 1) + ' %'; }
const ln = (s) => `<div class="ln">${s}</div>`;
const eq = (s) => `<div class="ln eq">${s}</div>`;

/* ---------- colours (read from CSS so theme switch works) ---------- */
let K = {};
function loadColors() {
  const cs = getComputedStyle(document.body);
  ['ink','muted','line','c1','c2','c3','c4','cv','ground','water','tree','treeS','mount','earth','sun','panel'].forEach(k => K[k] = cs.getPropertyValue('--' + k).trim());
}

/* ---------- canvas & drawing helpers ---------- */
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 800, H = 500;
function resize() {
  const r = cv.parentElement.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  W = Math.max(200, r.width); H = Math.max(200, r.height);
  cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); render();
}
function view(xmin, xmax, ymin, ymax, pad = 56) {
  const s = Math.min((W - 2 * pad) / (xmax - xmin), (H - 2 * pad) / (ymax - ymin));
  const ox = (W - (xmax - xmin) * s) / 2, oy = (H - (ymax - ymin) * s) / 2;
  return { s, X: x => ox + (x - xmin) * s, Y: y => oy + (ymax - y) * s, ux: sx => xmin + (sx - ox) / s, uy: sy => ymax - (sy - oy) / s };
}
function L(v, x1, y1, x2, y2, col, w = 2.5, dash) {
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.setLineDash(dash || []);
  ctx.beginPath(); ctx.moveTo(v.X(x1), v.Y(y1)); ctx.lineTo(v.X(x2), v.Y(y2)); ctx.stroke(); ctx.restore();
}
function T(txt, sx, sy, col, o = {}) {
  ctx.save(); ctx.font = (o.bold ? '650 ' : '') + (o.size || 14) + 'px system-ui,-apple-system,Segoe UI,sans-serif';
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.bg !== false) {
    const w = ctx.measureText(txt).width, hgt = (o.size || 14) + 6;
    const lx = ctx.textAlign === 'center' ? sx - w / 2 : ctx.textAlign === 'right' ? sx - w : sx;
    ctx.globalAlpha = 0.82; ctx.fillStyle = K.cv; ctx.fillRect(lx - 4, sy - hgt / 2, w + 8, hgt); ctx.globalAlpha = 1;
  }
  ctx.fillStyle = col || K.ink; ctx.fillText(txt, sx, sy); ctx.restore();
}
function Tw(v, txt, x, y, col, o = {}) { T(txt, v.X(x) + (o.dx || 0), v.Y(y) + (o.dy || 0), col, o); }
function dot(v, x, y, r, col, label, o = {}) {
  ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.arc(v.X(x), v.Y(y), r, 0, 7); ctx.fill(); ctx.restore();
  if (label) Tw(v, label, x, y, o.lc || K.ink, { dx: o.dx ?? 0, dy: o.dy ?? -18, bold: true, align: o.align });
}
function circ(v, cx, cy, R, stroke, fill, w = 2, dash) {
  ctx.save(); ctx.beginPath(); ctx.arc(v.X(cx), v.Y(cy), R * v.s, 0, 2 * Math.PI);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.setLineDash(dash || []); ctx.stroke(); }
  ctx.restore();
}
function poly(v, pts, fill, stroke, w = 2) {
  ctx.save(); ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(v.X(p[0]), v.Y(p[1])) : ctx.moveTo(v.X(p[0]), v.Y(p[1])));
  ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = w; ctx.stroke(); } ctx.restore();
}
function bandY(v, y1, y2, fill) { // horizontal band across the whole canvas between world y1<y2
  ctx.save(); ctx.fillStyle = fill; const a = v.Y(y2), b = v.Y(y1); ctx.fillRect(0, a, W, b - a); ctx.restore();
}
function ang(v, vx, vy, ax, ay, bx, by, col, label, r = 42) {
  const sx = v.X(vx), sy = v.Y(vy);
  const a1 = Math.atan2(v.Y(ay) - sy, v.X(ax) - sx), a2 = Math.atan2(v.Y(by) - sy, v.X(bx) - sx);
  let d = a2 - a1; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sx, sy, r, a1, a1 + d, d < 0); ctx.stroke(); ctx.restore();
  if (label) { const m = a1 + d / 2, rr = r + 12 + label.length * 3; T(label, sx + Math.cos(m) * rr, sy + Math.sin(m) * rr, col, { bold: true }); }
}
function rightA(v, vx, vy, ax, ay, bx, by, col, sz = 13) {
  const sx = v.X(vx), sy = v.Y(vy);
  const n = (x, y) => { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; };
  const u = n(v.X(ax) - sx, v.Y(ay) - sy), w = n(v.X(bx) - sx, v.Y(by) - sy);
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(sx + u[0] * sz, sy + u[1] * sz); ctx.lineTo(sx + (u[0] + w[0]) * sz, sy + (u[1] + w[1]) * sz); ctx.lineTo(sx + w[0] * sz, sy + w[1] * sz);
  ctx.stroke(); ctx.restore();
}
function arrowHead(x1, y1, x2, y2, col, sz = 9) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - sz * Math.cos(a - 0.4), y2 - sz * Math.sin(a - 0.4)); ctx.lineTo(x2 - sz * Math.cos(a + 0.4), y2 - sz * Math.sin(a + 0.4));
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dim(v, x1, y1, x2, y2, off, label, col, o = {}) {
  const a = [v.X(x1), v.Y(y1)], b = [v.X(x2), v.Y(y2)];
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1, nx = -dy / len * off, ny = dx / len * off;
  const A = [a[0] + nx, a[1] + ny], B = [b[0] + nx, b[1] + ny];
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2;
  if (off) { ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(A[0], A[1]); ctx.moveTo(b[0], b[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); ctx.setLineDash([]); }
  ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); ctx.restore();
  if (len > 24) { arrowHead(B[0], B[1], A[0], A[1], col); arrowHead(A[0], A[1], B[0], B[1], col); }
  if (label) { const lo = o.lo ?? 16, sg = Math.sign(off || 1); T(label, (A[0] + B[0]) / 2 + (-dy / len) * lo * sg, (A[1] + B[1]) / 2 + (dx / len) * lo * sg, col, { bold: true, align: o.align }); }
}
function sight(v, x1, y1, x2, y2, col, w = 3) {
  L(v, x1, y1, x2, y2, col, w); arrowHead(v.X(x1), v.Y(y1), v.X(x2), v.Y(y2), col, 11);
}
function person(v, x, e, col) {
  const sx = v.X(x), feet = v.Y(0), eye = v.Y(e), h = feet - eye, hr = Math.max(3, h * 0.09);
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(sx, eye, hr, 0, 7); ctx.stroke();
  const sh = eye + h * 0.25, hip = feet - h * 0.45;
  ctx.beginPath(); ctx.moveTo(sx, eye + hr); ctx.lineTo(sx, hip);
  ctx.moveTo(sx, hip); ctx.lineTo(sx - h * 0.12, feet); ctx.moveTo(sx, hip); ctx.lineTo(sx + h * 0.12, feet);
  ctx.moveTo(sx - h * 0.13, sh + h * 0.12); ctx.lineTo(sx, sh); ctx.lineTo(sx + h * 0.15, sh - h * 0.02); ctx.stroke(); ctx.restore();
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function starField(v, x1, x2, y1, y2, n, seed) {
  const r = rng(seed); ctx.save(); ctx.fillStyle = K.muted;
  for (let i = 0; i < n; i++) { const x = x1 + r() * (x2 - x1), y = y1 + r() * (y2 - y1), s = 1 + r() * 2; ctx.beginPath(); ctx.arc(v.X(x), v.Y(y), s, 0, 7); ctx.fill(); }
  ctx.restore();
}
function starShape(sx, sy, r, col) {
  ctx.save(); ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(sx + rr * Math.cos(a), sy + rr * Math.sin(a)); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

/* =================== CHAPTERS =================== */
const CH = [];

/* 1 — basics */
CH.push({ id: 'basics', grp: 'On the ground', title: 'One triangle does it all', sub: 'sin, cos, tan — the measuring stick',
  intro: `Every method in this tool rests on one fact: in a right triangle the <b>ratios</b> of the sides depend only on the angle, not on the size of the triangle. Measure one angle and one side you can reach, and the ratio gives you the side you can't reach.`,
  params: [{ k: 'th', label: 'Angle θ', min: 5, max: 85, step: 0.5, val: 35, unit: '°' }, { k: 'a', label: 'Adjacent side (the one you can measure)', min: 1, max: 20, step: 0.1, val: 8, unit: 'm' }],
  presets: [{ label: '30°', set: { th: 30 } }, { label: '45°', set: { th: 45 } }, { label: '60°', set: { th: 60 } }],
  steps: ['Lay the adjacent side along the ground from A to C.', 'Measure the angle θ at A.', 'The opposite side rises at right angles at C.', 'The hypotenuse closes the triangle from A to B.', 'Read off the three ratios: sin θ, cos θ, tan θ.'],
  draw(p, st) {
    const a = p.a, o = a * tand(p.th), v = view(-0.12 * a, a * 1.2, -0.15 * a, Math.max(o, 0.3 * a) * 1.08, 70);
    L(v, -0.12 * a, 0, a * 1.2, 0, K.line, 1.5);
    dot(v, 0, 0, 5, K.ink, 'A', { dx: -14, dy: 14 }); dot(v, a, 0, 5, K.ink, 'C', { dx: 14, dy: 14 });
    if (st >= 1) { L(v, 0, 0, a, 0, K.c1, 5); Tw(v, 'adjacent = ' + f(a) + ' m', a / 2, 0, K.c1, { dy: 24, bold: true }); }
    if (st >= 2) ang(v, 0, 0, a, 0, a, o, K.c3, 'θ = ' + p.th + '°', 52);
    if (st >= 3) { L(v, a, 0, a, o, K.c2, 5); rightA(v, a, 0, 0, 0, a, o, K.ink); Tw(v, 'opposite = ' + f(o) + ' m', a, o / 2, K.c2, { dx: 16, align: 'left', bold: true }); dot(v, a, o, 5, K.ink, 'B', { dy: -16 }); }
    if (st >= 4) { L(v, 0, 0, a, o, K.ink, 3.5); const hy = Math.hypot(a, o), sx = v.X(a / 2), sy = v.Y(o / 2), nx = -o / hy, ny = -a / hy; T('hypotenuse = ' + f(hy) + ' m', sx + nx * 34 - 30, sy + ny * 34, K.ink, { bold: true }); }
    if (st >= 5) {
      const hy = Math.hypot(a, o);
      T('sin θ = opposite / hypotenuse = ' + f4(o / hy), 20, 28, K.ink, { align: 'left', size: 15 });
      T('cos θ = adjacent / hypotenuse = ' + f4(a / hy), 20, 52, K.ink, { align: 'left', size: 15 });
      T('tan θ = opposite / adjacent = ' + f4(o / a), 20, 76, K.ink, { align: 'left', size: 15, bold: true });
    }

    const E1 = [0, 1], E2 = [0, -1];
    if (st >= 1) { L(v, 0, 1, 0, -1, K.c1, 3); dot(v, 0, 1, 6, K.c1, 'Earth (now)', { dy: -16, lc: K.c1 }); dot(v, 0, -1, 6, K.c1, '6 months later', { dy: 18, lc: K.c1 }); Tw(v, '2 AU', 0, 0.5, K.c1, { dx: -10, align: 'right', bold: true }); }
    if (st >= 2) { [E1, E2].forEach((P, i) => { const y = yApp(P); L(v, P[0], P[1], BX, y, K.c2, 2.2); circ(v, BX, y, 0.16, K.c2, null, 3); Tw(v, i ? 'seen from 2' : 'seen from 1', BX, y, K.c2, { dx: -24, align: 'right', bold: true }); }); }
    if (st >= 3) { L(v, 0, 0, N[0], N[1], K.muted, 2, [7, 5]); ang(v, N[0], N[1], 0, 0, 0, 1, K.c3, 'p', 64); }
    if (st >= 4) { rightA(v, 0, 0, 0, 1, N[0], N[1], K.ink, 14); Tw(v, 'd', N[0] / 2, 0, K.ink, { dy: 16, bold: true, size: 16 }); }
    // live Earth and its line of sight
    const y = yApp(E); L(v, E[0], E[1], BX, y, K.c4, 1.8, [3, 4]); dot(v, E[0], E[1], 7, K.c4); starShape(v.X(BX), v.Y(y), 9, K.c4);
    L(v, BX + 0.35, yApp(E1), BX + 0.35, yApp(E2), K.c4, 1.5, [3, 3]); Tw(v, 'apparent wobble ↕', BX + 0.35, -1.95, K.c4, { align: 'right', bold: true });
  },
  calc(p) {
    const pc = 1 / p.p, au = 206265 / p.p, ly = 3.26156 / p.p, km = au * AU_KM;
    return { res: `d = ${f(pc, 2)} parsecs = ${f(ly, 2)} light-years<span class="cmp">= ${sci(au)} AU = ${sci(km)} km · light takes ${f(ly, 2)} years</span>`,
      work: eq(`p = ${p.p}″ = ${(p.p / 3600).toExponential(4)}° = ${(p.p / 206265).toExponential(4)} rad`) + eq(`d = 1 AU / tan p ≈ 1 AU / p(rad) = 206,265 / ${p.p} = ${sci(au)} AU`) +
        eq(`1 parsec = 206,265 AU (the distance at which p = 1″)  ⇒  d = 1/p = ${f(pc, 3)} pc`) + eq(`1 pc = 3.2616 light-years = 3.086 × 10¹³ km`) };
  },
  note: `<p>The <b>parsec</b> ("parallax-second") is defined by this triangle: the distance at which 1 AU subtends 1 arcsecond.</p><p>The shift is so small that it was first measured only in <b>1838</b>, by Friedrich Bessel for the star 61 Cygni — over 2000 years after Aristarchus had predicted it must exist if the Earth moves.</p><p>The Gaia space telescope now measures parallaxes for more than a billion stars, to tiny fractions of a milli-arcsecond. Beyond that, astronomers climb further with "standard candles" — but every rung of that ladder is calibrated on parallax.</p>` });

/* 12 — ladder */
const RUNGS = [['Tree height', 20, 'Ch 2 · angle of elevation'], ['River width', 120, 'Ch 3 · triangulation'], ['Mountain height', 1500, 'Ch 4 · two angles'], ['Horizon from 100 m', 35700, 'Ch 5 · tangent'],
  ['Earth radius', 6.371e6, 'Ch 6–7 · Eratosthenes, Biruni'], ['Moon', 3.844e8, 'Ch 8 · parallax'], ['Venus orbit', 1.082e11, 'Ch 10 · elongation'], ['Sun (1 AU)', 1.496e11, 'Ch 9 · Aristarchus / transits'], ['Proxima Centauri', 4.02e16, 'Ch 11 · stellar parallax']];
CH.push({ id: 'ladder', grp: 'Summary', title: 'The distance ladder', sub: '17 powers of ten, one idea',
  intro: `Each method stands on the one before: the baseline you tape gives the river, triangles give mountains, the mountain gives the Earth, the Earth's size gives the Moon, the Earth's orbit gives the stars. Press <kbd>P</kbd> to climb the ladder.`,
  params: [], presets: [],
  steps: RUNGS.map(r => `${r[0]} — ${r[2]}`),
  caption: 'Logarithmic scale: each tick is 10× the previous',
  draw(p, st) {
    const v = view(-0.4, 17.4, -3.2, 3.2, 34);
    L(v, 0, 0, 17, 0, K.ink, 3);
    for (let i = 0; i <= 17; i++) { L(v, i, -0.12, i, 0.12, K.ink, 2); Tw(v, '10' + sup(i), i, 0, K.muted, { dy: 22, size: 12 }); }
    Tw(v, 'metres →', 17, 0, K.muted, { dy: 42, align: 'right', size: 12 });
    [['1 km', 3], ['1 AU', Math.log10(1.496e11)], ['1 light-year', Math.log10(9.461e15)]].forEach(u => { L(v, u[1], -0.35, u[1], 0.35, K.c1, 2, [3, 3]); Tw(v, u[0], u[1], -0.35, K.c1, { dy: 40, size: 12, bold: true }); });
    RUNGS.forEach((r, i) => {
      if (st < i + 1) return;
      const x = Math.log10(r[1]), up = i % 2 === 0, lvl = (Math.floor(i / 2) % 2 ? 2.35 : 1.25) * (up ? 1 : -1) - (up ? 0 : 0.5);
      L(v, x, 0, x, lvl, K.c2, 2); dot(v, x, 0, 6, K.c2);
      Tw(v, r[0], x, lvl, K.ink, { dy: up ? -10 : 8, bold: true }); Tw(v, sci(r[1] >= 1000 ? r[1] / 1000 : r[1]) + (r[1] >= 1000 ? ' km' : ' m'), x, lvl, K.c2, { dy: up ? -28 : 26, size: 12 }); Tw(v, r[2], x, lvl, K.muted, { dy: up ? 8 : 44, size: 11.5 });
    });
  },
  calc() {
    return { res: `${f(Math.log10(4.02e16 / 20), 1)} powers of ten, from a tree to the nearest star`,
      work: `<table><tr><th>Distance</th><th>Value</th><th>Method</th></tr>${RUNGS.map(r => `<tr><td>${r[0]}</td><td>${r[1] >= 1000 ? sci(r[1] / 1000) + ' km' : r[1] + ' m'}</td><td>${r[2]}</td></tr>`).join('')}</table>` };
  },
  note: `<p>Every result here came from <b>one angle and one known length</b> in a triangle. As the distances grow the angles shrink — 40° for a tree, 0.9° for the Moon, under 1/3600° for a star — so astronomy is largely the art of measuring very small angles very precisely.</p><p>Ideas to extend: build a clinometer and measure your school building; join a two-city shadow measurement on the equinox; time a lunar eclipse and repeat Hipparchus.</p>` });

/* =================== UI =================== */
const state = { ci: 0, p: {}, st: {}, playing: false, acc: 0, last: 0 };
const chap = () => CH[state.ci];
function P() { const c = chap(); if (!state.p[c.id]) { const o = {}; c.params.forEach(q => o[q.k] = q.val); state.p[c.id] = o; state.st[c.id] = c.steps.length; } return state.p[c.id]; }
function rnd(q, x) { return q.log ? +x.toPrecision(4) : +(+x).toFixed(Math.max(0, (String(q.step).split('.')[1] || '').length)); }

function buildSidebar() {
  let g = '', h = '';
  CH.forEach((c, i) => { if (c.grp !== g) { g = c.grp; h += `<div class="grp">${g}</div>`; } h += `<div class="it" data-i="${i}"><span class="n">${i + 1}</span><div><div class="t">${c.title}</div><div class="s">${c.sub}</div></div></div>`; });
  $('#sb').innerHTML = h; $('#sb').querySelectorAll('.it').forEach(el => el.onclick = () => { go(+el.dataset.i); if (innerWidth <= 980) document.body.classList.add('nosb'); });
}
function buildPanel() {
  const c = chap(), p = P();
  $('#chTitle').textContent = `${state.ci + 1}. ${c.title}`; $('#intro').innerHTML = c.intro;
  const box = $('#ctls'); box.innerHTML = c.params.length ? '' : '<div style="color:var(--muted)">No inputs — just press P.</div>';
  c.params.forEach(q => {
    const d = document.createElement('div'); d.className = 'ctl';
    d.innerHTML = `<label>${q.label}</label><div class="row"><input type="range"><input type="number"><span class="u">${q.unit || ''}</span></div>`;
    const r = d.querySelector('[type=range]'), n = d.querySelector('[type=number]');
    if (q.log) { r.min = Math.log10(q.min); r.max = Math.log10(q.max); r.step = 0.005; n.step = 'any'; } else { r.min = q.min; r.max = q.max; r.step = q.step; n.step = q.step; }
    n.min = q.min; n.max = q.max; q._r = r; q._n = n;
    r.oninput = () => { p[q.k] = rnd(q, q.log ? 10 ** +r.value : +r.value); n.value = p[q.k]; changed(); };
    n.onchange = () => { let x = +n.value; if (!isFinite(x)) x = q.val; x = Math.min(q.max, Math.max(q.min, x)); p[q.k] = x; syncControls(); changed(); };
    box.appendChild(d);
  });
  const pr = $('#presets'); pr.innerHTML = '';
  (c.presets || []).forEach(s => { const b = document.createElement('button'); b.textContent = s.label; b.onclick = () => { Object.assign(p, s.fn ? s.fn(p) : s.set); syncControls(); changed(); }; pr.appendChild(b); });
  $('#steps').innerHTML = c.steps.map(s => `<li>${s}</li>`).join('');
  $('#note').innerHTML = c.note;
  syncControls(); updateResult(); updSteps();
  document.querySelectorAll('#sb .it').forEach(el => el.classList.toggle('on', +el.dataset.i === state.ci));
}
function syncControls() { const p = P(); chap().params.forEach(q => { q._r.value = q.log ? Math.log10(p[q.k]) : p[q.k]; if (document.activeElement !== q._n) q._n.value = rnd(q, p[q.k]); }); }
function updateResult() { const r = chap().calc(P()); $('#result').innerHTML = r.res; $('#work').innerHTML = r.work; }
function updSteps() {
  const c = chap(), s = state.st[c.id], n = c.steps.length;
  $('#steps').querySelectorAll('li').forEach((li, i) => { li.className = i < s - 1 ? 'done' : i === s - 1 ? 'cur' : ''; });
  $('#stepind').textContent = `Step ${s} / ${n}` + (state.playing ? ' · playing' : '');
}
function changed() { updateResult(); render(); }
function render() {
  if (!CH.length) return; loadColors();
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = K.cv; ctx.fillRect(0, 0, W, H);
  const c = chap(); P(); c.draw(state.p[c.id], state.st[c.id]);
  if (c.caption) T(c.caption, W - 12, H - 16, K.muted, { align: 'right', size: 12 });
}
function go(i) { pause(); state.ci = (i + CH.length) % CH.length; buildPanel(); render(); $('#panel').scrollTop = 0; try { history.replaceState(null, '', '#' + chap().id); } catch (e) { } }

/* animation: P play, S step, X pause */
function play() {
  const c = chap(); P(); if (state.playing) return;
  if (state.st[c.id] >= c.steps.length && !c.tick) state.st[c.id] = 0;
  state.playing = true; state.acc = 0.9; state.last = performance.now(); updSteps(); render(); requestAnimationFrame(loop);
}
function loop(t) {
  if (!state.playing) return;
  const c = chap(), dt = Math.min(0.1, (t - state.last) / 1000), n = c.steps.length; state.last = t;
  if (state.st[c.id] < n) { state.acc += dt; if (state.acc >= 1.4) { state.acc = 0; state.st[c.id]++; updSteps(); render(); } }
  else if (c.tick) { c.tick(state.p[c.id], dt); syncControls(); updateResult(); render(); }
  else { pause(); return; }
  requestAnimationFrame(loop);
}
function pause() { state.playing = false; if (CH.length && state.st[chap().id] !== undefined) updSteps(); }
function step() { pause(); const c = chap(); P(); const n = c.steps.length; state.st[c.id] = state.st[c.id] >= n ? 0 : state.st[c.id] + 1; updSteps(); render(); }
function resetVals() { pause(); const c = chap(); delete state.p[c.id]; buildPanel(); render(); }

/* theme, sidebar, fullscreen */
function setTheme(d, quiet) {
  document.body.classList.toggle('dark', d);
  if (!quiet) { if (window.SiteTheme) SiteTheme.set(d ? 'dark' : 'light'); else try { localStorage.setItem('theme', d ? 'dark' : 'light'); } catch (e) { } }
  render();
}
window.addEventListener('site-theme', e => setTheme(e.detail === 'dark', true));
function toggleFs() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }
function toggleSb() { document.body.classList.toggle('nosb'); setTimeout(resize, 30); }
$('#themeBtn').onclick = () => setTheme(!document.body.classList.contains('dark'));
$('#bFs').onclick = toggleFs; $('#bSb').onclick = toggleSb;
$('#bPlay').onclick = play; $('#bStep').onclick = step; $('#bPause').onclick = pause; $('#bReset').onclick = resetVals;
$('#bPrev').onclick = () => go(state.ci - 1); $('#bNext').onclick = () => go(state.ci + 1);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  const tg = e.target, typing = tg && (tg.type === 'number' || tg.tagName === 'TEXTAREA' || tg.type === 'text');
  if (typing) return;
  const k = e.key.toLowerCase();
  if (k === 'm') toggleSb(); else if (k === 'p') play(); else if (k === 's') step(); else if (k === 'x') pause(); else if (k === 'f') toggleFs();
  else if (tg.type !== 'range' && e.key === 'ArrowRight') go(state.ci + 1); else if (tg.type !== 'range' && e.key === 'ArrowLeft') go(state.ci - 1);
  else return;
  e.preventDefault();
});

/* start */
try { const t = window.SiteTheme ? SiteTheme.get() : localStorage.getItem('theme'); if (t === 'dark') document.body.classList.add('dark'); } catch (e) { }
if (innerWidth <= 980) document.body.classList.add('nosb');
buildSidebar();
const hi = CH.findIndex(c => '#' + c.id === location.hash); state.ci = hi >= 0 ? hi : 0;
buildPanel();
new ResizeObserver(resize).observe($('#cvwrap'));
resize();
</script>
</body>
</html>
