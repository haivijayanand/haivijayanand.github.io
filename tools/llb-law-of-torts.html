<script>
"use strict";
/* ============================================================
   DATA
   ============================================================ */
const UNITS = [
 {id:"u1", n:1, title:"General Principles", short:"What a tort is; injuria and damnum; malice; constitutional torts."},
 {id:"u2", n:2, title:"General Defences", short:"Consent, inevitable accident, act of God, private defence, necessity, statutory authority."},
 {id:"u3", n:3, title:"Vicarious and State Liability", short:"Master and servant, course of employment, sovereign immunity."},
 {id:"u4", n:4, title:"Negligence", short:"Duty, breach, damage; res ipsa loquitur; medical negligence; nervous shock."},
 {id:"u5", n:5, title:"Strict and Absolute Liability", short:"Rylands v Fletcher and India's rule in M.C. Mehta."},
 {id:"u6", n:6, title:"Nuisance and Trespass", short:"Public and private nuisance; trespass to land and goods."},
 {id:"u7", n:7, title:"Wrongs to Person and Reputation", short:"Assault, battery, false imprisonment, malicious prosecution, defamation."},
 {id:"u8", n:8, title:"Remedies and Remoteness", short:"Damages, injunctions, remoteness of damage, consumer and motor accident claims."}
];
const EXTRAS = [
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"maxims", ic:"📜", title:"Latin maxims"},
 {id:"cases", ic:"🏛️", title:"Leading cases"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"brief", ic:"📝", title:"Case brief builder"},
 {id:"refs", ic:"📚", title:"References"}
];

const FLASH = [
 ["Tort","A civil wrong, other than a breach of contract or trust, for which the remedy is unliquidated damages."],
 ["Unliquidated damages","Damages fixed by the court after the wrong, not agreed in advance by the parties."],
 ["Injuria sine damno","Violation of a legal right without actual loss – actionable (Ashby v White)."],
 ["Damnum sine injuria","Actual loss without violation of a legal right – not actionable (Gloucester Grammar School)."],
 ["Constitutional tort","Compensation awarded by the Supreme Court or High Court for violation of Fundamental Rights by the State (Rudul Sah)."],
 ["Volenti non fit injuria","No wrong is done to one who consents – a defence."],
 ["Inevitable accident","An accident that could not be avoided by reasonable care – a defence."],
 ["Act of God","A natural event so extraordinary that no human foresight could guard against it."],
 ["Vicarious liability","Liability of one person for the tort of another, e.g. an employer for an employee."],
 ["Course of employment","An authorised act, or an unauthorised mode of doing an authorised act – the test for an employer's liability."],
 ["Sovereign immunity","The old rule that the State is not liable for torts committed in exercise of sovereign functions (Kasturi Lal)."],
 ["Negligence","Breach of a legal duty of care that causes damage to the claimant."],
 ["Neighbour principle","Take reasonable care to avoid acts you can reasonably foresee would injure your neighbour (Lord Atkin, Donoghue v Stevenson)."],
 ["Reasonable man","The standard of care: what an ordinary prudent person would do in the circumstances."],
 ["Res ipsa loquitur","'The thing speaks for itself' – the accident itself suggests negligence; the defendant must explain."],
 ["Bolam test","A doctor is not negligent if acting in line with a practice accepted by a responsible body of medical opinion."],
 ["Contributory negligence","The claimant's own carelessness contributed to the harm; damages are reduced in proportion."],
 ["Nervous shock","Recognised psychiatric injury caused by shock, e.g. witnessing an accident to a loved one."],
 ["Strict liability","Liability without fault for escape of a dangerous thing from non-natural use of land, subject to exceptions (Rylands v Fletcher)."],
 ["Absolute liability","Liability of an enterprise engaged in a hazardous activity with no exceptions at all (M.C. Mehta, 1987)."],
 ["Public nuisance","An act affecting the public at large; a private person can sue only on proving special damage."],
 ["Private nuisance","Unreasonable interference with a person's use or enjoyment of land."],
 ["Trespass to land","Direct and unjustified entry on land in another's possession; actionable without proof of damage."],
 ["Trespass ab initio","Entry lawful at first becomes trespass from the start if the entrant later abuses the authority (Six Carpenters' Case)."],
 ["Assault","An act causing reasonable fear of immediate unlawful force."],
 ["Battery","Intentional application of force to another person without lawful justification."],
 ["False imprisonment","Total restraint of a person's liberty without lawful justification."],
 ["Defamation","Publication of a false statement that lowers a person's reputation in the eyes of right-thinking members of society."],
 ["Innuendo","A statement innocent on its face but defamatory because of facts known to readers (Cassidy v Daily Mirror)."],
 ["Remoteness of damage","The defendant is liable only for damage of a kind that was reasonably foreseeable (Wagon Mound No. 1)."],
 ["Novus actus interveniens","A new intervening act that breaks the chain of causation."],
 ["Exemplary damages","Punitive damages awarded to punish outrageous conduct, not just to compensate."]
];

const MAXIMS = [
 ["Ubi jus ibi remedium","Where there is a right, there is a remedy.","Foundation of tort law; applied in Ashby v White."],
 ["Injuria sine damno","Legal injury without damage.","Actionable: violation of a right is enough."],
 ["Damnum sine injuria","Damage without legal injury.","Not actionable: loss alone is not enough."],
 ["Volenti non fit injuria","No wrong to one who consents.","Defence where the claimant freely accepted the risk."],
 ["Scienti non fit injuria","No wrong to one who merely knows.","Knowledge of risk is not the same as consent (Smith v Baker)."],
 ["Ex turpi causa non oritur actio","No action arises from a wrongful cause.","Claimant who was himself doing wrong cannot sue."],
 ["Res ipsa loquitur","The thing speaks for itself.","Shifts the burden to the defendant to explain the accident."],
 ["Qui facit per alium facit per se","He who acts through another acts himself.","Basis of vicarious liability."],
 ["Respondeat superior","Let the master answer.","The employer answers for the employee's torts in the course of employment."],
 ["Actio personalis moritur cum persona","A personal action dies with the person.","Old rule, now largely changed by statute (e.g. Legal Representatives' Suits Act, 1855)."],
 ["Sic utere tuo ut alienum non laedas","Use your own property so as not to harm another's.","Basis of nuisance and Rylands v Fletcher."],
 ["Novus actus interveniens","A new intervening act.","Breaks the chain of causation."],
 ["Restitutio in integrum","Restoration to the original position.","Aim of compensatory damages."],
 ["Salus populi suprema lex","The welfare of the people is the supreme law.","Basis of the necessity defence."],
 ["Rex non potest peccare","The King can do no wrong.","Origin of sovereign immunity."],
 ["Audi alteram partem","Hear the other side.","Natural justice – relevant to malicious prosecution and State action."]
];

const CASES = [
 {n:"Ashby v White", c:"(1703) 2 Ld Raym 938", u:1, in:0, p:"A returning officer wrongly refused Ashby's vote; his candidate won anyway. Held actionable: violation of a legal right is enough (injuria sine damno)."},
 {n:"Gloucester Grammar School Case", c:"(1410) YB 11 Hen IV", u:1, in:0, p:"A rival school drew away pupils and fees fell. No action: loss from lawful competition is damnum sine injuria."},
 {n:"Mogul Steamship Co v McGregor, Gow & Co", c:"[1892] AC 25", u:1, in:0, p:"Ship-owners cut freight rates to drive out a competitor. Lawful trade competition – no tort despite heavy loss."},
 {n:"Bradford Corporation v Pickles", c:"[1895] AC 587", u:1, in:0, p:"Pickles drained water under his land to force the town to buy it. A lawful act does not become a tort because of a bad motive."},
 {n:"Rudul Sah v State of Bihar", c:"(1983) 4 SCC 141", u:1, in:1, p:"Kept in jail for 14 years after acquittal. The Supreme Court ordered compensation under Article 32 – the start of constitutional torts."},
 {n:"Bhim Singh v State of J&K", c:"(1985) 4 SCC 677", u:1, in:1, p:"An MLA was illegally detained to stop him attending the Assembly. Rs 50,000 compensation awarded for violation of Article 21."},
 {n:"Smith v Baker & Sons", c:"[1891] AC 325", u:2, in:0, p:"A worker knew stones were swung over his head by a crane. Knowledge of the risk is not consent to it; volenti failed."},
 {n:"Hall v Brooklands Auto Racing Club", c:"[1933] 1 KB 205", u:2, in:0, p:"A spectator at a car race was hurt when a car flew into the crowd. Spectators accept the ordinary risks of the sport: volenti applied."},
 {n:"Haynes v Harwood", c:"[1935] 1 KB 146", u:2, in:0, p:"A policeman was hurt stopping runaway horses. Rescuers are not 'volunteers'; the defence failed."},
 {n:"Stanley v Powell", c:"[1891] 1 QB 86", u:2, in:0, p:"A pellet glanced off a tree and hit a beater at a shoot. Inevitable accident: no liability."},
 {n:"Padmavati v Dugganaika", c:"(1975) 1 Kant LJ 93", u:2, in:1, p:"Strangers took a lift in a jeep; a bolt suddenly gave way and the jeep overturned. Held an inevitable accident – the driver and owner were not liable."},
 {n:"Nichols v Marsland", c:"(1876) 2 Ex D 1", u:2, in:0, p:"Extraordinary rainfall burst artificial lakes. Act of God – no liability even under Rylands v Fletcher."},
 {n:"Bird v Holbrook", c:"(1828) 4 Bing 628", u:2, in:0, p:"A spring-gun set in a garden injured a trespasser. Private defence fails where the force used is out of proportion."},

function qHTML(q,id){

function bindQ(root, onAns){
  $$(".q",root).forEach(qd=>{
    $$(".opt",qd).forEach(b=>b.addEventListener("click",()=>{
      const ans=+qd.dataset.ans, i=+b.dataset.i;
      $$(".opt",qd).forEach(o=>{o.disabled=true; if(+o.dataset.i===ans) o.classList.add("right");});
      if(i!==ans) b.classList.add("wrong");
      const ex=$(".exp",qd); ex.hidden=false; ex.className="exp fb "+(i===ans?"ok":"bad");
      ex.textContent=(i===ans?"Correct. ":"Not quite. ")+$("[data-expl]",qd).dataset.expl;
      if(onAns) onAns(i===ans);
    }));
  });
}

/* ============================================================
   STEP ANIMATION ENGINE  (P play · S step · X pause)
   ============================================================ */
function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}

}

function choiceLab(sel, items, opts){
  const box=$(sel);
  box.innerHTML = items.map((it,i)=>`<div class="q" data-i="${i}"><div class="qt">${i+1}. ${esc(it[0])}</div><div class="row">${Object.entries(opts).map(([k,v])=>`<button class="btn sm sec" data-k="${k}">${v}</button>`).join("")}</div><div class="out"></div></div>`).join("")
   + `<div class="row"><span class="score" style="font-size:17px" id="${sel.slice(1)}Score"></span><button class="btn sm sec" id="${sel.slice(1)}Again">Try again</button></div>`;
  let got=0, ans=0;
  $$(".q",box).forEach(q=>$$("[data-k]",q).forEach(b=>b.onclick=()=>{
    const it=items[+q.dataset.i]; if(q.dataset.answered) return; q.dataset.answered=1; ans++;
    const ok=b.dataset.k===it[1]; if(ok) got++;
    $$("[data-k]",q).forEach(x=>{ x.disabled=true; if(x.dataset.k===it[1]) x.classList.add("right"); });
    if(!ok) b.classList.add("wrong");
    $(".out",q).innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Correct.":"Answer: "+opts[it[1]]+"."} ${esc(it[2])}</div>`;
    $("#"+sel.slice(1)+"Score").textContent=`${got} / ${ans} correct` + (ans===items.length?" – all done":"");
  }));
  $("#"+sel.slice(1)+"Again").onclick=()=>choiceLab(sel,items,opts);
}

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>A tort</b> is a civil wrong, other than a breach of contract or trust, for which the remedy is an action for unliquidated damages. The word comes from the Latin <i>tortum</i> – twisted or crooked.</div>
 <h4>Definitions</h4><ul><li><b>Winfield</b>: tortious liability arises from the breach of a duty primarily fixed by law; this duty is towards persons generally, and its breach is redressible by an action for unliquidated damages.</li><li><b>Salmond</b>: a civil wrong for which the remedy is a common law action for unliquidated damages, and which is not exclusively a breach of contract or breach of trust.</li></ul>
 <h4>Essentials of a tort</h4><ol><li>A <b>wrongful act or omission</b> by the defendant.</li><li>It causes <b>legal damage</b> – violation of a legal right of the claimant.</li><li>It gives rise to a <b>legal remedy</b> – mainly damages, also injunction.</li></ol>
 <h4>Injuria and damnum</h4>
 <table class="t"><tr><th></th><th>Meaning</th><th>Actionable?</th><th>Case</th></tr>
 <tr><td><b>Injuria sine damno</b></td><td>Violation of a legal right without actual loss</td><td>Yes</td><td><i>Ashby v White</i> (1703)</td></tr>
 <tr><td><b>Damnum sine injuria</b></td><td>Actual loss without violation of a legal right</td><td>No</td><td><i>Gloucester Grammar School</i> (1410); <i>Mogul Steamship</i> (1892)</td></tr></table>
 <h4>Does motive matter?</h4><p>Generally no. A lawful act does not become a tort because it was done with a bad motive (<i>Bradford Corporation v Pickles</i>, 1895). Malice matters only in a few torts such as malicious prosecution and to defeat some defences in defamation.</p>
 <h4>Constitutional torts – India's own development</h4><p>When the State violates Fundamental Rights, the Supreme Court and High Courts can award compensation directly under Articles 32 and 226 (<i>Rudul Sah v State of Bihar</i>, 1983; <i>Bhim Singh v State of J&amp;K</i>, 1985; <i>Nilabati Behera</i>, 1993).</p></div>
</div><div>
 <div class="card"><h3>Tort compared</h3><table class="t"><tr><th></th><th>Tort</th><th>Crime</th><th>Breach of contract</th></tr>
 <tr><td>Duty fixed by</td><td>Law, towards people generally</td><td>Law, towards society</td><td>The parties, by agreement</td></tr>
 <tr><td>Who acts</td><td>The injured person sues</td><td>The State prosecutes</td><td>The other party sues</td></tr>
 <tr><td>Remedy</td><td>Unliquidated damages, injunction</td><td>Punishment</td><td>Damages, often agreed (liquidated)</td></tr>
 <tr><td>Can it be settled?</td><td>Yes</td><td>Mostly no (some offences compoundable)</td><td>Yes</td></tr>
 <tr><td>Codified?</td><td>No – largely case law</td><td>Yes – BNS, 2023</td><td>Yes – Indian Contract Act, 1872</td></tr></table>
 <div class="ex">A drunk driver injures a pedestrian: the State prosecutes him for the crime, and the pedestrian can also claim compensation in tort. One act, two proceedings.</div></div>
 <div class="card lab"><h3>Injuria or damnum?</h3><p>Decide what each situation shows.</p><div id="lab1"></div></div>
</div></div>`+unitFoot(1)+footer(); },
 init(){ choiceLab("#lab1",U1_ITEMS,{IS:"Injuria sine damno",DS:"Damnum sine injuria",BOTH:"Injury and damage"}); miniQuiz(1); }};

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Vicarious liability</b> makes one person liable for another's tort because of their relationship – most often <b>employer and employee</b>, but also principal and agent and partners. The employer is liable for torts committed <b>in the course of employment</b>.</div>
 <h4>Why make the employer pay?</h4><ul><li>The employer controls the work and profits from it.</li><li>The employer is better able to pay and to insure (<i>respondeat superior</i>).</li><li>It encourages care in hiring and supervision.</li></ul>
 <h4>Servant vs independent contractor</h4><table class="t"><tr><th>Employee (servant)</th><th>Independent contractor</th></tr><tr><td>Employer controls what to do <i>and</i> how to do it</td><td>Employer controls only the result</td></tr><tr><td>Contract of service</td><td>Contract for services</td></tr><tr><td>Employer vicariously liable</td><td>Generally not liable, except for hazardous work or non-delegable duties</td></tr><tr><td>Your driver</td><td>A taxi you hire</td></tr></table>
 <h4>Course of employment</h4><p>An act is in the course of employment if it is (a) an act authorised by the employer, or (b) an <b>unauthorised way of doing an authorised act</b>. A careless or even forbidden method may still count (<i>Century Insurance</i>, 1942); a frolic of one's own does not.</p></div>
 <div class="card"><h3>Liability of the State</h3>
 <p><b>Article 300</b> lets the Government of India and State Governments sue and be sued like the East India Company could.</p>
 <table class="t"><tr><th>Year</th><th>Case</th><th>Holding</th></tr>
 <tr><td>1861</td><td><i>P&amp;O Steam Navigation</i></td><td>Liable for non-sovereign (commercial) acts; immune for sovereign acts</td></tr>

 <p>The Law Commission's first report (1956) recommended legislation on State liability; none has been passed, so courts decide case by case.</p></div>

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Negligence</b> is the omission to do something a reasonable man would do, or doing something a prudent and reasonable man would not do (<i>Blyth v Birmingham Waterworks</i>, 1856). The claimant must prove <b>duty, breach and damage</b>.</div>
 <h4>Standard of care</h4><p>The <b>reasonable man</b> – an ordinary prudent person, not the most careful one. A higher standard applies to people with special skills: professionals are judged by the standard of a reasonably competent member of their profession.</p>
 <h4>Res ipsa loquitur</h4><p>"The thing speaks for itself." Where (1) the thing was under the defendant's control, (2) the accident would not normally happen without negligence, and (3) there is no explanation, the court presumes negligence and the defendant must explain. <i>Scott v London &amp; St Katherine Docks</i> (falling sugar bags); <i>MCD v Subhagwanti</i> (Chandni Chowk clock tower collapse).</p>
 <h4>Medical negligence</h4><p>The <b>Bolam test</b>: a doctor is not negligent if acting in accordance with a practice accepted as proper by a responsible body of medical opinion. Adopted in India in <i>Jacob Mathew v State of Punjab</i> (2005). Patients can also complain to consumer commissions, since paid medical services are 'services'.</p>
 <h4>Contributory negligence</h4><p>If the claimant was also careless (e.g. not wearing a helmet), damages are reduced in proportion to their share of fault – the old rule that it barred the claim entirely has been abandoned.</p>
 <h4>Nervous shock</h4><p>Recognised psychiatric illness caused by shock. Primary victims (in danger themselves) can recover (<i>Dulieu v White</i>, 1901). Secondary victims must show a close tie of love and affection, closeness in time and space, and that they saw or heard the event or its immediate aftermath (<i>McLoughlin v O'Brian</i>, 1983; <i>Alcock</i>, 1992).</p></div>

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Strict liability</b> means liability without proof of fault. English law (<i>Rylands v Fletcher</i>, 1868) allows several exceptions. India went further: a hazardous enterprise is <b>absolutely liable</b>, with <b>no exceptions</b> (<i>M.C. Mehta v Union of India</i>, 1987).</div>
 <h4>The rule in Rylands v Fletcher</h4><p>A person who, for his own purposes, brings onto his land and keeps there anything likely to do mischief if it escapes, must keep it in at his peril; if he does not, he is answerable for all the damage that is the natural consequence of its escape (Blackburn J).</p>
 <p><b>Essentials:</b> (1) a <b>dangerous thing</b> – water, gas, electricity, chemicals; (2) <b>escape</b> from the defendant's land; (3) <b>non-natural use</b> of land.</p>
 <p><b>Exceptions:</b> plaintiff's own default; act of God (<i>Nichols v Marsland</i>); act of a stranger (<i>Box v Jubb</i>); consent of the plaintiff; statutory authority.</p>
 <h4>Absolute liability in India</h4><p>After the Bhopal gas tragedy (1984), the Oleum gas leak from Shriram Foods and Fertilisers in Delhi (1985) led the Supreme Court to hold:</p>
 <ul><li>An enterprise engaged in a hazardous or inherently dangerous activity owes an <b>absolute and non-delegable duty</b> to the community.</li><li><b>None</b> of the Rylands exceptions apply.</li><li>Escape from the premises is not needed.</li><li>Compensation should be linked to the <b>magnitude and capacity</b> of the enterprise, so that it deters.</li></ul>
 <p>Applied in <i>Indian Council for Enviro-Legal Action</i> (1996) with the <b>polluter-pays</b> principle. The <b>Public Liability Insurance Act, 1991</b> makes such industries carry insurance to pay immediate relief on a no-fault basis.</p></div>
</div><div>
 <div class="card"><h3>Strict vs absolute</h3><table class="t"><tr><th></th><th>Strict (Rylands)</th><th>Absolute (M.C. Mehta)</th></tr>
 <tr><td>Fault needed?</td><td>No</td><td>No</td></tr>
 <tr><td>Exceptions</td><td>Five recognised exceptions</td><td>None</td></tr>
 <tr><td>Escape from land</td><td>Required</td><td>Not required</td></tr>
 <tr><td>Who</td><td>Any land user</td><td>Hazardous enterprises</td></tr>

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Nuisance</b> protects the use and enjoyment of land against <i>indirect</i> interference – noise, smoke, smells, vibration. <b>Trespass</b> protects possession against <i>direct</i> physical intrusion and needs no proof of damage.</div>
 <h4>Public vs private nuisance</h4><table class="t"><tr><th>Public nuisance</th><th>Private nuisance</th></tr>
 <tr><td>Affects the public or a class of people</td><td>Affects a particular person's land</td></tr>
 <tr><td>Also a crime; State or Advocate-General can act (Section 91, CPC)</td><td>Only a civil wrong</td></tr>
 <tr><td>Individual sues only if special damage</td><td>The occupier sues</td></tr></table>
 <h4>Essentials of private nuisance</h4><ol><li><b>Unreasonable interference</b> – judged by the locality, duration, intensity and sensitivity of the claimant (an unusually sensitive use gets no extra protection).</li><li>With the <b>use or enjoyment of land</b>, or a right over it.</li><li><b>Damage</b> – physical damage or substantial discomfort.</li></ol>
 <h4>Defences</h4><ul><li><b>Valid:</b> prescription (20 years' continuous nuisance), statutory authority.</li><li><b>Not valid:</b> 'coming to the nuisance' (<i>Sturges v Bridgman</i>); public benefit; that the activity is done with all care; that many people together cause it.</li></ul>
 <h4>Trespass</h4><ul><li><b>Trespass to land</b>: entering, remaining, or placing things on land in another's possession without lawful justification. Actionable per se.</li><li><b>Trespass ab initio</b>: entry under authority of law, later abused by a positive wrongful act, becomes trespass from the start (<i>Six Carpenters' Case</i>, 1610).</li><li><b>Trespass to goods</b> and <b>conversion</b>: interfering with or dealing with another's goods as if one's own.</li></ul>
 <h4>Remedies</h4><p>Damages; injunction; abatement (removing the nuisance yourself, e.g. cutting overhanging branches, without causing unnecessary damage).</p></div>
</div><div>
 <div class="card lab"><h3>Nuisance or trespass?</h3><p>Classify each situation.</p><div id="lab6"></div></div>
</div></div>`+unitFoot(6)+footer(); },

 ["An MP, speaking in Parliament, accuses a businessman of tax evasion.","ABS","Absolute privilege: Article 105(2) protects anything said in Parliament."],
 ["A former employer, asked for a reference, honestly says the employee was often late.","QUAL","Qualified privilege: duty and interest in the communication, made without malice."],
 ["A WhatsApp group message falsely says a local teacher was arrested for theft.","NONE","False, defamatory, published to others – no defence. Libel."],

VIEWS.u7 = { html(){ return unitHead(7)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">These torts protect a person's <b>body</b>, <b>liberty</b> and <b>reputation</b>. Most are actionable without proof of damage.</div>
 <table class="t"><tr><th>Tort</th><th>Essence</th><th>Case</th></tr>
 <tr><td><b>Assault</b></td><td>An act causing reasonable apprehension of immediate force; no touching needed</td><td><i>Stephens v Myers</i> (1830)</td></tr>
 <tr><td><b>Battery</b></td><td>Intentional, direct application of force without consent; the least touching in anger is enough</td><td><i>Cole v Turner</i> (1704)</td></tr>
 <tr><td><b>False imprisonment</b></td><td>Total restraint of liberty without lawful justification, even for a short time</td><td><i>Bird v Jones</i> (1845); <i>Rudul Sah</i> (1983)</td></tr>
 <tr><td><b>Malicious prosecution</b></td><td>Prosecution by the defendant, without reasonable and probable cause, with malice, ending in the claimant's favour, causing damage</td><td>–</td></tr></table></div>
 <div class="card"><h3>Defamation</h3>
 <p>A false statement that lowers a person in the estimation of right-thinking members of society, or makes them shunned or avoided.</p>
 <h4>Essentials</h4><ol><li>The statement is <b>defamatory</b>.</li><li>It <b>refers to the claimant</b> – even if unintended (<i>Newstead v London Express</i>, 1940).</li><li>It is <b>published</b> – communicated to at least one person other than the claimant.</li></ol>
 <h4>Libel and slander</h4><table class="t"><tr><th>Libel</th><th>Slander</th></tr><tr><td>Permanent form: writing, print, picture, film, online post</td><td>Transient form: spoken words, gestures</td></tr><tr><td>Actionable per se in English law</td><td>Usually needs proof of special damage in English law</td></tr></table>
 <p>Indian courts generally treat both as actionable per se. Defamation is also a crime under <b>Section 356, Bharatiya Nyaya Sanhita, 2023</b> (formerly Section 499 IPC), upheld in <i>Subramanian Swamy</i> (2016).</p>
 <p><b>Innuendo:</b> words innocent on their face may be defamatory through facts known to readers (<i>Cassidy v Daily Mirror</i>, 1929).</p>
 <h4>Defences</h4><ul><li><b>Justification (truth)</b> – complete defence in civil law.</li><li><b>Fair comment</b> – honest opinion on a matter of public interest based on true facts.</li><li><b>Absolute privilege</b> – Parliament (Art. 105), State Legislatures (Art. 194), judicial proceedings.</li><li><b>Qualified privilege</b> – where there is a duty and interest, provided there is no malice (references, complaints to authorities).</li></ul>
 <p><i>R. Rajagopal v State of TN</i> (1994): public officials cannot sue for defamation over their official conduct unless the publication is shown to be false and made with reckless disregard for truth.</p></div>
</div><div>
 <div class="card lab"><h3>Defamation: which defence?</h3><p>Pick the defence that fits, or 'no defence'.</p><div id="lab7"></div></div>
</div></div>`+unitFoot(7)+footer(); },
 init(){ choiceLab("#lab7",U7_ITEMS,{TRUTH:"Truth",FAIR:"Fair comment",ABS:"Absolute privilege",QUAL:"Qualified privilege",NONE:"No defence"}); miniQuiz(7); }};

VIEWS.u8 = { html(){ return unitHead(8)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">The main remedy in tort is <b>damages</b>. The court may also grant an <b>injunction</b>. But a defendant pays only for damage that is <b>not too remote</b> – of a kind that was reasonably foreseeable.</div>
 <h4>Kinds of damages</h4><table class="t"><tr><th>Kind</th><th>When</th></tr>
 <tr><td><b>Nominal</b></td><td>Right violated, no real loss (injuria sine damno)</td></tr>
 <tr><td><b>Contemptuous</b></td><td>Claim technically valid but without merit; tiny sum</td></tr>
 <tr><td><b>Compensatory</b> (general and special)</td><td>Put the claimant back where they were; special damages are specific, provable losses such as bills</td></tr>
 <tr><td><b>Aggravated</b></td><td>Extra compensation for injured feelings caused by the manner of the wrong</td></tr>
 <tr><td><b>Exemplary / punitive</b></td><td>To punish and deter outrageous conduct</td></tr></table>
 <h4>Injunctions</h4><p>Governed by the Specific Relief Act, 1963 and Order XXXIX of the CPC. <b>Temporary</b> (during the suit) or <b>perpetual</b> (final); <b>prohibitory</b> (stop doing) or <b>mandatory</b> (do something, e.g. pull down a wall). For a temporary injunction the claimant must show a prima facie case, balance of convenience and irreparable injury.</p>
 <h4>Remoteness and causation</h4><ul><li><b>Direct consequence test</b> – <i>Re Polemis</i> (1921).</li><li><b>Reasonable foreseeability test</b> – <i>Wagon Mound (No. 1)</i> (1961), now generally followed.</li><li>The exact manner of harm need not be foreseen, only its kind.</li><li><b>Novus actus interveniens</b>: a free, deliberate act of a third party may break the chain; a foreseeable rescue does not (<i>Haynes v Harwood</i>).</li></ul>
 <h4>Joint tortfeasors</h4><p>Two or more people who together commit a tort are each liable for the whole damage; the one who pays may claim contribution from the others.</p>
 <h4>Statutory routes for compensation</h4><ul><li><b>Consumer Protection Act, 2019</b> – complaints about defective goods and deficient services (including product liability) before District, State and National Consumer Commissions; filing online through e-Daakhil.</li><li><b>Motor Vehicles Act, 1988</b> – Motor Accident Claims Tribunals; no-fault compensation under Section 164 (Rs 5 lakh for death, Rs 2.5 lakh for grievous hurt) without proving negligence.</li></ul></div>
</div><div>
 ${animBox("wmAnim","Remoteness: the Wagon Mound story",WM_SVG)}
 <div class="card lab"><h3>Name the damages</h3><div id="lab8"></div></div>
</div></div>`+unitFoot(8)+footer(); },
 init(){
  anim = makeAnim("#wmAnim", WM_STEPS, i=>{
    for(let k=0;k<5;k++){ const g=document.getElementById("w"+k); g.classList.toggle("show",k<=i); g.classList.toggle("hi",k===i&&i<5); }
    for(let k=0;k<4;k++) document.getElementById("wa"+k).classList.toggle("show",k<i);
    document.getElementById("wp").classList.toggle("show",i>=5); document.getElementById("ww").classList.toggle("show",i>=6);
  });
  choiceLab("#lab8",U8_ITEMS,{NOM:"Nominal",CON:"Contemptuous",COMP:"Compensatory",EXE:"Exemplary"});
  miniQuiz(8);
 }};

VIEWS.brief = { html(){ return `<div class="unitban"><div class="k">Practise</div><h2>Case brief builder</h2><p>Brief every judgment taught in class. Briefs are saved in this browser; download them as text to keep a copy.</p></div>
 <div class="two"><div class="card"><h3 id="bfTitle">New brief</h3>${BF.map(([k,l])=>`<label style="display:block;margin:8px 0 2px;font-weight:600;font-size:14px">${l}</label>${k==="name"||k==="cit"||k==="court"?`<input type="text" id="bf_${k}" style="width:100%">`:`<textarea id="bf_${k}"></textarea>`}`).join("")}

};

  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}

  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
