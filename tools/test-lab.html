    <div class="flds">${sl("cover","Chance a spare is in stores when needed",0,100,5,pf)}${sl("det","Failures caught early by vibration monitoring",0,100,5,pf,"Mechanical parts are easier to catch than electronics")}</div>
    <div class="tblwrap"><table class="tt" id="o_av"></table></div><div class="kpis" id="o_avk" style="margin-top:10px"></div>`)}

  ${card("06 · SPARES SIZING","How many to keep on the shelf",`
    <div class="prose small"><p>While a used spare is being replaced, more failures can arrive. The count of failures during one lead time is Poisson with mean λL = rigs × hours/week × lead / MTTF. With S spares, a failure finds the shelf empty when S or more orders are already open: P = 1 − F(S − 1).</p></div>
    <div style="margin-top:8px">${compChips}</div>
    <div class="flds">${sl("rigsUsing","Rigs using this part",1,4,1,nf)}${sl("lead","Lead time",1,6,1,v=>v+" wk")}${sl("downCost","Margin lost per idle rig hour",200,2500,50,rs)}</div>
    <div class="tblwrap"><table class="tt" id="o_sp"></table></div>
    <h3 style="margin-top:14px">Yearly cost against spares held</h3><div class="chart" id="c_sp"></div><div id="o_spv"></div>`)}

  ${card("07 · PREVENTIVE REPLACEMENT","When to swap a part before it fails",`
    <div class="prose small"><p>Age replacement: swap at age T or on failure, whichever comes first. Cost per running hour is C(T) = (C<sub>p</sub>·R(T) + C<sub>f</sub>·F(T)) / ∫<sub>0</sub><sup>T</sup> R(t) dt, where a planned swap C<sub>p</sub> costs the part and half a repair, and a failure C<sub>f</sub> adds the full repair and any wait for a spare.</p></div>
    <div style="margin-top:8px">${compChips}</div>
    <div class="kpis" id="o_pmk" style="margin-top:10px"></div>
    <h3 style="margin-top:14px">Cost per running hour against replacement age</h3><div class="chart" id="c_pm"></div><div id="o_pmv"></div>`)}

  ${card("08 · BID PRICING","Where to set the bid",`
    <div class="prose small"><p>Expected margin = P(win | bid) × (bid − cost). Higher bids earn more per win but win less often. If the rig would otherwise sit idle, only the running cost counts, so the best bid drops.</p></div>
    <div class="flds">${sl("bidRate","Market price per test hour",500,2500,50,rs)}${sl("cost","Your full cost per rig hour",200,2000,50,rs,"Section 2 puts it at about "+money(unit("GB","gbe",T.shifts,T.util/100).cost))}${sl("bidH","Test length",60,2000,20,hf)}</div>
    <div class="kpis" id="o_bidk"></div>
    <h3 style="margin-top:14px">Expected margin against bid</h3><div class="chart" id="c_bid"></div>`)}

  ${card("09 · CAPACITY AND SHIFTS","Backlog and missed deadlines",`
    <div class="prose small"><p>One rig is a queue. Won work arrives at random, the rig serves it at shifts × 40 h × availability per week, and every job carries a deadline drawn the same way the game draws it. Near full utilisation the backlog, and the chance of a late report, rise steeply.</p></div>
    ${seg("capType","Rig",[["pump","Pump rig"],["gbe","Gearbox rig"]])}
    ${sl("demand","Work won per week (rig hours)",10,200,5,hf)}
    <div class="tblwrap"><table class="tt" id="o_cap"></table></div>
    <h3 style="margin-top:14px">Chance a report is late</h3><div class="chart" id="c_cap"></div><div id="o_capv"></div>`)}

  ${card("10 · MONTE CARLO GROWTH","Many runs of the real weekly engine",`
    <div class="prose small" id="o_mcp"></div>
    <div class="flds">${sl("runs","Simulated runs",200,3000,100,nf)}${sl("reserve","Cash the player keeps in reserve",0,1500000,50000,rs)}</div>
    ${seg("weeks","Horizon",[[26,"26 weeks"],[52,"52 weeks"],[104,"104 weeks"]])}
    ${seg("spares","Spares policy",[[0,"None"],[1,"One of each cheap part"],[2,"One of every part"]])}
    ${seg("pm","Preventive replacement",[[0,"Off"],[0.6,"At 60%"],[0.8,"At 80%"]])}
    ${seg("cm","Vibration monitoring from week 1",[[0,"No"],[1,"Yes"]])}
    ${seg("autoCal","Calibration",[[1,"Auto"],[0,"Never booked"]])}
    <p class="busy mcbusy"></p>
    <h3 style="margin-top:10px">Cash minus loan, week by week</h3><div class="chart" id="c_fan"></div>
    <div class="tblwrap"><table class="tt" id="o_per"></table></div>
    <p class="tiny muted" style="margin-top:4px">Client payments are lumpy: most periods hold no big final payment, so a typical period loses money while the average period earns. The probability columns show that split.</p>
    <h3 style="margin-top:14px">Spread of the final result</h3><div class="chart" id="c_hist"></div><div class="kpis" id="o_mck" style="margin-top:8px"></div>`)}

  ${card("11 · EXPANSION","When to add a rig or monitoring",`
    <div class="prose small" id="o_expp"></div>
    ${chips("expType",[["BR","Bearing test rig"],["EC","Environmental chamber"],["GB","Second gearbox rig"],["PP","Second pump rig"],["CM","Vibration monitoring"]])}
    ${T.expType!=="CM"?sl("miss","Buy after this many RFQs turned away for that rig",1,30,1,nf,"Turned away: no such rig, or no room before the deadline"):""}
    ${seg("loan","Borrow to fund it",[[1,"Yes"],[0,"Cash only"]])}
    <p class="busy mcbusy"></p>
    <div class="kpis" id="o_exp" style="margin-top:8px"></div>
    <h3 style="margin-top:14px">Median cash minus loan</h3><div class="chart" id="c_exp"></div>`)}

  ${card("12 · STRATEGY","SWOT",`<p class="small muted" style="margin-bottom:10px">Figures update with the inputs above.</p><div class="swot" id="o_swot"></div>`)}`;
  updateTech();
}
let techTimer=null;
function scheduleTech(){clearTimeout(techTimer);techTimer=setTimeout(updateTech,150)}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.t;if(!k)return;T[k]=+e.target.value;const o=$("v_"+k);if(o)o.textContent=SLF[k](T[k]);saveT();scheduleTech()});
let lastRW=0;window.addEventListener("resize",()=>{if(tab!=="tech")return;const w=$("tech").clientWidth;if(Math.abs(w-lastRW)>20){lastRW=w;scheduleTech()}});

function updateTech(){
  if(tab!=="tech"||!$("o_cons"))return;
  lastRW=$("tech").clientWidth;
  const sh=T.shifts,u=T.util/100,H=sh*C.SHIFT_H;
  const uG=unit("GB","gbe",sh,u),uP=unit("PP","pump",sh,u);

  /* 1 constraints */
  const burn=fixedWk(sh),prem=2*C.PREM[sh],runway=T.cash/(burn+prem),capH=2*H;
  const fullSet=CK.reduce((a,c)=>a+COMP[c].price,0),cycG=meanH("gbe")/(H*0.88)+2.8,cycP=meanH("pump")/(H*0.88)+2.8;
  const cr=crew(sh);
  $("o_cons").innerHTML=`<tr><th>Constraint</th><th>Value</th><th>Effect</th></tr>
    <tr><td>Cash</td><td>${kfmt(T.cash)}</td><td>${runway.toFixed(1)} weeks of fixed cost</td></tr>
    <tr><td>Fixed cost/week</td><td>${kfmt(burn+prem)}</td><td>rent, ${cr.techs} tech, ${cr.engs} eng, premiums</td></tr>
    <tr><td>Rig capacity</td><td>${capH} h/wk</td><td>2 rigs × ${sh} shift${sh>1?"s":""}</td></tr>
    <tr><td>Gearbox cash cycle</td><td>${cycG.toFixed(0)} wk</td><td>${Math.round(meanH("gbe"))} h test + payment delay</td></tr>
    <tr><td>Pump cash cycle</td><td>${cycP.toFixed(0)} wk</td><td>${Math.round(meanH("pump"))} h test + payment delay</td></tr>
    <tr><td>One spare of every part</td><td>${kfmt(fullSet)}</td><td>${P100(fullSet/T.cash)} of cash</td></tr>
    <tr><td>R1 calibration</td><td>week 5</td><td>${kfmt(C.CAL_COST)} and ${C.CAL_H} h</td></tr>
    <tr><td>Crew cover</td><td>${2*C.TECH_COVER} rig-shifts</td><td>${2*sh>4?"needs "+(2*sh-4)+" more: hire or overtime":"enough"}</td></tr>`;
  $("o_bind").innerHTML=runway<cycG?verdict("no","CASH",`Fixed costs eat ${kfmt(burn+prem)} a week, and a typical gearbox test only pays its balance about <b>${cycG.toFixed(0)} weeks</b> after it starts. ${kfmt(T.cash)} lasts <b>${runway.toFixed(1)} weeks</b>, so the pump rig's short tests and advances carry the lab at first. Keep spare purchases to the cheap parts and line up a loan before buying anything big.`)
    :verdict(runway<cycG*1.6?"mid":"ok",runway<cycG*1.6?"TIGHT":"CAPACITY",`Cash covers <b>${runway.toFixed(1)} weeks</b> of fixed cost against a gearbox cash cycle of about ${cycG.toFixed(0)} weeks. ${runway<cycG*1.6?"Enough to start, not enough to absorb a long wait for a motor. Hold one cheap spare of each kind.":"The limit is rig hours: fill both rigs and keep them running."}`);

  /* 2 unit economics */
  const r2=(n,a,b,cls)=>`<tr class="${cls||""}"><td>${n}</td><td>${money(a)}</td><td>${money(b)}</td></tr>`;
  $("o_unit").innerHTML=`<tr><th>Per rig hour</th><th>Gearbox rig</th><th>Pump rig</th></tr>
    ${r2("Price (with setup time)",uG.price,uP.price,"hi")}${r2("Power",uG.power,uP.power)}${r2("Parts (price ÷ MTTF)",uG.parts,uP.parts)}${r2("Shift premium",uG.prem,uP.prem)}
    ${r2("Running cost",uG.variable,uP.variable,"sum")}${r2("Labour share",uG.labour,uP.labour)}${r2("Rent share",uG.rent,uP.rent)}${r2("Calibration",uG.cal,uP.cal)}
    ${r2("Full cost",uG.cost,uP.cost,"sum")}<tr class="sum"><td>Margin</td><td class="${uG.margin>=0?"pos":"neg"}">${money(uG.margin)}</td><td class="${uP.margin>=0?"pos":"neg"}">${money(uP.margin)}</td></tr>`;
  const contrib=(uG.price-uG.variable+uP.price-uP.variable)/2,beU=(burn+prem)/(contrib*capH);
  const profitAt=(s2,uu)=>{const a=unit("GB","gbe",s2,1),b=unit("PP","pump",s2,1);return (a.price-a.variable+b.price-b.variable)*s2*C.SHIFT_H*uu-fixedWk(s2)};
  $("o_unitk").innerHTML=kpi(money(contrib),"Contribution/rig hour","price minus running cost")+kpi(beU<=1?P100(beU):"never","Break-even utilisation",`at ${sh} shift${sh>1?"s":""}`)
    +kpi(kfmt(profitAt(sh,u)),"Profit/week at "+T.util+"%","both rigs")+kpi(kfmt(profitAt(sh,u)*T.weeks),"Over "+T.weeks+" weeks","if utilisation holds");
  const xs=[];for(let x=0;x<=100;x+=5)xs.push(x);
  const ser=[1,2,3].map((n,i)=>({n:n+" shift"+(n>1?"s":""),c:"--s"+(i+1),ys:xs.map(x=>profitAt(n,x/100)),w:n===sh?3:2}));
  const be=[1,2,3].map(n=>{const a=unit("GB","gbe",n,1),b=unit("PP","pump",n,1);return fixedWk(n)/((a.price-a.variable+b.price-b.variable)*n*C.SHIFT_H)*100});
  lineChart($("c_util"),{H:220,xs,series:ser,xf:v=>v+"%",yf:kfmt,xticks:[0,25,50,75,100],aria:"Weekly profit against utilisation for one, two and three shifts",
    dots:be[sh-1]<=100?[{x:be[sh-1],y:0,t:"Break-even "+Math.round(be[sh-1])+"%"}]:[],
    read:i=>`At ${xs[i]}%: 1 shift ${kfmt(ser[0].ys[i])} · 2 shifts ${kfmt(ser[1].ys[i])} · 3 shifts ${kfmt(ser[2].ys[i])} a week`,
    def:`Break-even utilisation: 1 shift ${be[0]>100?"never":Math.round(be[0])+"%"}, 2 shifts ${Math.round(be[1])}%, 3 shifts ${Math.round(be[2])}%. Tap the chart to read a point.`});

  /* 3 probability (analytic part; MC comparison filled in later) */
  const wm=[1,2,3].map(weekModel);
  $("o_wk").innerHTML=`<tr><th>Shifts</th><th>Hours</th><th>Trips/wk</th><th>Lost h</th><th>Profit/week</th></tr>`+
    wm.map((m,i)=>`<tr class="${i+1===sh?"hi":""}"><td>${i+1} shift${i?"s":""}</td><td>${2*m.H}</td><td>${m.fails.toFixed(2)}</td><td>${m.lost.toFixed(1)}</td><td>${kfmt(m.mu)} ± ${kfmt(m.sd)}</td></tr>`).join("");
  renderCLT();

  /* 4 reliability */
  const hs=[];for(let h=0;h<=2000;h+=25)hs.push(h);
  const Rsys=(rt,h,age)=>RIG[rt].comps.reduce((a,c)=>a*wbR(age*partEta(c)+h,partB(c),partEta(c))/wbR(age*partEta(c),partB(c),partEta(c)),1);
  $("o_rel").innerHTML=`<tr><th>Part</th><th>β</th><th>η</th><th>MTTF</th><th>R(H) new</th><th>R(H) at ½η</th></tr>`+
    CK.map(c=>{const b=partB(c),e=partEta(c),a=0.5*e;return `<tr class="${c===T.comp?"hi":""}"><td>${COMP[c].short}</td><td>${b.toFixed(1)}</td><td>${Math.round(e)}</td><td>${Math.round(partMTTF(c))}</td><td>${P100(wbR(T.H,b,e))}</td><td>${P100(wbR(a+T.H,b,e)/wbR(a,b,e))}</td></tr>`}).join("")+
    `<tr class="sum"><td>Gearbox rig</td><td></td><td></td><td>${Math.round(sysMTBF("GB"))}</td><td>${P100(Rsys("GB",T.H,0))}</td><td>${P100(Rsys("GB",T.H,0.5))}</td></tr><tr class="sum"><td>Pump rig</td><td></td><td></td><td>${Math.round(sysMTBF("PP"))}</td><td>${P100(Rsys("PP",T.H,0))}</td><td>${P100(Rsys("PP",T.H,0.5))}</td></tr>`;
  const relS=[{n:"Gearbox rig, new parts",c:"--s1",ys:hs.map(h=>Rsys("GB",h,0))},{n:"Gearbox rig, parts at ½η",c:"--s2",ys:hs.map(h=>Rsys("GB",h,0.5))},{n:COMP[T.comp].short+" alone (sliders)",c:"--s3",ys:hs.map(h=>wbR(h,T.beta,T.eta))}];
  lineChart($("c_rel"),{H:220,xs:hs,series:relS,xf:v=>v+" h",yf:v=>Math.round(v*100)+"%",ymin:0,ymax:1,xticks:[0,500,1000,1500,2000],marks:[{x:T.H,t:"H = "+T.H+" h"}],aria:"Probability a test finishes without a rig failure against test length",
    read:i=>`${hs[i]} h: new rig ${P100(relS[0].ys[i])} · worn rig ${P100(relS[1].ys[i])} · ${COMP[T.comp].short.toLowerCase()} ${P100(relS[2].ys[i])}`,def:"Tap the chart to read a test length."});
  const r1000=Rsys("GB",1000,0);
  $("o_relv").innerHTML=verdict(r1000<0.5?"no":"mid",r1000<0.5?"RISK":"PLAN",`A 1,000 h gearbox test on a new rig finishes clean only <b>${P100(r1000)}</b> of the time (${P100(Rsys("GB",1000,0.5))} with half-worn parts). Long endurance tests will see trips, so what matters is how fast the rig comes back: spares and monitoring, sections 5 to 7.${T.beta<=1?" With β ≤ 1 this part does not wear out, so replacing it early buys nothing.":""}`);

  /* 5 availability */
  const cov=T.cover/100,det=T.det/100;
  const cases=[["No spares",0,false],["Your spares cover",cov,false],["Spares + monitoring",cov,true]].map(([n,c,cm])=>Object.assign({n},availability("GB",sh,c,det,cm)));
  $("o_av").innerHTML=`<tr><th>Gearbox rig</th><th>MTBF</th><th>MTTR</th><th>Delay</th><th>A</th><th>Lost h/yr</th></tr>`+
    cases.map(x=>`<tr><td>${x.n}</td><td>${Math.round(x.mtbf)}</td><td>${x.mttr.toFixed(1)}</td><td>${x.delay.toFixed(0)}</td><td>${(x.A*100).toFixed(1)}%</td><td>${Math.round(H*52*(1-x.A))}</td></tr>`).join("");
  const gain=(cases[1].A-cases[0].A)*H*52*uG.margin,gainCM=(cases[2].A-cases[1].A)*H*52*(uG.price-uG.variable);
  $("o_avk").innerHTML=kpi((cases[0].A*100).toFixed(0)+"%","Availability, no spares","waits dominate")+kpi((cases[2].A*100).toFixed(0)+"%","With spares + CM",`${Math.round(H*52*(cases[2].A-cases[0].A))} h/yr recovered`)
    +kpi(kfmt(gainCM),"Monitoring, value/yr","per rig, vs "+kfmt(C.CM_COST)+" to fit")+kpi((cases[1].delay/(cases[1].mtbf+cases[1].mttr+cases[1].delay)*100).toFixed(1)+"%","Time waiting for parts","with your cover");

  /* 6 spares sizing */
  const c6=T.comp,mt=partMTTF(c6),Hr=H*T.rigsUsing,lamL=Hr*T.lead/mt,fy=Hr*52/mt,price=COMP[c6].price;
  const Ss=[0,1,2,3,4,5],sp=Ss.map(S=>{const pOut=S===0?1:1-poisCdf(S-1,lamL),hold=S*price*C.HOLD*52,out=fy*pOut*(T.lead*H*T.downCost+price*(C.EMERG-1));return{S,pOut,hold,out,tot:hold+out}});
  const best=sp.reduce((a,b)=>b.tot<a.tot?b:a);
  $("o_sp").innerHTML=`<tr><th>Spares</th><th>P(empty)</th><th>Holding/yr</th><th>Waiting/yr</th><th>Total/yr</th></tr>`+sp.slice(0,5).map(x=>`<tr class="${x===best?"hi":""}"><td>${x.S}</td><td>${P100(x.pOut)}</td><td>${kfmt(x.hold)}</td><td>${kfmt(x.out)}</td><td>${kfmt(x.tot)}</td></tr>`).join("");
  lineChart($("c_sp"),{H:200,xs:Ss,series:[{n:"Total",c:"--s1",ys:sp.map(x=>x.tot),w:3},{n:"Holding",c:"--s2",ys:sp.map(x=>x.hold)},{n:"Waiting for parts",c:"--s3",ys:sp.map(x=>x.out)}],xf:v=>v+" held",yf:kfmt,xticks:Ss,
    dots:[{x:best.S,y:best.tot,t:"Best: "+best.S}],aria:"Yearly spares cost against number held",read:i=>`${Ss[i]} held: total ${kfmt(sp[i].tot)} · holding ${kfmt(sp[i].hold)} · waiting ${kfmt(sp[i].out)} · shelf empty ${P100(sp[i].pOut)} of failures`,def:"Tap to compare stock levels."});
  $("o_spv").innerHTML=verdict(best.S>0?"ok":"mid",best.S+" HELD",`${COMP[c6].name}: about ${fy.toFixed(1)} failures a year across ${T.rigsUsing} rig${T.rigsUsing>1?"s":""} and λL = ${lamL.toFixed(2)} during a ${T.lead}-week lead. Holding <b>${best.S}</b> minimises yearly cost at ${kfmt(best.tot)}${best.S?`, against ${kfmt(sp[0].tot)} with none`:""}.`);

  /* 7 preventive replacement */
  const b7=T.beta,e7=T.eta,rm=repMean(c6),Cp=price+C.PLANNED_F*rm*T.downCost,Cf=price*(1+(1-cov)*(C.EMERG-1))+rm*T.downCost+(1-cov)*leadMean(c6)*H*T.downCost;
  const Ts=[];for(let k=5;k<=200;k+=5)Ts.push(k/100*e7);
  const crate=Tm=>{const n=60,dx=Tm/n;let I=0;for(let i=0;i<n;i++){const a=i*dx,b=a+dx;I+=dx/6*(wbR(a,b7,e7)+4*wbR((a+b)/2,b7,e7)+wbR(b,b7,e7))}const R=wbR(Tm,b7,e7);return (Cp*R+Cf*(1-R))/I};
  const cr7=Ts.map(crate),rtf=Cf/(e7*gammaFn(1+1/b7)),ib=cr7.indexOf(Math.min(...cr7)),Topt=Ts[ib],saving=1-cr7[ib]/rtf;
  $("o_pmk").innerHTML=kpi(money(Cp),"Planned swap C_p","part + half repair")+kpi(money(Cf),"Failure C_f","part, repair, wait")+kpi(saving>0.02?Math.round(Topt).toLocaleString("en-IN")+" h":"run to failure","Best replacement age",saving>0.02?Math.round(Topt/e7*100)+"% of η":"no gain from early swaps")+kpi(P100(Math.max(0,saving)),"Saving vs run-to-failure","per running hour");
  lineChart($("c_pm"),{H:210,xs:Ts,series:[{n:"Replace at age T",c:"--s1",ys:cr7,w:3},{n:"Run to failure",c:"--s2",ys:Ts.map(()=>rtf),dash:true}],xf:v=>Math.round(v/e7*100)+"% η",yf:v=>"₹"+Math.round(v),ymin:0,ymax:Math.min(Math.max(...cr7),rtf*3),xticks:[Ts[0],e7*0.5,e7,e7*1.5,Ts[Ts.length-1]],
    dots:saving>0.02?[{x:Topt,y:cr7[ib],t:"Best "+Math.round(Topt/e7*100)+"% η"}]:[],aria:"Cost per running hour against replacement age",read:i=>`Replace at ${Math.round(Ts[i]).toLocaleString("en-IN")} h (${Math.round(Ts[i]/e7*100)}% η): ₹${cr7[i].toFixed(1)}/h vs ₹${rtf.toFixed(1)}/h run to failure`,def:"Tap to read a replacement age."});
  const pol=saving<0.02?"Off":Topt/e7<0.7?"At 60%":"At 80%";
  $("o_pmv").innerHTML=verdict(saving>0.02?"ok":"mid",pol.toUpperCase(),saving>0.02?`For the ${COMP[c6].short.toLowerCase()} a failure costs ${(Cf/Cp).toFixed(1)}× a planned swap and β = ${b7.toFixed(1)}, so swapping at about ${Math.round(Topt/e7*100)}% of η saves ${P100(saving)}. The game's nearest policy is <b>${pol}</b>, and it only acts when a spare is in stores.`:`β = ${b7.toFixed(1)} and C<sub>f</sub>/C<sub>p</sub> = ${(Cf/Cp).toFixed(1)}: early swaps throw away good life without saving enough. Run this part to failure and keep a spare instead.`);

  /* 8 bid pricing */
  const bx=[];for(let x=70;x<=140;x+=1)bx.push(x);
  const mkt=T.bidRate*T.bidH+C.SETUP_FEE,fullC=T.cost*(T.bidH+C.SETUP_H),varC=uG.variable*(T.bidH+C.SETUP_H);
  const em=(x,cst)=>winP(x/100*mkt,mkt,T.rep/100)*(x/100*mkt-cst);
  const busyY=bx.map(x=>em(x,fullC)),idleY=bx.map(x=>em(x,varC));
  const ib1=busyY.indexOf(Math.max(...busyY)),ib2=idleY.indexOf(Math.max(...idleY));
  $("o_bidk").innerHTML=kpi(bx[ib1]+"%","Best bid, full cost",`win ${P100(winP(bx[ib1]/100*mkt,mkt,T.rep/100))}, ${kfmt(busyY[ib1])} expected`)+kpi(bx[ib2]+"%","Best bid, idle rig",`win ${P100(winP(bx[ib2]/100*mkt,mkt,T.rep/100))}, ${kfmt(idleY[ib2])} expected`);
  lineChart($("c_bid"),{H:210,xs:bx,series:[{n:"Rig busy (full cost)",c:"--s1",ys:busyY,w:3},{n:"Rig idle (running cost only)",c:"--s3",ys:idleY}],xf:v=>v+"%",yf:kfmt,xticks:[70,85,100,115,130,140],
    dots:[{x:bx[ib1],y:busyY[ib1],t:"Best "+bx[ib1]+"%"}],aria:"Expected margin against bid as a share of market",read:i=>`Bid ${bx[i]}% (${kfmt(bx[i]/100*mkt)}): win ${P100(winP(bx[i]/100*mkt,mkt,T.rep/100))} · expected ${kfmt(busyY[i])} busy, ${kfmt(idleY[i])} idle`,def:`Market price ${kfmt(mkt)} for ${T.bidH} h. Tap to read a bid.`});

  /* 9 capacity */
  const ck=T.capType,rt9=TEST[ck].rig,Aav=availability(rt9,sh,T.spares?cov:0,det,!!T.cm).A,u9=unit(rt9,ck,sh,1);
  const dem=[];for(let d=10;d<=200;d+=10)dem.push(d);
  const qs=[1,2,3].map(n=>{const A=availability(rt9,n,T.spares?cov:0,det,!!T.cm).A;return dem.map((d,i)=>queueSim(ck,d,n,A,1000+i*7+n))});
  const now=[1,2,3].map(n=>queueSim(ck,T.demand,n,availability(rt9,n,T.spares?cov:0,det,!!T.cm).A,4242+n));
  $("o_cap").innerHTML=`<tr><th>Shifts</th><th>Capacity</th><th>Utilisation</th><th>Wait</th><th>P(late)</th><th>Profit/wk</th></tr>`+
    now.map((q,i)=>{const n=i+1,uu=unit(rt9,ck,n,1),pw=q.served*(uu.price-uu.variable)-C.PREM[n]-q.lam*q.pen*TEST[ck].rate*meanH(ck);return `<tr class="${n===sh?"hi":""}"><td>${n}</td><td>${Math.round(n*C.SHIFT_H*Aav)} h</td><td>${P100(q.util)}</td><td>${q.wait.toFixed(1)} wk</td><td>${P100(q.pLate)}</td><td>${kfmt(pw)}</td></tr>`}).join("");
  lineChart($("c_cap"),{H:210,xs:dem,series:[1,2,3].map((n,i)=>({n:n+" shift"+(n>1?"s":""),c:"--s"+(i+1),ys:qs[i].map(q=>q.pLate),w:n===sh?3:2})),xf:v=>v+" h",yf:v=>Math.round(v*100)+"%",ymin:0,ymax:1,xticks:[10,50,100,150,200],
    marks:[{x:T.demand,t:"You: "+T.demand+" h"}],aria:"Chance of a late report against work won per week",read:i=>`${dem[i]} h/week won: late ${P100(qs[0][i].pLate)} on 1 shift · ${P100(qs[1][i].pLate)} on 2 · ${P100(qs[2][i].pLate)} on 3`,def:"Tap to read a demand level."});
  const q2=now[sh-1];
  $("o_capv").innerHTML=verdict(q2.pLate>0.25?"no":q2.pLate>0.1?"mid":"ok",q2.pLate>0.25?"OVERLOAD":q2.pLate>0.1?"TIGHT":"OK",`At ${T.demand} h a week won on the ${RIG[rt9].short.toLowerCase()} rig with ${sh} shift${sh>1?"s":""}, utilisation is <b>${P100(q2.util)}</b> and <b>${P100(q2.pLate)}</b> of reports go late. ${q2.pLate>0.1&&sh<3?`A further shift cuts that to ${P100(now[sh].pLate)}; otherwise bid higher so you win less.`:q2.util<0.6?"The rig has room: bid lower or accept more fixed offers.":"This is a sound load."}`);

  /* 10, 11, 12 need the Monte Carlo */
  $("o_mcp").innerHTML=`<p>The simulated player bids at ${T.markup}% of market on every RFQ it can finish before the deadline, accepts fixed offers within 7% of market, runs ${sh} shift${sh>1?"s":""}, hires a technician when cover runs short, trains staff when cash allows, borrows when cash drops below ${kfmt(T.reserve*0.4)}, and follows the spares, replacement and calibration choices below. Each run starts from ${kfmt(T.cash)} and ${T.rep}% reputation.</p>`;
  $("o_expp").innerHTML=`<p>Two runs per seed with the same random numbers: one stays as it is, one follows the rule below. That pairing removes most of the luck from the comparison, so the share of seeds where the rule wins is a fair test. Section 9 shows the trigger: when RFQs are being turned away, capacity is the limit.</p>`;
  startMC(renderMC);
}
function renderCLT(){
  const sh=T.shifts,m=weekModel(sh),N=T.weeks,mu=N*m.mu,sg=Math.sqrt(N)*m.sd,pT=1-normCdf((T.target-mu)/(sg||1));
  const ready=MC.done&&MC.key===mcKey();const ends=ready?MC.base.map(o=>o.end):[];
  $("o_clt").innerHTML=kpi(kfmt(mu),N+" weeks, theory","± "+kfmt(sg)+" (1σ), full order book")+kpi(ready?kfmt(pct(ends,.5)):"…",N+" weeks, simulated","median of "+T.runs+" runs")
    +kpi(P100(pT),"P(≥ target), theory","normal approximation")+kpi(ready?P100(ends.filter(v=>v>=T.target).length/ends.length):"…","P(≥ target), simulated","same engine as the game");
  $("o_cltnote").textContent=ready?`The theory column assumes both rigs always have work and counts only failure downtime. The simulation also has to win the work: bids lose, RFQs miss the rig types you own, tests wait for setup, cash arrives weeks after reports, and the first weeks start nearly empty. The gap between ${kfmt(mu)} and ${kfmt(pct(ends,.5))} is the cost of selling capacity rather than just running it.`:"";
}
function renderMC(){
  if(tab!=="tech"||!$("c_fan"))return;
  renderCLT();
  const B=MC.base,X=MC.exp,N=T.weeks,wk=[];for(let w=0;w<N;w++)wk.push(w+1);
  const col=(runs,f)=>wk.map((_,w)=>runs.map(o=>f(o,w)));
  const ncs=col(B,(o,w)=>o.nc[w]),p10=ncs.map(v=>pct(v,.1)),p50=ncs.map(v=>pct(v,.5)),p90=ncs.map(v=>pct(v,.9));
  lineChart($("c_fan"),{H:230,xs:wk,series:[{n:"Median",c:"--s1",ys:p50,w:3}],band:{lo:p10,hi:p90,c:"--s1",n:"8 in 10 runs"},xf:v=>"W"+Math.round(v),yf:kfmt,xticks:[1,Math.round(N/2),N],
    hlines:[{y:T.cash,t:"Start"}],aria:"Cash minus loan by week, median and 80 percent band",read:i=>`Week ${wk[i]}: median ${kfmt(p50[i])}, 80% between ${kfmt(p10[i])} and ${kfmt(p90[i])}`,def:`Week ${N}: median ${kfmt(p50[N-1])}. Tap to read a week.`});
  const per=N>52?8:4,P=Math.floor(N/per),pt=T.target*per/N;let prev=null,rows="";
  for(let k=0;k<P;k++){const inc=B.map(o=>{let s=0;for(let w=k*per;w<(k+1)*per;w++)s+=o.rev[w];return s}),pr=B.map(o=>{let s=0;for(let w=k*per;w<(k+1)*per;w++)s+=o.profit[w];return s});
    const mi=pct(inc,.5),mp=pr.reduce((a,v)=>a+v,0)/pr.length,ma=inc.reduce((a,v)=>a+v,0)/inc.length,g=prev==null||prev<1?"—":((ma/prev-1)*100>=0?"+":"")+Math.round((ma/prev-1)*100)+"%";prev=ma;
    rows+=`<tr><td>Weeks ${k*per+1}–${(k+1)*per}</td><td>${kfmt(mi)}</td><td>${kfmt(mp)}</td><td>${g}</td><td>${P100(pr.filter(v=>v>=pt).length/pr.length)}</td><td>${P100(pr.filter(v=>v<0).length/pr.length)}</td></tr>`}
  $("o_per").innerHTML=`<tr><th>Period</th><th>Income (median)</th><th>Profit (mean)</th><th>Income growth</th><th>P(≥ ${kfmt(pt)})</th><th>P(loss)</th></tr>`+rows;
  const ends=B.map(o=>o.end);barHist($("c_hist"),ends,T.target,kfmt);
  const bank=B.filter(o=>o.bank>=0).length/B.length;
  $("o_mck").innerHTML=kpi(kfmt(pct(ends,.5)),"Median result",`P10 ${kfmt(pct(ends,.1))} · P90 ${kfmt(pct(ends,.9))}`)+kpi(P100(bank),"Bankrupt","cash below "+money(-C.OVERDRAFT))
    +kpi((B.reduce((a,o)=>a+o.fails,0)/B.length).toFixed(1),"Trips per run","part failures")+kpi((B.reduce((a,o)=>a+o.late,0)/B.length).toFixed(1),"Late reports per run","");
  /* 11 expansion */
  const trig=X.filter(o=>o.expAt>=0||T.expType==="CM"),tw=X.map(o=>o.expAt).filter(x=>x>=0);
  let beat=0,pay=0;const diff=[];for(let i=0;i<X.length;i++){const d=X[i].end-B[i].end;diff.push(d);if(d>0)beat++;if(X[i].nc[N-1]>=B[i].nc[N-1])pay++}
  const capx=T.expType==="CM"?2*C.CM_COST:RIG[T.expType].price;
  $("o_exp").innerHTML=kpi(P100(trig.length/X.length),T.expType==="CM"?"Fitted":"Rule triggers",tw.length?"median week "+Math.round(pct(tw,.5)+1):T.expType==="CM"?"week 1":"never")
    +kpi(P100(beat/X.length),"Beats not expanding","net position, same seeds")+kpi(P100(pay/X.length),"Cash paid back","cash − loan ahead by week "+N)
    +kpi(kfmt(pct(diff,.5)),"Median gain",`outlay ${kfmt(capx)}`)+kpi(P100(X.filter(o=>o.bank>=0).length/X.length),"Bankrupt with rule","vs "+P100(bank)+" without");
  const e50=wk.map((_,w)=>pct(X.map(o=>o.nc[w]),.5));
  lineChart($("c_exp"),{H:220,xs:wk,series:[{n:"Stay as is",c:"--s1",ys:p50},{n:"With the rule",c:"--s2",ys:e50,w:3}],xf:v=>"W"+Math.round(v),yf:kfmt,xticks:[1,Math.round(N/2),N],
    marks:tw.length>X.length/2?[{x:pct(tw,.5)+1,t:"Buys"}]:[],aria:"Median cash minus loan with and without the expansion rule",read:i=>`Week ${wk[i]}: stay ${kfmt(p50[i])} · with rule ${kfmt(e50[i])}`,def:`Week ${N}: stay ${kfmt(p50[N-1])}, with rule ${kfmt(e50[N-1])}.`});
  renderSWOT(ends,bank,beat/X.length);
}
function renderSWOT(ends,bank,beat){
  const sh=T.shifts,uG=unit("GB","gbe",sh,T.util/100),uP=unit("PP","pump",sh,T.util/100),A0=availability("GB",sh,0,0,false).A,A2=availability("GB",sh,T.cover/100,T.det/100,true).A;
  const r1000=RIG.GB.comps.reduce((a,c)=>a*wbR(1000,partB(c),partEta(c)),1),acc=Math.round((C.ACC_PREM-1)*100);
  const nm={BR:"a bearing test rig",EC:"an environmental chamber",GB:"a second gearbox rig",PP:"a second pump rig",CM:"vibration monitoring"}[T.expType];
  $("o_swot").innerHTML=`
   <div class="S"><h4>Strengths</h4><ul><li>Margin of ${money(uP.margin)} per pump rig hour and ${money(uG.margin)} per gearbox rig hour at ${T.util}% use</li><li>Advances of up to 40% fund work in progress</li><li>Median ${T.weeks}-week result ${kfmt(pct(ends,.5))} in simulation</li><li>Reputation lifts RFQ flow and the win curve</li></ul></div>
   <div class="W"><h4>Weaknesses</h4><ul><li>Only ${P100(r1000)} of 1,000 h gearbox tests run trip-free on a new rig</li><li>Availability without spares is ${(A0*100).toFixed(0)}%</li><li>Fixed cost ${kfmt(fixedWk(sh)+2*C.PREM[sh])}/week runs whether rigs work or not</li><li>Payments trail reports by up to 10 weeks</li></ul></div>
   <div class="O"><h4>Opportunities</h4><ul><li>Spares and monitoring raise availability to ${(A2*100).toFixed(0)}%</li><li>Accredited RFQs pay about ${acc}% more</li><li>${nm[0].toUpperCase()+nm.slice(1)} beats standing still in ${P100(beat)} of paired runs</li><li>A third shift adds ${C.SHIFT_H} h per rig for ${money(C.PREM[3])}</li></ul></div>
   <div class="T"><h4>Threats</h4><ul><li>Bankruptcy in ${P100(bank)} of simulated runs</li><li>Lead times of up to 6 weeks for motors and sensors</li><li>Expired calibration: ${Math.round(C.QA_CATCH*100)}% chance a client rejects the hours</li><li>Night shifts multiply operator errors by ${C.ERR_NIGHT}</li></ul></div>`;
}

/* ---------- boot ---------- */
function boot(){
  applyTheme();
  const au=LS.get(K_AUTO);if(au&&au.v===1){s=au;view="title"}
  render();if(tab==="tech")renderTech();
}
boot();
</script>
