<script>
"use strict";
/* ============================================================
   DATA AND UNIT PAGES (History I)
   ============================================================ */
/*
TOOL:    ba-helpers.js — shared helpers for the B.A. LL.B. explorers (home page, footer, ordering lab, flow and ring animations)
FAMILY:  law-explorers
VERSION: 1.0.0
DATE:    2026-11-22
CHAT:    Kaavya Study Materials – TNNLU B.A. LL.B. Semester I and II explorers (claude.ai, 2026-11-22)
CHANGES: 1.0.0 - first version
*/
/* Each course content file defines HOME = {title, intro:[...], tips:[...], about:"..."} and FOOT = "footer text". */
function footer(){ return `<div class="foot">${FOOT}</div>`; }
function homeView(){
  const done=S.d.done;
  return `<div class="hero"><h2>${HOME.title}</h2>${HOME.intro.map(p=>`<p>${p}</p>`).join("")}</div>
  <div class="ucards">${UNITS.map(u=>`<a class="ucard" data-go="${u.id}"><span class="k">Unit ${u.n}</span><b>${u.title}</b><span>${u.short}</span>${done[u.id]?'<span class="st">✓ Done</span>':""}</a>`).join("")}
  ${EXTRAS.map(x=>`<a class="ucard" data-go="${x.id}" style="border-top-color:var(--gold)"><span class="k" style="color:var(--gold)">${x.ic} Revise</span><b>${x.title}</b></a>`).join("")}</div>
  <div class="two" style="margin-top:18px">
   <div class="card"><h3>How to study this course</h3><ol>${HOME.tips.map(t=>`<li>${t}</li>`).join("")}</ol></div>
   <div class="card"><h3>Keyboard</h3><table class="t">
   <tr><td><span class="kbd">M</span></td><td>Show or hide the unit list</td></tr>
   <tr><td><span class="kbd">P</span> / <span class="kbd">S</span> / <span class="kbd">X</span></td><td>Play, step, pause the animation on the page</td></tr>
   <tr><td><span class="kbd">F</span></td><td>Full screen</td></tr>
   <tr><td><span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">Space</span></td><td>Flashcards: previous, next, flip</td></tr>
   <tr><td><span class="kbd">[</span> <span class="kbd">]</span></td><td>Previous or next unit</td></tr></table>
   <p style="font-size:13.5px;color:var(--muted)">Works offline once opened. Sign in (top right) to keep progress and certificates on every device. The 🎓 button shows progress and the certificate.</p></div></div>
  <div class="card"><h3>About this syllabus</h3><p>${HOME.about}</p></div>
  ${footer()}`;
}

/* ---------------- ordering lab: put items in the right order ---------------- */
function orderLab(sel, items, note){
  const box=$(sel); let cur=shuffle(items.map((t,i)=>i));
  const draw=(checked)=>{
    const all=cur.every((k,i)=>k===i);
    box.innerHTML=`<ol class="order">${cur.map((k,pos)=>`<li class="${checked?(k===pos?"ok":"bad"):""}"><span>${checked?(k===pos?"✔ ":"✖ "):""}${esc(items[k])}</span><button class="btn sm sec" data-up="${pos}" ${pos===0?"disabled":""}>↑</button><button class="btn sm sec" data-dn="${pos}" ${pos===cur.length-1?"disabled":""}>↓</button></li>`).join("")}</ol>
    <div class="row"><button class="btn" data-chk>Check order</button><button class="btn sec sm" data-shuf>Shuffle</button></div>${checked?`<div class="fb ${all?"ok":"info"}">${all?"✔ Correct order.":"Not quite – ✔ marks items in the right place."} ${note||""}</div>`:""}`;
    $$("[data-up]",box).forEach(b=>b.onclick=()=>{ const i=+b.dataset.up; [cur[i-1],cur[i]]=[cur[i],cur[i-1]]; draw(false); });
    $$("[data-dn]",box).forEach(b=>b.onclick=()=>{ const i=+b.dataset.dn; [cur[i+1],cur[i]]=[cur[i],cur[i+1]]; draw(false); });
    $("[data-chk]",box).onclick=()=>draw(true);
    $("[data-shuf]",box).onclick=()=>{ cur=shuffle(cur); draw(false); };
  };
  draw(false);
}

/* ---------------- flow animation: a vertical chain of boxes ----------------
   items = [[title, subtitle], ...]; steps = one caption per box */
function flowSVG(p, items, label){
  const w=560, h=58, gap=20, x=40, H=items.length*(h+gap)-gap+12;
  let s=`<svg viewBox="0 0 640 ${H}" class="lg" role="img" aria-label="${esc(label||"")}"><defs><marker id="${p}mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  items.forEach((t,i)=>{ const y=6+i*(h+gap);
    s+=`<g id="${p}${i}" class="node fade"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><text x="${x+w/2}" y="${y+(t[1]?25:36)}" text-anchor="middle">${t[0]}</text>${t[1]?`<text class="sub" x="${x+w/2}" y="${y+47}" text-anchor="middle">${t[1]}</text>`:""}</g>`;
    if(i<items.length-1) s+=`<path id="${p}a${i}" class="edge fade" d="M320 ${y+h+1} V${y+h+gap-2}" marker-end="url(#${p}mk)" style="color:var(--muted)"/>`;
  });
  return s+`</svg>`;
}
/* ring animation: boxes round a circle with arrows from each to the next (a cycle) */
function ringSVG(p, items, label, centre){
  const n=items.length, cx=320, cy=232, R=n<=4?185:200, bw=n<=4?212:160, bh=54;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n, at=a=>[cx+R*Math.cos(a), cy+R*Math.sin(a)];
  /* gap (radians) left at each box so the arc starts and ends just outside it */
  const gap=a=>{ const c=Math.abs(Math.cos(a)), s=Math.abs(Math.sin(a)); return Math.min(Math.PI/n*0.85, (bw/2*s+bh/2*c+14)/R); };
  let s=`<svg viewBox="0 0 640 470" class="lg" role="img" aria-label="${esc(label||"")}"><defs><marker id="${p}mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  if(centre){ const L=centre.split("|"); s+=`<text x="${cx}" y="${cy+6-(L.length-1)*11}" text-anchor="middle" class="big">${L.map((l,i)=>`<tspan x="${cx}" dy="${i?22:0}">${l}</tspan>`).join("")}</text>`; }
  for(let i=0;i<n;i++){ const a1=ang(i)+gap(ang(i)), a2=ang(i+1)-gap(ang(i+1)); const [x1,y1]=at(a1), [x2,y2]=at(a2);
    s+=`<path id="${p}a${i}" class="edge fade" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" marker-end="url(#${p}mk)" style="color:var(--muted)"/>`; }
  items.forEach((t,i)=>{ const [x,y]=at(ang(i));
    s+=`<g id="${p}${i}" class="node fade"><rect x="${(x-bw/2).toFixed(1)}" y="${(y-bh/2).toFixed(1)}" width="${bw}" height="${bh}" rx="10"/><text x="${x.toFixed(1)}" y="${(y+(t[1]?-3:7)).toFixed(1)}" text-anchor="middle">${t[0]}</text>${t[1]?`<text class="sub" x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" text-anchor="middle">${t[1]}</text>`:""}</g>`; });
  return s+`</svg>`;
}
/* drive a flow or ring: box k shows when step >= k; arrow k shows once box k+1 is shown (ring: last arrow closes the loop) */
function flowAnim(boxId, p, n, steps, ring){
  return makeAnim("#"+boxId, steps, i=>{
    for(let k=0;k<n;k++){ const g=document.getElementById(p+k); if(g){ g.classList.toggle("show",k<=i); g.classList.toggle("hi",k===i); } }
    for(let k=0;k<n;k++){ const e=document.getElementById(p+"a"+k); if(e) e.classList.toggle("show", ring ? (k<i || (k===n-1 && i===steps.length-1 && steps.length>n-1)) : k<i); }
  });
}

function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}

 <div class="two"><div class="card"><h3>Books</h3><table class="t"><tr><th>Book</th><th>Use it for</th></tr>

/* ---------------- CASES (torts version: Indian cases → Indian Kanoon, English → BAILII search) ---------------- */
VIEWS.cases = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Leading cases</h2><p>${CASES.length} cases. Indian cases link to Indian Kanoon; English and other cases link to a web search (internet needed).</p></div>
 <div class="card"><div class="row"><input type="text" id="csS" class="search" placeholder="Search cases…"><select id="csU"><option value="0">All units</option>${UNITS.map(u=>`<option value="${u.n}">Unit ${u.n}: ${u.title}</option>`).join("")}</select><select id="csI"><option value="">Indian and foreign</option><option value="1">Indian only</option><option value="0">Foreign only</option></select></div></div><div class="casecards" id="csB"></div>`+footer(); },
 init(){ const draw=()=>{ const q=$("#csS").value.toLowerCase(), u=+$("#csU").value, ind=$("#csI").value; $("#csB").innerHTML=CASES.filter(c=>(c.n+c.c+c.p).toLowerCase().includes(q)&&(!u||c.u===u)&&(ind===""||String(c.in)===ind)).map(c=>`<div class="cc"><b><a href="${c.in?"https://indiankanoon.org/search/?formInput="+encodeURIComponent(c.n):"https://duckduckgo.com/?q="+encodeURIComponent(c.n+" "+c.c)}" target="_blank" rel="noopener">${esc(c.n)}</a></b><span class="cit">${esc(c.c)} · Unit ${c.u} · ${c.in?"India":"Foreign"}</span><p>${esc(c.p)}</p></div>`).join(""); }; draw(); $("#csS").oninput=draw; $("#csU").onchange=draw; $("#csI").onchange=draw; }};

/* ---------------- FLASHCARDS ---------------- */
let fIdx=0, fDeck=FLASH.slice();
VIEWS.flash = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Flashcards</h2><p>${FLASH.length} key terms. Click the card or press Space to flip; use ← → to move.</p></div>
 <div class="card"><div class="flash"><div class="fc" id="fc"><div class="front"><b id="fFront"></b><small>Click or Space to see the meaning</small></div><div class="back"><div id="fBack"></div><small id="fCount"></small></div></div></div>
 <div class="row" style="justify-content:center"><button class="btn sec" id="fPrev">← Previous</button><button class="btn" id="fFlip">Flip</button><button class="btn sec" id="fNext">Next →</button><button class="btn sec" id="fShuf">Shuffle</button><span id="fPos" style="margin-left:10px;color:var(--muted)"></span></div></div>`+footer(); },
 init(){ fIdx=0; this.show(); $("#fc").onclick=()=>$("#fc").classList.toggle("flip"); $("#fFlip").onclick=()=>$("#fc").classList.toggle("flip"); $("#fPrev").onclick=()=>this.move(-1); $("#fNext").onclick=()=>this.move(1); $("#fShuf").onclick=()=>{fDeck=shuffle(FLASH); fIdx=0; this.show();}; },
 show(){ const c=fDeck[fIdx]; $("#fc").classList.remove("flip"); $("#fFront").textContent=c[0]; $("#fBack").textContent=c[1]; $("#fPos").textContent=`${fIdx+1} / ${fDeck.length}`; },
 move(d){ fIdx=(fIdx+d+fDeck.length)%fDeck.length; this.show(); }
};

/* ---------------- MAXIMS ---------------- */
VIEWS.maxims = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Latin maxims and terms</h2><p>Phrases you will meet in judgments from the first week. Search to filter.</p></div>
 <div class="card"><input type="text" id="mxS" class="search" placeholder="Search maxims…"><table class="t" style="margin-top:10px"><thead><tr><th>Maxim</th><th>Literal meaning</th><th>How it is used</th></tr></thead><tbody id="mxB"></tbody></table></div>`+footer(); },
 init(){ const draw=q=>{ q=(q||"").toLowerCase(); $("#mxB").innerHTML=MAXIMS.filter(m=>m.join(" ").toLowerCase().includes(q)).map(m=>`<tr><td><b><i>${esc(m[0])}</i></b></td><td>${esc(m[1])}</td><td>${esc(m[2])}</td></tr>`).join(""); }; draw(); $("#mxS").oninput=e=>draw(e.target.value); }};

/* ---------------- QUIZ ---------------- */
VIEWS.quiz = { html(){ return `<div class="unitban"><div class="k">Test yourself</div><h2>Quiz</h2><p>${QUIZ.length} questions in the bank. Pick a unit or take a mixed set of 10.</p></div>
 <div class="card"><div class="row"><select id="qU"><option value="0">All units (10 random)</option>${UNITS.map(u=>`<option value="${u.n}">Unit ${u.n}: ${u.title}</option>`).join("")}</select><button class="btn" id="qStart">Start</button><span id="qBest" style="color:var(--muted)"></span></div></div>
 <div class="card" id="qBox" hidden><div id="qList"></div><div class="row" style="margin-top:10px"><span class="score" id="qScore"></span></div></div>`+footer(); },
 init(){
  const best=()=>{ const b=S.d.best, u=$("#qU").value; $("#qBest").textContent = b[u]!=null ? `Best: ${b[u]}%` : ""; };
  $("#qU").onchange=best; best();
  $("#qStart").onclick=()=>{
    const u=+$("#qU").value; const pool = u? QUIZ.filter(q=>q[0]===u) : QUIZ; const set = shuffle(pool).slice(0, u?pool.length:10);
    let got=0, ans=0; $("#qBox").hidden=false; $("#qList").innerHTML=set.map((q,i)=>qHTML(q,"q"+i)).join(""); $("#qScore").textContent=`0 / ${set.length}`;
    bindQ($("#qList"), ok=>{ ans++; if(ok) got++; $("#qScore").textContent=`${got} / ${set.length}` + (ans===set.length?`  ·  ${Math.round(100*got/set.length)}%`:"");
      if(ans===set.length){ const pct=Math.round(100*got/set.length), k=String(u); if(S.d.best[k]==null||pct>S.d.best[k]){S.d.best[k]=pct; S.save();} best(); toast(pct>=80?"Excellent!":pct>=50?"Good – revise the ones you missed.":"Revisit the units and try again."); } });
  };
 }};

/* ---------------- CASE BRIEF BUILDER ---------------- */
const BF = [["name","Case name"],["cit","Citation"],["court","Court and bench (judges)"],["facts","Facts (material facts only)"],["issues","Issues"],["argsP","Arguments – petitioner / appellant"],["argsR","Arguments – respondent"],["held","Held (decision)"],["ratio","Ratio decidendi"],["obiter","Obiter dicta"],["notes","My comments – do I agree? Is it still good law?"]];
let briefEdit = -1;
VIEWS.brief = { html(){ return `<div class="unitban"><div class="k">Practise</div><h2>Case brief builder</h2><p>Brief every judgment taught in class. Briefs are saved in this browser; download them as text to keep a copy.</p></div>
 <div class="two"><div class="card"><h3 id="bfTitle">New brief</h3>${BF.map(([k,l])=>`<label style="display:block;margin:8px 0 2px;font-weight:600;font-size:14px">${l}</label>${k==="name"||k==="cit"||k==="court"?`<input type="text" id="bf_${k}" style="width:100%">`:`<textarea id="bf_${k}"></textarea>`}`).join("")}
 <div class="row" style="margin-top:10px"><button class="btn" id="bfSave">Save brief</button><button class="btn sec" id="bfNew">Clear</button><button class="btn sec" id="bfDl">Download as .txt</button><button class="btn sec" onclick="window.print()">Print</button></div></div>
 <div class="card"><h3>Saved briefs</h3><div id="bfList"></div><div class="key" style="margin-top:14px"><b>Tip.</b> Keep each brief to one page. If you cannot state the ratio in two sentences, read the judgment's analysis again.</div></div></div>`+footer(); },
 init(){ briefEdit=-1; this.list(); $("#bfSave").onclick=()=>this.save(); $("#bfNew").onclick=()=>{briefEdit=-1; BF.forEach(([k])=>$("#bf_"+k).value=""); $("#bfTitle").textContent="New brief";}; $("#bfDl").onclick=()=>this.dl(); },
 collect(){ const o={}; BF.forEach(([k])=>o[k]=$("#bf_"+k).value.trim()); return o; },
 save(){ const o=this.collect(); if(!o.name){toast("Add a case name first"); return;} if(briefEdit>=0) S.d.briefs[briefEdit]=o; else S.d.briefs.push(o); S.save(); briefEdit=S.d.briefs.indexOf(o); toast("Brief saved"); this.list(); },
 list(){ const b=S.d.briefs; $("#bfList").innerHTML = b.length ? b.map((x,i)=>`<div class="row" style="border-bottom:1px solid var(--rule);padding:6px 0"><span style="flex:1"><b>${esc(x.name)}</b><br><small style="color:var(--muted)">${esc(x.cit||"")}</small></span><button class="btn sm sec" data-ed="${i}">Open</button><button class="btn sm sec" data-del="${i}">Delete</button></div>`).join("") : `<p style="color:var(--muted)">No briefs yet.</p>`;
   $$("[data-ed]").forEach(btn=>btn.onclick=()=>{ briefEdit=+btn.dataset.ed; const x=S.d.briefs[briefEdit]; BF.forEach(([k])=>$("#bf_"+k).value=x[k]||""); $("#bfTitle").textContent="Editing: "+x.name; });
   $$("[data-del]").forEach(btn=>btn.onclick=()=>{ S.d.briefs.splice(+btn.dataset.del,1); S.save(); briefEdit=-1; this.list(); }); },
 dl(){ const o=this.collect(); const txt=BF.map(([k,l])=>l.toUpperCase()+"\n"+(o[k]||"-")+"\n").join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=(o.name||"case-brief").replace(/[^\w\- ]+/g,"").slice(0,60)+".txt"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
};

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
