<script>
"use strict";
/* ============================================================
   DATA
   ============================================================ */
const UNITS = [
 {id:"u1", n:1, title:"Basics of Accounting", short:"Meaning, users, concepts and conventions, the accounting equation."},
 {id:"u2", n:2, title:"Journal and Ledger", short:"Double entry, the golden rules, journal entries, posting and balancing."},
 {id:"u3", n:3, title:"Trial Balance, BRS and Depreciation", short:"Trial balance, errors, bank reconciliation, SLM and WDV depreciation."},
 {id:"u4", n:4, title:"Final Accounts", short:"Trading account, profit and loss account and balance sheet with adjustments."},
 {id:"u5", n:5, title:"Practical Auditing", short:"Audit objectives, internal control, vouching, verification, auditor's report."}
];
const EXTRAS = [
 {id:"practice", ic:"🔁", title:"Practice generator"},
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"glossary", ic:"📖", title:"Glossary"},
 {id:"formulas", ic:"🧮", title:"Formula sheet"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"refs", ic:"📚", title:"References"}
];

const FLASH = [
 ["Accounting","Identifying, measuring, recording, classifying, summarising and communicating financial information to users."],
 ["Book-keeping","The recording part of accounting: journal and ledger."],
 ["Accounting equation","Assets = Liabilities + Capital."],
 ["Business entity concept","The business is separate from its owner; the owner's private transactions are not recorded."],
 ["Money measurement concept","Only transactions measurable in money are recorded."],
 ["Going concern","The business is assumed to continue for the foreseeable future."],
 ["Accrual concept","Income and expenses are recorded when earned or incurred, not when cash moves."],
 ["Matching concept","Expenses are matched with the revenue of the same period."],
 ["Conservatism (prudence)","Anticipate no profit, provide for all possible losses."],
 ["Consistency","Use the same accounting methods year after year so results can be compared."],
 ["Materiality","Record and disclose items that would influence users' decisions; trivial items may be simplified."],
 ["Personal account","Account of a person, firm, company or bank. Debit the receiver, credit the giver."],
 ["Real account","Account of an asset. Debit what comes in, credit what goes out."],
 ["Nominal account","Account of an expense, loss, income or gain. Debit expenses and losses, credit incomes and gains."],
 ["Journal","Book of original entry where transactions are first recorded in date order."],
 ["Ledger","Book of final entry with a separate account for each item."],
 ["Trial balance","A list of ledger balances to check arithmetical accuracy: debit total = credit total."],
 ["Compensating error","Two errors that cancel each other's effect on the trial balance."],
 ["Error of principle","Wrong classification, e.g. treating a capital expense as revenue."],
 ["Bank reconciliation statement","A statement explaining the difference between the cash book's bank balance and the pass book balance."],
 ["Depreciation","Systematic allocation of an asset's cost, less residual value, over its useful life."],
 ["Straight line method","Equal depreciation every year: (Cost − Residual value) ÷ Useful life."],
 ["Written down value method","A fixed percentage on the reducing book value each year."],
 ["Gross profit","Net sales − cost of goods sold."],
 ["Net profit","Gross profit + other incomes − all indirect expenses."],
 ["Outstanding expense","Expense of the current year not yet paid; a liability."],
 ["Prepaid expense","Expense paid in advance for the next year; an asset."],
 ["Audit","Independent examination of financial statements to express an opinion on whether they give a true and fair view."],
 ["Vouching","Checking entries in the books against documentary evidence (vouchers)."],
 ["Verification","Confirming the existence, ownership, valuation and presentation of assets and liabilities."],
 ["Internal check","Arranging work so that one person's work is automatically checked by another."],
 ["Qualified opinion","'Except for' opinion: the statements are true and fair except for a specific, not pervasive, matter."]
];

const GLOSSARY = [
 ["Assets","Resources owned or controlled that bring future benefit: cash, stock, debtors, machinery.","Fixed (non-current) and current assets."],
 ["Liabilities","Amounts owed to outsiders: creditors, loans, outstanding expenses.","Current and non-current."],
 ["Capital","Owner's investment in the business; the business owes it to the owner.","Increases with profit, decreases with drawings."],
 ["Drawings","Cash or goods taken by the owner for personal use.","Deducted from capital."],
 ["Debtors (trade receivables)","Customers who owe money for credit sales.","Current asset."],
 ["Creditors (trade payables)","Suppliers to whom money is owed for credit purchases.","Current liability."],
 ["Capital expenditure","Spending that gives benefit over several years, e.g. buying machinery.","Shown in the balance sheet."],
 ["Revenue expenditure","Spending whose benefit ends within the year, e.g. rent, wages.","Charged to trading or P&L account."],
 ["Direct expenses","Expenses on buying or making goods: wages, carriage inwards, factory power.","Trading account."],
 ["Indirect expenses","Office, selling and finance expenses: salaries, rent, advertising.","Profit and loss account."],
 ["Contra entry","An entry affecting both cash and bank columns, e.g. cash deposited into bank.","Marked 'C' in the cash book."],
 ["Narration","Short explanation written below a journal entry.","Starts with '(Being …)'."],
 ["Balancing","Finding the difference between the two sides of a ledger account.","Balance c/d and b/d."],
 ["Suspense account","Temporary account to make a trial balance agree until errors are found.","Closed once errors are rectified."],
 ["Cheque not yet presented","Cheque issued and entered in the cash book but not yet paid by the bank.","Common BRS item."],
 ["Residual (salvage) value","Estimated value of an asset at the end of its useful life.","Used in depreciation."],
 ["Closing stock","Unsold goods at the end of the year, valued at cost or net realisable value, whichever is lower.","Credit side of trading account; asset in balance sheet."],
 ["True and fair view","The auditor's test: the statements present the position without material misstatement.","Basis of the audit opinion."],
 ["Standards on Auditing (SA)","Auditing standards issued by ICAI, e.g. SA 200, SA 500, SA 700.","Mandatory for auditors in India."],
 ["Audit evidence","Information used by the auditor to reach conclusions (SA 500).","Must be sufficient and appropriate."],
 ["Materiality (audit)","The size of misstatement that could influence users' decisions (SA 320).","Guides audit planning."],
 ["Audit trail","The path from a source document through the books to the financial statements.","Used in vouching."],
 ["Statutory audit","Audit required by law, e.g. company audit under the Companies Act, 2013.","Done by a Chartered Accountant."],
 ["Internal audit","Continuous review of operations and controls by the organisation's own or outsourced staff.","Supports management."],
 ["CARO","Companies (Auditor's Report) Order, 2020 – extra matters auditors report for many companies.","Issued under Section 143(11)."]
];

const QUIZ = [
 [1,"Which is the accounting equation?",["Assets = Liabilities − Capital","Assets = Liabilities + Capital","Capital = Assets + Liabilities","Liabilities = Assets + Capital"],1,"Every asset is financed either by outsiders (liabilities) or by the owner (capital)."],
 [1,"The owner pays his house rent from business cash. Under the business entity concept this is…",["A business expense","Drawings","A liability","Capital"],1,"Personal expenses paid by the business are the owner's drawings."],
 [1,"Recording income when earned rather than when received follows the…",["Cash concept","Accrual concept","Money measurement concept","Cost concept"],1,"Accrual basis."],
 [1,"'Anticipate no profit, provide for all losses' is the convention of…",["Consistency","Materiality","Conservatism","Full disclosure"],2,"Also called prudence."],
 [1,"Which are the fundamental accounting assumptions under AS 1?",["Going concern, consistency, accrual","Cost, realisation, matching","Entity, money, period","Prudence, materiality, disclosure"],0,"If they are followed, no disclosure is needed; if not, it must be disclosed."],
 [1,"Started business with cash ₹1,00,000. Effect on the equation?",["Assets +, Capital +","Assets +, Liabilities +","Assets −, Capital −","No effect"],0,"Cash (asset) and capital both rise by ₹1,00,000."],
 [2,"Goods bought on credit from Ravi. The journal entry is…",["Dr Ravi, Cr Purchases","Dr Purchases, Cr Ravi","Dr Cash, Cr Ravi","Dr Purchases, Cr Cash"],1,"Purchases (nominal/expense) debited; Ravi (giver) credited."],
 [2,"Rent paid in cash: which account is credited?",["Rent","Cash","Capital","Landlord"],1,"Cash goes out (real account) – credit."],
 [2,"Cash withdrawn by the owner for personal use is debited to…",["Cash","Capital","Drawings","Expenses"],2,"Drawings reduces capital."],

   ============================================================ */
function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}

/* ---------- Final accounts generator ---------- */
function makeFA(){
  for(let k=0;k<200;k++){
    const f={os:rnd(20000,60000), p:rnd(150000,300000), w:rnd(10000,30000), ci:rnd(2000,8000,500), sal:rnd(20000,50000), rent:rnd(12000,36000), off:rnd(5000,15000,500),
      dr:rnd(10000,30000), deb:rnd(30000,80000), cash:rnd(10000,40000), fur:rnd(20000,50000), mac:rnd(50000,150000,5000), cred:rnd(20000,60000)};
    f.sales = Math.round(f.p*(1.35+Math.random()*0.45)/1000)*1000;
    f.cap = f.os+f.p+f.w+f.ci+f.sal+f.rent+f.off+f.dr+f.deb+f.cash+f.fur+f.mac - f.sales - f.cred;
    f.cs=rnd(25000,70000); f.outSal=rnd(2000,6000,500); f.preRent=rnd(1000,4000,500); f.depR=10; f.dep=f.mac*f.depR/100;
    f.cogs=f.os+f.p+f.w+f.ci-f.cs; f.gp=f.sales-f.cogs;
    f.np=f.gp-(f.sal+f.outSal)-(f.rent-f.preRent)-f.off-f.dep;
    f.assets=f.cash+f.deb+f.fur+(f.mac-f.dep)+f.cs+f.preRent;
    f.liab=f.cred+f.outSal+f.cap+f.np-f.dr;
    if(f.cap>=50000 && f.np>=5000 && Math.abs(f.assets-f.liab)<0.5) return f;
  }
}

function makeEQ(){

  return [
   {t:`Started business with cash ${fmt(c0)}`, d:{cash:c0, cap:c0}, e:"Asset (cash) and capital both rise."},
   {t:`Borrowed ${fmt(loan)} from a bank`, d:{cash:loan, loan:loan}, e:"Asset rises; a liability (loan) rises."},
   {t:`Bought machinery for cash ${fmt(mach)}`, d:{cash:-mach, mach:mach}, e:"One asset falls, another rises – totals unchanged."},
   {t:`Bought goods on credit ${fmt(gc)}`, d:{stock:gc, cred:gc}, e:"Stock (asset) and creditors (liability) rise."},
   {t:`Sold goods costing ${fmt(gsold)} for cash ${fmt(sp)}`, d:{cash:sp, stock:-gsold, cap:sp-gsold}, e:"Cash rises by the sale price and stock falls by the cost; the difference is profit, which increases capital."},
   {t:`Paid rent ${fmt(rent)}`, d:{cash:-rent, cap:-rent}, e:"An expense reduces cash and reduces capital."},

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Accounting</b> identifies, records, classifies, summarises and communicates financial information so that users can make decisions. Every transaction keeps the equation <b>Assets = Liabilities + Capital</b> in balance.</div>
 <h4>Users of accounts</h4><table class="t"><tr><th>Internal</th><th>External</th></tr><tr><td>Owners, managers, employees</td><td>Investors, lenders and banks, creditors, government and tax authorities, regulators, the public</td></tr></table>
 <h4>Book-keeping vs accounting</h4><p>Book-keeping is the clerical recording (journal, ledger). Accounting goes further – it summarises, analyses and interprets. Accountancy is the whole body of knowledge.</p>
 <h4>Accounting concepts</h4><table class="t">
 <tr><td><b>Business entity</b></td><td>Business and owner are separate.</td></tr>
 <tr><td><b>Money measurement</b></td><td>Only events measurable in money are recorded – staff morale is not.</td></tr>
 <tr><td><b>Going concern</b></td><td>The business will continue; assets are shown at cost less depreciation, not break-up value.</td></tr>
 <tr><td><b>Accounting period</b></td><td>Results are measured for a period – in India usually 1 April to 31 March.</td></tr>
 <tr><td><b>Cost</b></td><td>Assets are recorded at purchase price.</td></tr>
 <tr><td><b>Dual aspect</b></td><td>Every transaction has two sides: debit and credit.</td></tr>
 <tr><td><b>Realisation</b></td><td>Revenue is recognised when goods are delivered or services rendered.</td></tr>
 <tr><td><b>Accrual</b></td><td>Record income and expenses when earned or incurred.</td></tr>
 <tr><td><b>Matching</b></td><td>Set expenses against the revenue they helped earn.</td></tr></table>
 <h4>Conventions</h4><p><b>Conservatism</b> (provide for losses, not for expected profits) · <b>Consistency</b> · <b>Materiality</b> · <b>Full disclosure</b>.</p>
 <h4>Accounting standards in India</h4><p>The ICAI issues <b>Accounting Standards (AS)</b> for non-corporate and smaller entities. Larger companies follow <b>Ind AS</b>, converged with IFRS and notified under the Companies (Indian Accounting Standards) Rules, 2015. AS 1 names three fundamental assumptions: going concern, consistency and accrual.</p></div>

 ${animBox("eqAnim","The equation always balances",`<div style="overflow:auto"><table class="t" style="font-size:14px;min-width:620px"><tr><th>Transaction</th><th>Cash</th><th>Stock</th><th>Machinery</th><th>Creditors</th><th>Loan</th><th>Capital</th><th>A = L + C</th></tr><tbody id="eqBody"></tbody></table></div><div class="row noprint"><button class="btn sm sec" id="eqNew">New numbers</button></div>`)}

function drawLedger(i){

    let dRows=d.slice(), cRows=c.slice(), tot=null;
    if(balancing && (sd||sc)){ if(sd>sc) cRows.push([`By Balance c/d`,sd-sc,true]); else if(sc>sd) dRows.push([`To Balance c/d`,sc-sd,true]); tot=Math.max(sd,sc); }
    const n=Math.max(dRows.length,cRows.length,1), cell=x=>x?`<td style="${x[2]?"background:var(--hl);font-weight:600":""}">${x[0]}</td><td style="text-align:right;${x[2]?"background:var(--hl);font-weight:600":""}">${num(x[1])}</td>`:"<td></td><td></td>";

}

 <table class="t"><tr><th>Error</th><th>Example</th><th>Trial balance affected?</th></tr>
 <tr><td>Omission (complete)</td><td>Transaction not recorded</td><td>No</td></tr><tr><td>Omission (partial)</td><td>Only one side posted</td><td>Yes</td></tr>
 <tr><td>Commission</td><td>Posted to the wrong person's account</td><td>No</td></tr><tr><td>Principle</td><td>Capital item treated as revenue</td><td>No</td></tr>
 <tr><td>Compensating</td><td>Two errors cancel out</td><td>No</td></tr><tr><td>Casting / wrong side / wrong amount in one account</td><td>Totalling or posting mistakes</td><td>Yes</td></tr></table>
 <p>Until errors are found, the difference is put in a <b>suspense account</b>; it is closed as each error is rectified.</p></div>
 <div class="card"><h3>Bank reconciliation statement</h3><p>The <b>cash book</b> (our record) and the <b>pass book</b> or bank statement (the bank's record) rarely agree on a given date because of timing differences and items one side has not yet recorded.</p>

 <tr><td>Cheques issued but not presented</td><td>Add</td></tr><tr><td>Cheques deposited but not cleared</td><td>Subtract</td></tr>
 <tr><td>Bank charges, direct payments by bank</td><td>Subtract</td></tr><tr><td>Interest credited, direct deposits, dividends collected</td><td>Add</td></tr></table>
 <p style="font-size:14px;color:var(--muted)">Starting from an overdraft (credit) balance, every sign reverses.</p></div>
 <div class="card"><h3>Depreciation</h3><p>Depreciation spreads an asset's cost over its useful life (AS 10 / Ind AS 16; Schedule II of the Companies Act, 2013 gives useful lives for companies). Causes: wear and tear, passage of time, obsolescence, depletion.</p>
 <table class="t"><tr><th>Straight line (SLM)</th><th>Written down value (WDV)</th></tr>

</div><div>

const OPIN_ITEMS = [
 ["Everything is properly stated; no material misstatement found.","UN","Unmodified ('clean') opinion – SA 700."],
 ["Inventory is overstated by a material amount, but the rest of the statements are fine.","QU","Material but not pervasive misstatement – qualified ('except for') opinion, SA 705."],
 ["Revenue, assets and liabilities are all materially misstated throughout the statements.","AD","Material and pervasive misstatement – adverse opinion."],
 ["Management refuses access to most books, so the auditor cannot obtain evidence on most items.","DI","Unable to obtain sufficient evidence, possible effects pervasive – disclaimer of opinion."],
 ["Statements are fine, but the auditor wants to draw attention to a major pending lawsuit already disclosed in the notes.","EM","Unmodified opinion with an Emphasis of Matter paragraph – SA 706."]
];
const VOUCH_ITEMS = [
 ["Cash purchase of stationery, ₹2,400.","CM","Check the cash memo or bill: date, name, amount, approval."],
 ["Purchase of a new machine for ₹6 lakh.","INV","Check the supplier's invoice, purchase order, board approval and installation report."],

VIEWS.u5 = { html(){ return unitHead(5)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">An <b>audit</b> is an independent examination of financial statements so that the auditor can express an <b>opinion</b> on whether they give a <b>true and fair view</b>. The auditor gives reasonable – not absolute – assurance (SA 200).</div>
 <h4>Objectives</h4><ul><li><b>Primary</b>: report on true and fair view.</li><li><b>Secondary</b>: detect and prevent errors and frauds. Auditors must assess fraud risk (SA 240) but are not guarantors against all fraud.</li></ul>
 <h4>Types of audit</h4><table class="t"><tr><td><b>Statutory</b></td><td>Required by law – companies (Companies Act, 2013), banks, co-operative societies; tax audit under the income-tax law.</td></tr><tr><td><b>Internal</b></td><td>Continuous review by the organisation's own or outsourced staff (SA 610 governs how external auditors use it).</td></tr><tr><td><b>Continuous / periodic / interim</b></td><td>By timing: throughout the year, after year-end, or part-way through.</td></tr><tr><td><b>Government audit</b></td><td>By the Comptroller and Auditor General of India (CAG) for government departments and companies.</td></tr></table>
 <h4>Internal control, internal check, internal audit</h4><p><b>Internal control</b> is the whole system of policies that protect assets and ensure reliable records. <b>Internal check</b> is part of it: dividing work so that no one handles a transaction from start to finish (the cashier does not keep the ledger). <b>Internal audit</b> reviews whether the controls work. Strong controls let the auditor rely on <b>test checking</b> (sampling) instead of checking every entry.</p>
 <h4>Vouching and verification</h4><p><b>Vouching</b> checks that each entry is supported by a genuine, authorised document – 'the backbone of auditing'. <b>Verification</b> confirms that assets and liabilities in the balance sheet <b>exist</b>, are <b>owned</b>, are properly <b>valued</b> and are free of undisclosed charges – e.g. physical count of cash and stock, title deeds for land, bank confirmations.</p></div>
 <div class="card"><h3>Company auditors under the Companies Act, 2013</h3><table class="t">
 <tr><td>Sec. 139(6)</td><td>First auditor of a non-government company appointed by the Board within 30 days of registration</td></tr>
 <tr><td>Sec. 139(1)</td><td>Appointed at the first AGM for a term from that AGM to the sixth AGM (five years)</td></tr>
 <tr><td>Sec. 139(2)</td><td>Rotation for listed and prescribed companies: an individual for one term of five years; a firm for two terms of five years</td></tr>
 <tr><td>Sec. 141</td><td>Only a Chartered Accountant or CA firm; lists disqualifications</td></tr>
 <tr><td>Sec. 143</td><td>Powers (access to books, information) and duties; the audit report; Sec. 143(12) reporting of fraud</td></tr>
 <tr><td>Sec. 144</td><td>Services an auditor must not provide, e.g. book-keeping, internal audit, investment advice</td></tr>
 <tr><td>CARO 2020</td><td>Additional matters reported for many companies</td></tr></table></div>
</div><div>
 <div class="card"><h3>The auditor's opinion</h3><table class="t"><tr><th>Situation</th><th>Opinion</th></tr><tr><td>No material misstatement</td><td><b>Unmodified</b> (clean)</td></tr><tr><td>Material, not pervasive</td><td><b>Qualified</b> ('except for')</td></tr><tr><td>Material and pervasive</td><td><b>Adverse</b></td></tr><tr><td>Cannot get evidence; possible effects pervasive</td><td><b>Disclaimer</b> of opinion</td></tr></table>
 <p style="font-size:14px;color:var(--muted)">SA 700 (forming an opinion), SA 705 (modifications), SA 706 (emphasis of matter and other matter paragraphs).</p></div>
 <div class="card lab"><h3>Which opinion?</h3><div id="opLab"></div></div>
 <div class="card lab"><h3>What would you vouch?</h3><div id="vLab"></div></div>
</div></div>`+unitFoot(5)+footer(); },
 init(){
  choiceLab("#opLab",OPIN_ITEMS,{UN:"Unmodified",QU:"Qualified",AD:"Adverse",DI:"Disclaimer",EM:"Unmodified + emphasis of matter"});
  choiceLab("#vLab",VOUCH_ITEMS,{CM:"Cash memo",INV:"Invoice + approvals",PAY:"Payroll records",SALE:"Sales invoice + challan",BANK:"Bank statement / advice"});
  miniQuiz(5);
 }};

VIEWS.formulas = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Formula sheet</h2><p>Everything you need to compute in this course on one page. Print it with Ctrl+P.</p></div>
 <div class="two"><div class="card"><table class="t">
 <tr><th colspan="2">Basics</th></tr>
 <tr><td>Accounting equation</td><td>Assets = Liabilities + Capital</td></tr>
 <tr><td>Closing capital</td><td>Opening capital + additional capital + net profit − drawings</td></tr>
 <tr><td>Profit (statement of affairs method)</td><td>Closing capital − opening capital + drawings − additional capital</td></tr>
 <tr><th colspan="2">Final accounts</th></tr>
 <tr><td>Cost of goods sold</td><td>Opening stock + purchases + direct expenses − closing stock</td></tr>
 <tr><td>Gross profit</td><td>Net sales − cost of goods sold</td></tr>
 <tr><td>Net profit</td><td>Gross profit + other incomes − indirect expenses</td></tr>
 <tr><td>Net sales / purchases</td><td>Sales − sales returns; purchases − purchases returns</td></tr>
 <tr><th colspan="2">Depreciation</th></tr>
 <tr><td>Straight line</td><td>(Cost − residual value) ÷ useful life</td></tr>
 <tr><td>SLM rate</td><td>Annual depreciation ÷ cost × 100</td></tr>
 <tr><td>WDV depreciation</td><td>Rate × opening book value</td></tr>
 <tr><td>WDV rate</td><td>1 − (residual ÷ cost)<sup>1/n</sup></td></tr>
 <tr><td>Profit or loss on sale of asset</td><td>Sale price − book value on date of sale</td></tr></table></div>
 <div class="card"><table class="t">
 <tr><th colspan="2">Ratios worth knowing</th></tr>
 <tr><td>Gross profit ratio</td><td>Gross profit ÷ net sales × 100</td></tr>
 <tr><td>Net profit ratio</td><td>Net profit ÷ net sales × 100</td></tr>
 <tr><td>Current ratio</td><td>Current assets ÷ current liabilities</td></tr>
 <tr><td>Working capital</td><td>Current assets − current liabilities</td></tr>
 <tr><td>Stock turnover</td><td>Cost of goods sold ÷ average stock</td></tr>
 <tr><td>Average stock</td><td>(Opening stock + closing stock) ÷ 2</td></tr>
 <tr><th colspan="2">Bank reconciliation (from favourable cash book balance)</th></tr>
 <tr><td>Add</td><td>Cheques issued not presented; interest and dividends credited by bank; direct deposits</td></tr>
 <tr><td>Less</td><td>Cheques deposited not cleared; bank charges; direct payments by bank; dishonoured cheques</td></tr></table></div></div>`+footer(); }};

document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
