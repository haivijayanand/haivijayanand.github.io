theme: jekyll-theme-chirpy

# Site settings
lang: en
timezone: Asia/Kolkata

# Site title and tagline
title: K Vijay Anand
tagline: Engineer · Chennai, India

description: >-
  K Vijay Anand, engineer from Chennai: technical papers on aero-mechanical testing, vibration and gearboxes;
  free interactive courses (SolidWorks, Creo, machine design, manufacturing, differential equations, business,
  finance); CBSE Class 1 to 12 maths and science revision kits with worksheets and slides; engineering tools;
  book reviews and essays (Vijay Anand Speaks).

# Search engine verification (paste the codes from Google Search Console / Bing Webmaster Tools)
webmaster_verifications:
  google: ""
  bing: ""

# Default link-preview image for Chirpy pages (made by _scripts/make_og_images.py)
social_preview_image: /assets/img/og/default.png

url: "https://haivijayanand.github.io"
baseurl: ""

github:
  username: haivijayanand

# Author info
author:
  name: K Vijay Anand
  url: https://github.com/haivijayanand

# Avatar (place your photo as assets/img/avatar.jpg)
avatar: /assets/img/avatar.jpg

# Social links
social:
  name: K Vijay Anand
  email: ""
  links:
    - https://github.com/haivijayanand

# Theme mode: left empty so the sidebar shows the light / dark switch; the site opens in light
# (assets/js/site-theme.js, loaded by _includes/metadata-hook.html, sets light when nothing is chosen yet)
theme_mode:

# Enable table of contents on posts
toc: true

# Pagination
paginate: 10

# Comments — disable for now (can enable Disqus/Giscus later)
comments:
  active: ""

# Analytics — leave blank for now
analytics:
  google:
    id: ""

# MathJax (for equations in posts)
math: true

# Mermaid diagrams
mermaid: true

# Build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      math: true
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from build
exclude:
  - "*.gem"
  - "*.gemspec"


