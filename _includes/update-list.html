<!--
  TOOL:    _includes/update-list.html — side panel "Recently Added" (overrides Chirpy 7.6)
  FAMILY:  SITE
  VERSION: 1.1.0
  DATE:    2026-11-21
  CHAT:    Home page progress improvements: Recently Added shows which section each item belongs to
  CHANGES: 1.1.0 - each entry shows its section (e.g. DE Part II, Book Review) in small text above the title
           1.0.0 - lists the newest pages from the whole site (courses, series, tools, papers, posts) using
                   _data/site_panel.json from _scripts/build_search_index.py, not only the blog posts
-->
{% assign recent = site.data.site_panel.recent %}
{% if recent and recent.size > 0 %}
  <section id="access-lastmod">
    <h2 class="panel-heading">Recently Added</h2>
    <ul class="content list-unstyled ps-0 pb-1 ms-1 mt-2">
      {% for item in recent %}
        <li class="mb-2" style="line-height:1.3">
          <a href="{{ item.url | relative_url }}" title="{{ item.section | escape }} · {{ item.title | escape }}" class="d-block">
            <small class="d-block text-truncate" style="font-size:.74rem;opacity:.72;letter-spacing:.02em">{{ item.section }}</small>
            <span class="d-block text-truncate">{{ item.title }}</span>
          </a>
        </li>
      {% endfor %}
    </ul>
  </section>
  <!-- #access-lastmod -->
{% endif %}
