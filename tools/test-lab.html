<!DOCTYPE html>
<!--
TOOL: Test Lab
FAMILY: games
VERSION: 1.0.0
DATE: 2026-10-02
CHAT: Business sim game set (claude.ai, 2026-10-02)
CHANGES: 1.0.0 - first release: weekly test-lab sim with Weibull rig parts, spares, calibration, bidding, shifts, staff, accreditation, loans; shift log; 3 save slots + autosave + LAB1 save code; Tech discussion tab with reliability, availability, spares, replacement, bidding, capacity, Monte Carlo and expansion analysis
STATUS: playable
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16181b">
<title>Test Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: an instrument panel and a test log sheet. Graphite and off-white, one amber signal colour for actions and live values. */
:root{
  --bg:#ebe9e3; --card:#f8f7f3; --ink:#1d2124; --muted:#5a6066; --line:#d0cdc4; --chip:#e2dfd7; --well:#dedbd2;
  --sig:#9a5800; --sig-strong:#b86a00; --sig-ink:#ffffff; --ok:#2c7a4b; --bad:#b0352a; --off:#868b90; --glow:transparent;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --f-display:"Chakra Petch","Saira Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16181b; --card:#1f2226; --ink:#e8e6df; --muted:#9ba1a7; --line:#343940; --chip:#2a2e33; --well:#121417;
  --sig:#f0a83a; --sig-strong:#f0a83a; --sig-ink:#1b1200; --ok:#52c784; --bad:#ff6d5e; --off:#6f757b; --glow:currentColor;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16181b; --card:#1f2226; --ink:#e8e6df; --muted:#9ba1a7; --line:#343940; --chip:#2a2e33; --well:#121417;
  --sig:#f0a83a; --sig-strong:#f0a83a; --sig-ink:#1b1200; --ok:#52c784; --bad:#ff6d5e; --off:#6f757b; --glow:currentColor;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
.num,.mono{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2{font-family:var(--f-display);font-weight:700;margin:0;line-height:1.1;text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px}
h3{font-family:var(--f-num);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.pos{color:var(--ok)} .neg{color:var(--bad)} .sigc{color:var(--sig)}
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--well);border:1px solid var(--line);border-radius:10px;padding:4px;margin-block:12px 4px}
.tabs button{border:0;background:transparent;border-radius:7px;min-height:40px;padding:8px 6px;font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer;color:var(--muted);letter-spacing:.03em}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:inset 0 -2px 0 var(--sig)}
/* status bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar .row{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;flex:1;min-width:0;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--sig)}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;min-height:44px;padding:8px 14px;font-weight:600;cursor:pointer}
.stats{display:grid;grid-template-columns:.8fr 1.3fr 1fr;gap:6px;margin-top:8px}
.stat{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:5px 9px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sig)}
.lbl{font-family:var(--f-num);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.meter{height:5px;background:var(--chip);border-radius:3px;margin-top:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sig)}
/* cards and controls */
section{display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 14px}
.card.flat{background:transparent;border-style:dashed}
.big{display:block;width:100%;border:0;border-radius:10px;min-height:54px;padding:14px;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.04em;background:var(--sig-strong);color:var(--sig-ink);cursor:pointer;text-transform:uppercase}
.big:active{transform:translateY(1px)}
.ghost{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-weight:600;cursor:pointer}
.ghost.sig{border-color:var(--sig);color:var(--sig)}
.btn{min-height:44px;border:1px solid var(--line);background:var(--chip);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px;cursor:pointer}
.btn.sig{background:var(--sig-strong);color:var(--sig-ink);border-color:var(--sig-strong)}
.btn:disabled,.ghost:disabled,.big:disabled{opacity:.45;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 130px}
.seg{display:flex;gap:3px;background:var(--well);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1 1 0;min-width:0;border:0;background:transparent;border-radius:6px;min-height:40px;padding:6px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--sig);box-shadow:inset 0 -2px 0 var(--sig)}
.subnav{margin-block:2px}
.subnav button{font-size:13px;padding-inline:2px}
.subnav .badge{display:inline-block;min-width:18px;padding:0 4px;border-radius:9px;background:var(--sig-strong);color:var(--sig-ink);font-family:var(--f-num);font-size:11px;margin-left:3px}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:6px}
.ctl{display:flex;align-items:center;gap:6px;flex:none}
.ctl button{width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--chip);font-size:22px;font-weight:600;cursor:pointer}
.ctl output{min-width:96px;text-align:center;font-family:var(--f-num);font-size:16px;color:var(--sig)}
/* lamps */
.lamp{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:11px;letter-spacing:.08em;font-weight:600;white-space:nowrap}
.lamp i{width:10px;height:10px;border-radius:50%;background:var(--off);box-shadow:0 0 6px var(--glow);flex:none;color:var(--off)}
.lamp.run i{background:var(--ok);color:var(--ok)} .lamp.run{color:var(--ok)}
.lamp.down i{background:var(--bad);color:var(--bad)} .lamp.down{color:var(--bad)}
.lamp.wait i{background:var(--sig);color:var(--sig)} .lamp.wait{color:var(--sig)}
.lamp.idle{color:var(--muted)}
.rigrow{display:flex;flex-wrap:wrap;gap:6px 14px}
.righead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.righead .id{font-family:var(--f-display);font-weight:700;font-size:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-family:var(--f-num);font-size:13px}
.bar2{height:8px;background:var(--well);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.bar2 i{display:block;height:100%;background:var(--sig)}
.bar2 i.ok{background:var(--ok)} .bar2 i.bad{background:var(--bad)}
.parts{display:flex;flex-direction:column}
.part{display:grid;grid-template-columns:1fr 70px;gap:4px 10px;align-items:center;padding-block:7px;border-top:1px dashed var(--line)}
.part:first-child{border-top:0}
.part .nm{font-size:14px;font-weight:600}
.part .ag{font-family:var(--f-num);font-size:12px;color:var(--muted);text-align:right}
.part .bar2{grid-column:1/-1}
.part .act{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between}
.tag{display:inline-block;font-family:var(--f-num);font-size:10px;letter-spacing:.08em;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;white-space:nowrap}
.tag.sig{border-color:var(--sig);color:var(--sig)} .tag.bad{border-color:var(--bad);color:var(--bad)} .tag.ok{border-color:var(--ok);color:var(--ok)}
.qrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding-block:6px;border-top:1px dashed var(--line)}
.qrow:first-child{border-top:0}
.alert{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding-block:4px}
.alert::before{content:"";flex:none;width:6px;height:6px;margin-top:7px;border-radius:1px;background:var(--sig)}
.alert.bad::before{background:var(--bad)}
.rfq .hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rfq .fit{font-size:13px;padding:7px 10px;border-radius:7px;background:var(--well);margin-top:8px}
.rfq .fit.bad{color:var(--bad)} .rfq .fit.ok{color:var(--ok)}
/* log sheet */
.log{display:flex;flex-direction:column;font-family:var(--f-num);font-size:13px}
.log .h{display:grid;grid-template-columns:76px 36px 1fr;gap:8px;padding-block:6px;border-top:1px solid var(--line)}
.log .h:first-child{border-top:0}
.log .t{color:var(--muted)}
.log .rg{color:var(--sig);font-weight:600}
.log .x{font-family:var(--f-body);font-size:14px}
.log .q{font-style:italic;color:var(--muted);font-size:13px;margin-top:2px}
.log .warn .x{color:var(--sig)} .log .bad .x{color:var(--bad)} .log .good .x{color:var(--ok)}
@keyframes pop{from{opacity:.15}to{opacity:1}}
.log .h{animation:pop .35s ease-out}
.sheetlines{background:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px)}
table.acc{width:100%;border-collapse:collapse;font-size:14px}
table.acc td{padding:6px 0;border-bottom:1px dashed var(--line)}
table.acc td:last-child{text-align:right;font-family:var(--f-num);font-size:13px}
table.acc tr.total td{font-weight:700;border-bottom:0;font-size:16px}
table.acc tr.sub td{color:var(--muted);font-size:13px}
.title-card{text-align:center;padding:28px 16px}
.title-card h1{font-size:52px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0}
.title-card h1 span{color:var(--sig)}
.lenpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lenpick button{border:1px solid var(--line);background:var(--well);border-radius:8px;min-height:56px;padding:8px 4px;font-weight:600;cursor:pointer}
.lenpick button[aria-pressed="true"]{border-color:var(--sig);color:var(--sig);box-shadow:inset 0 -2px 0 var(--sig)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.slot{display:flex;gap:8px;align-items:center;padding-block:8px;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot .info{flex:1;min-width:0;font-size:13px}
.slot .btn{flex:none}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:8px;background:var(--well);color:var(--ink);padding:8px;font-family:var(--f-num);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:90%}
.confirm{border:1px solid var(--sig);border-radius:8px;padding:10px;margin-top:8px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.hist{display:flex;flex-direction:column;gap:3px;font-size:12px}
.hist .r{display:grid;grid-template-columns:34px 1fr 74px;gap:8px;align-items:center}
.hist .b{height:9px;border-radius:2px}
/* tech tab */
#tech{display:flex;flex-direction:column;gap:12px;padding-top:10px}
.sec-n{font-family:var(--f-num);font-size:11px;color:var(--sig);font-weight:600;letter-spacing:.12em;margin-bottom:2px}
.prose{display:flex;flex-direction:column;gap:8px;max-width:65ch}
.fld{display:flex;flex-direction:column;gap:2px;padding-block:5px}
.fld label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14px}
.fld output{font-family:var(--f-num);font-weight:500;white-space:nowrap;color:var(--sig)}
input[type=range]{width:100%;height:36px;accent-color:var(--sig-strong);margin:0}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:18px}
.segrow{display:flex;flex-direction:column;gap:4px;padding-block:5px}
.segrow>span{font-weight:600;font-size:14px}
.tblwrap{overflow-x:auto}
.tt{width:100%;border-collapse:collapse;font-size:13px;min-width:300px}
.tt th{font-family:var(--f-num);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);font-weight:500}
.tt th:first-child,.tt td:first-child{text-align:left}
.tt td{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tt td:first-child{font-family:var(--f-body)}
.tt tr.sum td{font-weight:700;border-bottom:0}
.tt tr.hi td{color:var(--sig)}
.formula{font-family:var(--f-num);font-size:12.5px;background:var(--well);border:1px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.7;overflow-x:auto;white-space:pre}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--well);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
.kpi b{display:block;font-family:var(--f-num);font-weight:500;font-size:20px;line-height:1.2;color:var(--sig)}
.kpi .small{display:block}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--well);font-size:14px;margin-top:8px}
.verdict i{flex:none;font-style:normal;font-family:var(--f-num);font-weight:600;font-size:11px;padding:2px 7px;border-radius:4px;margin-top:2px;letter-spacing:.06em}
.verdict.ok i{background:var(--ok);color:#fff}
.verdict.no i{background:var(--bad);color:#fff}
.verdict.mid i{background:var(--sig-strong);color:var(--sig-ink)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .readout{font-family:var(--f-num);font-size:12px;min-height:2.6em;color:var(--ink);padding-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--muted);border-radius:0;background:none}
.legend i.band{height:10px;opacity:.3}
svg .ax{font-family:var(--f-num);font-size:10.5px;fill:var(--muted)}
svg .lab{font-family:var(--f-body);font-size:12px;font-weight:600;fill:var(--ink)}
svg .grid{stroke:var(--line);stroke-width:1;opacity:.7}
svg .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swot>div{border-radius:8px;padding:12px;background:var(--well);border:1px solid var(--line);min-width:0}
.swot h4{margin:0 0 6px;font-family:var(--f-display);font-size:18px;line-height:1}
.swot ul{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:5px}
.swot .S h4{color:var(--ok)} .swot .W h4{color:var(--bad)} .swot .O h4{color:var(--sig)} .swot .T h4{color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--well);border-radius:999px;min-height:40px;padding:5px 12px;font-weight:600;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--sig);color:var(--sig)}
.busy{font-family:var(--f-num);font-size:12px;color:var(--sig)}
@media (max-width:440px){.swot{grid-template-columns:1fr}}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.log .h{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>

<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Sections"><button role="tab" data-act="tab" data-tab="play" id="tab_play">Play</button><button role="tab" data-act="tab" data-tab="tech" id="tab_tech">Tech discussion</button></nav>

    <div class="row">

</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel"></div></div>

/* ---------- maths helpers (also used by the Tech tab) ---------- */
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const U=(r,a,b)=>a+r()*(b-a);
const UI=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pickR=(r,a)=>a[Math.floor(r()*a.length)];
function poisR(l,r){if(l<=0)return 0;const L=Math.exp(-l);let k=0,p=1;do{k++;p*=r()}while(p>L&&k<200);return k-1}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gammaFn(z){const g=7,p=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];
  if(z<0.5)return Math.PI/(Math.sin(Math.PI*z)*gammaFn(1-z));z-=1;let x=p[0];for(let i=1;i<g+2;i++)x+=p[i]/(z+i);const t=z+g+0.5;return Math.sqrt(2*Math.PI)*Math.pow(t,z+0.5)*Math.exp(-t)*x}
const wbR=(t,b,eta)=>Math.exp(-Math.pow(Math.max(0,t)/eta,b));
const mttf=c=>COMP[c].eta*gammaFn(1+1/COMP[c].b);
function wbResid(r,c,age){const k=COMP[c];return k.eta*Math.pow(Math.pow(age/k.eta,k.b)-Math.log(1-r()),1/k.b)} // life given survival to age
function winP(bid,market,rep){return 1/(1+Math.exp((bid/market-1-C.REP_PRICE*(rep-0.5))/C.BID_SLOPE))}
function liveRNG(){const f=Math.random;return{m:f,x:f,g:()=>f}}
function seededRNG(seed,wk){const m=mulberry32(seed*7919+wk*104729+11),x=mulberry32(seed*7919+wk*104729+5003),gs=[];
  return{m,x,g:i=>gs[i]||(gs[i]=mulberry32(seed*7919+wk*104729+20011*(i+1)))}}
const repH=(r,c)=>U(r,COMP[c].rep[0],COMP[c].rep[1]);
const leadW=(r,c)=>UI(r,COMP[c].lead[0],COMP[c].lead[1]);

/* ---------- state ---------- */
function newComp(r,c,age){age=age||0;return{age,life:age?wbResid(r,c,age):COMP[c].eta*Math.pow(-Math.log(1-r()),1/COMP[c].b),det:r()<COMP[c].det,warn:false}}
function makeRig(s,type,r,ready,used){
  const n=s.rigs.length+1,g={id:"R"+n,type,shifts:2,queue:[],down:null,calDue:ready+C.CAL_VALID,cm:false,logger:false,ready,comps:{},debt:0,calBook:false,ran:0,bought:used?0:RIG[type].price,boughtWk:s.week};
  RIG[type].comps.forEach(c=>g.comps[c]=newComp(r,c,used?Math.round(U(r,0.1,0.55)*COMP[c].eta):0));
  s.rigs.push(g);return g;
}
function person(s,role,r,skill){const pool=NAMES[role],used=new Set(s.staff.map(p=>p.name));const free=pool.filter(n=>!used.has(n));
  return{id:s.nid++,role,name:free.length?pickR(r,free):pickR(r,pool)+" "+(s.nid%9+1),skill:skill!=null?skill:Math.round(U(r,0.3,0.5)*100)/100,fat:0}}
function newState(weeks,R){
  R=R||liveRNG();const r=R.x;
  const s={v:1,weeks,week:1,cash:C.START_CASH,loan:0,rep:C.START_REP,acc:{st:"none",at:0,until:0},rigs:[],con:{},rfqs:[],
    spares:{motor:0,brg:1,cpl:1,tq:0,slip:0,daq:0},orders:[],staff:[],pol:{autoCal:true,pm:0,autoBid:false,markup:100},
    recv:[],hist:[],nid:1,phase:"plan",over:null,wk:blankWk(),tot:{rev:0,hours:0,reports:0,late:0,fails:0,planned:0,capex:0},missed:{}};
  makeRig(s,"GB",R.g(0),1,true);makeRig(s,"PP",R.g(1),1,true);
  s.rigs[0].calDue=5;s.rigs[1].calDue=12;
  s.staff.push(person(s,"tech",r,0.5),person(s,"tech",r,0.45),person(s,"eng",r,0.55));
  // two jobs carried over from the previous owner, advances already spent
  const a=makeRFQ(s,R.m,"gbe",{hours:500,dl:9,art:0}),b=makeRFQ(s,R.m,"pump",{hours:150,dl:4,art:0});
  [a,b].forEach(q=>{q.adv=0;acceptRFQ(s,q,q.market,true)});
  genRFQs(s,R);return s;
}
function blankWk(){return{adv:0,spares:0,staff:0,capex:0,cal:0,other:0,loanIn:0,loanOut:0,notes:[]}}

/* ---------- RFQs and contracts ---------- */
function owned(s,rt){return s.rigs.some(g=>g.type===rt)}
function makeRFQ(s,r,type,o){
  o=o||{};const T=TEST[type];
  const hours=o.hours||Math.round((T.h[0]+(T.h[1]-T.h[0])*Math.pow(r(),T.skew))/T.step)*T.step;
  const acc=o.acc!=null?o.acc:r()<C.ACC_SHARE,q=r()<(acc?0.6:0.3)?"High":"Std";
  const market=Math.round((T.rate*hours*U(r,0.9,1.1)*(acc?C.ACC_PREM:1)*(q==="High"?1.1:1)+C.SETUP_FEE)/1000)*1000;
  const fixed=o.fixed!=null?o.fixed:r()<C.FIXED_SHARE;
  const offer=fixed?Math.round(market*(o.offerF||U(r,0.88,1.06))/1000)*1000:null;
  const dl=o.dl||s.week+1+Math.ceil(hours/80*U(r,1.15,1.8))+UI(r,1,3);
  const pen=Math.max(2000,Math.round(market*U(r,0.03,0.06)/500)*500);
  const adv=pickR(r,[0,0.1,0.2,0.3,0.4]);
  const pw=r();const payer=pw<PAYER.prompt.w?"prompt":pw<PAYER.prompt.w+PAYER.average.w?"average":"slow";
  const art=o.art!=null?o.art:(r()<T.fail?U(r,0.15,1):0);
  const id=s.nid++;
  return{id,code:"Q-"+String(1000+id).slice(-4),type,client:o.client||pickR(r,CLIENTS),hours,acc,q,market,fixed,offer,dl,pen,adv,payer,art,bid:null,retest:!!o.retest};
}
function genRFQs(s,R){
  const r=R.m;const n=clamp(1+poisR(C.RFQ_BASE+C.RFQ_REP*s.rep,r),1,4);
  const ws=TK.map(k=>TEST[k].w*(owned(s,TEST[k].rig)?C.OWNED_W:C.OTHER_W)),tw=ws.reduce((a,b)=>a+b,0);
  const out=(s.retests||[]).map(o=>makeRFQ(s,r,o.type,{hours:o.hours,client:o.client,fixed:true,offerF:U(r,0.92,1.05),retest:true,acc:o.acc}));
  s.retests=[];
  for(let i=0;i<n;i++){let x=r()*tw,k=0;while(k<TK.length-1&&(x-=ws[k])>0)k++;out.push(makeRFQ(s,r,TK[k]))}
  s.rfqs=out.slice(0,5);
}
function canTake(s,q){if(q.acc&&s.acc.st!=="yes")return"Needs an accredited lab";if(!owned(s,TEST[q.type].rig))return"You have no "+RIG[TEST[q.type].rig].name.toLowerCase();return""}
function backlogH(s,g){return g.queue.reduce((a,id)=>{const c=s.con[id];return a+Math.max(0,c.hours-c.done)+c.setup},0)+(g.down?(g.down.wait?40:g.down.rep):0)}
function rigCap(g,sh){return (sh!=null?sh:Math.max(1,g.shifts))*C.SHIFT_H*0.88}
function bestRig(s,type){let best=null,bh=Infinity;for(const g of s.rigs)if(g.type===TEST[type].rig){const h=backlogH(s,g)/rigCap(g)+Math.max(0,g.ready-s.week);if(h<bh){bh=h;best=g}}return best}
function finishEst(s,q){const g=bestRig(s,q.type);if(!g)return null;return s.week+Math.max(0,g.ready-s.week)+(backlogH(s,g)+q.hours+C.SETUP_H)/rigCap(g)}
function acceptRFQ(s,q,price,silent){
  const g=bestRig(s,q.type);if(!g)return null;
  const c={id:q.id,code:q.code.replace("Q-","T-"),type:q.type,client:q.client,hours:q.hours,done:0,setup:C.SETUP_H,dl:q.dl,price,pen:q.pen,adv:Math.round(price*q.adv),
    q:q.q,acc:q.acc,payer:q.payer,art:q.art,rig:g.id,err:0,sud:0,loss:0,bad:0,state:"queued",retest:q.retest};
  s.con[c.id]=c;g.queue.push(c.id);
  if(!silent){s.cash+=c.adv;s.wk.adv+=c.adv}
  s.rfqs=s.rfqs.filter(x=>x.id!==q.id);return c;
}

/* ---------- plan-phase actions (shared by the UI and the simulator's bot) ---------- */
function orderSpare(s,c,r,emerg){const p=Math.round(COMP[c].price*(emerg?C.EMERG:1));s.cash-=p;s.wk.spares+=p;const o={c,arr:s.week+leadW(r,c)+(emerg?0:0),claim:null};s.orders.push(o);return o}
function hire(s,role,r){s.cash-=C.HIRE_COST;s.wk.staff+=C.HIRE_COST;const p=person(s,role,r);s.staff.push(p);return p}
function fire(s,id){const p=s.staff.find(x=>x.id===id);if(!p)return;const c=C.SEVER_WEEKS*(p.role==="eng"?C.ENG_WAGE:C.TECH_WAGE);s.cash-=c;s.wk.staff+=c;s.staff=s.staff.filter(x=>x.id!==id)}
function train(s,id){const p=s.staff.find(x=>x.id===id);if(!p||p.skill>=0.95)return;s.cash-=C.TRAIN_COST;s.wk.staff+=C.TRAIN_COST;p.skill=Math.min(1,p.skill+C.TRAIN_GAIN);p.trained=(p.trained||0)+1}
function replaceNow(s,g,c,r){if(s.spares[c]<1)return false;s.spares[c]--;g.comps[c]=newComp(r,c);g.debt+=repH(r,c)*C.PLANNED_F;s.tot.planned++;return true}
function buyRig(s,type,r){const p=RIG[type].price;s.cash-=p;s.wk.capex+=p;s.tot.capex+=p;const g=makeRig(s,type,r,s.week+RIG[type].build,false);return g}
function buyCM(s,g){s.cash-=C.CM_COST;s.wk.capex+=C.CM_COST;s.tot.capex+=C.CM_COST;g.cm=true}
function buyLogger(s,g){s.cash-=C.LOGGER_COST;s.wk.capex+=C.LOGGER_COST;s.tot.capex+=C.LOGGER_COST;g.logger=true}
function bookCal(s,g){g.calBook=true}
function applyAcc(s){s.cash-=C.ACC_COST;s.wk.other+=C.ACC_COST;s.acc={st:"pending",at:s.week+C.ACC_WAIT,until:0}}
function takeLoan(s){if(s.loan+C.LOAN_STEP>C.LOAN_MAX)return false;s.loan+=C.LOAN_STEP;s.cash+=C.LOAN_STEP;s.wk.loanIn+=C.LOAN_STEP;return true}
function repayLoan(s){const x=Math.min(C.LOAN_STEP,s.loan);if(x<=0||s.cash<x)return false;s.loan-=x;s.cash-=x;s.wk.loanOut+=x;return true}
function pipeline(s,c){return s.orders.filter(o=>o.c===c&&!o.claim).length}

/* auto-bid rule: used by the "Auto-bid" policy in the game and by the simulator */
function autoBid(s,markup,careless){
  for(const q of s.rfqs.slice()){
    if(canTake(s,q)){continue}
    const fin=finishEst(s,q),ok=careless||fin<=q.dl;
    if(!ok){q.bid=null;const rt=TEST[q.type].rig;s.capMiss=s.capMiss||{};s.capMiss[rt]=(s.capMiss[rt]||0)+1;continue}
    if(q.fixed){if(careless||q.offer>=q.market*0.93)acceptRFQ(s,q,q.offer)}
    else q.bid=Math.round(q.market*markup/100/1000)*1000;
  }
}

/* ---------- one week ---------- */
function stamp(h,sh){sh=Math.max(1,sh||1);const per=8*sh;let d=Math.min(4,Math.floor(h/per));const hr=6+(h-d*per);const day=d+Math.floor(hr/24),hh=hr%24;
  return{k:day*24+hh,t:DAYS[day]+" "+String(Math.floor(hh)).padStart(2,"0")+":"+String(Math.floor((hh%1)*6)*10).padStart(2,"0")}}
function L_(L,k,t,rig,x,c,q){if(L)L.push({k,t,rig,x,c:c||"",q:q||null})}
function lgR(L,g,h,x,c,q){if(!L)return;const st=stamp(h,g.effSh||g.shifts);L.push({k:st.k,t:st.t,rig:g.id,x,c:c||"",q:q||null})}

function runWeek(s,R,L){
  const wk=s.week,rep0=s.rep,W={inc:{adv:s.wk.adv,recv:0},cost:{wage:0,ot:0,prem:0,power:0,rent:C.RENT,hold:0,cal:0,interest:0,acc:0,spares:s.wk.spares,staff:s.wk.staff,other:s.wk.other},
    capex:s.wk.capex,loanIn:s.wk.loanIn,loanOut:s.wk.loanOut,hours:0,reports:[],fails:0,planned:0,errors:0,loss:0,saved:0,lateRep:0,art:0,waits:[],won:[],lost:[],audit:null,resigned:[],rigHours:{},idle:[],short:0,qa:0,rep0,expired:[]};
  const mr=R.m,xr=R.x;
  /* 1. bids resolve */
  for(const q of s.rfqs){const u=mr();if(q.bid==null||canTake(s,q))continue;
    if(u<winP(q.bid,q.market,s.rep)){const c=acceptRFQ(s,q,q.bid,true);if(c){s.cash+=c.adv;W.inc.adv+=c.adv;W.won.push(c);L&&L_(L,3,"Mon 09:00","LAB",`Bid ${q.code} won at ${money(q.bid)} (${TEST[q.type].name.toLowerCase()}, ${q.hours} h). Logged as ${c.code} on ${c.rig}.`,"good")}}
    else{W.lost.push(q);L&&L_(L,3,"Mon 09:00","LAB",`Bid ${q.code} lost to another lab (you asked ${money(q.bid)}).`)}}
  for(const q of s.rfqs)if(!canTake(s,q)){}else{const rt=TEST[q.type].rig;if(!owned(s,rt))s.missed[rt]=(s.missed[rt]||0)+1}
  s.rfqs=[];
  /* 2. deliveries */
  for(const o of s.orders)if(o.arr<=wk){s.spares[o.c]++;L&&L_(L,2,"Mon 08:00","STR",`Stores received: ${COMP[o.c].name.toLowerCase()}.`)}
  s.orders=s.orders.filter(o=>o.arr>wk);
  /* 3. crew */
  const techs=s.staff.filter(p=>p.role==="tech"),engs=s.staff.filter(p=>p.role==="eng");
  const active=s.rigs.filter(g=>g.ready<=wk&&g.queue.length&&g.shifts>0&&!(g.down&&g.down.wait&&s.spares[g.down.c]<1));
  let need=active.reduce((a,g)=>a+g.shifts,0);const cap=techs.length*C.TECH_COVER,ceil=Math.floor(cap*C.OT_CEIL);
  s.rigs.forEach(g=>g.effSh=g.shifts);
  if(need>ceil){let cut=need-ceil;const by=active.slice().sort((a,b)=>b.shifts-a.shifts);while(cut>0){const g=by.find(x=>x.effSh>0&&x.effSh===Math.max(...by.map(y=>y.effSh)));if(!g)break;g.effSh--;cut--}
    W.short=need-ceil;need=ceil;L&&L_(L,1,"Mon 06:00","LAB",`Not enough technicians: ${W.short} rig-shift${W.short>1?"s":""} left uncovered this week.`,"warn")}
  const otShifts=Math.max(0,need-cap);W.cost.ot=Math.round(otShifts*C.TECH_WAGE/C.TECH_COVER*C.OT_MULT);
  if(otShifts)L&&L_(L,1,"Mon 06:00","LAB",`Crew on overtime: ${otShifts} extra rig-shift${otShifts>1?"s":""} covered at 1.5× pay.`,"warn");
  const tSkill=techs.length?techs.reduce((a,p)=>a+p.skill,0)/techs.length:0.3,tFat=techs.length?techs.reduce((a,p)=>a+p.fat,0)/techs.length:1;
  const eSkill=engs.length?Math.max(...engs.map(p=>p.skill)):0,engNeed=Math.ceil(active.length/C.ENG_COVER),engShort=engs.length<engNeed;
  const setupF=(engs.length?1.3-0.6*eSkill:3)*(engShort&&engs.length?1.6:1);
  /* 4. rigs */
  let ranBad=false;
  for(let i=0;i<s.rigs.length;i++){
    const g=s.rigs[i],r=R.g(i),sh=g.effSh;g.ran=0;
    const u1=r(),u2=r(),u3=r(),u4=r();     // drawn every week so paired runs stay in step
    if(g.ready>wk){continue}
    if(g.ready===wk)L&&L_(L,1,"Mon 07:00",g.id,`${RIG[g.type].name} commissioned and ready for work.`,"good");
    const busy=g.queue.length>0&&sh>0;
    const H=busy?sh*C.SHIFT_H:0;let t=0;
    if(g.calDue<=wk&&(s.pol.autoCal||g.calBook)||g.calBook){const c=C.CAL_COST;s.cash-=c;W.cost.cal+=c;t+=busy?C.CAL_H:0;g.calDue=wk+C.CAL_VALID;g.calBook=false;L&&lgR(L,g,0,`Calibration done on torque and DAQ channels. Next due week ${g.calDue}.`)}
    const calOK=g.calDue>wk;if(!calOK){W.expired.push(g.id)}
    if(g.debt>0){const x=Math.min(g.debt,Math.max(0,H-t));t+=x;g.debt-=busy?x:g.debt}
    if(g.down){
      if(g.down.wait){if(s.spares[g.down.c]>0){s.spares[g.down.c]--;g.down.wait=false;g.down.rep=repH(r,g.down.c);L&&lgR(L,g,t,`Spare ${COMP[g.down.c].short.toLowerCase()} issued. Repair started.`)}
        else{W.waits.push(g.id);continue}}
      const x=Math.min(Math.max(0,(busy?H:40)-t),g.down.rep);t+=busy?x:0;g.down.rep-=x;
      if(g.down.rep<=0.01){g.comps[g.down.c]=newComp(r,g.down.c);L&&lgR(L,g,t,`${COMP[g.down.c].short} replaced. Rig back in service.`,"good");g.down=null}
      else continue;
    }
    // preventive replacement (policy) and planned swaps after a vibration warning
    for(const k in g.comps){const m=g.comps[k];
      if(s.spares[k]>0&&((m.warn&&g.cm)||(s.pol.pm>0&&m.age>=s.pol.pm*COMP[k].eta))){s.spares[k]--;const h=repH(r,k)*C.PLANNED_F;t+=busy?h:0;g.comps[k]=newComp(r,k);W.planned++;s.tot.planned++;
        L&&lgR(L,g,Math.min(t,Math.max(0,H-1)),`Planned stop: ${COMP[k].short.toLowerCase()} replaced at ${Math.round(m.age)} h${m.warn?" after the vibration warning":""}.`,"")}}
    let worked=0,cur=null;
    while(t<H-1e-6&&!g.down&&g.queue.length){
      const c=s.con[g.queue[0]];cur=c;
      if(c.state==="queued"){c.state="run";c.start=wk}
      if(c.setup>0){const x=Math.min(H-t,c.setup*setupF);t+=x;c.setup=Math.max(0,c.setup-x/setupF);if(c.setup>0.01)break;c.setup=0;L&&lgR(L,g,t,`${c.code} set up for ${TEST[c.type].name.toLowerCase()} (${c.client}). Run started.`);continue}
      let dt=Math.min(H-t,c.hours-c.done),ev=null,evc=null;
      if(c.art>0){const ta=c.art*c.hours-c.done;if(ta<dt){dt=Math.max(0,ta);ev="art"}}
      for(const k in g.comps){const m=g.comps[k],tf=m.life-m.age;if(tf<dt){dt=Math.max(0,tf);ev="fail";evc=k}
        if(g.cm&&m.det&&!m.warn){const tw=m.life-C.WARN_H-m.age;if(tw<dt){dt=Math.max(0,tw);ev="warn";evc=k}}}
      t+=dt;c.done+=dt;worked+=dt;for(const k in g.comps)g.comps[k].age+=dt;if(!calOK){c.bad+=dt;ranBad=true}
      if(ev==="art"){c.art=0;W.art++;finishContract(s,c,"art",W,L,g,t,r,eSkill,engShort);g.queue.shift();continue}
      if(ev==="warn"){const m=g.comps[evc];m.warn=true;
        if(s.spares[evc]>0){s.spares[evc]--;const h=Math.min(H-t,repH(r,evc)*C.PLANNED_F);t+=h;g.comps[evc]=newComp(r,evc);W.planned++;s.tot.planned++;
          L&&lgR(L,g,t,`Vibration trend rising on ${COMP[evc].short.toLowerCase()}. Planned stop, part swapped from stores.`,"good")}
        else{const has=pipeline(s,evc)>0;if(!has){const o=orderSpare(s,evc,r,false);W.cost.spares+=COMP[evc].price;s.wk.spares-=COMP[evc].price}
          L&&lgR(L,g,t,`Vibration trend rising on ${COMP[evc].short.toLowerCase()}. No spare in stores${has?", one is on order":", ordered one"}. Running on watch.`,"warn")}
        continue}
      if(ev==="fail"){const m=g.comps[evc];W.fails++;s.tot.fails++;c.sud++;
        if(s.spares[evc]>0){s.spares[evc]--;g.down={c:evc,wait:false,rep:repH(r,evc)};L&&lgR(L,g,t,`TRIP: ${COMP[evc].short.toLowerCase()} failed at ${Math.round(m.age)} h. Spare in stores, repair started.`,"warn")}
        else{const o=s.orders.find(x=>x.c===evc&&!x.claim);let arr;if(o){o.claim=g.id;arr=o.arr}else{const e=orderSpare(s,evc,r,true);e.claim=g.id;arr=e.arr;W.cost.spares+=Math.round(COMP[evc].price*C.EMERG);s.wk.spares-=Math.round(COMP[evc].price*C.EMERG)}
          g.down={c:evc,wait:true,rep:0};L&&lgR(L,g,t,`TRIP: ${COMP[evc].short.toLowerCase()} failed at ${Math.round(m.age)} h. No spare. ${o?"Waiting for the open order":"Emergency order placed"}, due week ${arr}.`,"bad");break}
        const x=Math.min(H-t,g.down.rep);t+=x;g.down.rep-=x;if(g.down.rep<=0.01){g.comps[evc]=newComp(r,evc);g.down=null;L&&lgR(L,g,t,`${COMP[evc].short} replaced. Run resumed.`)}
        continue}
      if(c.done>=c.hours-1e-6){c.done=c.hours;if(finishContract(s,c,"ok",W,L,g,t,r,eSkill,engShort))g.queue.shift()}
    }
    // operator error and DAQ dropouts on the test that is still running
    if(worked>0&&cur&&cur.state==="run"&&g.queue[0]===cur.id){
      const pe=C.ERR_P*(sh>=3?C.ERR_NIGHT:1)*(1+tFat)*(1.5-tSkill)*(otShifts?1.3:1);
      if(u1<pe){const x=Math.round(6+u2*18);cur.done=Math.max(0,cur.done-x);cur.err++;W.errors++;L&&lgR(L,g,Math.max(0,t-3),`Operator error on ${cur.code}: wrong load step applied. ${x} h to rerun.`,"warn")}
      if(u3<C.DAQ_P*worked/80){if(g.logger){W.saved++;L&&lgR(L,g,Math.max(0,t-2),`DAQ dropout. Redundant logger kept the record, no rerun.`)}
        else{const x=Math.round(8+u4*22);cur.done=Math.max(0,cur.done-x);cur.loss++;W.loss++;L&&lgR(L,g,Math.max(0,t-2),`DAQ dropout on ${cur.code}. ${x} h of data lost, segment to rerun.`,"warn")}}
    }
    g.ran=worked;W.hours+=worked;W.rigHours[g.id]=worked;
    W.cost.power+=Math.round(worked*RIG[g.type].power);
    if(busy)W.cost.prem+=C.PREM[sh]||0;else if(!g.down)W.idle.push(g.id);
  }
  /* 5. money in */
  for(const v of s.recv)if(v.wk<=wk){s.cash+=v.amt;W.inc.recv+=v.amt;if(v.amt>0)L&&L_(L,140,"Sat 11:00","ACC",`Payment received from ${v.client}: ${money(v.amt)} for ${v.code}.`,"good")}
  s.recv=s.recv.filter(v=>v.wk>wk);
  /* 6. money out */
  W.cost.wage=techs.length*C.TECH_WAGE+engs.length*C.ENG_WAGE;
  W.cost.hold=Math.round(CK.reduce((a,k)=>a+s.spares[k]*COMP[k].price*C.HOLD,0));
  W.cost.interest=Math.round(s.loan*C.LOAN_RATE+(s.cash<0?-s.cash*C.OD_RATE:0));
  if(s.acc.st==="yes"||s.acc.st==="susp")W.cost.acc=C.ACC_FEE;
  const run=W.cost.wage+W.cost.ot+W.cost.prem+W.cost.power+W.cost.rent+W.cost.hold+W.cost.interest+W.cost.acc;
  s.cash-=run;
  /* 7. accreditation */
  if(s.acc.st==="pending"&&wk>=s.acc.at){
    const calAll=s.rigs.every(g=>g.ready>wk||g.calDue>wk);
    if(calAll&&eSkill>=C.ACC_SKILL){s.acc={st:"yes",at:wk,until:0};s.rep+=0.05;W.audit="pass";L&&L_(L,130,"Fri 15:00","QA","Accreditation audit passed. Accredited RFQs are now open to you.","good",{x:"Auditor: “Traceable calibration, tidy records. Approved.”"})}
    else{s.acc={st:"none",at:0,until:0};W.audit="fail";L&&L_(L,130,"Fri 15:00","QA",`Accreditation audit failed: ${!calAll?"a rig has an expired calibration":"no engineer with enough skill (train one)"}. Fee lost.`,"bad")}
  }else if(s.acc.st==="yes"&&xr()<C.AUDIT_P){
    if(ranBad||W.expired.length){s.acc={st:"susp",at:wk,until:wk+C.ACC_SUSPEND};s.rep-=0.06;W.audit="susp";L&&L_(L,131,"Fri 16:00","QA",`Surprise audit: ${W.expired.join(", ")} past calibration. Accreditation suspended until week ${wk+C.ACC_SUSPEND}.`,"bad")}
    else{W.audit="ok";L&&L_(L,131,"Fri 16:00","QA","Surprise audit by the accreditation body. No findings.","good")}
  }else if(s.acc.st==="susp"&&wk>=s.acc.until){s.acc={st:"yes",at:wk,until:0};L&&L_(L,131,"Fri 16:00","QA","Accreditation suspension lifted.","good")}
  /* 8. people */
  const load=cap>0?(need)/cap:2,nights=s.rigs.filter(g=>g.effSh>=3&&g.queue.length).length;
  for(const p of techs){p.fat=clamp(p.fat+(load>1?0.22*(load-1)+0.05:-0.12)+(nights?0.05*nights:0),0,1);if(need>0)p.skill=Math.min(1,p.skill+C.LEARN)}
  const eLoad=engs.length?active.length/(engs.length*C.ENG_COVER):0;
  for(const p of engs){p.fat=clamp(p.fat+(eLoad>1?0.15*(eLoad-1)+0.05:-0.1),0,1);if(active.length)p.skill=Math.min(1,p.skill+C.LEARN)}
  for(const p of s.staff.slice()){if(p.fat>0.6&&xr()<C.RESIGN_P*(p.fat-0.6)/0.4){s.staff=s.staff.filter(x=>x.id!==p.id);W.resigned.push(p);
    L&&L_(L,135,"Fri 18:00","HR",`${p.name} (${p.role==="eng"?"test engineer":"technician"}) resigned.`,"bad",{x:`${p.name}: “${pickR(xr,QUOTES.resign)}”`})}}
  /* 9. wrap up */
  s.rep=clamp(s.rep,0.05,1);
  const inc=W.inc.adv+W.inc.recv,cost=Object.values(W.cost).reduce((a,b)=>a+b,0);
  W.income=inc;W.costs=cost;W.profit=inc-cost;W.cash=s.cash;W.rep1=s.rep;W.loan=s.loan;
  s.tot.rev+=inc;s.tot.hours+=W.hours;
  s.hist.push({wk,inc,cost,profit:inc-cost,cash:s.cash,rep:s.rep,hours:W.hours,net:netWorth(s)});
  if(L)L.sort((a,b)=>a.k-b.k);
  s.wk=blankWk();
  if(s.cash<-C.OVERDRAFT)s.over="bankrupt";
  s.week++;
  if(!s.over)genRFQs(s,R);
  return W;
}
function finishContract(s,c,how,W,L,g,t,r,eSkill,engShort){
  const wk=s.week;let pay,msg,q=null,cls="good";
  if(how==="art"){
    const share=C.ART_BASE+(1-C.ART_BASE)*c.done/c.hours;pay=Math.round(c.price*share);
    msg=`${c.code}: test article failed at ${Math.round(c.done)} h. Early report issued, client pays ${Math.round(share*100)}% of the price.`;
    q={x:`${c.client}: “${pickR(r,QUOTES.art)}”`};cls="";
    if(r()<C.RETEST_P){(s.retests=s.retests||[]).push({type:c.type,hours:c.hours,client:c.client,acc:c.acc});msg+=" They want a retest quote."}
    s.rep+=0.01;
  }else{
    if(c.bad>0&&r()<C.QA_CATCH){const b=Math.round(c.bad);c.done=Math.max(0,c.done-c.bad);c.bad=0;s.rep-=0.06;W.qa++;
      L&&lgR(L,g,t,`${c.code}: client QA rejected ${b} h logged with an expired calibration. Those hours must be rerun.`,"bad",{x:`${c.client}: “${QUOTES.qa[0]}”`});return false}
    const late=Math.max(0,wk-c.dl),pen=Math.min(C.PEN_CAP*c.price,late*c.pen);
    const qual=1-0.035*c.err-0.05*c.sud+0.06*(eSkill-0.5)-(engShort?0.04:0)-(eSkill?0:0.1);
    const reb=qual<(c.q==="High"?C.Q_HIGH:C.Q_STD)?Math.round(0.1*c.price):0;
    pay=Math.round(c.price-pen-reb);
    if(late){s.rep-=0.04*Math.min(late,4);W.lateRep++;s.tot.late++;cls="warn";q={x:`${c.client}: “${pickR(r,QUOTES.late)}”`}}
    else{s.rep+=0.025+(c.q==="High"&&!reb?0.01:0);q={x:`${c.client}: “${pickR(r,QUOTES.ontime)}”`}}
    if(reb){s.rep-=0.04;q={x:`${c.client}: “${pickR(r,QUOTES.rebate)}”`};cls="warn"}
    msg=`${c.code} complete, ${c.hours} h. Final report sent${late?`, ${late} week${late>1?"s":""} late (penalty ${money(pen)})`:" on time"}${reb?`, data quality below spec (rebate ${money(reb)})`:""}.`;
  }
  c.state="done";c.end=wk;c.paid=pay;s.tot.reports++;
  const bal=Math.max(0,pay-c.adv),d=PAYER[c.payer].d,due=wk+UI(r,d[0],d[1]);
  s.recv.push({amt:bal,wk:due,client:c.client,code:c.code});
  W.reports.push({code:c.code,how,pay,bal,due});
  L&&lgR(L,g,t,msg,cls,q);return true;
}
function wip(s){let v=0;for(const g of s.rigs)for(const id of g.queue){const c=s.con[id];const late=Math.max(0,s.week-c.dl);v+=Math.max(0,0.7*c.price*c.done/c.hours-c.adv-Math.min(C.PEN_CAP*c.price,late*c.pen))}return v}
function netWorth(s){const rigs=s.rigs.reduce((a,g)=>a+g.bought*0.6,0);return s.cash-s.loan+s.recv.reduce((a,v)=>a+v.amt,0)+wip(s)+rigs}
const NF=new Intl.NumberFormat("en-IN",{maximumFractionDigits:0});

/* ---------- bot used by the Monte Carlo and the balance test ---------- */
const BOT_DEF={shifts:2,markup:100,spares:1,autoCal:true,pm:0,cm:false,logger:false,hire:true,train:true,acc:false,careless:false,expand:null,trigger:4,reserve:300000,loan:true};
function botPlan(s,b,R){
  const r=R.x;
  s.pol.autoCal=b.autoCal;s.pol.pm=b.pm;
  s.rigs.forEach(g=>g.shifts=b.shifts);
  // spares: keep b.spares of each cheap part (bearings, coupling, slip ring); 2 = also motor, sensor, DAQ
  if(b.spares>0){const used=new Set();s.rigs.forEach(g=>RIG[g.type].comps.forEach(c=>used.add(c)));
    for(const c of used){const cheap=COMP[c].price<30000,tgt=cheap?b.spares:(b.spares>=2?1:0);
      while(s.spares[c]+pipeline(s,c)<tgt&&s.cash>b.reserve*0.3)orderSpare(s,c,r)}}
  if(b.hire){const need=s.rigs.filter(g=>g.queue.length||g.ready>s.week).reduce((a,g)=>a+g.shifts,0),t=s.staff.filter(p=>p.role==="tech").length;
    if(t*C.TECH_COVER<need)hire(s,"tech",r);
    const e=s.staff.filter(p=>p.role==="eng").length;if(e<Math.ceil(s.rigs.length/C.ENG_COVER))hire(s,"eng",r)}
  if(b.train&&s.cash>b.reserve){const p=s.staff.filter(p=>p.skill<0.65&&(p.role==="eng"||b.shifts>=2)).sort((a,b)=>a.skill-b.skill)[0];if(p&&s.week%4===1)train(s,p.id)}
  if(b.cm)for(const g of s.rigs)if(!g.cm&&s.cash>C.CM_COST+b.reserve)buyCM(s,g);
  if(b.logger)for(const g of s.rigs)if(!g.logger&&s.cash>C.LOGGER_COST+b.reserve)buyLogger(s,g);
  if(b.acc&&s.acc.st==="none"&&s.cash>C.ACC_COST+b.reserve&&s.staff.some(p=>p.role==="eng"&&p.skill>=C.ACC_SKILL)&&s.rigs.every(g=>g.calDue>s.week+C.ACC_WAIT))applyAcc(s);
  if(b.expand&&b.expand.type==="CM"){for(const g of s.rigs)if(!g.cm&&s.cash>C.CM_COST+b.reserve*0.5)buyCM(s,g)}
  else if(b.expand&&!s.expanded&&s.week<s.weeks-8){
    const t=b.expand.type,miss=(s.missed[t]||0)+((s.capMiss||{})[t]||0),price=RIG[t].price;
    if(miss>=b.expand.miss){if(s.cash<price+b.reserve&&b.loan)while(s.cash<price+b.reserve&&takeLoan(s));if(s.cash>=price+b.reserve*0.5){buyRig(s,t,r);s.expanded=true}}
  }
  if(b.loan&&s.cash<b.reserve*0.4)takeLoan(s);
  else if(b.loan&&s.loan>0&&s.cash>C.LOAN_STEP+b.reserve*2)repayLoan(s);
  autoBid(s,b.markup,b.careless);
}
function simRun(seed,weeks,b,init){
  const s=newState(weeks,seededRNG(seed,0));if(init)init(s);
  const o={nc:new Float64Array(weeks),cash:new Float64Array(weeks),profit:new Float64Array(weeks),rev:new Float64Array(weeks),hours:new Float64Array(weeks),bank:-1,end:0,expAt:-1};
  for(let w=0;w<weeks;w++){
    const R=seededRNG(seed,w+1);const n0=s.rigs.length;botPlan(s,b,R);if(s.rigs.length>n0&&o.expAt<0)o.expAt=w;
    const W=runWeek(s,R,null);o.cash[w]=s.cash;o.nc[w]=s.cash-s.loan;o.profit[w]=W.profit-W.capex*0;o.rev[w]=W.income;o.hours[w]=W.hours;
    if(s.over){o.bank=w;for(let k=w+1;k<weeks;k++){o.cash[k]=s.cash;o.nc[k]=s.cash-s.loan;o.profit[k]=0}break}
  }
  o.end=netWorth(s)-(init?init.base||C.START_CASH:C.START_CASH);o.fails=s.tot.fails;o.late=s.tot.late;o.planned=s.tot.planned;o.rep=s.rep;o.hrs=s.tot.hours;o.rigs=s.rigs.length;return o;
}

function alerts(){

  if(r.lateRep)t.push("A report went out late. Check the Floor for late-risk tags and add a shift or turn down tight deadlines.");
  if(r.idle.length&&t.length<4)t.push(`${r.idle.join(", ")} stood idle. Bid a little lower or accept fixed offers to fill it.`);
  if(r.errors&&r.nights)t.push("Operator errors are more than twice as likely on night shifts. Training and rested crews help.");
  else if(r.errors)t.push("An operator error cost rerun hours. Training raises skill and cuts errors.");
  if(r.loss&&t.length<4)t.push("A DAQ dropout forced a rerun. A redundant logger (Office) prevents that.");
  if(r.ot&&t.length<4)t.push("Shifts ran on overtime. A third technician costs less than steady overtime.");
  if(r.lost>0&&r.won===0&&t.length<4)t.push(`All ${r.lost} bid${r.lost>1?"s":""} lost. Bids near the market price win about half the time.`);
  if(r.fails&&!r.waits.length&&t.length<4)t.push("A part failed but a spare was ready, so the rig lost only repair hours.");
  if(r.cash<150000&&t.length<4)t.push("Cash is thin. Payments arrive weeks after reports; a bank loan can bridge the gap.");
  if(!t.length)t.push("Clean week. Keep an eye on part ages and calibration dates.");
  return t.slice(0,4);
}

    markup:g.pol.markup||100,spares:(g.spares.brg+g.spares.cpl+g.spares.slip)>=4?2:(g.spares.brg+g.spares.cpl+g.spares.slip)>0?1:0,
    cm:g.rigs.some(r=>r.cm)?1:0,pm:g.pol.pm,autoCal:g.pol.autoCal?1:0,weeks:g.weeks});

}

/* ---- shared model pieces ---- */
const meanH=k=>{const t=TEST[k];return t.h[0]+(t.h[1]-t.h[0])/(t.skew+1)};
const partB=c=>c===T.comp?T.beta:COMP[c].b, partEta=c=>c===T.comp?T.eta:COMP[c].eta;
const partMTTF=c=>partEta(c)*gammaFn(1+1/partB(c));
const repMean=c=>(COMP[c].rep[0]+COMP[c].rep[1])/2, leadMean=c=>(COMP[c].lead[0]+COMP[c].lead[1])/2;
const leadSq=c=>{const a=COMP[c].lead[0],b=COMP[c].lead[1];let v=0;for(let x=a;x<=b;x++)v+=x*x;return v/(b-a+1)};
const START_RIGS=["GB","PP"],START_TESTS=["gbe","pump"];
function priceH(k,mk){return (TEST[k].rate*(mk||T.markup)/100*meanH(k)+C.SETUP_FEE)/(meanH(k)+C.SETUP_H)} // per rig hour incl. setup time
function partsH(rt){return RIG[rt].comps.reduce((a,c)=>a+COMP[c].price/partMTTF(c),0)}
function crew(sh){return{techs:Math.max(2,Math.ceil(2*sh/C.TECH_COVER)),engs:1}}
function fixedWk(sh){const cr=crew(sh);return C.RENT+cr.techs*C.TECH_WAGE+cr.engs*C.ENG_WAGE}
function unit(rt,k,sh,u){
  const h=sh*C.SHIFT_H*u,rigs=START_RIGS.length,cr=crew(sh);
  const r={price:priceH(k),power:RIG[rt].power,labour:(cr.techs*C.TECH_WAGE+cr.engs*C.ENG_WAGE)/rigs/h,rent:C.RENT/rigs/h,prem:C.PREM[sh]/h,
    parts:partsH(rt)*(1+(T.spares?0.02:0)),cal:C.CAL_COST/(C.CAL_VALID*h)};
  r.variable=r.power+r.parts+r.prem;r.cost=r.variable+r.labour+r.rent+r.cal;r.margin=r.price-r.cost;return r;
}
function sysMTBF(rt){return 1/RIG[rt].comps.reduce((a,c)=>a+1/partMTTF(c),0)}
/* downtime per failure: mixture over parts, spare in stock with prob cover, CM catches share det of detectable failures */
function downMoments(rt,Hwk,cover,det,cm){
  const cs=RIG[rt].comps,w=cs.map(c=>1/partMTTF(c)),tw=w.reduce((a,b)=>a+b,0);let m1=0,m2=0;
  cs.forEach((c,i)=>{const p=w[i]/tw,rm=repMean(c),rv=Math.pow(COMP[c].rep[1]-COMP[c].rep[0],2)/12;
    const dCatch=cm?det*COMP[c].det/ (CK.reduce((a,k)=>a+COMP[k].det,0)/CK.length):0,pc=clamp(dCatch,0,1);
    // planned: half repair, no wait (spare ordered at warning; leftover lead beyond warning window)
    const leftL=Math.max(0,leadMean(c)*Hwk-C.WARN_H);
    const pl1=C.PLANNED_F*rm+(1-cover)*leftL,pl2=Math.pow(C.PLANNED_F,2)*(rv+rm*rm)+(1-cover)*leftL*leftL;
    const un1=rm+(1-cover)*leadMean(c)*Hwk,un2=rv+rm*rm+(1-cover)*(leadSq(c)*Hwk*Hwk+2*rm*leadMean(c)*Hwk);
    m1+=p*(pc*pl1+(1-pc)*un1);m2+=p*(pc*pl2+(1-pc)*un2)});
  return{m1,m2};
}
function availability(rt,sh,cover,det,cm){const H=sh*C.SHIFT_H,mt=sysMTBF(rt),d=downMoments(rt,H,cover,det,cm);
  const mttr=RIG[rt].comps.reduce((a,c)=>a+repMean(c)/partMTTF(c),0)*mt,delay=Math.max(0,d.m1-mttr);return{mtbf:mt,mttr,delay,A:mt/(mt+d.m1),d}}
function normCdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
function poisCdf(k,l){if(k<0)return 0;let t=Math.exp(-l),s=t;for(let i=1;i<=k;i++){t*=l/i;s+=t}return Math.min(1,s)}
function pct(a,q){if(!a.length)return NaN;const b=Float64Array.from(a).sort();const i=(b.length-1)*q,lo=Math.floor(i);return b[lo]+(b[Math.min(lo+1,b.length-1)]-b[lo])*(i-lo)}
function weekModel(sh){ // expected weekly profit with a full order book, ± sigma from failure downtime
  const H=sh*C.SHIFT_H;let mu=-fixedWk(sh),v=0,lost=0,fails=0;
  START_RIGS.forEach((rt,i)=>{const k=START_TESTS[i],u=unit(rt,k,sh,1),m=u.price-u.variable,lam=H/sysMTBF(rt),d=downMoments(rt,H,T.spares?T.cover/100:0,T.det/100,!!T.cm);
    const el=Math.min(H,lam*d.m1);lost+=el;fails+=lam;mu+=m*(H-el)-C.PREM[sh];v+=m*m*lam*d.m2});
  return{H,mu,sd:Math.sqrt(v),lost,fails};
}

/* ---- capacity queue (Lindley recursion, same job sizes and deadlines as makeRFQ) ---- */
function queueSim(k,demand,sh,A,seed){
  const r=mulberry32(seed),t=TEST[k],cap=sh*C.SHIFT_H*A,lam=demand/(meanH(k)+C.SETUP_H),W=1200;
  let backlog=0,late=0,n=0,served=0,bsum=0,pen=0;
  for(let w=0;w<W;w++){
    const a=poisR(lam,r);
    for(let j=0;j<a;j++){const h=t.h[0]+(t.h[1]-t.h[0])*Math.pow(r(),t.skew)+C.SETUP_H,dl=1+Math.ceil((h-C.SETUP_H)/80*U(r,1.15,1.8))+UI(r,1,3);
      const fin=(backlog+h)/cap;bsum+=backlog/cap;backlog+=h;n++;if(fin>dl+0.5){late++;pen+=Math.min(C.PEN_CAP,(fin-dl)*0.045)}}
    const x=Math.min(cap,backlog);served+=x;backlog-=x;
    if(backlog>cap*60)backlog=cap*60;
  }
  return{util:served/(cap*W),wait:n?bsum/n:0,pLate:n?late/n:0,served:served/W,pen:n?pen/n:0,lam};
}

/* ---- Monte Carlo (chunked so the page stays responsive) ---- */
let MC={key:null,done:false,base:[],exp:[],i:0,N:0,timer:null};
function botCfg(){return Object.assign({},BOT_DEF,{shifts:T.shifts,markup:T.markup,spares:T.spares,autoCal:!!T.autoCal,pm:T.pm,cm:!!T.cm,reserve:T.reserve,loan:!!T.loan})}
function mcKey(){return JSON.stringify([T.cash,T.rep,T.shifts,T.markup,T.spares,T.autoCal,T.pm,T.cm,T.runs,T.weeks,T.expType,T.miss,T.reserve,T.loan])}
function mcInit(){const f=st=>{st.cash=T.cash;st.rep=T.rep/100};f.base=T.cash;return f}
function startMC(onDone){
  const key=mcKey();if(MC.key===key&&MC.done){onDone();return}
  clearTimeout(MC.timer);MC={key,done:false,base:[],exp:[],i:0,N:T.runs,timer:null};
  const b0=botCfg(),b1=Object.assign({},b0,{expand:{type:T.expType,miss:T.miss}}),init=mcInit();
  const chunk=()=>{const t0=performance.now();
    while(MC.i<MC.N&&performance.now()-t0<30){const sd=MC.i+1;MC.base.push(slim(simRun(sd,T.weeks,b0,init)));MC.exp.push(slim(simRun(sd,T.weeks,b1,init)));MC.i++}
    document.querySelectorAll(".mcbusy").forEach(e=>e.textContent=MC.i<MC.N?`Simulating ${MC.N} paired runs… ${Math.round(MC.i/MC.N*100)}%`:"");
    if(MC.i<MC.N)MC.timer=setTimeout(chunk,0);else{MC.done=true;onDone()}};
  chunk();
}
function slim(o){return{nc:o.nc,profit:o.profit,rev:o.rev,end:o.end,bank:o.bank,expAt:o.expAt,fails:o.fails,late:o.late,hrs:o.hrs}}

/* ---- chart helpers ---- */
function niceTicks(lo,hi,n){if(hi<=lo)hi=lo+1;const raw=(hi-lo)/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);const out=[];for(let v=Math.floor(lo/st)*st;v<=hi+st*0.999;v+=st)out.push(+v.toFixed(10));return out}
function frame(el,H){const W=Math.max(280,Math.round(el.clientWidth||340));return{W,H,l:52,r:12,t:14,b:28}}
function hookHover(el,pick,def){
  const svg=el.querySelector("svg"),out=el.querySelector(".readout"),g=svg.querySelector(".guide");out.textContent=def;
  const move=e=>{const bb=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,x=(e.clientX-bb.left)*vb.width/bb.width;const h=pick(x);if(!h)return;g.setAttribute("x1",h.x);g.setAttribute("x2",h.x);g.style.display="";out.textContent=h.text};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);
  svg.addEventListener("pointerleave",()=>{g.style.display="none";out.textContent=def});
}
const path=pts=>pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
/* generic line chart: o={H,xs,series:[{n,c,ys,w,dash}],band,xf,yf,xticks,ymin,ymax,marks:[{x,t}],dots:[{x,y,t}],aria,read(i),def,legendExtra} */
function lineChart(el,o){
  const f=frame(el,o.H||220),xs=o.xs,n=xs.length;
  const all=o.series.flatMap(s=>s.ys).concat(o.band?o.band.lo.concat(o.band.hi):[]).filter(v=>isFinite(v));
  let lo=o.ymin!=null?o.ymin:Math.min(0,...all),hi=o.ymax!=null?o.ymax:Math.max(...all);if(hi<=lo)hi=lo+1;
  const tk=niceTicks(lo,hi,4);lo=Math.min(lo,tk[0]);hi=tk[tk.length-1];
  const x0=xs[0],x1=xs[n-1],X=v=>f.l+(v-x0)/(x1-x0||1)*(f.W-f.l-f.r),Y=v=>f.t+(hi-clamp(v,lo,hi))/(hi-lo)*(f.H-f.t-f.b);
  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="${esc(o.aria||"")}">`;
  tk.forEach(v=>svg+=`<line class="grid" x1="${f.l}" x2="${f.W-f.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${f.l-6}" y="${Y(v)+4}" text-anchor="end">${o.yf(v)}</text>`);
  if(lo<0&&hi>0)svg+=`<line x1="${f.l}" x2="${f.W-f.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  (o.xticks||[x0,(x0+x1)/2,x1]).forEach((v,i,a)=>svg+=`<text class="ax" x="${X(v)}" y="${f.H-8}" text-anchor="${i===0?"start":i===a.length-1?"end":"middle"}">${o.xf(v)}</text>`);
  if(o.band)svg+=`<path d="${path(xs.map((x,i)=>[X(x),Y(o.band.hi[i])]))}L${xs.map((x,i)=>[X(xs[n-1-i]),Y(o.band.lo[n-1-i])].join(" ")).join("L")}Z" fill="var(${o.band.c})" opacity=".2"/>`;
  (o.hlines||[]).forEach(h=>{if(h.y>lo&&h.y<hi)svg+=`<line x1="${f.l}" x2="${f.W-f.r}" y1="${Y(h.y)}" y2="${Y(h.y)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="lab" x="${f.W-f.r-4}" y="${Y(h.y)-5}" text-anchor="end">${esc(h.t)}</text>`});
  o.series.forEach(s=>svg+=`<path d="${path(xs.map((x,i)=>[X(x),Y(s.ys[i])]).filter((p,i)=>isFinite(s.ys[i])))}" fill="none" stroke="var(${s.c})" stroke-width="${s.w||2}" ${s.dash?'stroke-dasharray="6 4"':""} stroke-linejoin="round" stroke-linecap="round"/>`);
  (o.marks||[]).forEach(m=>svg+=`<line x1="${X(m.x)}" x2="${X(m.x)}" y1="${f.t}" y2="${f.H-f.b}" stroke="var(--sig)" stroke-width="1.5"/><text class="lab" x="${X(m.x)+(X(m.x)>f.W*0.7?-4:4)}" y="${f.t+11}" text-anchor="${X(m.x)>f.W*0.7?"end":"start"}">${esc(m.t)}</text>`);
  (o.dots||[]).forEach(d=>svg+=`<circle cx="${X(d.x)}" cy="${Y(d.y)}" r="5" fill="var(--sig)" stroke="var(--card)" stroke-width="2"/><text class="lab" x="${X(d.x)+(X(d.x)>f.W*0.65?-8:8)}" y="${Y(d.y)-9}" text-anchor="${X(d.x)>f.W*0.65?"end":"start"}">${esc(d.t)}</text>`);
  svg+=`<line class="guide" y1="${f.t}" y2="${f.H-f.b}" style="display:none"/></svg>`;
  const leg=o.series.length+(o.band?1:0)>=2?`<div class="legend">${o.series.map(s=>`<span><i class="${s.dash?"dash":""}" style="${s.dash?"":`background:var(${s.c})`}"></i>${esc(s.n)}</span>`).join("")}${o.band?`<span><i class="band" style="background:var(${o.band.c})"></i>${esc(o.band.n)}</span>`:""}</div>`:"";
  el.innerHTML=leg+svg+`<div class="readout"></div>`;
  hookHover(el,x=>{const v=x0+(x-f.l)/(f.W-f.l-f.r)*(x1-x0);let i=0,bd=Infinity;xs.forEach((xx,j)=>{const d=Math.abs(xx-v);if(d<bd){bd=d;i=j}});return{x:X(xs[i]),text:o.read(i)}},o.def);
}
function barHist(el,vals,target,fmt){
  const lo=Math.min(...vals),hi=Math.max(...vals),B=24,w=(hi-lo)/B||1,bins=new Array(B).fill(0);vals.forEach(v=>bins[Math.min(B-1,Math.floor((v-lo)/w))]++);
  const f=frame(el,190),mx=Math.max(...bins),X=v=>f.l+(v-lo)/(hi-lo||1)*(f.W-f.l-f.r),Y=c=>f.t+(1-c/mx)*(f.H-f.t-f.b),bwp=(f.W-f.l-f.r)/B;
  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Distribution of final result across runs">`;
  niceTicks(0,mx,3).filter(v=>v<=mx).forEach(v=>svg+=`<line class="grid" x1="${f.l}" x2="${f.W-f.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${f.l-6}" y="${Y(v)+4}" text-anchor="end">${(v/vals.length*100).toFixed(0)}%</text>`);
  bins.forEach((c,i)=>{if(!c)return;const x=f.l+i*bwp+1,y=Y(c),h=f.H-f.b-y,r=Math.min(3,h/2),bw=bwp-2,mid=lo+(i+.5)*w;
    svg+=`<path d="M${x} ${f.H-f.b}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${f.H-f.b}Z" fill="var(${mid<0?"--s2":"--s1"})" opacity="${mid>=target?1:.5}"/>`});
  [lo,(lo+hi)/2,hi].forEach((v,i)=>svg+=`<text class="ax" x="${X(v)}" y="${f.H-8}" text-anchor="${["start","middle","end"][i]}">${fmt(v)}</text>`);
  if(target>lo&&target<hi)svg+=`<line x1="${X(target)}" x2="${X(target)}" y1="${f.t}" y2="${f.H-f.b}" stroke="var(--ink)" stroke-width="2" stroke-dasharray="4 3"/><text class="lab" x="${X(target)+(X(target)>f.W*0.7?-4:4)}" y="${f.t+11}" text-anchor="${X(target)>f.W*0.7?"end":"start"}">Target</text>`;
  svg+=`<line class="guide" y1="${f.t}" y2="${f.H-f.b}" style="display:none"/></svg>`;
  el.innerHTML=`<div class="legend"><span><i style="background:var(--s1);height:8px"></i>Gain</span><span><i style="background:var(--s2);height:8px"></i>Loss</span><span><i class="dash"></i>Target</span></div>${svg}<div class="readout"></div>`;
  const pHit=vals.filter(v=>v>=target).length/vals.length;
  hookHover(el,x=>{const i=clamp(Math.floor((x-f.l)/bwp),0,B-1);return{x:f.l+(i+.5)*bwp,text:`${fmt(lo+i*w)} to ${fmt(lo+(i+1)*w)}: ${(bins[i]/vals.length*100).toFixed(1)}% of runs`}},
    `Solid bars reach the target. ${P100(pHit)} of runs end at least ${money(target)} up.`);
}
