<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive offline VIII Science CBSE explorer for Class 8 (NCERT Curiosity): stepped animations, virtual labs, practice with worked solutions and certificates.">
<title>VIII Science CBSE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔬</text></svg>">
<style>
:root{
  --bg:#f4f7fb; --panel:#ffffff; --ink:#1d2433; --muted:#5b6578; --line:#e1e6ef;
  --accent:#0f9d8a; --accent2:#5b4bdb; --ok:#14935a; --bad:#d8433b; --warn:#e08a00;
  --c1:#0f9d8a; --c2:#7a3fd1; --c3:#e0465e;
  --radius:16px; --shadow:0 4px 18px rgba(30,40,70,.08);
  --fs:19px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans",sans-serif;font-size:var(--fs);line-height:1.55}
button{font:inherit;cursor:pointer}
input,select{font:inherit}
/* ---------- top bar ---------- */
#topbar{position:sticky;top:0;z-index:50;height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(90deg,#0f9d8a,#2f7fd8 55%,#7a3fd1);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
#topbar .brand{font-weight:800;font-size:22px;letter-spacing:.3px;cursor:pointer;white-space:nowrap}
#topbar .brand small{font-weight:500;opacity:.85;font-size:14px;margin-left:6px}
#topbar .sp{flex:1}
.tbtn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:10px;padding:6px 12px;font-size:15px;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.3)}
/* ---------- layout ---------- */
#layout{display:flex;min-height:calc(100vh - 60px)}
#sidebar{width:270px;flex:none;background:var(--panel);border-right:1px solid var(--line);position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;padding:12px 10px 30px}
#sidebar h4{margin:14px 8px 6px;font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.sitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;color:var(--ink);font-size:15.5px;line-height:1.25}
.sitem:hover{background:#eef3fa}
.sitem.on{background:#e3f4f1;font-weight:700}
.sitem .em{font-size:20px;width:26px;text-align:center}
.sitem .tx{flex:1}
.sitem .bar{display:block;height:4px;border-radius:3px;background:#e6eaf1;margin-top:4px;overflow:hidden}
.sitem .bar i{display:block;height:100%;background:var(--accent)}
.sitem .soon{font-size:11px;color:#fff;background:#9aa4b5;border-radius:6px;padding:1px 6px}
.sitem .cert{font-size:15px}
#main{flex:1;min-width:0;padding:20px 28px 60px}
#phonetabs{display:none}
@media (max-width:900px){
  #sidebar{display:none}
  #main{padding:14px 14px 70px}
  #phonetabs{display:flex;position:sticky;top:60px;z-index:40;overflow-x:auto;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:none}
  #phonetabs::-webkit-scrollbar{display:none}
  .ptab{flex:none;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:15px;white-space:nowrap}
  .ptab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #topbar .brand small{display:none}
  .hero .floaty{display:none}
  .hero h1{font-size:27px}
  .anim .stage{overflow-x:auto}
  #main .anim .stage svg{width:600px;max-width:none;max-height:none}
  .card,.lab,.qcard{padding:16px 14px}
  .chban h1{font-size:22px}
  .chban p{font-size:15px}
  :root{--fs:17px}
}
/* ---------- home ---------- */
.hero{border-radius:22px;padding:26px 28px;color:#fff;background:linear-gradient(120deg,#0f9d8a,#2f7fd8 60%,#7a3fd1);box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{margin:0 0 6px;font-size:34px}
.hero p{margin:4px 0;font-size:18px;opacity:.95;max-width:820px}
.hero .floaty{position:absolute;right:24px;top:14px;font-size:64px;opacity:.9;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(6deg)}}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.howto div{background:var(--panel);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);font-size:16px}
.howto b{display:block;font-size:18px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{background:var(--panel);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);border-top:6px solid var(--cc,#999);cursor:pointer;transition:transform .15s}
.ccard:hover{transform:translateY(-3px)}
.ccard .num{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.ccard h3{margin:4px 0 6px;font-size:20px;line-height:1.25}
.ccard p{margin:0;font-size:15px;color:var(--muted)}
.ccard.soon{opacity:.6;border-top-color:#b8c0cc}
.ccard .badge{display:inline-block;font-size:12px;background:#eef1f6;border-radius:6px;padding:1px 7px;margin-top:8px;color:var(--muted)}
.sech{font-size:24px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
/* ---------- chapter ---------- */
.chban{border-radius:20px;padding:14px 22px;color:#fff;margin-top:0;box-shadow:var(--shadow);background:var(--cc);position:relative;overflow:hidden}
.chban .num{opacity:.85;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-size:14px}
.chban h1{margin:2px 0 2px;font-size:27px;line-height:1.2}
.chban p{margin:0;opacity:.95;font-size:16px;max-width:900px}
.chban .big{position:absolute;right:20px;bottom:-6px;font-size:84px;opacity:.25}
.ctabs{display:flex;gap:8px;margin:12px 0 10px;flex-wrap:wrap}
.ctab{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 16px;font-size:17px;font-weight:600;color:var(--ink)}
.ctab.on{background:var(--cc);border-color:var(--cc);color:#fff}
/* card navigation */
.cnav{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--muted)}
.dot.on{background:var(--cc);border-color:var(--cc);color:#fff}
.dot.seen{border-color:var(--cc);color:var(--cc)}
.nbtn{border:0;background:var(--cc);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700;font-size:16px}
.nbtn.ghost{background:#fff;color:var(--cc);border:2px solid var(--cc)}
.nbtn:disabled{opacity:.35;cursor:default}
.card{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 26px;animation:cardin .35s ease}
@keyframes cardin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card h2{margin:0 0 10px;font-size:26px;display:flex;gap:10px;align-items:center;color:var(--cc)}
.card h3{margin:16px 0 6px;font-size:20px}
.card p{margin:8px 0}
.card ul,.card ol{margin:6px 0;padding-left:26px}
.card li{margin:3px 0}
.kw{background:#fff3c4;border-radius:5px;padding:0 4px;font-weight:700}
.formula{display:inline-block;background:#eef3ff;border:2px dashed #5b7bdb;border-radius:12px;padding:8px 16px;font-weight:700;font-size:21px;margin:6px 0;color:#2b3f99}
table.t{border-collapse:collapse;margin:10px 0;font-size:17px;max-width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:6px 12px;text-align:left;vertical-align:top}
table.t th{background:#f0f4fa}
.tblwrap{overflow-x:auto}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:14px}
.tip{border-radius:12px;padding:10px 14px;font-size:16.5px;border-left:6px solid}
.tip .tl{display:block;font-size:15px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.tip.trick{background:#fff6e0;border-color:#f0a500}
.tip.life{background:#e6f7ef;border-color:#14935a}
.tip.try{background:#e8f0ff;border-color:#3a6fe0}
.tip.know{background:#f6e9ff;border-color:#8b3fd1}
/* ---------- animation box ---------- */
.anim{margin:14px 0 4px;border:2px solid var(--line);border-radius:14px;background:#fbfdff;overflow:hidden}
.anim .stage{width:100%;display:block}
.anim .stage svg{width:100%;height:auto;display:block;max-height:min(460px,58vh)}
.anim .acap{padding:10px 16px;font-size:18px;min-height:52px;background:#f3f7fc;border-top:1px solid var(--line)}
.anim .acap b{color:var(--cc)}
.actl{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.actl button{border:2px solid var(--cc);background:#fff;color:var(--cc);border-radius:10px;padding:5px 12px;font-weight:700;font-size:15px}
.actl button.pp{background:var(--cc);color:#fff}
.actl .stp{font-size:14px;color:var(--muted);margin-left:auto}
.actl .prog{flex:1 1 120px;height:6px;background:#e6eaf1;border-radius:4px;overflow:hidden;min-width:80px}
.actl .prog i{display:block;height:100%;background:var(--cc);transition:width .3s}
/* svg helper classes */
svg text{font-family:"Segoe UI",system-ui,sans-serif}
.pop{animation:pop .55s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
svg .pop{transform-box:fill-box;transform-origin:center}
.fade{animation:fade .7s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.slidel{animation:slidel .7s ease both}
@keyframes slidel{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.slideu{animation:slideu .7s ease both}
@keyframes slideu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
.wig{animation:wig 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes wig{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise 2.2s ease-in infinite}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.drift{animation:drift 2.4s ease-out both}
@keyframes drift{from{transform:translate(0,0);opacity:1}to{transform:translate(var(--dx),var(--dy));opacity:.9}}
.grow{transform-box:fill-box;transform-origin:center;animation:pop .6s ease both}
.swing{transform-box:view-box;animation:swing 1.6s ease-in-out infinite alternate}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.75s}.d6{animation-delay:.9s}.d7{animation-delay:1.05s}.d8{animation-delay:1.2s}
/* ---------- labs ---------- */
.lab{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 24px;animation:cardin .35s ease}
.lab h2{margin:0 0 6px;color:var(--cc);font-size:25px}
.lab .intro{color:var(--muted);margin:0 0 12px}
.ctrls{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:flex-end;margin:10px 0;padding:12px 14px;background:#f5f8fc;border-radius:12px}
.ctrl{display:flex;flex-direction:column;gap:3px;font-size:15.5px;min-width:160px}
.ctrl label{font-weight:700}
.ctrl input[type=range]{width:200px;accent-color:var(--cc)}
.ctrl .val{font-weight:800;color:var(--cc)}
.lbtn{border:0;background:var(--cc);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700;font-size:16px}
.lbtn.ghost{background:#fff;color:var(--cc);border:2px solid var(--cc)}
.seg{display:inline-flex;border:2px solid var(--cc);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--cc);padding:6px 12px;font-weight:700;font-size:15px}
.seg button.on{background:var(--cc);color:#fff}
.labout{margin-top:12px;padding:12px 16px;border-radius:12px;background:#f0f7f5;font-size:17px}
.labout.warn{background:#fff1ec;color:#a3301f}
.labstage{border:2px solid var(--line);border-radius:12px;background:#fbfdff;overflow:hidden}
.labstage svg{display:block;width:100%;height:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.two{grid-template-columns:1fr}}
/* ---------- practice ---------- */
.lvls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.lvl{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;font-size:16px;text-align:left;line-height:1.2}
.lvl small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.lvl.on{border-color:var(--cc);background:var(--cc);color:#fff}
.lvl.on small{color:#fff;opacity:.9}
.qcard{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 26px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;color:var(--muted);font-size:15px}
.qhead .qn{font-weight:800;color:var(--cc);font-size:16px}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdot{width:14px;height:14px;border-radius:50%;background:#e1e6ef;border:0;padding:0}
.qdot.cur{outline:3px solid var(--cc);outline-offset:1px}
.qdot.right{background:var(--ok)}.qdot.wrong{background:var(--bad)}.qdot.done{background:#f0a500}
.qtext{font-size:21px;margin:8px 0 14px;line-height:1.5}
.qtext .fig{margin:8px 0}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-size:18px;color:var(--ink)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:#eef1f6;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
.opt:hover{border-color:var(--cc)}
.opt.sel{border-color:var(--cc);background:#f2f8ff}
.opt.right{border-color:var(--ok);background:#e7f7ee}
.opt.wrong{border-color:var(--bad);background:#fdecea}
.ansrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ansrow input{font-size:22px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:260px;max-width:100%}
.ansrow input:focus{outline:none;border-color:var(--cc)}
.ansrow .unit{font-size:19px;color:var(--muted)}
.qbtns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.qbtns button{border:2px solid var(--cc);background:#fff;color:var(--cc);border-radius:10px;padding:7px 14px;font-weight:700;font-size:16px}
.qbtns button.main{background:var(--cc);color:#fff}
.fb{margin-top:14px;border-radius:12px;padding:12px 16px;font-size:18px;display:none}
.fb.ok{display:block;background:#e7f7ee;color:#0f6b40}
.fb.no{display:block;background:#fdecea;color:#a3301f}
.fb.hint{display:block;background:#fff6e0;color:#7a5200}
.steps{margin-top:12px;background:#f5f8fc;border-radius:12px;padding:12px 16px;display:none}
.steps.show{display:block}
.steps ol{margin:4px 0;padding-left:24px}
.steps li{margin:5px 0;animation:slidel .4s ease both}
.kbd{font-size:13.5px;color:var(--muted);margin-top:12px}
.kbd kbd{background:#eef1f6;border:1px solid #d5dbe5;border-bottom-width:2px;border-radius:5px;padding:0 6px;font-family:inherit;font-size:13px}
.goal{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 14px;font-size:15.5px}
.goal span{background:#fff;border-radius:10px;padding:5px 12px;box-shadow:var(--shadow)}
/* ---------- watch out ---------- */
.wo{display:grid;gap:12px}
.woi{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:800px){.woi{grid-template-columns:1fr}}
.woi .w{background:#fdecea;border-radius:10px;padding:10px 14px}
.woi .r{background:#e7f7ee;border-radius:10px;padding:10px 14px}
.woi .w b{color:#a3301f}.woi .r b{color:#0f6b40}
.woi .why{grid-column:1/-1;font-size:16px;color:var(--muted)}
/* ---------- toast / modal ---------- */
#toast{opacity:0;pointer-events:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#1d2433;color:#fff;padding:12px 22px;border-radius:14px;font-size:17px;z-index:200;transition:transform .35s;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(10,15,30,.55);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#modal .box{background:#fff;border-radius:18px;max-width:560px;width:100%;padding:24px;text-align:center;animation:pop .5s ease}
#modal .box h2{margin:6px 0}
.confetti{position:fixed;top:-20px;font-size:24px;z-index:160;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
/* ---------- certificates ---------- */
.certrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.certc{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;border-left:6px solid var(--cc,#999)}
.certc h4{margin:0 0 6px;font-size:17px}
.certc .pr{font-size:14.5px;color:var(--muted)}
.mini{height:6px;background:#e6eaf1;border-radius:4px;overflow:hidden;margin:4px 0}
.mini i{display:block;height:100%;background:var(--cc,#0f9d8a)}
.certview{background:#fff;margin:14px auto;max-width:1000px;aspect-ratio:297/210;border:14px solid #0f9d8a;outline:3px solid #f0a500;outline-offset:-24px;border-radius:6px;padding:4% 6%;text-align:center;position:relative;display:flex;flex-direction:column;justify-content:center;gap:1.2%}
.certview .t1{font-size:clamp(14px,2.2vw,22px);letter-spacing:3px;text-transform:uppercase;color:#5b6578}
.certview .t2{font-size:clamp(22px,4.2vw,44px);font-weight:800;color:#0f6f63;font-family:Georgia,serif}
.certview .nm{font-size:clamp(22px,4vw,42px);font-family:Georgia,serif;font-style:italic;border-bottom:2px solid #c9ced8;display:inline-block;padding:0 30px;margin:0 auto}
.certview .t3{font-size:clamp(13px,1.9vw,20px)}
.certview .stars{font-size:clamp(20px,3.6vw,38px)}
.certview .foot{display:flex;justify-content:space-between;font-size:clamp(11px,1.5vw,16px);margin-top:3%;color:#5b6578}
.certview .seal{position:absolute;right:7%;bottom:12%;width:12%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#f7c948,#e08a00);display:flex;align-items:center;justify-content:center;font-size:clamp(18px,3.4vw,40px);box-shadow:0 0 0 5px #fff,0 0 0 8px #e08a00}
@media print{
  body *{visibility:hidden}
  #printcert,#printcert *{visibility:visible}
  #printcert{position:fixed;inset:0;margin:0;max-width:none;width:100%;height:100%;aspect-ratio:auto}
  @page{size:A4 landscape;margin:0}
}
.hidden{display:none!important}
:fullscreen{background:var(--bg)}

</style>
</head>
<body>
<header id="topbar"><span class="brand" id="brand">🔬 VIII Science CBSE <small>NCERT Curiosity</small></span><span class="sp"></span>
<button class="tbtn" id="fsb" title="Full screen">⛶ Full screen</button></header>
<nav id="phonetabs"></nav>
<div id="layout"><aside id="sidebar"></aside><main id="main"></main></div>
<div id="toast"></div><div id="modal"></div>
<script>
/* ===================== Science Explorer engine ===================== */
"use strict";
const APPVER = "1.3.1";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ---------- seeded random ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const R = {
  int: (rng, a, b) => a + Math.floor(rng() * (b - a + 1)),
  pick: (rng, arr) => arr[Math.floor(rng() * arr.length)],
  shuffle: (rng, arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  sample: (rng, arr, n) => R.shuffle(rng, arr).slice(0, n)
};
/* number formatting: up to 6 significant decimals, no float junk, Indian-free plain commas */
function fmt(x, dp) {
  if (typeof x !== "number" || !isFinite(x)) return String(x);
  if (dp !== undefined) x = +x.toFixed(dp);
  let s = (+x.toPrecision(12)).toString();
  if (/e/.test(s)) return s;
  const [i, d] = s.split(".");
  const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return d ? ii + "." + d : ii;
}

class Anim {
  constructor(host, def, cc) {
    this.def = def; this.host = host; this.i = 0; this.timer = null; this.cc = cc;
    host.innerHTML = `<div class="anim"><div class="stage"></div><div class="acap"></div>
<div class="actl"><button class="b0" title="Start again">⏮</button><button class="bp" title="Step back (←)">◀ Back</button>
<button class="pp" title="Play / pause (Space)">▶ Play</button><button class="bn" title="Step forward (→)">Next ▶</button>
<div class="prog"><i></i></div><span class="stp"></span></div></div>`;
    this.stage = $(".stage", host); this.cap = $(".acap", host);
    $(".b0", host).onclick = () => { this.stop(); this.go(0); };
    $(".bp", host).onclick = () => { this.stop(); this.prev(); };
    $(".bn", host).onclick = () => { this.stop(); this.next(); };
    $(".pp", host).onclick = () => this.toggle();
    this.go(0);
  }
  get n() { return this.def.steps.length; }
  go(i) {
    this.i = Math.max(0, Math.min(this.n - 1, i));
    const st = this.def.steps[this.i];
    const rng = mulberry32(hashStr(this.def.id + "|" + this.i));
    this.stage.innerHTML = S.wrap(this.def.w, this.def.h, st.draw(rng));
    this.cap.innerHTML = st.cap || "";
    $(".stp", this.host).textContent = `Step ${this.i + 1} of ${this.n}`;
    $(".prog i", this.host).style.width = (100 * (this.i + 1) / this.n) + "%";
    $(".bp", this.host).disabled = this.i === 0;
    $(".bn", this.host).disabled = this.i === this.n - 1;
  }
  next() { if (this.i < this.n - 1) { this.go(this.i + 1); return true; } return false; }
  prev() { if (this.i > 0) { this.go(this.i - 1); return true; } return false; }
  atEnd() { return this.i === this.n - 1; }
  toggle() { this.timer ? this.stop() : this.play(); }
  play() {
    if (this.i === this.n - 1) this.go(0);
    $(".pp", this.host).textContent = "⏸ Pause";
    const tick = () => { if (!this.next()) { this.stop(); return; } this.timer = setTimeout(tick, this.def.speed || 2600); };
    this.timer = setTimeout(tick, this.def.speed || 2600);
  }
  stop() { if (this.timer) clearTimeout(this.timer); this.timer = null; const b = $(".pp", this.host); if (b) b.textContent = "▶ Play"; }
}

/* ===================== Practice engine ===================== */
/* A generator returns {q, type:'mcq'|'num'|'text', opts, ans, tol, unit, hint, steps, accept} */
function bankGen(items) {               // items: [{q, opts:[correct, ...wrong], hint, steps, fixed}]
  return rng => {
    const it = R.pick(rng, items);
    return Object.assign({ type: "mcq" }, it);
  };
}
function normaliseQ(g, rng) {
  const q = Object.assign({}, g);
  if (q.type === "mcq") {
    const correct = q.opts[0];
    q.optsShown = q.display ? q.display.slice() : q.fixed ? q.opts.slice() : R.shuffle(rng, q.opts);
    q.ansIdx = q.optsShown.indexOf(correct);
  }
  if (!q.steps) q.steps = [];
  return q;
}
function makeSet(ch, lvl, seed) {
  const gens = ch.practice[lvl];
  const rng = mulberry32(seed);
  const out = [], seenQ = new Set();
  let guard = 0;
  // cycle through generators so every type appears
  const order = R.shuffle(rng, gens.map((_, i) => i));
  while (out.length < 10 && guard < 400) {
    guard++;
    const gi = order[out.length % order.length];
    const q = normaliseQ(gens[gi](rng), rng);
    if (seenQ.has(q.q) && guard < 300) continue;
    seenQ.add(q.q);
    out.push({ q, state: "new", tries: 0, sel: -1, input: "", hintShown: false, solShown: false, msg: "" });
  }
  return { seed, items: out, i: 0 };
}
function normText(s) {
  return String(s).toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9 ]+/g, " ")
    .replace(/\b(the|a|an)\b/g, " ").replace(/\s+/g, " ").trim();
}
function parseNum(s) {
  s = String(s).replace(/,/g, "").replace(/\s+/g, "").replace(/×10\^?/, "e").replace(/x10\^/, "e");
  const m = s.match(/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?/i);
  if (!m) return NaN;
  return parseFloat(m[0]);
}
function checkAnswer(q, item) {
  if (q.type === "mcq") return item.sel === q.ansIdx;
  if (q.type === "num") {
    const v = parseNum(item.input);
    if (!isFinite(v)) return null;
    const tol = q.tol !== undefined ? q.tol : Math.max(1e-9, Math.abs(q.ans) * 1e-6);
    return Math.abs(v - q.ans) <= tol + 1e-12;
  }
  if (q.type === "text") {
    const v = normText(item.input);
    if (!v) return null;
    return q.accept.some(a => normText(a) === v);
  }
  return false;
}

}

  it.tries++;

    it.state = "right"; it.msg = PRAISE[Math.floor(Math.random() * PRAISE.length)] + (first ? " First try!" : "") + (q.why ? " " + q.why : "");

function certPNG(d) {

function wrapText(x, text, cx, y, maxW, lh) {

document.addEventListener("keydown", e => {
  if ($("#modal").classList.contains("show")) { if (e.key === "Escape") $("#modal").classList.remove("show"); return; }
  const ae = document.activeElement, tag = ae ? ae.tagName : "";
  const inAns = ae && ae.id === "ans";
  const typing = (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") && !inAns;
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (St.view !== "ch") return;
  const ch = chapterByN(St.n);
  if (St.tab === "learn") {
    if (e.key === "ArrowRight") { e.preventDefault(); if (St.anim) St.anim.stop(); if (!(St.anim && St.anim.next())) cardGo(St.card + 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); if (St.anim) St.anim.stop(); if (!(St.anim && St.anim.prev())) cardGo(St.card - 1, true); }
    else if (e.key === " " && St.anim) { e.preventDefault(); St.anim.toggle(); }
  } else if (St.tab === "practice") {
    if (e.key === "ArrowRight") { e.preventDefault(); qMove(ch, 1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); qMove(ch, -1); }
    else if (e.key === "Enter") { e.preventDefault(); submit(ch); }
    else if (!inAns && /^[1-4]$/.test(e.key)) {
      const set = getSet(ch, St.lvl), it = set.items[set.i];
      if (it.q.type === "mcq" && +e.key <= it.q.optsShown.length && it.state !== "right" && it.state !== "shown" && it.state !== "wrong2") { it.sel = +e.key - 1; submit(ch); }
    }
  }
});

    intro: "Choose a slide and lenses. Total magnification = eyepiece × objective. Turn the focus knob until the view is sharp. Notice how the field of view shrinks as you zoom in!",
    init(root, col) {
      root.innerHTML = `<div class="two"><div><div class="labstage" style="background:#1d2433"><svg id="ms" viewBox="0 0 400 400"></svg></div></div><div>
<div class="ctrls"><div class="ctrl"><label>Slide</label><select id="sp" style="padding:6px;border-radius:8px">${Object.entries(SPEC).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("")}</select></div>
<div class="ctrl"><label>Eyepiece</label><div class="seg" id="ey"><button data-v="10" class="on">×10</button><button data-v="15">×15</button></div></div>
<div class="ctrl"><label>Objective</label><div class="seg" id="ob"><button data-v="4" class="on">×4</button><button data-v="10">×10</button><button data-v="40">×40</button><button data-v="100">×100</button></div></div>
<div class="ctrl"><label>Focus knob</label><input type="range" id="fc" min="0" max="100" value="20"></div></div>
<div class="labout" id="mo"></div></div></div>`;
      let sp = "onion", E = 10, O = 4, F = 20, target = 62;
      const svg = $("#ms", root), out = $("#mo", root);
      const draw = () => {
        const M = E * O, fov = 180 / M, k = 340 / fov;         // px per mm
        const blur = Math.abs(F - target) / 7;
        const rng = mulberry32(hashStr(sp));
        let s = "";
        if (sp === "onion") {
          const w = .25 * k, h = .06 * k, n = Math.ceil(340 / Math.max(h, 1)) + 2;
          if (h < 1.5) s += S.r(30, 30, 340, 340, { fill: "#e7d2fb", rx: 0 });
          else for (let r = -n / 2; r < n / 2; r++) for (let c = -Math.ceil(340 / w) - 1; c < Math.ceil(340 / w) + 1; c++) {
            const x = 200 + c * w + (Math.abs(r) % 2 ? w / 2 : 0) - w / 2, y = 200 + r * h - h / 2;
            if (y > 380 || y + h < 20 || x > 380 || x + w < 20) continue;
            s += S.r(x, y, w - Math.max(.5, w * .03), h - Math.max(.5, h * .06), { fill: "#f1e3ff", stroke: "#7a3fd1", sw: Math.max(.6, w / 60), rx: 1 });
            if (h > 8) s += S.c(x + w * .3, y + h / 2, h * .16, { fill: "#6a2fb8" });
          }
        } else if (sp === "cheek") {
          s += S.r(20, 20, 360, 360, { fill: "#fdf6ec", rx: 0 });
          for (let i = 0; i < 40; i++) { const x = 200 + (rng() - .5) * 340 * Math.min(4, fov / .45), y = 200 + (rng() - .5) * 340 * Math.min(4, fov / .45); const px = 200 + (x - 200), r = .03 * k; if (r < .7) { s += S.c(200 + (rng() - .5) * 340, 200 + (rng() - .5) * 340, .8, { fill: "#b88a5a" }); continue; } s += S.e(px, y, r * (1 + rng() * .3), r * (.8 + rng() * .3), { fill: "#fbe1c4", stroke: "#b88a5a", sw: Math.max(.6, r / 15), tr: `rotate(${rng() * 180} ${px} ${y})` }) + S.c(px, y, r * .2, { fill: "#6a2fb8" }); }
        } else if (sp === "pond") {
          s += S.r(20, 20, 360, 360, { fill: "#eaf6f1", rx: 0 });
          const pr = .1 * k;
          s += S.g(S.e(200, 200, pr, pr * .45, { fill: "#cfeedd", stroke: "#2e8b57", sw: Math.max(.8, pr / 25) }) + S.c(200, 200, pr * .15, { fill: "#6a2fb8" }), { tr: "rotate(-20 200 200)" });
          for (let i = 0; i < 12; i++) { const r = .005 * k; s += S.c(40 + rng() * 320, 40 + rng() * 320, Math.max(.8, r), { fill: "#2e9d3a" }); }
        } else if (sp === "yeast") {
          s += S.r(20, 20, 360, 360, { fill: "#fffbea", rx: 0 });
          for (let i = 0; i < 70; i++) { const x = 30 + rng() * 340, y = 30 + rng() * 340, r = .003 * k; s += S.e(x, y, Math.max(.8, r * 1.2), Math.max(.8, r), { fill: "#f2dc9a", stroke: "#b08a2a", sw: Math.max(.3, r / 10) }); if (rng() < .3 && r > 3) s += S.c(x + r * 1.3, y - r * .5, r * .5, { fill: "#f2dc9a", stroke: "#b08a2a", sw: r / 10 }); }
        } else {
          s += S.r(20, 20, 360, 360, { fill: "#fffdf3", rx: 0 });
          for (let i = 0; i < 160; i++) { const x = 30 + rng() * 340, y = 30 + rng() * 340, L = Math.max(1.2, .002 * k); s += S.r(x, y, L, Math.max(.8, L * .35), { fill: "#c2385a", rx: L * .2, tr: `rotate(${rng() * 180} ${x} ${y})` }); }
        }
        svg.innerHTML = `<defs><clipPath id="vw"><circle cx="200" cy="200" r="170"/></clipPath><filter id="bl"><feGaussianBlur stdDeviation="${blur.toFixed(2)}"/></filter></defs>
<rect width="400" height="400" fill="#111"/><g clip-path="url(#vw)"><g filter="url(#bl)">${s}</g></g><circle cx="200" cy="200" r="170" fill="none" stroke="#333" stroke-width="6"/>`;
        const sharp = blur < .8;
        const looks = { onion: .25, cheek: .06, pond: .2, yeast: .006, bact: .002 }[sp] * M;
        out.innerHTML = `<b>Total magnification:</b> ${E} × ${O} = <span style="font-size:24px;font-weight:800;color:${col}">×${M}</span><br>
<b>Field of view:</b> about ${fmt(+fov.toPrecision(2))} mm across<br><b>Real size:</b> ${SPEC[sp].real}<br><b>Looks like:</b> about ${fmt(+looks.toPrecision(2))} mm to your eye<br>
${sharp ? "✅ In focus" : "🔄 Blurry — turn the focus knob"}${sp === "bact" && M < 400 ? "<br>👉 Bacteria are tiny — use ×40 or ×100 objective." : ""}${sp === "bact" && M >= 400 ? "<br>🦠 Even at high power bacteria are just tiny rods. Details need stains and electron microscopes." : ""}${sp === "onion" && M >= 400 ? "<br>🧱 See the cell walls and a nucleus in each cell!" : ""}`;
      };
      const seg = (id, cb) => $$(`#${id} button`, root).forEach(b => b.onclick = () => { $$(`#${id} button`, root).forEach(x => x.classList.remove("on")); b.classList.add("on"); cb(+b.dataset.v); target = 40 + Math.floor(Math.random() * 40); draw(); });
      seg("ey", v => E = v); seg("ob", v => O = v);
      $("#sp", root).onchange = e => { sp = e.target.value; draw(); };
      $("#fc", root).oninput = e => { F = +e.target.value; draw(); };
      draw();
    }

  const labTug = {
    em: "🤼", title: "Tug of war",
    intro: "Set how hard each team pulls. The net force decides which way the rope's middle moves. Make it balanced, then unbalanced!",
    init(root, col) {
      root.innerHTML = `<div class="ctrls"><div class="ctrl"><label>🔵 Left team: <span class="val" id="lv">200</span> N</label><input type="range" id="lf" min="0" max="500" step="50" value="200"></div>
<div class="ctrl"><label>🔴 Right team: <span class="val" id="rv">200</span> N</label><input type="range" id="rf" min="0" max="500" step="50" value="200"></div>
<div class="ctrl"><label>&nbsp;</label><button class="lbtn" id="go">▶ Pull!</button></div></div>
<div class="labstage"><svg id="ts" viewBox="0 0 800 260"></svg></div><div class="labout" id="to"></div>`;
      let Lf = 200, Rf = 200, x = 0, v = 0, raf, running = false;
      const draw = () => {
        const net = Rf - Lf;
        $("#ts", root).innerHTML = S.r(0, 200, 800, 60, { fill: "#8bc34a", rx: 0 }) + S.l(400, 200, 400, 260, { stroke: "#fff", sw: 4, dash: "8 6" }) +

        $("#to", root).innerHTML = `<b>Net force</b> = ${Math.max(Lf, Rf)} − ${Math.min(Lf, Rf)} = <span style="font-size:24px;font-weight:800;color:${col}">${Math.abs(net)} N</span> ${net === 0 ? "— <b>balanced</b> ⚖️ No movement." : net > 0 ? "to the <b>right</b> ➡️ Unbalanced!" : "to the <b>left</b> ⬅️ Unbalanced!"}` +
          (Math.abs(x) >= 120 ? `<br>🏆 ${x > 0 ? "Right" : "Left"} team wins!` : "");
      };
      const tick = () => { const net = Rf - Lf; v = net / 400; x = Math.max(-120, Math.min(120, x + v * 2)); draw(); if (running && Math.abs(x) < 120 && net !== 0) raf = requestAnimationFrame(tick); else { running = false; $("#go", root).textContent = "▶ Pull!"; } };
      $("#lf", root).oninput = e => { Lf = +e.target.value; $("#lv", root).textContent = Lf; draw(); };
      $("#rf", root).oninput = e => { Rf = +e.target.value; $("#rv", root).textContent = Rf; draw(); };
      $("#go", root).onclick = () => { if (Math.abs(x) >= 120) x = 0; running = true; $("#go", root).textContent = "…"; cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); };
      draw();
      return () => cancelAnimationFrame(raf);
    }
  };

  const SURF = { ice: ["❄️ Ice", .03, "#d6ecff"], glass: ["🔷 Glass", .1, "#cfe7f5"], wood: ["🌳 Wood", .3, "#c8934f"], carpet: ["🧶 Carpet", .55, "#d8433b"], sand: ["⏳ Sand", .7, "#e8d18c"] };
  const labSlide = {
    em: "🛷", title: "Friction slide",
    intro: "Give the box a push and see how far it slides on different surfaces. Rougher surface → more friction → shorter slide. Try adding oil!",
    init(root, col) {
      root.innerHTML = `<div class="ctrls"><div class="ctrl"><label>Surface</label><div class="seg" id="sf">${Object.entries(SURF).map(([k, v]) => `<button data-v="${k}" class="${k === "wood" ? "on" : ""}">${v[0]}</button>`).join("")}</div></div>
<div class="ctrl"><label>Push speed: <span class="val" id="pv">3</span> m/s</label><input type="range" id="ps" min="1" max="5" value="3"></div>
<div class="ctrl"><label>Lubricant</label><label><input type="checkbox" id="oil"> 🛢️ Oil on the surface</label></div>
<div class="ctrl"><label>&nbsp;</label><button class="lbtn" id="pu">👉 Push!</button></div></div>
<div class="labstage"><svg id="ss" viewBox="0 0 800 200"></svg></div><div class="labout" id="so"></div>`;
      let sf = "wood", sp = 3, raf, results = {};
      const mu = () => SURF[sf][1] * ($("#oil", root).checked ? .35 : 1);
      let scale = 90;   // px per metre
      const scene = (d) => {
        const step = scale >= 60 ? 1 : scale >= 25 ? 2 : scale >= 12 ? 5 : 10;
        let ticks = ""; for (let m = 0; m * scale <= 740; m += step) ticks += S.l(40 + m * scale, 140, 40 + m * scale, 152, { stroke: "#5b6578", sw: 2 }) + S.t(40 + m * scale, 166, m + " m", { size: 12 });
        const px = (d || 0) * scale;
        $("#ss", root).innerHTML = S.r(0, 140, 800, 60, { fill: SURF[sf][2], rx: 0 }) + ticks +
          S.r(15 + px, 95, 50, 45, { fill: "#2f6fd8", rx: 4 }) + ($("#oil", root).checked ? S.r(0, 138, 800, 4, { fill: "#d4a514", op: .6, rx: 0 }) : "") + (d !== undefined ? S.t(40 + px, 80, fmt(+d.toFixed(2)) + " m", { size: 16, w: 800, fill: col }) : "");
      };
      const out = () => { $("#so", root).innerHTML = `<b>Results so far</b> (push ${sp} m/s):<br>${Object.entries(results).map(([k, v]) => `${k}: <b>${fmt(+v.toFixed(2))} m</b>`).join(" · ") || "—"}<br><small>The box stops because friction opposes its motion. Less friction → it slides further.</small>`; };
      $$("#sf button", root).forEach(b => b.onclick = () => { $$("#sf button", root).forEach(x => x.classList.remove("on")); b.classList.add("on"); sf = b.dataset.v; scene(); });
      $("#ps", root).oninput = e => { sp = +e.target.value; $("#pv", root).textContent = sp; results = {}; out(); };
      $("#oil", root).onchange = () => scene();
      $("#pu", root).onclick = () => {
        cancelAnimationFrame(raf);
        const a = mu() * 9.8, D = sp * sp / (2 * a), T = sp / a, t0 = performance.now();
        scale = Math.min(90, 690 / Math.max(D, .1));
        const step = (now) => { const t = Math.min(T, (now - t0) / 1000 * Math.max(1, T / 3)); const d = sp * t - a * t * t / 2; scene(d); if (t < T) raf = requestAnimationFrame(step); else { results[SURF[sf][0] + ($("#oil", root).checked ? " + oil" : "")] = D; out(); } };
        raf = requestAnimationFrame(step);
      };
      scene(); out();
      return () => cancelAnimationFrame(raf);
    }
  };

  function scatterD(rng, kinds, n) {
    let s = ""; const cells = R.shuffle(rng, Array.from({ length: 12 }, (_, i) => i)).slice(0, n);

    return `<svg viewBox="0 0 300 220" style="width:260px;max-width:100%;background:#fbfdff;border:2px solid #c6cfdd;border-radius:10px">${s}</svg>`;
  }

<p class="kbd" style="font-size:15px">Element = one kind of atom (single or joined) · Compound = identical molecules with different atoms bonded · Mixture = two or more different particles mixed</p>`;

  const labSep = {
    em: "⚗️", title: "Separation challenge",
    intro: "You have a mixture of <b>sand</b>, <b>common salt</b> and <b>iron filings</b>. Choose the steps in order to get all three back separately.",
    init(root, col) {
      const ACT = [["magnet", "🧲 Use a magnet"], ["water", "💧 Add water & stir"], ["filter", "🧻 Filter"], ["evap", "🔥 Evaporate"], ["sieve", "🕳️ Sieve"], ["hand", "✋ Handpick"]];
      root.innerHTML = `<p>${ACT.map(a => `<button class="lbtn ghost" data-a="${a[0]}" style="margin:3px">${a[1]}</button>`).join("")} <button class="lbtn" id="rs">↺ Start again</button></p>
<div class="two"><div class="labstage"><svg id="sp" viewBox="0 0 520 260"></svg></div><div><div class="labout" id="so"></div><ol id="log" style="font-size:16px"></ol></div></div>`;
      let st;
      const reset = () => { st = { mix: ["iron", "sand", "salt"], water: false, dissolved: false, filtrate: false, got: [], steps: 0 }; $("#log", root).innerHTML = ""; msg("Start: everything is mixed together."); draw(); };
      const msg = m => { $("#so", root).innerHTML = m; };
      const log = t => { $("#log", root).insertAdjacentHTML("beforeend", `<li>${t}</li>`); };
      const draw = () => {
        const rng = mulberry32(3); let s = S.r(20, 60, 220, 160, { fill: st.water ? "#cfe8fb" : "#fbfdff", stroke: "#5b7fa8", sw: 4, rx: 10 }) + S.t(130, 40, st.filtrate ? "salt solution" : "mixture", { size: 16, w: 800 });
        st.mix.forEach(k => { for (let i = 0; i < 18; i++) { if (k === "salt" && st.dissolved) continue; s += S.c(40 + rng() * 180, 120 + rng() * 90, k === "salt" ? 4 : 3.5, { fill: { iron: "#4b5563", sand: "#d4a85a", salt: "#fff" }[k], stroke: k === "salt" ? "#9aa4b5" : "none", sw: 1 }); } });
        const bins = [["iron", "iron filings", "#4b5563"], ["sand", "sand", "#d4a85a"], ["salt", "salt", "#fff"]];
        bins.forEach((b, i) => { const x = 280 + i * 80; s += S.r(x, 160, 64, 60, { fill: "#f4f6fb", stroke: st.got.includes(b[0]) ? "#14935a" : "#c6cfdd", sw: 3, rx: 8 }) + S.t(x + 32, 238, b[1], { size: 12, w: 700 }) + (st.got.includes(b[0]) ? S.c(x + 32, 190, 18, { fill: b[2], stroke: "#9aa4b5", sw: 1, cls: "pop" }) + S.t(x + 32, 145, "✅", { size: 18 }) : ""); });
        $("#sp", root).innerHTML = s;
      };
      const act = a => {
        st.steps++;
        const L = ACT.find(x => x[0] === a)[1];
        if (a === "magnet") { if (st.mix.includes("iron")) { st.mix = st.mix.filter(x => x !== "iron"); st.got.push("iron"); msg("🧲 The magnet pulled out the iron filings!"); } else msg("Nothing magnetic left."); }
        else if (a === "water") { if (st.water) msg("Already has water."); else { st.water = true; if (st.mix.includes("salt")) st.dissolved = true; msg("💧 Salt dissolved in the water. Sand " + (st.mix.includes("iron") ? "and iron stay" : "stays") + " undissolved."); } }
        else if (a === "filter") { if (!st.water) msg("🧻 Filtering dry powder does nothing — the grains all stay on the paper. Add water first?"); else { const solids = st.mix.filter(x => x !== "salt"); if (solids.length === 1 && solids[0] === "sand") { st.got.push("sand"); msg("🧻 Sand stays on the filter paper; salt solution passes through."); } else if (solids.length) { msg("🧻 Sand and iron stayed on the paper together — still mixed! (Use the magnet on them.) "); st.got.push("sand"); st.got.push("iron"); st.mix = ["salt"]; st.filtrate = true; draw(); log(L); finish(); return; } st.mix = st.mix.filter(x => x === "salt"); st.filtrate = true; } }
        else if (a === "evap") { if (st.dissolved && st.mix.includes("salt") && st.filtrate) { st.mix = []; st.got.push("salt"); st.water = false; msg("🔥 The water evaporated, leaving salt crystals!"); } else if (st.dissolved && !st.filtrate) { msg("🔥 Evaporating now leaves salt mixed with sand again! Filter first."); st.water = false; st.dissolved = false; } else msg("Nothing dissolved to recover."); }
        else if (a === "sieve") msg("🕳️ Sand and salt grains are about the same size — sieving doesn't separate them.");
        else if (a === "hand") msg("✋ The grains are far too tiny to pick by hand!");
        log(L); draw(); finish();
      };
      const finish = () => { const g = new Set(st.got); if (g.has("iron") && g.has("sand") && g.has("salt")) msg(`🎉 All three separated in ${st.steps} steps! The best order: magnet → add water → filter → evaporate.`); };
      $$("[data-a]", root).forEach(b => b.onclick = () => act(b.dataset.a));
      $("#rs", root).onclick = reset;
      reset();
    }

      { cap: "<b>Density = mass ÷ volume</b>, in g/cm³ (or kg/m³). Water's density is <b>1 g/cm³</b>.", draw: () => S.box(150, 120, 500, 110, "Density = Mass ÷ Volume", { size: 38, stroke: C, color: C, cls: "pop" }) + S.t(400, 300, "unit: g/cm³ · water = 1 g/cm³", { size: 24, w: 700 }) },

  /* ---------- labs ---------- */
  const labDissolve = {
    em: "🥄", title: "Dissolving beaker",
    intro: "100 g of water. Pick a solute and add it 5 g at a time. When some stays undissolved, the solution is saturated. Then heat it — or cool it and watch crystals form!",
    init(root, col) {
      root.innerHTML = `<div class="ctrls"><div class="ctrl"><label>Solute</label><div class="seg" id="sl">${Object.entries(SOL).map(([k, v], i) => `<button data-v="${k}" class="${i ? "" : "on"}">${v[0]}</button>`).join("")}</div></div>

<div class="two"><div class="labstage"><svg id="db" viewBox="0 0 420 300"></svg></div><div class="labout" id="dd"></div></div>`;
      let k = "salt", T = 20, added = 0, fallen = false;

      $("#tt", root).oninput = e => { const old = solAt(k, T); T = +e.target.value; $("#tv", root).textContent = T; fallen = solAt(k, T) < old && added > solAt(k, T); draw(); };
      $$("#sl button", root).forEach(b => b.onclick = () => { $$("#sl button", root).forEach(x => x.classList.remove("on")); b.classList.add("on"); k = b.dataset.v; added = 0; draw(); });

  const OBJS = { cork: ["Cork", .24, "#d9b382"], wood: ["Wood", .65, "#b5793c"], wax: ["Candle wax", .9, "#fff3c4"], ice: ["Ice", .92, "#e8f6ff"], egg: ["Egg", 1.03, "#fff5e1"], plastic: ["Plastic bead (PVC)", 1.38, "#7fb3e6"], aluminium: ["Aluminium", 2.7, "#c0c6cf"], iron: ["Iron", 7.87, "#6b7280"], gold: ["Gold", 19.3, "#f2c94c"] };
  const LIQ = { water: ["💧 Water", 1.0, "#9cc9f0"], salt: ["🧂 Salt water", 1.2, "#bfe0f7"], oil: ["🛢️ Cooking oil", .92, "#f7d774"], kerosene: ["⛽ Kerosene", .8, "#f4f1d0"], honey: ["🍯 Honey", 1.42, "#f2b84b"], mercury: ["⚪ Mercury", 13.6, "#c9ced8"] };
  const labFloat = {

<div class="ctrl"><label>Liquid</label><div class="seg" id="lq">${Object.entries(LIQ).map(([k, v], i) => `<button data-v="${k}" class="${i ? "" : "on"}">${v[0]}</button>`).join("")}</div></div></div>

          S.g(S.r(175, top, size, size, { fill: oc, stroke: "#3a4458", sw: 2, rx: 6 }) + S.t(210, top + size / 2, on.split(" ")[0], { size: 13, w: 800 }), { cls: "slideu" }) + S.l(63, surf, 357, surf, { stroke: "#2f6fd8", sw: 2, dash: "6 6" });
        $("#fo", root).innerHTML = `${on}: <b>${od} g/cm³</b> · ${ln}: <b>${ld} g/cm³</b><br>` + (floats ? `<span style="font-size:22px;font-weight:800;color:#14935a">Floats</span> — about ${Math.round(frac * 100)}% of it is below the surface.` : `<span style="font-size:22px;font-weight:800;color:#d8433b">Sinks</span> — it is denser than the liquid.`) +
          (lq === "mercury" && ob === "iron" ? "<br>😮 Iron floats on mercury — mercury is even denser!" : "") + (ob === "egg" ? "<br>🥚 Compare water and salt water for the egg!" : "");

  const STONES = [["Pebble", 13, 5], ["Marble chip", 27, 10], ["Iron bolt", 63, 8], ["Aluminium block", 54, 20], ["Brass weight", 85, 10], ["Glass marble", 25, 10]];
  const labDisp = {
    em: "📏", title: "Measure density",
    intro: "Weigh an object, then lower it into a measuring cylinder with 50 mL of water. The rise in water level is its volume. Work out its density!",
    init(root, col) {
      root.innerHTML = `<div class="ctrls"><div class="ctrl"><label>Object</label><select id="st" style="padding:6px;border-radius:8px">${STONES.map((s, i) => `<option value="${i}">${s[0]}</option>`).join("")}</select></div>
<div class="ctrl"><label>&nbsp;</label><button class="lbtn" id="dp">⬇️ Lower into water</button></div></div>
<div class="two"><div class="labstage"><svg id="cy" viewBox="0 0 420 320"></svg></div><div><div class="labout" id="co"></div>
<div class="ansrow" style="margin-top:10px"><input id="dg" type="text" inputmode="decimal" placeholder="your density" style="width:180px"><span class="unit">g/cm³</span><button class="lbtn" id="ck">Check</button></div><div id="cr" style="margin-top:8px"></div></div></div>`;

        for (let k = 0; k <= 90; k += 10) s += S.l(150, 300 - k * px, 166, 300 - k * px, { sw: 2 }) + S.t(140, 300 - k * px, k, { size: 12, anchor: "end" });
        s += inW ? S.p("M180,288 l25,-20 l30,6 l10,14 l-35,10 z", { fill: "#8a8f99", stroke: "#3a4458", sw: 2, cls: "slideu" }) : S.p("M300,120 l25,-20 l30,6 l10,14 l-35,10 z", { fill: "#8a8f99", stroke: "#3a4458", sw: 2 }) + S.t(330, 160, `${m} g`, { size: 16, w: 800 });
        $("#cy", root).innerHTML = s;
        $("#co", root).innerHTML = `<b>${nm}</b> · mass on balance: <b>${m} g</b><br>Water level: <b>${lvl} mL</b>${inW ? ` (was 50 mL → volume = ${lvl} − 50 = <b>${v} cm³</b>)` : ""}<br><small>Density = mass ÷ volume</small>`;
      };

      $("#dp", root).onclick = () => { inW = !inW; $("#dp", root).textContent = inW ? "⬆️ Take out" : "⬇️ Lower into water"; draw(); };
      $("#ck", root).onclick = () => { const [nm, m, v] = STONES[i], d = m / v, g = parseNum($("#dg", root).value); $("#cr", root).innerHTML = !isFinite(g) ? "Type a number first." : Math.abs(g - d) < .051 ? `✅ Correct! ${m} ÷ ${v} = <b>${fmt(+d.toFixed(2))} g/cm³</b>` : `❌ Not quite. Lower it in to find the volume, then divide ${m} g by the volume.`; };
      draw();

  };

  /* ---------- practice ---------- */
  const PAIRS = [["Sugar dissolved in water", "Sugar", "Water"], ["Salt dissolved in water", "Salt", "Water"], ["Carbon dioxide in a soda drink", "Carbon dioxide", "Water"], ["Oxygen dissolved in a pond", "Oxygen", "Water"], ["Iodine dissolved in alcohol (tincture of iodine)", "Iodine", "Alcohol"], ["Lemon juice and sugar in water (nimbu pani)", "Lemon juice and sugar", "Water"], ["Copper sulfate crystals in water", "Copper sulfate", "Water"]];
  const gSS = rng => { const [d, sol, sv] = R.pick(rng, PAIRS); const ask = rng() < .5 ? "solute" : "solvent"; const ans = ask === "solute" ? sol : sv;
    return { type: "mcq", q: `<b>${d}</b>. What is the <b>${ask}</b>?`, opts: [ans, ask === "solute" ? sv : sol, "The container", "Air"], steps: [`Solute (dissolved): <b>${sol}</b>. Solvent (does the dissolving): <b>${sv}</b>.`] }; };
  const SOLU = [["Sugar", 1], ["Common salt", 1], ["Sand", 0], ["Chalk powder", 0], ["Sawdust", 0], ["Copper sulfate", 1], ["Glucose", 1], ["Iron filings", 0], ["Baking soda", 1], ["Pebbles", 0]];
  const gSoluble = rng => { const [s, k] = R.pick(rng, SOLU); const A = "Soluble", B = "Insoluble"; return { type: "mcq", q: `Is <b>${s.toLowerCase()}</b> soluble or insoluble in water?`, opts: k ? [A, B] : [B, A], display: [A, B], steps: [`${s} is <b>${k ? "soluble" : "insoluble"}</b> in water.`] }; };
  const gPct = rng => { const [a, b] = R.pick(rng, [[5, 95], [10, 90], [20, 80], [25, 75], [15, 85], [10, 40], [20, 180], [30, 120], [9, 291], [4, 196], [50, 200]]); const p = +(a / (a + b) * 100).toFixed(2);
    return { type: "num", unit: "%", tol: .011, q: `<b>${a} g</b> of salt is dissolved in <b>${b} g</b> of water. What is the concentration as a percentage by mass?`, ans: p, hint: "Mass of solution = solute + water. Then solute ÷ solution × 100.",
      steps: [`Mass of solution = ${a} + ${b} = ${a + b} g`, `% = ${a} ÷ ${a + b} × 100 = <b>${fmt(p)}%</b>`] }; };
  const gDens = rng => { const [nm, m, v] = R.pick(rng, [["A stone", 30, 12], ["A metal block", 81, 30], ["A wooden block", 30, 50], ["A plastic toy", 19, 20], ["A piece of ice", 46, 50], ["A cork", 12, 50], ["A brass weight", 85, 10], ["A glass marble", 25, 10], ["A copper cube", 89, 10]]); const d = +(m / v).toFixed(4);
    return { type: "num", unit: "g/cm³", tol: .006, q: `${nm} has a mass of <b>${m} g</b> and a volume of <b>${v} cm³</b>. What is its density?`, ans: d, hint: "Density = mass ÷ volume.", steps: [`Density = ${m} ÷ ${v}`, `= <b>${fmt(+d.toFixed(2))} g/cm³</b>`, d < 1 ? "Less than 1 → it floats on water." : "More than 1 → it sinks in water."] }; };
  const gFloat = rng => { const o = R.pick(rng, Object.values(OBJS)), l = R.pick(rng, Object.values(LIQ).slice(0, 5)); if (o[1] === l[1]) return gFloat(rng); const fl = o[1] < l[1]; const A = "Floats", B = "Sinks";
    return { type: "mcq", q: `${o[0]} (density <b>${o[1]} g/cm³</b>) is placed in ${l[0].split(" ").slice(1).join(" ").toLowerCase()} (density <b>${l[1]} g/cm³</b>). Will it float or sink?`, opts: fl ? [A, B] : [B, A], display: [A, B], hint: "Less dense than the liquid → floats.", steps: [`${o[1]} ${fl ? "<" : ">"} ${l[1]} → <b>${fl ? "floats" : "sinks"}</b>.`] }; };
  const gSatQ = rng => { const k = R.pick(rng, ["salt", "kno3"]), T = R.pick(rng, [20, 40, 60, 80]), s = solAt(k, T), add = Math.round(s + R.pick(rng, [-10, -5, 5, 10, 20])); const un = Math.max(0, +(add - s).toFixed(1));
    return { type: "num", unit: "g", tol: .051, q: `The solubility of ${SOL[k][0].split(" ").slice(1).join(" ").toLowerCase()} at <b>${T} °C</b> is <b>${fmt(s)} g</b> per 100 g water. You stir <b>${add} g</b> into 100 g of water at ${T} °C. How many grams stay <b>undissolved</b>? (Type 0 if all dissolve.)`, ans: un,
      hint: "Only up to the solubility can dissolve. The rest stays at the bottom.", steps: [`Maximum that dissolves = ${fmt(s)} g`, add > s ? `Undissolved = ${add} − ${fmt(s)} = <b>${fmt(un)} g</b> (saturated)` : `${add} g ≤ ${fmt(s)} g → all dissolves: <b>0 g</b> (unsaturated)`] }; };
  const gCryst = rng => { const [T1, T2] = R.pick(rng, [[60, 20], [80, 20], [80, 40], [100, 40], [60, 40], [100, 60]]); const a = solAt("kno3", T1), b = solAt("kno3", T2), c = +(a - b).toFixed(1);
    return { type: "num", unit: "g", tol: .051, q: `A saturated solution of potassium nitrate in 100 g water at <b>${T1} °C</b> holds <b>${fmt(a)} g</b>. At <b>${T2} °C</b> only <b>${fmt(b)} g</b> can stay dissolved. How many grams of crystals form when it cools from ${T1} °C to ${T2} °C?`, ans: c,

      const P = { r: .81, need: 2, c: 2.264, h: 202, b: .687, m: .117, s: .456, k: .002, p: 5.815, dh: 25.5, tneed: 5.343, tb: .154, tm: .081, ts: .231, tk: .011 };

  const gSph = rng => { const [x, k] = R.pick(rng, SPH); return { type: "mcq", q: `Which sphere does <b>${x.toLowerCase()}</b> belong to?`, opts: [k, ...["Atmosphere", "Hydrosphere", "Geosphere", "Biosphere"].filter(z => z !== k)], display: ["Atmosphere", "Hydrosphere", "Geosphere", "Biosphere"], steps: [`${x} → <b>${k}</b> (${{ Atmosphere: "air", Hydrosphere: "water", Geosphere: "rock and soil", Biosphere: "living things" }[k]}).`] }; };
  const GAS = [["Nitrogen", "about 78%"], ["Oxygen", "about 21%"], ["Carbon dioxide", "about 0.04%"], ["Argon", "about 0.9%"]];
  const gGas = rng => { const [g, p] = R.pick(rng, GAS); return { type: "mcq", q: `How much of dry air is <b>${g.toLowerCase()}</b>?`, opts: [p, ...GAS.map(x => x[1]).filter(x => x !== p)], steps: ["Air: nitrogen ~78%, oxygen ~21%, argon ~0.9%, carbon dioxide ~0.04%.", `${g}: <b>${p}</b>.`] }; };
  const gPlanet = rng => { const facts = [["is the hottest planet because of its thick carbon dioxide atmosphere", "Venus"], ["is cold, red and has only a very thin atmosphere and ice", "Mars"], ["is a gas giant with no solid surface", "Jupiter"], ["has liquid water on its surface and an oxygen-rich atmosphere", "Earth"], ["is closest to the Sun and has almost no atmosphere", "Mercury"]]; const [f, p] = R.pick(rng, facts);
    return { type: "mcq", q: `Which planet ${f}?`, opts: [p, ...Object.keys(PLANETS).filter(x => x !== p).slice(0, 3)], steps: [`<b>${p}</b> ${f}.`] }; };
  const VEG = [["Potato", "Stem tuber (‘eyes’)"], ["Ginger", "Underground stem (rhizome)"], ["Onion", "Bulb"], ["Bryophyllum", "Buds on the leaf edges"], ["Rose", "Stem cuttings"], ["Sugarcane", "Stem cuttings"], ["Sweet potato", "Roots"]];
  const gVeg = rng => { const [p, part] = R.pick(rng, VEG); return { type: "mcq", q: `<b>${p}</b> plants can grow new plants without seeds. From which part?`, opts: [part, ...R.sample(rng, [...new Set(VEG.map(v => v[1]))].filter(x => x !== part), 3)], steps: [`${p}: <b>${part.toLowerCase()}</b> (vegetative propagation).`] }; };
  const gFresh = rng => { const L = R.pick(rng, [100, 200, 400, 1000, 2000]); const k = R.pick(rng, ["fresh", "salt"]); const ans = k === "fresh" ? +(L * .025).toFixed(3) : +(L * .975).toFixed(3);
    return { type: "num", unit: "L", q: `If all Earth's water were <b>${fmt(L)} litres</b>, and <b>2.5%</b> of it is fresh water, how many litres would be <b>${k === "fresh" ? "fresh" : "salty"}</b>?`, ans, hint: "Find 2.5% (×2.5 ÷100); salty = the rest.",
      steps: [`Fresh = 2.5% of ${fmt(L)} = ${fmt(+(L * .025).toFixed(3))} L`].concat(k === "salt" ? [`Salty = ${fmt(L)} − ${fmt(+(L * .025).toFixed(3))} = <b>${fmt(ans)} L</b>`] : [`Answer: <b>${fmt(ans)} L</b>`]) }; };
  const gSurface = rng => { const L = R.pick(rng, [1000, 10000, 100000]); const fresh = L * .025, surf = +(fresh * .01).toFixed(4);
    return { type: "num", unit: "L", q: `Out of <b>${fmt(L)} L</b> of Earth's water, 2.5% is fresh, and only about <b>1%</b> of that fresh water is in lakes and rivers. How many litres is that?`, ans: surf, hint: "First 2.5% of the total, then 1% of that.", steps: [`Fresh = ${fmt(L)} × 2.5 ÷ 100 = ${fmt(fresh)} L`, `Lakes & rivers = 1% of ${fmt(fresh)} = <b>${fmt(surf)} L</b>`] }; };
  const TXT = [
    { q: "Which layer in the atmosphere absorbs most of the Sun's harmful ultraviolet rays?", accept: ["ozone", "ozone layer"], hint: "O₃", steps: ["The <b>ozone layer</b>."] },
    { q: "Trapping of heat by gases like carbon dioxide is called the ______ effect.", accept: ["greenhouse", "greenhouse effect", "green house"], hint: "Like a glass house for plants.", steps: ["The <b>greenhouse</b> effect."] },
    { q: "Growing new plants from stems, roots or leaves (without seeds) is called ______ propagation.", accept: ["vegetative", "vegetative propagation"], hint: "v _ _ _ _ _ _ _ _ _", steps: ["<b>Vegetative</b> propagation."] },
    { q: "The variety of all living things on Earth is called ______.", accept: ["biodiversity", "biological diversity", "bio diversity"], hint: "bio + diversity", steps: ["<b>Biodiversity</b>."] },
    { q: "The name of India's Mars Orbiter Mission (2014) is ______.", accept: ["mangalyaan", "mangalayaan", "mom", "mars orbiter mission"], hint: "Mangal = Mars", steps: ["<b>Mangalyaan</b>."] }
  ].map(x => Object.assign({ type: "text" }, x));
  const pickTxt = rng => Object.assign({}, R.pick(rng, TXT));
  const B_W = [
    { q: "Why can water stay liquid on Earth?", opts: ["Earth is at just the right distance from the Sun", "Earth is the biggest planet", "Earth has no atmosphere", "Earth is closest to the Sun"], steps: ["Right distance → temperatures where water is <b>liquid</b>."] },
    { q: "Which gas do we need to breathe?", opts: ["Oxygen", "Nitrogen", "Argon", "Helium"], steps: ["<b>Oxygen</b> (about 21% of air)."] },
    { q: "About how much of Earth's surface is covered by water?", opts: ["About 71%", "About 10%", "About 50%", "About 99%"], steps: ["Roughly <b>71%</b>."] },
    { q: "Which of these helps protect the Earth?", opts: ["Saving electricity and water", "Burning more plastic", "Cutting forests", "Wasting food"], steps: ["Saving resources reduces pollution and CO₂."] }
  ].map(x => Object.assign({ type: "mcq" }, x));
  const B_P = [
    { q: "Without the greenhouse effect, Earth's average temperature would be about…", opts: ["−18 °C", "15 °C", "100 °C", "465 °C"], steps: ["About <b>−18 °C</b> instead of +15 °C."] },
    { q: "Why is Mars not suitable for life as we know it today?", opts: ["Very thin atmosphere and no liquid water on its surface", "It is too close to the Sun", "It has oceans of acid", "It is made of gas"], steps: ["Thin air, freezing, no liquid surface water."] },
    { q: "Cutting down a forest on a hillside most directly leads to…", opts: ["Soil erosion and floods downstream", "More oxygen in the air", "Cleaner rivers", "Cooler cities"], steps: ["Tree roots hold soil; without them rain washes soil away → muddy rivers, floods."] },
    { q: "Why do offspring from two parents differ from one another?", opts: ["Sexual reproduction mixes features of both parents (variation)", "They eat different food from birth", "Because of the Moon", "They are all identical"], steps: ["Mixing features → <b>variation</b>."] }
  ].map(x => Object.assign({ type: "mcq" }, x));
  const B_C = [
    { q: "Plastic dumped in a river is later found inside fish in the sea. This shows that…", opts: ["Earth's spheres are connected — pollution travels between them", "Plastic is food for fish", "Rivers don't reach the sea", "Plastic dissolves in water"], steps: ["Geosphere/hydrosphere/biosphere are linked — pollution spreads."] },
    { q: "Venus is closer to the Sun than Earth but not by that much. Why is it so much hotter?", opts: ["Its thick CO₂ atmosphere traps heat (runaway greenhouse effect)", "It spins faster", "It has more oceans", "It has a bigger moon"], steps: ["Extreme <b>greenhouse effect</b>."] },
    { q: "Why was it important to ban CFCs?", opts: ["They destroyed the ozone layer that blocks UV rays", "They made fridges noisy", "They added oxygen", "They cooled the planet too much"], steps: ["CFCs thin the <b>ozone layer</b> → more harmful UV."] },
    { q: "Why does vegetative propagation produce plants identical to the parent while seeds give variety?", opts: ["Vegetative propagation uses a part of one parent; seeds come from two parents", "Seeds are bigger", "Vegetative plants grow faster", "Seeds have no parents"], steps: ["One parent → copies; two parents → mixed features."] }
  ].map(x => Object.assign({ type: "mcq" }, x));

  CHAPTERS.push({
    n: 13, em: "🌍", color: C, short: "Our Home: Earth",
    title: "Our Home: Earth, a Unique Life Sustaining Planet",
    blurb: "What makes Earth the only known home of life? Right distance from the Sun, liquid water, a protective atmosphere, connected spheres, and the variety of life itself — and how we can protect it.",
    learn: [
      { em: "☀️", title: "Just the right distance", anim: animZone,
        html: `<p>Earth orbits the Sun at a distance where it is neither too hot nor too cold, so water stays <b>liquid</b> — the <span class="kw">habitable zone</span>. Its average temperature is about <b>15 °C</b>.</p>`,
        tips: [["try", "Open 🔭 Planet comparer in the Lab."]] },
      { em: "💧", title: "Water, water everywhere?", anim: animWater,
        html: `<p>About 71% of Earth's surface is water, but 97.5% is salty. Only a tiny part is easily usable fresh water in lakes and rivers. The <b>water cycle</b> keeps it moving and renewing.</p>`,
        tips: [["try", "Open 💧 If all Earth's water were 100 litres."], ["life", "A dripping tap can waste thousands of litres a year. Report and fix leaks!"]] },
      { em: "🌬️", title: "The atmosphere and the greenhouse effect", anim: animAir,
        html: `<p>Air is ~78% nitrogen, ~21% oxygen, plus small amounts of argon, carbon dioxide and water vapour. The natural <span class="kw">greenhouse effect</span> keeps Earth warm; extra CO₂ from burning fuels causes <span class="kw">global warming</span>.</p>`,
        tips: [["try", "Open 🌡️ Greenhouse dial in the Lab."]] },
      { em: "🛡️", title: "Earth's shields", anim: animShield,
        html: `<ul><li>The <b>ozone layer</b> absorbs most harmful UV rays.</li><li>The <b>magnetic field</b> deflects charged particles from the Sun.</li><li>The atmosphere also burns up most small meteors.</li></ul>`,
        tips: [["know", "Shooting stars are tiny bits of space rock burning up as they rush into our atmosphere."]] },
      { em: "🔄", title: "Four connected spheres", anim: animSpheres,
        html: `<p>Earth's <b>atmosphere</b> (air), <b>hydrosphere</b> (water), <b>geosphere</b> (rocks and soil) and <b>biosphere</b> (life) constantly interact. Changes in one — like deforestation or pollution — affect all the others.</p>`,
        tips: [["trick", "<b>A H G B</b>: Air, H₂O, Ground, Bio."]] },
      { em: "🌸", title: "Life goes on: reproduction and biodiversity", anim: animLife,
        html: `<p>Living things reproduce. Sexual reproduction (e.g. flowers → seeds) produces <b>variation</b>; <b>vegetative propagation</b> grows new plants from stems, roots or leaves. The resulting <span class="kw">biodiversity</span> helps ecosystems stay healthy.</p>`,
        tips: [["try", "Place a Bryophyllum (Patharchatta) leaf on moist soil and watch tiny plants grow from its edges."]] },
      { em: "🔴", title: "Is there life elsewhere?", anim: animMars,
        html: `<p>Scientists search for water, energy, the right chemicals and protective atmospheres on other worlds. Mars has a thin atmosphere and no liquid surface water today. So far, Earth is the only known home of life.</p>`,
        tips: [["know", "India's Mangalyaan reached Mars orbit on its first try in 2014 — the first Asian nation to do so."]] },
      { em: "💚", title: "Caring for our home", anim: animCare,
        html: `<p>Climate change, pollution, resource depletion and habitat destruction threaten Earth's balance. Using resources wisely, reducing waste and protecting ecosystems keep our planet life-sustaining.</p>`,
        tips: [["life", "Make a family ‘Earth pledge’: three things you'll do this month to save water, energy or plastic."]] }
    ],
    labs: [labPlanets, labGreen, labBucket],
    practice: {
      warm: [gSph, gGas, bankGen(B_W), pickTxt],
      prac: [gPlanet, gVeg, gFresh, bankGen(B_P), gSph, pickTxt],
      chal: [gSurface, bankGen(B_C), gPlanet, gFresh]
    },
    watch: [
      ["“The greenhouse effect is bad.”", "The <b>natural</b> greenhouse effect keeps Earth warm enough for life; the problem is <b>too much</b> of it.", ""],
      ["“Earth has plenty of fresh water, since 71% is covered by water.”", "Only about <b>2.5%</b> is fresh, and most of that is ice or underground.", ""],
      ["“The ozone hole causes global warming.”", "They are different problems: ozone loss lets in <b>UV</b>; global warming comes from <b>greenhouse gases</b>.", ""],
      ["“Air is mostly oxygen.”", "Air is mostly <b>nitrogen</b> (~78%); oxygen is ~21%.", ""],
      ["“Mars is like Earth, just red.”", "Mars is very cold, with thin air and no liquid surface water.", ""],
      ["“What happens to the oceans doesn't affect land.”", "The four spheres are <b>connected</b> — changes spread.", ""]
    ]
  });
})();
