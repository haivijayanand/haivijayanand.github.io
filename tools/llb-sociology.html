.fc .front{background:var(--card)}
.fc .front b{font-family:Georgia,serif;font-size:30px;color:var(--accent)}
.fc .back{background:var(--hl);transform:rotateY(180deg);font-size:18px}
.fc small{color:var(--muted);margin-top:10px;font-size:13px}
.q{margin:12px 0;padding:12px 16px;background:var(--bg);border:1px solid var(--rule);border-radius:10px}
.q .qt{font-weight:600;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.opt{text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;color:var(--ink)}

.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.score{font-size:22px;font-family:Georgia,serif}

.casecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px}

.foot{margin-top:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule);padding-top:10px}

@media print{#top,#side,.noprint{display:none!important}#main{padding:0}.card{break-inside:avoid;box-shadow:none}}
</style>

<script>
"use strict";
/* ============================================================
   DATA
   ============================================================ */
const UNITS = [
 {id:"u1", n:1, title:"Sociology as a Discipline", short:"Meaning, origin, scope, methods, the sociological imagination, and sociology of law."},
 {id:"u2", n:2, title:"Basic Concepts", short:"Society, community, institutions; status and role; norms, culture, socialisation, groups."},
 {id:"u3", n:3, title:"Sociological Thinkers", short:"Comte, Spencer, Durkheim, Marx, Weber, Parsons, Merton and Indian sociologists."},
 {id:"u4", n:4, title:"Social Institutions", short:"Family, kinship, marriage, religion, education, economy and the state."},
 {id:"u5", n:5, title:"Social Inequality", short:"Stratification, caste, class, gender, social mobility and the Constitution."},
 {id:"u6", n:6, title:"Social Control and Change", short:"Norms and law as control, deviance, theories and factors of change, law as a tool of change."}
];
const EXTRAS = [
 {id:"thinkers", ic:"🧠", title:"Thinkers"},
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"glossary", ic:"📖", title:"Glossary"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"refs", ic:"📚", title:"References"}
];

const FLASH = [
 ["Sociology","The systematic study of society, social relationships, groups and institutions."],
 ["Auguste Comte","Coined the word 'sociology' (1838); law of three stages; father of positivism."],
 ["Sociological imagination","C. Wright Mills: seeing the link between private troubles and public issues, biography and history."],
 ["Society","A web of social relationships (MacIver); a large group sharing territory and culture."],
 ["Community","A group living in a particular area with a sense of 'we-feeling'."],
 ["Association","A group organised to pursue specific interests, e.g. a trade union or bar association."],
 ["Institution","An established set of norms and procedures meeting a basic need – family, marriage, law."],
 ["Ascribed status","Status given by birth – sex, caste, family."],
 ["Achieved status","Status earned by effort – advocate, judge, doctor."],
 ["Role conflict","Clash between the demands of two or more roles a person holds."],
 ["Folkways","Everyday customs whose breach brings mild disapproval (Sumner)."],
 ["Mores","Norms with strong moral force; their breach brings severe sanction."],
 ["Cultural lag","Non-material culture lags behind material change (Ogburn)."],
 ["Socialisation","The lifelong process by which a person learns the norms and values of society."],
 ["Looking-glass self","Cooley: we see ourselves as we think others see us."],
 ["Primary group","Small, intimate, face-to-face group – family, close friends (Cooley)."],
 ["Reference group","A group whose standards a person uses to judge themselves."],
 ["Social fact","Durkheim: ways of acting and thinking external to the individual and exercising constraint."],
 ["Mechanical solidarity","Cohesion based on similarity in simple societies; repressive law."],
 ["Organic solidarity","Cohesion based on interdependence from division of labour; restitutive law."],
 ["Anomie","Normlessness – breakdown of regulating norms (Durkheim; Merton)."],
 ["Verstehen","Weber: interpretive understanding of the meaning actors give to their actions."],
 ["Legal-rational authority","Weber: authority based on rules and office, as in modern bureaucracies and courts."],
 ["Base and superstructure","Marx: the economic base shapes the superstructure of law, politics and ideology."],
 ["Manifest and latent functions","Merton: intended and recognised versus unintended and unrecognised consequences."],
 ["Sanskritisation","Srinivas: a lower caste adopting customs of higher castes to rise in the hierarchy."],
 ["Dominant caste","Srinivas: a caste numerically strong, economically and politically powerful in a village."],
 ["Endogamy","Marrying within one's own group (caste, community)."],
 ["Exogamy","Marrying outside a group (gotra, clan)."],
 ["Social stratification","Division of society into layers ranked by wealth, power or prestige."],
 ["Social mobility","Movement of individuals or groups between positions in the social hierarchy."],
 ["Social control","Means by which society secures conformity to its norms (term by E.A. Ross)."]
];

const GLOSSARY = [
 ["Positivism","Studying society by the scientific methods of natural science.","Comte."],
 ["Participant observation","Researcher lives with and takes part in the group studied.","Used in village studies, e.g. Srinivas in Rampura."],
 ["Survey","Questionnaires or interviews on a large sample.","Census, National Family Health Survey."],
 ["Case study","In-depth study of a single unit – person, village, institution.","A single court's working."],
 ["Ideal type","Weber: an analytical model stressing typical features, used for comparison.","Bureaucracy."],
 ["Social structure","Patterned arrangement of statuses, roles, groups and institutions.","The skeleton of society."],
 ["Role set","Merton: the set of roles attached to one status.","A judge relates to lawyers, litigants, staff."],
 ["Value","Shared idea of what is good or desirable.","Equality, justice."],
 ["Sanction","Reward or punishment that enforces a norm.","Formal (fine) or informal (gossip)."],
 ["Ethnocentrism","Judging other cultures by the standards of one's own.","Opposite of cultural relativism."],
 ["Kinship","Social relationships based on blood (consanguinity) or marriage (affinity).","Defines who may marry whom."],
 ["Patriarchy","Social system in which men hold primary power.","Studied in gender and law."],
 ["Polygyny / polyandry","One man with several wives / one woman with several husbands.","Both forms of polygamy."],
 ["Caste","Hereditary, endogamous group with a traditional occupation and ritual rank.","Ghurye's six features."],
 ["Class","Group sharing a similar economic position.","Marx: relation to means of production."],
 ["Status group","Weber: group sharing social honour and lifestyle.","Distinct from class and party."],
 ["Intergenerational mobility","Change in position between parents and children.","A farmer's daughter becomes a judge."],
 ["Deviance","Behaviour that violates social norms.","Not always crime."],
 ["Westernisation","Srinivas: changes due to British rule – technology, institutions, values.","English education, courts."],
 ["Modernisation","Shift to rational, scientific, industrial, urban ways of life.","Broader than westernisation."],
 ["Secularisation","Declining influence of religion in public life.","Separation of law and religion."],
 ["Social engineering","Roscoe Pound: law as a tool to balance competing interests.","Sociological jurisprudence."],
 ["Repressive law","Durkheim: punitive law in mechanical solidarity.","Criminal law."],
 ["Restitutive law","Durkheim: law restoring relations in organic solidarity.","Contract, commercial, administrative law."],
 ["Alienation","Marx: workers estranged from product, process, others and themselves under capitalism.","Factory labour."]
];

const THINKERS = [
 {n:"Auguste Comte (1798–1857)", t:"Father of sociology; positivism", p:"Coined 'sociology'. Law of three stages: theological, metaphysical and positive (scientific). Social statics (order) and social dynamics (progress).", w:"Course in Positive Philosophy (1830–42)"},
 {n:"Herbert Spencer (1820–1903)", t:"Social evolution; organic analogy", p:"Society is like an organism evolving from simple to complex. Coined 'survival of the fittest' – used, controversially, to justify inequality (social Darwinism).", w:"Principles of Sociology (1876–96)"},
 {n:"Émile Durkheim (1858–1917)", t:"Social facts; solidarity; law", p:"Sociology studies social facts as things. Mechanical solidarity (likeness, repressive law) and organic solidarity (division of labour, restitutive law). Suicide rates vary with social integration and regulation.", w:"The Division of Labour in Society (1893); The Rules of Sociological Method (1895); Suicide (1897)"},
 {n:"Karl Marx (1818–1883)", t:"Conflict; class; historical materialism", p:"History is the history of class struggle. The economic base shapes the superstructure, including law and the State. Under capitalism the bourgeoisie own the means of production; workers are alienated.", w:"The Communist Manifesto (1848, with Engels); Capital (1867)"},
 {n:"Max Weber (1864–1920)", t:"Social action; authority; bureaucracy", p:"Sociology interprets meaningful social action (verstehen). Three types of authority: traditional, charismatic, legal-rational. Class, status and party as dimensions of inequality. Protestant ethic and the spirit of capitalism.", w:"The Protestant Ethic and the Spirit of Capitalism (1905); Economy and Society"},
 {n:"Talcott Parsons (1902–1979)", t:"Structural functionalism", p:"Every social system must meet four functional needs – adaptation, goal attainment, integration, latency (AGIL). Law is a mechanism of integration.", w:"The Social System (1951)"},
 {n:"Robert K. Merton (1910–2003)", t:"Middle-range theory; functions; anomie", p:"Manifest and latent functions; dysfunctions. Strain theory: a gap between cultural goals and legitimate means produces conformity, innovation, ritualism, retreatism or rebellion. Role set; reference groups.", w:"Social Theory and Social Structure (1949)"},

      if(onAns) onAns(i===ans);
    }));
  });
}

/* ============================================================
   STEP ANIMATION ENGINE  (P play · S step · X pause)
   ============================================================ */
function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}
function animBox(id,title,svg){

}

   + `<div class="row"><span class="score" style="font-size:17px" id="${id}Score"></span><button class="btn sm sec" id="${id}Again">Try again</button></div>`;
  let got=0, ans=0;
  $$(".q",box).forEach(q=>$$("[data-k]",q).forEach(b=>b.onclick=()=>{

    $$("[data-k]",q).forEach(x=>{ x.disabled=true; if(x.dataset.k===it[1]) x.classList.add("right"); });

}

 <h4>Why it arose</h4><p>The French Revolution (1789) and the Industrial Revolution broke old orders – feudalism, guilds, village life – and thinkers asked how social order and change are possible. Sociology was their answer: study society scientifically.</p>

const DK_STEPS = [

VIEWS.u3 = { html(){ return unitHead(3)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">Sociology has three classic perspectives: <b>functionalism</b> (society as a system in balance – Durkheim, Parsons, Merton), <b>conflict</b> (society shaped by struggle over resources – Marx), and <b>interpretive / interactionist</b> (society built from meaningful action – Weber, Mead).</div>
 <table class="t"><tr><th>Thinker</th><th>Big idea</th><th>Law connection</th></tr>
 <tr><td><b>Comte</b></td><td>Positivism; three stages of thought</td><td>Scientific study of society can guide reform</td></tr>
 <tr><td><b>Spencer</b></td><td>Society as an evolving organism</td><td>Opposed state intervention – a view later rejected by welfare law</td></tr>
 <tr><td><b>Durkheim</b></td><td>Social facts; solidarity; anomie</td><td>Type of law reflects type of solidarity; crime is 'normal' and reaffirms norms</td></tr>
 <tr><td><b>Marx</b></td><td>Class struggle; base and superstructure</td><td>Law protects the interests of the ruling class</td></tr>
 <tr><td><b>Weber</b></td><td>Social action; authority; bureaucracy</td><td>Modern law is legal-rational: rules, offices, procedure</td></tr>
 <tr><td><b>Parsons</b></td><td>AGIL functional needs</td><td>Law integrates the social system</td></tr>
 <tr><td><b>Merton</b></td><td>Manifest and latent functions; strain</td><td>Laws have unintended effects; crime from blocked opportunity</td></tr></table>
 <h4>Indian sociologists</h4><ul><li><b>G.S. Ghurye</b> – six features of caste (Unit 5).</li><li><b>M.N. Srinivas</b> – Sanskritisation, westernisation, dominant caste.</li><li><b>B.R. Ambedkar</b> – caste as graded inequality maintained by endogamy; <i>Annihilation of Caste</i> (1936).</li><li>Others to note: D.P. Mukerji, A.R. Desai (Marxist view of Indian nationalism), Irawati Karve (kinship), Yogendra Singh (modernisation).</li></ul>
 <p>See the <a href="#thinkers" data-go="thinkers">Thinkers</a> page for each one's main works.</p></div>
</div><div>
 ${animBox("dkAnim","Durkheim: from mechanical to organic solidarity",DK_SVG)}
 <div class="card lab"><h3>Who said it?</h3><div id="lab3"></div></div>
</div></div>`+unitFoot(3)+footer(); },
 init(){
  anim = makeAnim("#dkAnim", DK_STEPS, i=>{ for(let k=0;k<5;k++) document.getElementById("dk"+k).classList.toggle("show",k<=i); });
  choiceLab("#lab3",U3_ITEMS,{COM:"Comte",SPE:"Spencer",DUR:"Durkheim",MAR:"Marx",WEB:"Weber",SRI:"Srinivas",AMB:"Ambedkar"});

 }};

const U4_ITEMS = [
 ["A community requires members to marry only within the community.","END","Endogamy."],
 ["Marriage between members of the same gotra is forbidden.","EXO","Exogamy."],

VIEWS.u4 = { html(){ return unitHead(4)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Social institutions</b> are lasting patterns of norms and roles that meet basic needs: family and marriage (reproduction, care), religion (meaning), education (knowledge), economy (livelihood) and the State (order).</div>
 <h4>Family</h4><p>A group based on marriage and kinship that shares a home and cares for children. Types by structure: <b>nuclear</b> and <b>joint</b> (extended); by descent: <b>patrilineal</b> and <b>matrilineal</b>; by residence: patrilocal, matrilocal, neolocal. In India the joint family is shrinking with urbanisation and migration, but kin ties remain strong – often as a 'functionally joint' family.</p>
 <h4>Kinship</h4><p>Relationships by blood (<b>consanguineal</b>) and by marriage (<b>affinal</b>). Kinship rules decide whom one may marry, who inherits, and who has authority.</p>
 <h4>Marriage</h4><table class="t"><tr><td><b>Monogamy</b></td><td>One spouse – the legal rule for most Indians</td></tr><tr><td><b>Polygamy</b></td><td>Polygyny (several wives), polyandry (several husbands)</td></tr><tr><td><b>Endogamy</b></td><td>Marry within the group – caste, community</td></tr><tr><td><b>Exogamy</b></td><td>Marry outside the group – gotra, sapinda, clan</td></tr><tr><td><b>Hypergamy / hypogamy</b></td><td>Woman marries into a higher / lower group</td></tr></table>
 <h4>Religion</h4><p>Durkheim: a unified system of beliefs and practices relating to <b>sacred</b> things, uniting followers into a moral community. Weber: the Protestant ethic encouraged rational capitalism. Marx: religion is 'the opium of the people'.</p>
 <h4>Education, economy and State</h4><p>Education transmits culture and sorts people into occupations (functionalist view) or reproduces inequality (conflict view). The economy organises production and exchange. The State holds the monopoly of legitimate force within a territory (Weber).</p></div>
</div><div>
 <div class="card">${lawLink("Family law is where sociology and law meet most: the Hindu Marriage Act, 1955 made monogamy compulsory and allowed divorce; the Special Marriage Act, 1954 allows inter-faith marriage; the Hindu Succession (Amendment) Act, 2005 made daughters coparceners; the Protection of Women from Domestic Violence Act, 2005 recognised violence inside the home.")}</div>
 <div class="card lab"><h3>Name the rule</h3><div id="lab4"></div></div>
</div></div>`+unitFoot(4)+footer(); },
 init(){ choiceLab("#lab4",U4_ITEMS,{END:"Endogamy",EXO:"Exogamy",PGY:"Polygyny",PAN:"Polyandry",MAT:"Matrilineal"}); miniQuiz(4); }};

const U5_ITEMS = [
 ["A daily-wage worker's daughter becomes a civil judge.","UPI","Upward intergenerational mobility – compared with the parent's position."],
 ["A bank clerk is promoted to branch manager during his career.","UPA","Upward intragenerational mobility – within one person's lifetime."],
 ["A teacher leaves one school to teach at another of similar standing.","HOR","Horizontal mobility – change of position without change of rank."],
 ["A shopkeeper's business fails and he becomes a hired helper.","DOW","Downward mobility."],
 ["A caste group adopts vegetarianism and Vedic rituals to claim higher rank.","SAN","Group mobility through Sanskritisation (Srinivas)."]
];
VIEWS.u5 = { html(){ return unitHead(5)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key"><b>Social stratification</b> ranks people into layers by wealth, power and prestige. It is <b>social</b> (not natural), <b>universal</b> but varying, lasts across <b>generations</b>, and is supported by <b>beliefs</b> that make it seem fair.</div>
 <h4>Systems of stratification</h4><p>Slavery · estates (feudal Europe) · <b>caste</b> (closed, birth-based) · <b>class</b> (open, economic).</p>
 <h4>Caste – Ghurye's six features</h4><ol><li>Segmental division of society</li><li>Hierarchy</li><li>Restrictions on feeding and social intercourse</li><li>Civil and religious disabilities and privileges</li><li>Lack of unrestricted choice of occupation</li><li>Restrictions on marriage (endogamy)</li></ol>
 <p>Distinguish <b>varna</b> (four-fold textual scheme) from <b>jati</b> (thousands of local endogamous groups). Ambedkar showed how endogamy sustains caste.</p>
 <h4>Class</h4><p><b>Marx</b>: class depends on relation to the means of production – bourgeoisie and proletariat. <b>Weber</b>: three dimensions – <b>class</b> (market situation), <b>status</b> (social honour), <b>party</b> (political power).</p>
 <h4>Gender</h4><p>Sex is biological; gender is socially constructed. <b>Patriarchy</b> organises power in favour of men – in property, work, family and law. Feminist sociology asks how law has reflected and challenged it.</p>
 <h4>Social mobility</h4><p>Vertical (upward, downward) and horizontal; intergenerational and intragenerational; individual and group. Education, migration, reservation and urbanisation have increased mobility in India.</p></div>
</div><div>
 <div class="card">${lawLink("The Constitution attacks inequality directly: Article 14 (equality), 15 (no discrimination; special provisions for women, children, backward classes, SCs and STs), 16 (equality in public employment and reservations), 17 (abolition of untouchability), 46 (promotion of educational and economic interests of weaker sections). Statutes: Protection of Civil Rights Act, 1955; Scheduled Castes and Scheduled Tribes (Prevention of Atrocities) Act, 1989. Key cases: <i>Indra Sawhney v Union of India</i> (1992) on OBC reservation and the 50% ceiling; <i>NALSA v Union of India</i> (2014) recognising transgender persons.")}</div>
 <div class="card lab"><h3>What kind of mobility?</h3><div id="lab5"></div></div>
</div></div>`+unitFoot(5)+footer(); },
 init(){ choiceLab("#lab5",U5_ITEMS,{UPI:"Upward, intergenerational",UPA:"Upward, intragenerational",HOR:"Horizontal",DOW:"Downward",SAN:"Group mobility"}); miniQuiz(5); }};

VIEWS.u6 = { html(){ return unitHead(6)+`
<div class="two"><div>
 <div class="card"><h3>Social control</h3><div class="key"><b>Social control</b> is the set of means by which society secures conformity to its norms (E.A. Ross, 1901). It may be <b>informal</b> – family, gossip, religion, public opinion – or <b>formal</b> – law, police, courts, administration.</div>
 <p>Roscoe Pound saw law as <b>social engineering</b>: a tool to balance individual, public and social interests with the least friction.</p>
 <h4>Deviance</h4><p>Behaviour that breaks social norms; crime is deviance that breaks the law. Durkheim: some crime is normal and even useful – punishing it reaffirms shared values. <b>Anomie</b> arises when norms break down. Merton's <b>strain theory</b>: when society stresses goals (wealth) but blocks legitimate means, people adapt in five ways (see lab).</p></div>
 <div class="card"><h3>Social change</h3>
 <p><b>Theories</b>: evolutionary (Comte, Spencer – simple to complex), cyclical (Spengler, Sorokin – rise and decline), conflict (Marx – change through class struggle), functionalist (Parsons – gradual adjustment).</p>
 <p><b>Factors</b>: technology, demography, economy, ideas and values, social movements, and law.</p>
 <p><b>Processes in India</b> (Srinivas and others): <b>Sanskritisation</b>, <b>westernisation</b>, <b>modernisation</b>, <b>secularisation</b>, <b>urbanisation</b>, <b>globalisation</b>.</p>
 ${lawLink("Does law follow society or lead it? Both. Some laws codify changes already under way (Hindu Marriage Act); others try to push change against custom (sati, untouchability, dowry). Laws that run far ahead of public opinion are often weakly enforced – a gap between law in books and law in action.")}</div>
</div><div>
 ${animBox("lcAnim","Law and social change in India",`<div id="lcList" style="display:grid;gap:6px"></div>`)}
 <div class="card lab"><h3>Merton's five adaptations</h3><div id="lab6"></div></div>
</div></div>`+unitFoot(6)+footer(); },
 init(){
  $("#lcList").innerHTML = LAWCH.map((e,i)=>`<div id="lc${i}" style="display:grid;grid-template-columns:56px 1fr;gap:10px;padding:6px 10px;border-radius:8px;border:1px solid var(--rule);background:var(--card);opacity:.12;transition:opacity .4s,background .4s"><b style="color:var(--accent);font-family:Georgia,serif">${e[0]}</b><span><b>${e[1]}</b> – <span style="color:var(--muted)">${e[2]}</span></span></div>`).join("");
  anim = makeAnim("#lcAnim", LAWCH.map(e=>`<b>${e[0]} · ${e[1]}.</b> ${e[2]}`), i=>LAWCH.forEach((_,k)=>{ const r=document.getElementById("lc"+k); r.style.opacity = k<=i?1:.12; r.style.background = k===i?"var(--hl)":"var(--card)"; }));
  choiceLab("#lab6",U6_ITEMS,{CON:"Conformity",INN:"Innovation",RIT:"Ritualism",RET:"Retreatism",REB:"Rebellion"});
  miniQuiz(6);
 }};

    const u=+$("#qU").value; const pool = u? QUIZ.filter(q=>q[0]===u) : QUIZ; const set = shuffle(pool).slice(0, u?pool.length:10);
    let got=0, ans=0; $("#qBox").hidden=false; $("#qList").innerHTML=set.map((q,i)=>qHTML(q,"q"+i)).join(""); $("#qScore").textContent=`0 / ${set.length}`;
    bindQ($("#qList"), ok=>{ ans++; if(ok) got++; $("#qScore").textContent=`${got} / ${set.length}` + (ans===set.length?`  ·  ${Math.round(100*got/set.length)}%`:"");
      if(ans===set.length){ const pct=Math.round(100*got/set.length), k=String(u); if(S.d.best[k]==null||pct>S.d.best[k]){S.d.best[k]=pct; S.save();} best(); toast(pct>=80?"Excellent!":pct>=50?"Good – revise the ones you missed.":"Revisit the units and try again."); } });
  };
 }};


/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
