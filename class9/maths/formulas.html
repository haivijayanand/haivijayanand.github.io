<!DOCTYPE html>
<!--
TOOL:    class9_maths_formula_sheets
FAMILY:  CBSE_REVISION / Class 9 Maths (Ganita Manjari)
VERSION: 1.1.0
DATE:    2026-11-22
CHAT:    CBSE Revision - Class 9 Maths full build
CHANGES: 1.1.0 - first release: one A4 formula sheet per chapter (14), view one or all, print / save as PDF, works offline
-->
<html lang="en">
<head>
<meta charset="utf-8">
<script type="module" src="/assets/js/site-progress.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 9 Maths One-page Formula Sheets (Ganita Manjari)</title>
<meta name="description" content="One-page formula sheets for all 14 chapters of NCERT Class 9 Mathematics, Ganita Manjari Parts I and II (2026-27). Print or save as PDF.">
<style>
:root{--ink:#0f172a;--muted:#475569;--line:#cbd5e1;--blue:#1d4ed8;--blue2:#e3ebff;--orange:#c2410c;--orange2:#ffeadb;--purple:#6d28d9;--purple2:#f0e8ff;--bg:#eef1f7}
body.dark{--bg:#0b1020}
*{box-sizing:border-box}
body{-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:8px 16px;background:#0f1b3d;color:#fff}
.bar b{font-size:17px;margin-right:auto}
.bar select,.bar button,.bar a{font:inherit;font-size:14px;border-radius:8px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;padding:5px 11px;cursor:pointer;text-decoration:none}
.bar select option{color:#000}
.wrap{display:flex;flex-wrap:wrap;gap:22px;justify-content:center;padding:22px}
.sheet{width:210mm;min-height:297mm;background:#fff;color:#0f172a;padding:11mm 12mm 9mm;box-shadow:0 2px 14px rgba(0,0,0,.15);display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:12px;border-bottom:3px solid #0f1b3d;padding-bottom:6px}
.badge{width:44px;height:44px;border-radius:50%;background:#c2410c;color:#fff;font:700 22px Cambria,Georgia,serif;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.hd h1{font:700 23px Cambria,Georgia,serif;margin:0;line-height:1.2}
.hd .sub{color:var(--muted);font-size:12.5px}
.one{margin:8px 0 10px;font-size:14px;color:#1e293b;background:#f1f5fb;border-radius:6px;padding:6px 9px}
.cols{column-count:2;column-gap:7mm;flex:1}
.grp{break-inside:avoid;margin:0 0 10px}
  .grp h2{font:700 14.5px "Segoe UI",Arial;color:#fff;background:var(--blue);margin:0 0 3px;padding:3px 8px;border-radius:5px}
.grp:nth-child(2n) h2{background:var(--purple)}
.grp:last-child h2{background:#0f766e}
table{border-collapse:collapse;width:100%}
td{border-bottom:1px solid #e2e8f0;padding:4px 5px;vertical-align:top;font-size:14.8px}
td.l{color:var(--muted);width:38%}
td.f{font-family:"Cambria Math",Cambria,"Times New Roman",serif;font-size:16.4px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.1;margin:0 2px}
.fr>span:first-child{border-bottom:1.2px solid currentColor;padding:0 2px}
.foot{display:grid;grid-template-columns:1.4fr 1fr;gap:6mm;margin-top:6px}
.box{border-radius:7px;padding:7px 10px;font-size:14px}
.box h3{margin:0 0 3px;font-size:14.5px}
.ex{background:var(--orange2);border:1px solid #f6c9a8}.ex h3{color:var(--orange)}
.rem{background:var(--purple2);border:1px solid #dccbfa}.rem h3{color:var(--purple)}
.box ol,.box ul{margin:0;padding-left:16px}
.box li{margin:2px 0}
.ex .ans{font-family:"Cambria Math",Cambria,serif;color:#1e293b}
.pf{display:flex;justify-content:space-between;color:#64748b;font-size:10px;margin-top:6px;border-top:1px solid #e2e8f0;padding-top:3px}
@media print{
  body{background:#fff}.bar{display:none}.wrap{display:block;padding:0}
  .sheet{box-shadow:none;width:auto;min-height:0;height:277mm;padding:0;page-break-after:always;overflow:hidden}
  .sheet:last-child{page-break-after:auto}
  .sheet.hide{display:none}
  @page{size:A4;margin:10mm}
}
.sheet.hide{display:none}
</style>
</head>
<body>
<div class="bar">
  <b>Class 9 Maths · One-page formula sheets</b>
  <select id="sel"><option value="all">All 14 chapters</option></select>
  <button id="pr" title="Print, or choose Save as PDF">🖨 Print / Save PDF</button>
  <a href="index.html">← Back to the kit</a>
  <button id="fs" title="Full screen (F)">Full screen (F)</button>
</div>
<div class="wrap" id="wrap"></div>
<script src="assets/core.js"></script>
<script src="chapters/ch01.js"></script><script src="chapters/ch02.js"></script><script src="chapters/ch03.js"></script><script src="chapters/ch04.js"></script>
<script src="chapters/ch05.js"></script><script src="chapters/ch06.js"></script><script src="chapters/ch07.js"></script><script src="chapters/ch08.js"></script>
<script src="chapters/ch09.js"></script><script src="chapters/ch10.js"></script><script src="chapters/ch11.js"></script><script src="chapters/ch12.js"></script>
<script src="chapters/ch13.js"></script><script src="chapters/ch14.js"></script>
<script src="chapters/formulas.js"></script>
<script>
(function () {
  const wrap = document.getElementById('wrap'), sel = document.getElementById('sel');
  G9.chapters.forEach(c => {
    const S = G9.FS[c.no]; if (!S) return;
    sel.insertAdjacentHTML('beforeend', `<option value="${c.no}">Ch ${c.no}: ${c.title}</option>`);
    const allG = S.groups.concat(c.revise.terms ? [['Key terms', c.revise.terms]] : []);
    const groups = allG.map(([h, rows]) => `<div class="grp"><h2>${h}</h2><table>${rows.map(r => `<tr><td class="l">${r[0]}</td><td class="f">${r[1]}</td></tr>`).join('')}</table></div>`).join('');
    wrap.insertAdjacentHTML('beforeend', `<section class="sheet" data-ch="${c.no}">
      <div class="hd"><div class="badge">${c.no}</div><div><h1>${c.title}</h1><div class="sub">Class IX Mathematics · Ganita Manjari ${c.part} · Chapter ${c.no} · One-page formula sheet</div></div></div>
      <div class="one">${c.revise.oneLine}</div>
      <div class="cols">${groups}</div>
      <div class="foot">
        <div class="box ex"><h3>Worked examples</h3><ol>${S.ex.map(e => `<li>${e[0]}: <span class="ans">${e[1]}</span></li>`).join('')}</ol></div>
        <div class="box rem"><h3>Remember</h3><ul>${S.rem.map(r => `<li>${r}</li>`).join('')}</ul></div>
      </div>
      <div class="pf"><span>Class 9 Maths revision kit · haivijayanand.github.io/class9/</span><span>Use with the NCERT textbook</span></div>
    </section>`);
  });
  const show = (v) => { document.querySelectorAll('.sheet').forEach(s => s.classList.toggle('hide', v !== 'all' && s.dataset.ch !== v)); sel.value = v; if (location.hash.slice(1) !== v) history.replaceState(null, '', '#' + v); };
  sel.onchange = () => show(sel.value);
  const h = location.hash.slice(1); show(G9.FS[h] ? h : 'all');
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (G9.FS[v] || v === 'all') show(v); });
  document.getElementById('pr').onclick = () => window.print();
  const fs = document.getElementById('fs'), tf = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); };
  fs.onclick = tf;
  document.addEventListener('keydown', e => { if (e.target.tagName === 'SELECT' || e.ctrlKey || e.metaKey || e.altKey) return; if (e.key.toLowerCase() === 'f') tf(); });
})();
</script>
</body>
</html>
