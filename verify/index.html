<!DOCTYPE html>
<!--
TOOL: verify/index.html — public certificate verification by ID (haivijayanand.github.io)
FAMILY: site-progress
VERSION: 1.0.0
DATE: 2026-11-16
CHAT: Login, progress & certificates on GitHub Pages with Firebase
CHANGES: 1.0.0 — first release: look up a certificate ID from ?id= or the form, show holder, course, score and date
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verify a certificate · haivijayanand.github.io</title>
<style>
  body{margin:0;font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#14213d;background:#f6f8fb}
  header{background:#14213d;color:#fff;padding:14px 24px}header a{color:#fff;text-decoration:none;font-weight:600}
  main{max-width:720px;margin:32px auto;padding:0 20px}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input{flex:1;min-width:220px;font:600 16px ui-monospace,Consolas,monospace;padding:10px 12px;border:1px solid #c9d1de;border-radius:8px;text-transform:uppercase}
  button{cursor:pointer;border:0;background:#1f5fbf;color:#fff;border-radius:8px;padding:10px 18px;font:600 15px system-ui,Arial,sans-serif}
  .res{margin-top:22px;background:#fff;border:1px solid #d9dee8;border-radius:12px;padding:20px}
  .ok{border-left:6px solid #1f5fbf}.bad{border-left:6px solid #e08a00}
  .ok h2{color:#1f5fbf;margin:0 0 8px}.bad h2{color:#9a4a00;margin:0 0 8px}
  dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0}dt{color:#5b6475}dd{margin:0;font-weight:600}
</style>
</head>
<body>
<header><a href="/">← haivijayanand.github.io</a></header>
<main>
  <h1>Verify a certificate</h1>
  <p>Enter the certificate ID printed at the bottom of the certificate.</p>
  <form id="f"><input id="id" placeholder="HVA-2026-XXXXXX" autocomplete="off" required><button>Verify</button></form>
  <div id="out"></div>
</main>
<script type="module">
import SP from '/assets/js/site-progress.js';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const out = document.getElementById('out'), inp = document.getElementById('id');
async function check(id) {
  id = id.trim().toUpperCase(); if (!id) return;
  out.innerHTML = '<div class="res">Checking…</div>';
  history.replaceState(null, '', '?id=' + encodeURIComponent(id));
  try {
    const c = await SP.verifyCertificate(id);
    out.innerHTML = c ? `<div class="res ok"><h2>✓ Valid certificate</h2><dl>
      <dt>Issued to</dt><dd>${esc(c.holderName)}</dd><dt>For</dt><dd>${esc(c.title)}</dd>
      ${c.score ? `<dt>Score</dt><dd>${esc(c.score)}</dd>` : ''}<dt>Issued on</dt><dd>${esc(SP.certDate(c))}</dd>
      <dt>Certificate ID</dt><dd>${esc(c.certId)}</dd></dl></div>`
      : `<div class="res bad"><h2>No certificate found</h2>No certificate with ID <b>${esc(id)}</b> was issued on this site. Check the ID for typing mistakes.</div>`;
  } catch (e) { out.innerHTML = `<div class="res bad"><h2>Could not check right now</h2>${esc(e.message)}</div>`; }
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); check(inp.value); };
const q = new URLSearchParams(location.search).get('id');
if (q) { inp.value = q; check(q); }
</script>
</body>
</html>
