<script>
"use strict";
/* ============================================================
   DATA
   ============================================================ */
const UNITS = [
 {id:"u1", n:1, title:"Language and Law", short:"Why precision matters; legal vocabulary; ambiguity; plain English."},
 {id:"u2", n:2, title:"Grammar and Usage", short:"Sentence patterns, concord, tense, voice, reported speech, common errors."},
 {id:"u3", n:3, title:"Vocabulary", short:"Word building, one-word substitutes, idioms, commonly confused words."},
 {id:"u4", n:4, title:"Reading and Comprehension", short:"Reading strategies, a classic speech, answering comprehension questions."},
 {id:"u5", n:5, title:"Business and Formal Writing", short:"Précis, formal letters, e-mails, memos, notices, reports and minutes."}
];
const EXTRAS = [
 {id:"practice", ic:"🔁", title:"Practice drill"},
 {id:"flash", ic:"🃏", title:"Flashcards"},
 {id:"glossary", ic:"⚖️", title:"Legal vocabulary"},
 {id:"quiz", ic:"✅", title:"Quiz"},
 {id:"refs", ic:"📚", title:"References"}
];

const FLASH = [
 ["Subject–verb concord","The verb agrees with its subject in number: 'The list of cases is long.'"],
 ["Active voice","The subject does the action: 'The court dismissed the appeal.'"],
 ["Passive voice","The subject receives the action: 'The appeal was dismissed by the court.'"],
 ["SVOC","Subject–Verb–Object–Complement: 'The court declared the law void.'"],
 ["SVA","Subject–Verb–Adverbial: 'The files are in the cupboard.'"],
 ["Reported speech","Reporting someone's words without quoting them; tenses usually shift back."],
 ["Principal / principle","Principal: chief, or a sum of money, or the main person. Principle: a rule or belief."],
 ["Affect / effect","Affect is usually a verb (to influence); effect is usually a noun (result)."],
 ["Counsel / council","Counsel: a lawyer or advice. Council: an elected or advisory body."],
 ["Stationary / stationery","Stationary: not moving. Stationery: paper, pens."],
 ["Complement / compliment","Complement: completes. Compliment: praise."],
 ["Practice / practise","In British and Indian usage, practice is the noun and practise the verb."],
 ["Adverse / averse","Adverse: harmful (adverse effect). Averse: unwilling (averse to risk)."],
 ["Precede / proceed","Precede: come before. Proceed: go on."],
 ["Prescribe / proscribe","Prescribe: lay down. Proscribe: forbid."],
 ["Eminent / imminent","Eminent: distinguished. Imminent: about to happen."],
 ["Ensure / insure","Ensure: make certain. Insure: protect with an insurance policy."],
 ["One-word: one who cannot pay debts","Insolvent."],
 ["One-word: a person who makes a will","Testator (woman: testatrix)."],
 ["One-word: a law that applies to past events","Retrospective (retroactive) law."],
 ["One-word: a speech without preparation","Extempore."],
 ["Précis","A summary in your own words, about one-third the length of the original, with a title."],
 ["SQ3R","A reading method: Survey, Question, Read, Recite, Review."],
 ["Skimming","Reading quickly for the general idea."],
 ["Scanning","Reading quickly to find a specific fact – a date, name or section."],
 ["Yours faithfully","Closing for a letter that begins 'Dear Sir/Madam'."],
 ["Yours sincerely","Closing for a letter that begins with the person's name."],
 ["Memo","A short internal message within an organisation: To, From, Date, Subject."],
 ["Minutes","The official written record of a meeting: attendance, decisions, action points."],
 ["Plain English","Writing clearly: short sentences, everyday words, active voice, no needless jargon."],
 ["Doublet","A legal pair saying one thing twice: 'null and void', 'cease and desist'."],
 ["Ambiguity","A word or sentence that can be read in more than one way – the enemy of good drafting."]
];

/* Legal vocabulary: term, meaning, origin/example */
const GLOSSARY = [
 ["Affidavit","A written statement of facts sworn on oath.","Latin: 'he has declared on oath'."],
 ["Appellant / respondent","The party who appeals / the party who answers the appeal.","Appellant v Respondent in the cause title."],
 ["Petitioner","One who files a petition (e.g. a writ petition).","Petitioner v State."],
 ["Plaintiff / defendant","The party who files a civil suit / the party sued.","Old French: plaintif (complaining)."],
 ["Accused","A person charged with an offence.","Criminal law."],
 ["Adjournment","Postponing a hearing to another date.","'Adjourned to 12 December.'"],
 ["Bail","Release of an accused pending trial, on security.","Old French: baillier (to deliver)."],
 ["Cause of action","The facts that give a right to sue.","Must be stated in a plaint."],
 ["Decree","Formal expression of a civil court's decision on the rights of parties.","CPC, Section 2(2)."],
 ["Estoppel","A rule stopping a person from denying what they earlier said or did.","Old French: estoupail (stopper)."],
 ["Injunction","Court order to do or not to do something.","Temporary or permanent."],
 ["Jurisdiction","The authority of a court to hear a matter.","Territorial, pecuniary, subject-matter."],
 ["Lis pendens","A pending suit.","Transfer of Property Act, Section 52."],
 ["Locus standi","The right to approach a court.","Wider in public interest litigation."],
 ["Mens rea","Guilty mind.","With actus reus (guilty act)."],
 ["Obiter dictum","Remark by the way; not binding.","Contrast ratio decidendi."],
 ["Plaint","The written statement of claim in a civil suit.","Filed by the plaintiff."],
 ["Prima facie","At first sight.","'A prima facie case.'"],
 ["Pro bono","Free legal work for the public good.","Latin: 'for the good'."],
 ["Quash","To set aside or cancel (an order, FIR).","'The High Court quashed the FIR.'"],
 ["Sub judice","Under judicial consideration – not to be discussed in a way that prejudices the case.","Contempt of court risk."],
 ["Suo motu","On its own motion.","Court acts without a petition."],
 ["Tort","A civil wrong.","Old French: 'wrong'."],
 ["Ultra vires","Beyond the powers.","Void action or rule."],
 ["Vakalatnama","Document authorising an advocate to act for a client.","Filed in Indian courts."],
 ["Writ","A formal written order of a court.","Habeas corpus, mandamus, certiorari, prohibition, quo warranto."]
];

/* Sentence patterns */
const PATTERNS = [
 ["The judge smiled.","SV","Subject + intransitive verb."],
 ["The clerk filed the petition.","SVO","'the petition' is the object."],
 ["The witness seemed nervous.","SVC","'nervous' completes the subject (subject complement)."],
 ["The files are in the cupboard.","SVA","'in the cupboard' is an obligatory adverbial."],
 ["The client gave the lawyer a cheque.","SVOO","Indirect object 'the lawyer', direct object 'a cheque'."],
 ["The court declared the law void.","SVOC","'void' completes the object (object complement)."],
 ["She put the brief on the table.","SVOA","'on the table' is needed to complete the meaning."]
];

/* Error pairs: [correct, wrong, rule] */
const ERRORS = [
 ["The list of cases is long.","The list of cases are long.","The subject is 'list' (singular), not 'cases'."],
 ["Neither the judge nor the lawyers were present.","Neither the judge nor the lawyers was present.","With neither…nor, the verb agrees with the nearer subject ('lawyers')."],
 ["Each of the students has a moot court problem.","Each of the students have a moot court problem.","'Each' is singular."],
 ["The committee has submitted its report.","The committee have submitted its report.","Treat a collective noun as singular when it acts as one unit (and keep 'its' consistent)."],
 ["She has been studying law since 2025.","She is studying law since 2025.","Use the present perfect continuous with 'since' for an action continuing to now."],
 ["If I were the judge, I would grant bail.","If I was the judge, I would grant bail.","Use 'were' in hypothetical conditions."],
 ["He gave me some useful information.","He gave me some useful informations.","'Information' is uncountable."],
 ["Please discuss the issue with your advocate.","Please discuss about the issue with your advocate.","'Discuss' takes a direct object – no 'about'."],
 ["The accused denied the charge.","The accused denied the charge against him falsely and wrongly.","Avoid redundancy: 'falsely and wrongly' adds nothing."],
 ["One of my friends is a lawyer.","One of my friend is a lawyer.","'One of' takes a plural noun and a singular verb."],
 ["She is an honest witness.","She is a honest witness.","Use 'an' before a vowel sound – 'honest' begins with a silent h."],
 ["He is a university student.","He is an university student.","'University' begins with a 'yoo' consonant sound – use 'a'."],
 ["The court was adjourned till Monday.","The court was adjourned till on Monday.","No 'on' after 'till'."],
 ["Hardly had the hearing begun when the power failed.","Hardly the hearing had begun when the power failed.","After 'hardly' at the start, invert subject and auxiliary."],
 ["I look forward to hearing from you.","I look forward to hear from you.","'Look forward to' is followed by the -ing form."],
 ["The data show a clear trend.","The datas show a clear trend.","'Data' is already plural (singular use is also accepted); never 'datas'."],

      if(onAns) onAns(i===ans);
    }));
  });

/* ============================================================
   STEP ANIMATION ENGINE  (P play · S step · X pause)
   ============================================================ */
function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}

}

function choiceLab(sel, items, opts){
  const box=$(sel), id=sel.slice(1);
  box.innerHTML = items.map((it,i)=>`<div class="q" data-i="${i}"><div class="qt">${i+1}. ${esc(it[0])}</div><div class="row">${Object.entries(opts).map(([k,v])=>`<button class="btn sm sec" data-k="${k}">${v}</button>`).join("")}</div><div class="out"></div></div>`).join("")
   + `<div class="row"><span class="score" style="font-size:17px" id="${id}Score"></span><button class="btn sm sec" id="${id}Again">Try again</button></div>`;
  let got=0, ans=0;
  $$(".q",box).forEach(q=>$$("[data-k]",q).forEach(b=>b.onclick=()=>{
    const it=items[+q.dataset.i]; if(q.dataset.answered) return; q.dataset.answered=1; ans++;
    const ok=b.dataset.k===it[1]; if(ok) got++;
    $$("[data-k]",q).forEach(x=>{ x.disabled=true; if(x.dataset.k===it[1]) x.classList.add("right"); });

    $(".out",q).innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Correct.":"Answer: "+opts[it[1]]+"."} ${esc(it[2])}</div>`;
    $("#"+id+"Score").textContent=`${got} / ${ans} correct` + (ans===items.length?" – all done":"");
  }));

}

function pairLab(sel, items, n, prompt){
  const box=$(sel), id=sel.slice(1), set=shuffle(items).slice(0,n);
  box.innerHTML = set.map((it,i)=>{ const opts=shuffle([[it[1],1],[it[2],0]]); return `<div class="q" data-i="${i}"><div class="qt">${i+1}. ${esc(prompt?prompt(it):it[0])}</div><div class="opts">${opts.map(o=>`<button class="opt" data-r="${o[1]}">${esc(o[0])}</button>`).join("")}</div><div class="out"></div></div>`; }).join("")
   + `<div class="row"><span class="score" style="font-size:17px" id="${id}Score"></span><button class="btn sm sec" id="${id}Again">New set</button></div>`;
  let got=0, ans=0;
  $$(".q",box).forEach(q=>$$(".opt",q).forEach(b=>b.onclick=()=>{
    if(q.dataset.answered) return; q.dataset.answered=1; ans++; const ok=b.dataset.r==="1"; if(ok) got++;
    $$(".opt",q).forEach(x=>{ x.disabled=true; if(x.dataset.r==="1") x.classList.add("right"); }); if(!ok) b.classList.add("wrong");
    $(".out",q).innerHTML=`<div class="fb ${ok?"ok":"bad"}">${ok?"Correct.":"Not quite."} ${esc(set[+q.dataset.i][3])}</div>`;
    $("#"+id+"Score").textContent=`${got} / ${ans} correct`+(ans===set.length?" – all done":"");
  }));
  $("#"+id+"Again").onclick=()=>pairLab(sel,items,n,prompt);
}

<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">In law, <b>words create rights and duties</b>. A misplaced comma or an unclear pronoun can change who pays, who is liable, or whether a law applies. Good legal English is <b>precise, clear and concise</b>.</div>
 <h4>Where legal English comes from</h4><p>English law grew in three languages: Old English (everyday words – <i>will, deed, land</i>), <b>Law French</b> after 1066 (<i>plaintiff, tort, estoppel, mortgage, verdict</i>), and <b>Latin</b> (<i>mens rea, prima facie, ultra vires</i>). Indian courts inherited this vocabulary and added Indian terms (<i>vakalatnama, panchnama, karta</i>). Under <b>Article 348(1)</b> of the Constitution, proceedings in the Supreme Court and High Courts are in English unless Parliament provides otherwise.</p>
 <h4>Ambiguity</h4><ul><li><b>Lexical</b> – a word with two meanings: 'The bank was closed' (river bank or a bank?).</li><li><b>Syntactic</b> – structure allows two readings: 'The judge saw the lawyer with the binoculars.'</li><li><b>Pronoun reference</b> – 'The tenant told the landlord that he must repair the roof.' Who is 'he'?</li><li><b>Scope</b> – 'Women and children over 12 may enter.' Does 'over 12' apply to women too?</li></ul>
 <h4>Plain English</h4><p>Modern drafting favours plain English: short sentences (around 20 words), everyday words, active voice, verbs instead of nouns ('decide', not 'take a decision'), 'must' for duties, and no needless doublets ('null and void', 'cease and desist', 'each and every').</p></div>

VIEWS.u2 = { html(){ return unitHead(2)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">Grammar is not decoration – in law it carries meaning. Master five things first: <b>sentence patterns</b>, <b>concord</b>, <b>tense</b>, <b>voice</b> and <b>reported speech</b>.</div>
 <h4>Seven basic sentence patterns</h4><table class="t">${PATTERNS.map(p=>`<tr><td><b>${p[1]}</b></td><td>${esc(p[0])}</td></tr>`).join("")}</table>
 <p style="font-size:14px;color:var(--muted)">S subject · V verb · O object · C complement · A adverbial.</p>
 <h4>Concord – rules that trap students</h4><ul><li>The verb agrees with the head noun: 'The <b>list</b> of cases <b>is</b>…'.</li><li>'Each', 'every', 'either', 'neither', 'one of' + singular verb.</li><li>'Neither…nor', 'either…or': the verb agrees with the nearer subject.</li><li>'Along with', 'as well as', 'together with' do not make a subject plural.</li><li>Uncountable nouns – information, advice, evidence, furniture – take a singular verb and no plural -s.</li></ul>
 <h4>Tense – the tricky ones</h4><table class="t"><tr><td>Present perfect</td><td>The court <b>has reserved</b> judgment. (past action, present relevance)</td></tr><tr><td>Present perfect continuous</td><td>She <b>has been practising</b> since 2020.</td></tr><tr><td>Past perfect</td><td>The accused <b>had left</b> before the police arrived.</td></tr><tr><td>Hypothetical</td><td>If I <b>were</b> the judge, I <b>would</b> grant bail.</td></tr></table>
 <h4>Reported speech</h4><p>He said, "I <b>am</b> innocent." → He said that he <b>was</b> innocent. Tenses shift back (am → was, will → would, has → had), pronouns and time words change (now → then, today → that day, here → there). Questions become statements: She asked, "Where is the file?" → She asked where the file was.</p>
 <h4>Articles</h4><p>'A' before consonant sounds, 'an' before vowel sounds: <i>an honest witness, a university, an MLA, a one-time fee</i>.</p></div>
</div><div>
 ${animBox("vAnim","Active to passive, step by step",`<style>#vStage .chip{font-size:19px;padding:3px 12px}</style><div id="vStage" style="font-size:20px;min-height:110px;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font-family:Georgia,serif"></div>`)}
 <div class="card lab"><h3>Name the pattern</h3><div id="patLab"></div></div>
 <div class="card lab"><h3>Spot the correct sentence</h3><div id="errLab"></div></div>
</div></div>`+unitFoot(2)+footer(); },

  anim = makeAnim("#vAnim", VOICE_STEPS.map(s=>s[1]), i=>{ $("#vStage").innerHTML = i<0 ? "<span style='color:var(--muted);font-size:16px;font-family:Segoe UI'>Press P or S to begin</span>" : VOICE_STEPS[i][0]; });

 }};

  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
</body>
