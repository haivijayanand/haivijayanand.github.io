   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="135.3276" y="39.463587" transform="rotate(-0 135.3276 39.463587)">Grid connection</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 33.604583)">flexible load, on-site storage,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 44.647098)">grid-enhancing technologies</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="135.3276" y="81.967587" transform="rotate(-0 135.3276 81.967587)">Power chain</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 76.108583)">fewer conversions, 800 V DC,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 87.151098)">high-efficiency UPS and PSUs</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #111111" x="135.3276" y="124.471587" transform="rotate(-0 135.3276 124.471587)">Cooling plant</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 118.612583)">liquid cooling, warmer water,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 129.655098)">variable speed, AI control</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="135.3276" y="166.975587" transform="rotate(-0 135.3276 166.975587)">IT hardware</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 161.116583)">newer chips, retire idle servers,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 172.159098)">raise utilisation</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #ffffff" x="135.3276" y="209.479587" transform="rotate(-0 135.3276 209.479587)">Software and models</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 203.620583)">smaller models, batching,</text>
    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'" transform="translate(274.4928 214.663098)">scheduling, caching</text>
   </g>
   <g id="text_11">
    <text style="font-style: italic; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle" x="125.73" y="258.229284" transform="rotate(-0 125.73 258.229284)">Useful work: computation delivered to users</text>
   </g>
