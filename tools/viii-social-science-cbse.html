<!DOCTYPE html>
<!--
TOOL:    VIII Social Science CBSE ( / NCERT Exploring Society: India and Beyond, Parts 1 and 2)
FAMILY:  learning-explorers
VERSION: 2.0.1
DATE:    2026-10-04
CHAT:    Social Science Explorer for Class 8 (claude.ai, 2026-10-04)
CHANGES: 2.0.1 - page heading, title and certificates renamed to VIII Social Science CBSE for the public site
         2.0.0 - Added Part 2 (8 chapters: World Geography, Long Road to Independence, Indian Architecture, Judiciary, Citizenship, Population, Urban Landscape, Cultural Currents); app now covers both parts with a champion award per part
STATUS:  Part 1 (7 chapters) and Part 2 (8 chapters) ready
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Interactive offline VIII Social Science CBSE explorer for Class 8 (NCERT Exploring Society: India and Beyond, Parts 1 and 2): stepped animations, map and timeline labs, practice with worked solutions and certificates.">
<title>VIII Social Science CBSE</title>
<style>
:root{
  --bg:#f7f2e9; --panel:#fffdf8; --ink:#2b2420; --muted:#6f655c; --line:#e3d8c6;
  --accent:#b5452e; --accent2:#2f6f73; --gold:#c8962a; --good:#2e7d4f; --bad:#b33a3a;
  --soft:#f0e6d6; --hl:#fff1c9; --shadow:0 2px 10px rgba(60,40,20,.08);
  --svgbg:#fffaf0; --svgink:#2b2420; --svgmuted:#7a6f63;
  --serif: Georgia, "Times New Roman", serif;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", Arial, sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1c1915; --panel:#26221d; --ink:#eee6da; --muted:#b0a493; --line:#3d362d;
  --accent:#e0775c; --accent2:#6cb7ba; --gold:#e3b55a; --good:#5cc08a; --bad:#e57373;
  --soft:#302a23; --hl:#4a3f22; --shadow:0 2px 10px rgba(0,0,0,.35);
  --svgbg:#221f1a; --svgink:#eee6da; --svgmuted:#a99d8c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1915; --panel:#26221d; --ink:#eee6da; --muted:#b0a493; --line:#3d362d;
    --accent:#e0775c; --accent2:#6cb7ba; --gold:#e3b55a; --good:#5cc08a; --bad:#e57373;
    --soft:#302a23; --hl:#4a3f22; --shadow:0 2px 10px rgba(0,0,0,.35);
    --svgbg:#221f1a; --svgink:#eee6da; --svgmuted:#a99d8c;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
button{font:inherit;cursor:pointer}
#topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.brand{font-family:var(--serif);font-size:1.2rem;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.brand small{font-family:var(--sans);font-weight:normal;color:var(--muted);font-size:.8rem;margin-left:4px}
.logo{font-size:1.4rem}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:38px;height:36px;font-size:1.1rem}
.iconbtn:hover{background:var(--soft)}
#menuBtn{display:none}
#app{display:grid;grid-template-columns:270px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
#topbar{grid-column:1/3}
#sidebar{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;overflow-y:auto;height:calc(100vh - 53px);position:sticky;top:53px}
#main{padding:20px 24px 60px;min-width:0;max-width:1100px}
.side-theme{font-family:var(--serif);color:var(--accent);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;margin:14px 6px 4px;font-weight:bold}
.side-ch{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:7px 8px;border-radius:8px}
.side-ch:hover{background:var(--soft)}
.side-ch.active{background:var(--hl)}
.side-part{font-family:var(--serif);font-weight:bold;font-size:1rem;margin:16px 6px 0;padding-top:10px;border-top:2px solid var(--line)}
.part-h{margin-top:1.2em;padding-top:.4em;border-top:3px solid var(--line)}
.side-ch .num{flex:0 0 24px;height:24px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold}
.side-ch.soon{opacity:.55}
.side-ch .stars{color:var(--gold);font-size:.75rem;display:block}
.side-home{font-weight:bold}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #topbar{grid-column:1}
  #menuBtn{display:block}
  #sidebar{position:fixed;left:0;top:53px;width:280px;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  #sidebar.open{transform:none}
  #main{padding:14px 16px 60px}
  .brand small{display:none}
}
h1,h2,h3{font-family:var(--serif);line-height:1.25}
h1{font-size:1.7rem;margin:.2em 0 .4em}
h2{font-size:1.3rem;margin:.6em 0 .4em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero{background:linear-gradient(135deg,var(--hl),var(--panel));}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.chcard{cursor:pointer;transition:transform .12s;margin:0}
.chcard:hover{transform:translateY(-2px)}
.chcard .ico{font-size:2rem}
.chcard .theme{font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.05em;font-weight:bold}
.chcard.soon{opacity:.6;cursor:default}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--soft);font-size:.75rem;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px;border-bottom:2px solid var(--line)}
.tab{background:none;border:none;padding:8px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;color:var(--muted);font-weight:600}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:9px;padding:8px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:5px 10px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.learnnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.learnnav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:4px 11px;font-size:.85rem}
.learnnav button.active{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.learnnav button.seen:not(.active){background:var(--soft)}
.animwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line);background:var(--svgbg)}
.animwrap svg{display:block;width:100%;min-width:600px;height:auto}
.caption{min-height:3.2em;padding:10px 4px 4px;font-size:1rem}
.caption b{color:var(--accent)}
.ctrls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.stepdots{display:flex;gap:4px;margin-left:auto}
.stepdots span{width:9px;height:9px;border-radius:50%;background:var(--line)}
.stepdots span.on{background:var(--accent2)}
.keyfacts{background:var(--soft);border-left:4px solid var(--gold);padding:10px 14px;border-radius:8px;margin-top:12px}
.keyfacts ul{margin:4px 0;padding-left:20px}
.term{border-bottom:1px dashed var(--accent2);cursor:help}
svg text{font-family:var(--sans)}
svg .pop{animation:pop .5s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg .pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
/* practice */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.tier{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--panel);text-align:left;color:var(--ink)}
.tier.active{border-color:var(--accent)}
.tier .t{font-weight:bold;font-family:var(--serif);font-size:1.05rem}
.qnav{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.qnav button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:.85rem}
.qnav button.cur{outline:2px solid var(--accent)}
.qnav button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.qnav button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.qtext{font-size:1.08rem;margin:6px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:0 0 24px;height:24px;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:bold}
.opt.sel{border-color:var(--accent2);background:var(--hl)}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--panel))}
.fillin{font:inherit;padding:9px 12px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:min(100%,360px)}
.orderlist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.orderlist li{display:flex;gap:8px;align-items:center;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--panel)}
.orderlist li .lbl{flex:1}
.orderlist li.right{border-color:var(--good)} .orderlist li.wrong{border-color:var(--bad)}
.feedback{margin-top:12px;padding:10px 14px;border-radius:10px;display:none}
.feedback.show{display:block}
.feedback.good{background:color-mix(in srgb,var(--good) 14%,var(--panel));border:1px solid var(--good)}
.feedback.bad{background:color-mix(in srgb,var(--bad) 12%,var(--panel));border:1px solid var(--bad)}
.hint{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--hl);display:none}
.hint.show{display:block}
.kbdtip{color:var(--muted);font-size:.82rem;margin-top:10px}
kbd{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.8rem}
/* watch out */
.myth{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.myth>div{padding:10px 14px;border-radius:10px}
.myth .m{background:color-mix(in srgb,var(--bad) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line))}
.myth .f{background:color-mix(in srgb,var(--good) 10%,var(--panel));border:1px solid color-mix(in srgb,var(--good) 40%,var(--line))}
.myth b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
@media (max-width:600px){.myth{grid-template-columns:1fr}}
/* labs */
.lab{margin-bottom:18px}
.lab .desc{color:var(--muted);margin-top:-4px}
.chipbin{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.bin{border:2px dashed var(--line);border-radius:12px;padding:8px;min-height:90px;background:var(--panel)}
.bin h4{margin:0 0 6px;font-size:.92rem}
.bin.target{border-color:var(--accent2);background:var(--hl);cursor:pointer}
.chip{display:inline-block;margin:3px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:.9rem}
.chip.sel{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.chip.ok{border-color:var(--good);box-shadow:0 0 0 2px color-mix(in srgb,var(--good) 40%,transparent)}
.chip.no{border-color:var(--bad);box-shadow:0 0 0 2px color-mix(in srgb,var(--bad) 40%,transparent)}
.pool{min-height:44px;padding:6px;border-radius:10px;background:var(--soft)}
.slider{width:min(100%,320px)}
.readout{font-variant-numeric:tabular-nums;font-weight:bold}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.matchgrid button{text-align:left;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font-size:.92rem}
.matchgrid button.sel{border-color:var(--accent2);background:var(--hl)}
.matchgrid button.done{border-color:var(--good);opacity:.65}
.matchgrid button.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.85rem;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
.tilemap svg{max-width:440px;width:100%;display:block}
/* certificate */
.certwrap canvas{width:100%;max-width:800px;border-radius:10px;border:1px solid var(--line);display:block}
.namein{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
table.simple{border-collapse:collapse;width:100%;font-size:.94rem}
table.simple td,table.simple th{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.simple th{background:var(--soft)}
@media print{
  body *{visibility:hidden}
  .printArea.printing,.printArea.printing *{visibility:visible}
  .printArea.printing{position:absolute;left:0;top:0;width:100%}
  .printArea.printing canvas{width:100%;border:none}
}

</style>

<body>
<div id="app">
  <header id="topbar">
    <button id="menuBtn" class="iconbtn" aria-label="Menu">&#9776;</button>
    <div class="brand" id="brandHome"><span class="logo">&#127757;</span> <span>VIII Social Science CBSE</span></div>
    <div class="spacer"></div>
    <button id="themeBtn" class="iconbtn" title="Light / dark">&#127763;</button>
    <button id="fsBtn" class="iconbtn" title="Full screen">&#9974;</button>
  </header>
  <nav id="sidebar"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
/* ===== Social Science Explorer engine ===== */
const SSE = { chapters: {}, version: "2.0.1" };

/* ---------- small utils ---------- */
const R = {
  rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; },
  int(rng, a, b){ return a + Math.floor(rng() * (b - a + 1)); },
  pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; },
  shuffle(rng, arr){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  sample(rng, arr, n){ return R.shuffle(rng, arr).slice(0, n); }
};
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
function h(tag, attrs = {}, html = ""){ const e = document.createElement(tag); for (const k in attrs){ if (k === "on") for (const ev in attrs.on) e.addEventListener(ev, attrs.on[ev]); else if (k === "class") e.className = attrs[k]; else e.setAttribute(k, attrs[k]); } if (html !== null) e.innerHTML = html; return e; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9%.]/g, ""); }

/* ---------- storage ---------- */
const Store = {
  key: "sse8_progress_v1",
  data: { seen: {}, tiers: {}, name: "", theme: "" },
  load(){ try { const d = JSON.parse(localStorage.getItem(this.key) || "null"); if (d) this.data = Object.assign(this.data, d); } catch (e) {} },
  save(){ try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {} },
  seen(ch, i){ (this.data.seen[ch] = this.data.seen[ch] || {})[i] = 1; this.save(); },
  isSeen(ch, i){ return !!(this.data.seen[ch] && this.data.seen[ch][i]); },
  setTier(ch, t, pct){ const o = (this.data.tiers[ch] = this.data.tiers[ch] || {}); if (!(o[t] >= pct)) o[t] = pct; this.save(); },
  stars(ch){ const o = this.data.tiers[ch] || {}; return ["warm", "practice", "challenge"].filter(t => o[t] >= 70).length; }
};

/* ---------- book structure (all chapters, built or not) ----------
   Part 1 chapters use ids 1-7; Part 2 chapters use ids 201-208 (shown as Part 2, Chapter 1-8). */
SSE.parts = [
  { part: 1, title: "Part 1", themes: [
    { theme: "A", themeName: "India and the World: Land and the People", ch: [1] },
    { theme: "B", themeName: "Tapestry of the Past", ch: [2, 3, 4] },
    { theme: "D", themeName: "Governance and Democracy", ch: [5, 6] },
    { theme: "E", themeName: "Economic Life Around Us", ch: [7] } ] },
  { part: 2, title: "Part 2", themes: [
    { theme: "A", themeName: "India and the World: Land and the People", ch: [201] },
    { theme: "B", themeName: "Tapestry of the Past", ch: [202] },
    { theme: "C", themeName: "Our Cultural Heritage and Knowledge Traditions", ch: [203, 208] },
    { theme: "D", themeName: "Governance and Democracy", ch: [204, 205] },
    { theme: "E", themeName: "Economic Life Around Us", ch: [206, 207] } ] }
];
SSE.meta = {
  1: { title: "Natural Resources and Their Use", icon: "🌳" },
  2: { title: "Reshaping India\u2019s Political Map", icon: "🗺️" },
  3: { title: "The Rise of the Marathas", icon: "🏰" },
  4: { title: "The Colonial Era in India", icon: "\u2693" },
  5: { title: "Universal Franchise and India\u2019s Electoral System", icon: "🗳️" },
  6: { title: "The Parliamentary System: Legislature and Executive", icon: "🏛️" },
  7: { title: "Factors of Production", icon: "🏭" },
  201: { title: "World Geography: Some Glimpses", icon: "🌏" },
  202: { title: "India\u2019s Long Road to Independence", icon: "🕊️" },
  203: { title: "A Journey Through Indian Architecture", icon: "🕌️" },
  204: { title: "The Role of the Judiciary in Our Society", icon: "\u2696" },
  205: { title: "Citizenship: Rights and Duties", icon: "📜" },
  206: { title: "Dynamics of Population", icon: "👥" },
  207: { title: "India\u2019s Urban Landscape", icon: "🏙️" },
  208: { title: "Cultural Currents: 13th to 17th Centuries", icon: "🎶" }
};
SSE.part = id => id > 100 ? 2 : 1;
SSE.num = id => id > 100 ? id - 200 : id;
SSE.label = id => `Part ${SSE.part(id)} \u00B7 Chapter ${SSE.num(id)}`;
SSE.partIds = p => SSE.parts.find(x => x.part === p).themes.flatMap(t => t.ch).sort((a, b) => SSE.num(a) - SSE.num(b));
SSE.register = function(def){ SSE.chapters[def.id] = def; };

/* ---------- SVG helpers for animations ---------- */
const S = {
  W: 600, H: 340,
  // show html only once step >= k; newly revealed group gets "pop"
  at(s, k, html){ return s >= k ? `<g class="${s === k ? "pop" : ""}">${html}</g>` : ""; },
  t(x, y, txt, o = {}){ const sz = o.size || 14, fill = o.fill || "var(--svgink)", anc = o.anchor || "middle", w = o.bold ? "bold" : "normal"; return `<text x="${x}" y="${y}" font-size="${sz}" fill="${fill}" text-anchor="${anc}" font-weight="${w}"${o.italic ? ' font-style="italic"' : ""}>${txt}</text>`; },
  // multi-line text
  tl(x, y, lines, o = {}){ const sz = o.size || 13, lh = o.lh || sz * 1.3; return lines.map((l, i) => S.t(x, y + i * lh, l, o)).join(""); },
  r(x, y, w, h, fill, o = {}){ return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx == null ? 8 : o.rx}" fill="${fill}" stroke="${o.stroke || "none"}" stroke-width="${o.sw || 1.5}"${o.op != null ? ` opacity="${o.op}"` : ""}/>`; },
  c(x, y, r, fill, o = {}){ return `<circle cx="${x}" cy="${y}" r="${r}" fill="${fill}" stroke="${o.stroke || "none"}" stroke-width="${o.sw || 1.5}"${o.cls ? ` class="${o.cls}"` : ""}/>`; },
  l(x1, y1, x2, y2, col = "var(--svgmuted)", w = 2, dash = ""){ return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${w}"${dash ? ` stroke-dasharray="${dash}"` : ""}/>`; },
  arrow(x1, y1, x2, y2, col = "var(--svgmuted)", w = 2){ const a = Math.atan2(y2 - y1, x2 - x1), hl = 9; const p1 = [x2 - hl * Math.cos(a - .45), y2 - hl * Math.sin(a - .45)], p2 = [x2 - hl * Math.cos(a + .45), y2 - hl * Math.sin(a + .45)]; return S.l(x1, y1, x2, y2, col, w) + `<polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="${col}"/>`; },
  box(x, y, w, h, fill, lines, o = {}){ const sz = o.size || 13, lh = sz * 1.3, n = lines.length; const y0 = y + h / 2 - (n - 1) * lh / 2 + sz * .35; return S.r(x, y, w, h, fill, o) + lines.map((ln, i) => S.t(x + w / 2, y0 + i * lh, ln, { size: sz, fill: o.color || "#fff", bold: o.bold })).join(""); },
  emoji(x, y, e, size = 28){ return `<text x="${x}" y="${y}" font-size="${size}" text-anchor="middle">${e}\uFE0F</text>`; },
  title(txt){ return S.t(300, 26, txt, { size: 16, bold: true }); }
};

/* ---------- tile map of Indian states (schematic) ---------- */
const TILES = {
  JK: [2, 0, "J&K"], LA: [3, 0, "LA"], PB: [2, 1, "PB"], HP: [3, 1, "HP"],
  RJ: [1, 2, "RJ"], HR: [2, 2, "HR"], DL: [3, 2, "DL"], UK: [4, 2, "UK"],
  GJ: [0, 3, "GJ"], MP: [2, 3, "MP"], UP: [3, 3, "UP"], BR: [4, 3, "BR"], SK: [5, 3, "SK"], AS: [6, 3, "AS"], AR: [7, 3, "AR"],
  MH: [1, 4, "MH"], CG: [3, 4, "CG"], JH: [4, 4, "JH"], WB: [5, 4, "WB"], ML: [6, 4, "ML"], NL: [7, 4, "NL"],
  GA: [0, 5, "GA"], KA: [1, 5, "KA"], TS: [2, 5, "TS"], OD: [4, 5, "OD"], TR: [6, 5, "TR"], MN: [7, 5, "MN"],
  KL: [1, 6, "KL"], AP: [2, 6, "AP"], MZ: [6, 6, "MZ"], TN: [2, 7, "TN"]
};
const STATE_NAMES = { JK: "Jammu & Kashmir", LA: "Ladakh", PB: "Punjab", HP: "Himachal Pradesh", RJ: "Rajasthan", HR: "Haryana", DL: "Delhi", UK: "Uttarakhand", GJ: "Gujarat", MP: "Madhya Pradesh", UP: "Uttar Pradesh", BR: "Bihar", SK: "Sikkim", AS: "Assam", AR: "Arunachal Pradesh", MH: "Maharashtra", CG: "Chhattisgarh", JH: "Jharkhand", WB: "West Bengal", ML: "Meghalaya", NL: "Nagaland", GA: "Goa", KA: "Karnataka", TS: "Telangana", OD: "Odisha", TR: "Tripura", MN: "Manipur", KL: "Kerala", AP: "Andhra Pradesh", MZ: "Mizoram", TN: "Tamil Nadu" };
// colorOf(code) -> fill ; marks(code) -> extra svg
function tileMapSVG(colorOf, o = {}){
  const s = o.size || 50, g = 4, ox = o.ox || 6, oy = o.oy || 6;
  let out = "";
  for (const k in TILES){ const [c, r, lab] = TILES[k]; const x = ox + c * (s + g), y = oy + r * (s + g); const fill = colorOf(k) || "var(--soft)";
    out += `<g data-st="${k}" class="tile"${o.click ? ' style="cursor:pointer"' : ""}><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="7" fill="${fill}" stroke="var(--line)" stroke-width="1.5"/><text x="${x + s / 2}" y="${y + s / 2 + 5}" font-size="13" text-anchor="middle" fill="${o.labelFill ? o.labelFill(k) : "var(--svgink)"}" font-weight="bold">${lab}</text>${o.marks ? o.marks(k, x, y, s) : ""}<title>${STATE_NAMES[k]}</title></g>`; }
  const W = ox * 2 + 8 * (s + g), H = oy * 2 + 8 * (s + g);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tile map of Indian states">${out}</svg>`;
}

/* ---------- Learn (stepped animations) ---------- */
const Anim = {
  timer: null,
  stop(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } const b = $("#playBtn"); if (b) b.textContent = "▶ Play"; }
};
const Learn = {
  ch: null, i: 0, s: 0,
  render(el, ch){
    if (this.ch !== ch) { this.ch = ch; this.i = 0; this.s = 0; }
    el.innerHTML = "";
    const nav = h("div", { class: "learnnav" });
    ch.learn.forEach((c, i) => nav.appendChild(h("button", { class: (i === this.i ? "active" : "") + (Store.isSeen(ch.id, i) ? " seen" : ""), on: { click: () => { this.i = i; this.s = 0; this.render(el, ch); } } }, `${i + 1}. ${esc(c.title)}`)));
    el.appendChild(nav);
    const c = ch.learn[this.i];
    const card = h("div", { class: "card" });
    card.innerHTML = `<h2 style="margin-top:0">${esc(c.title)}</h2>${c.text ? `<p>${c.text}</p>` : ""}
      <div class="animwrap"><svg id="animSvg" viewBox="0 0 600 340" xmlns="http://www.w3.org/2000/svg" role="img"></svg></div>
      <div class="caption" id="animCap"></div>
      <div class="ctrls"><button class="btn sec small" id="backBtn">&#9664; Back</button><button class="btn small" id="nextBtn">Next &#9654;</button><button class="btn sec small" id="playBtn">&#9654; Play</button><div class="stepdots" id="dots"></div></div>
      ${c.facts ? `<div class="keyfacts"><b>Key points</b><ul>${c.facts.map(f => `<li>${f}</li>`).join("")}</ul></div>` : ""}`;
    el.appendChild(card);
    const nn = h("div", { class: "row", style: "justify-content:space-between" });
    nn.appendChild(h("button", { class: "btn sec", on: { click: () => this.card(-1) } }, "&#8592; Previous card"));
    nn.appendChild(h("button", { class: "btn", on: { click: () => this.card(1) } }, this.i < ch.learn.length - 1 ? "Next card &#8594;" : "Go to Labs &#8594;"));
    el.appendChild(nn);
    $("#backBtn").onclick = () => this.step(-1);
    $("#nextBtn").onclick = () => this.step(1);
    $("#playBtn").onclick = () => this.play();
    this.draw();
  },
  draw(){
    const c = this.ch.learn[this.i], n = c.steps.length;
    $("#animSvg").innerHTML = `<rect x="0" y="0" width="600" height="340" fill="var(--svgbg)"/>` + c.draw(this.s);
    $("#animCap").innerHTML = `<b>Step ${this.s + 1} of ${n}.</b> ${c.steps[this.s]}`;
    $("#dots").innerHTML = c.steps.map((_, k) => `<span class="${k <= this.s ? "on" : ""}"></span>`).join("");
    $("#backBtn").disabled = this.s === 0;
    $("#nextBtn").innerHTML = this.s === n - 1 ? "Done &#10003;" : "Next &#9654;";
    if (this.s === n - 1) Store.seen(this.ch.id, this.i);
  },
  step(d){
    const n = this.ch.learn[this.i].steps.length;
    if (d > 0 && this.s === n - 1) { Anim.stop(); return false; }
    this.s = Math.max(0, Math.min(n - 1, this.s + d)); this.draw(); return true;
  },
  play(){
    if (Anim.timer) return Anim.stop();
    if (this.s === this.ch.learn[this.i].steps.length - 1) { this.s = 0; this.draw(); }
    $("#playBtn").textContent = "⏸ Pause";
    Anim.timer = setInterval(() => { if (!this.step(1)) Anim.stop(); }, 2600);
  },
  card(d){
    const n = this.ch.learn.length, j = this.i + d;
    if (j >= n) return App.go("ch", this.ch.id, "labs");
    if (j < 0) return;
    this.i = j; this.s = 0; Anim.stop(); App.render();
  },
  key(e, tag){
    if (tag === "input" || tag === "textarea") return;
    if (e.key === "ArrowRight"){ e.preventDefault(); Anim.stop(); if (!this.step(1)) this.card(1); }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); Anim.stop(); if (this.s === 0) { if (this.i > 0){ this.i--; App.render(); this.s = this.ch.learn[this.i].steps.length - 1; this.draw(); } } else this.step(-1); }
    else if (e.key === " " && tag !== "button"){ e.preventDefault(); this.play(); }
  }
};

/* ---------- Labs ---------- */
const Labs = {
  render(el, ch){
    el.innerHTML = "";

  },
  /* click a chip, then click a bin. items:[{t, bin}] bins:[{id,name}] */
  sorter(el, items, bins, o = {}){
    let sel = null; const place = {};
    const seed = Date.now() % 100000; const order = R.shuffle(R.rng(seed), items.map((_, i) => i));
    el.innerHTML = `<div class="pool" id="pool"></div><div class="chipbin">${bins.map(b => `<div class="bin" data-bin="${b.id}"><h4>${b.name}</h4><div class="binc"></div></div>`).join("")}</div>
      <div class="row" style="margin-top:10px"><button class="btn small chk">Check</button><button class="btn sec small rst">Reset</button><span class="msg"></span></div>`;
    const draw = () => {
      const pool = $("#pool", el); pool.innerHTML = ""; $$(".binc", el).forEach(b => b.innerHTML = "");
      order.forEach(i => { const ch = h("button", { class: "chip" + (sel === i ? " sel" : "") }, items[i].t); ch.onclick = ev => { ev.stopPropagation(); sel = sel === i ? null : i; draw(); }; (place[i] ? $(`[data-bin="${place[i]}"] .binc`, el) : pool).appendChild(ch); });
      if (!pool.children.length) pool.innerHTML = `<small style="color:var(--muted)">All placed &mdash; press Check.</small>`;
      $$(".bin", el).forEach(b => b.classList.toggle("target", sel !== null));
    };
    $$(".bin", el).forEach(b => b.onclick = () => { if (sel === null) return; place[sel] = b.dataset.bin; sel = null; draw(); });
    $("#pool", el).onclick = () => { if (sel !== null){ delete place[sel]; sel = null; draw(); } };
    $(".rst", el).onclick = () => { for (const k in place) delete place[k]; sel = null; $(".msg", el).textContent = ""; draw(); };
    $(".chk", el).onclick = () => {
      draw(); let ok = 0, placed = 0;
      $$(".bin", el).forEach(b => $$(".chip", b).forEach(c => { const i = items.findIndex(it => it.t === c.innerHTML); placed++; const good = items[i].bin === b.dataset.bin; if (good) ok++; c.classList.add(good ? "ok" : "no"); }));
      $(".msg", el).innerHTML = placed < items.length ? `${ok} of ${placed} placed correctly &mdash; ${items.length - placed} still to place.` : (ok === items.length ? `<b style="color:var(--good)">All ${ok} correct! ${o.win || ""}</b>` : `${ok} of ${items.length} correct. Red ones need another look.`);
    };
    draw();
  },
  /* matching pairs: pairs:[[left,right]] */
  matcher(el, pairs, o = {}){
    const rng = R.rng(Date.now() % 99991);
    const L = R.shuffle(rng, pairs.map((p, i) => i)), Rr = R.shuffle(rng, pairs.map((p, i) => i));
    let selL = null, selR = null, done = new Set(), tries = 0;
    el.innerHTML = `<div class="matchgrid"><div class="colL" style="display:grid;gap:8px"></div><div class="colR" style="display:grid;gap:8px"></div></div><p class="msg" style="margin-bottom:0"></p><button class="btn sec small rst">Shuffle &amp; restart</button>`;

      const cl = $(".colL", el), cr = $(".colR", el); cl.innerHTML = cr.innerHTML = "";

      $(".msg", el).innerHTML = done.size === pairs.length ? `<b style="color:var(--good)">All ${pairs.length} matched in ${tries} tries! ${o.win || ""}</b>` : `Pick one item on the left and its match on the right. Matched: ${done.size}/${pairs.length}`;
    };

        else { draw(); $$(".sel", el).forEach(b => b.classList.add("shake")); setTimeout(() => { selL = selR = null; draw(); }, 380); }
      } else draw();

  /* put events in order: ev:[[year,label]] already in order */

        const up = h("button", { class: "btn sec small", "aria-label": "up" }, "&#9650;"), dn = h("button", { class: "btn sec small", "aria-label": "down" }, "&#9660;");
        up.disabled = pos === 0; dn.disabled = pos === cur.length - 1;
        up.onclick = () => { [cur[pos - 1], cur[pos]] = [cur[pos], cur[pos - 1]]; draw(); }; dn.onclick = () => { [cur[pos + 1], cur[pos]] = [cur[pos], cur[pos + 1]]; draw(); };
        li.appendChild(up); li.appendChild(dn); ol.appendChild(li); });
    };
    $(".chk", el).onclick = () => { const marks = cur.map((i, pos) => ev[i][0] === ev[pos][0]); const ok = marks.filter(Boolean).length; draw(marks);
      $(".msg", el).innerHTML = ok === ev.length ? `<b style="color:var(--good)">Perfect order!</b>` : `${ok} of ${ev.length} in the right place.`;
      if (ok === ev.length) $(".tlsvg", el).innerHTML = Labs.tlSVG(ev); };

    $(".rst", el).onclick = () => { cur = R.shuffle(R.rng(Date.now() % 77777), ev.map((_, i) => i)); $(".msg", el).textContent = ""; $(".tlsvg", el).innerHTML = ""; draw(); };
    draw();
  },
  /* put steps in order (no years): items already in correct order */
  order(el, items, o = {}){
    let cur = R.shuffle(R.rng(Date.now() % 77771), items.map((_, i) => i)); if (cur.every((v, i) => v === i)) cur.reverse();
    el.innerHTML = `<p style="margin-top:0">${o.intro || "Use &#9650; &#9660; to put the steps in the right order, then press Check."}</p><ol class="orderlist"></ol>

        li.appendChild(up); li.appendChild(dn); ol.appendChild(li); });
    };

  tlSVG(ev){
    const y0 = +ev[0][0].toString().slice(0, 4), y1 = +ev[ev.length - 1][0].toString().slice(0, 4);

/* ---------- Practice ---------- */
const TIERS = [["warm", "Warm-up", "Facts and terms"], ["practice", "Practice", "Explain and connect"], ["challenge", "Challenge", "Think it through"]];
const Practice = {
  ch: null, tier: "warm", qs: [], i: 0, st: [], N: 8,
  render(el, ch){
    if (this.ch !== ch){ this.ch = ch; this.tier = "warm"; this.qs = []; }
    this.el = el; el.innerHTML = "";
    const tw = h("div", { class: "tiers" });
    const best = Store.data.tiers[ch.id] || {};
    TIERS.forEach(([k, name, sub]) => { const b = h("button", { class: "tier" + (this.tier === k ? " active" : "") }, `<div class="t">${name}</div><small style="color:var(--muted)">${sub}</small><div class="stars">${best[k] >= 70 ? "★" : "☆"} <small style="color:var(--muted)">${best[k] != null ? "best " + best[k] + "%" : "not tried"}</small></div>`);
      b.onclick = () => { this.tier = k; this.qs = []; this.render(el, ch); }; tw.appendChild(b); });
    el.appendChild(tw);
    if (!this.qs.length) this.newSet();
    this.box = h("div", { class: "card" }); el.appendChild(this.box);
    this.show();
  },
  newSet(){
    const bank = this.ch.practice[this.tier]; const rng = R.rng((Date.now() ^ (Math.random() * 1e9)) >>> 0);
    const picked = R.sample(rng, bank, Math.min(this.N, bank.length));
    this.qs = picked.map(q => this.prep(typeof q === "function" ? q(rng) : q, rng));
    this.st = this.qs.map(() => ({ done: false, ok: false, ans: null, hint: false }));
    this.i = 0;
  },
  prep(q, rng){
    q = Object.assign({}, q);
    if (q.type === "mcq" || !q.type){ q.type = "mcq"; const correct = q.opts[0]; q.shown = q.fixed ? q.opts.slice() : R.shuffle(rng, q.opts); q.correct = q.shown.indexOf(correct); }
    if (q.type === "order"){ q.cur = R.shuffle(rng, q.items.map((_, i) => i)); if (q.cur.every((v, i) => v === i)) q.cur.reverse(); }
    return q;
  },
  show(){
    const q = this.qs[this.i], st = this.st[this.i], b = this.box;
    const nav = this.qs.map((_, k) => `<button data-k="${k}" class="${k === this.i ? "cur " : ""}${this.st[k].done ? (this.st[k].ok ? "ok" : "no") : ""}">${k + 1}</button>`).join("");
    let body = "";
    if (q.type === "mcq") body = `<div class="opts">${q.shown.map((o, k) => `<button class="opt${st.ans === k ? " sel" : ""}${st.done && k === q.correct ? " right" : ""}${st.done && st.ans === k && !st.ok ? " wrong" : ""}" data-k="${k}"><span class="k">${k + 1}</span><span>${o}</span></button>`).join("")}</div>`;
    else if (q.type === "fill") body = `<input class="fillin" id="fillIn" placeholder="${q.ph || "Type your answer"}" value="${st.ans != null ? esc(st.ans) : ""}" ${st.done ? "disabled" : ""} autocomplete="off">`;
    else if (q.type === "order") body = `<ol class="orderlist">${q.cur.map((it, pos) => `<li class="${st.done ? (it === pos ? "right" : "wrong") : ""}"><span class="lbl">${q.items[it]}</span><button class="btn sec small" data-up="${pos}" ${st.done || pos === 0 ? "disabled" : ""}>&#9650;</button><button class="btn sec small" data-dn="${pos}" ${st.done || pos === q.cur.length - 1 ? "disabled" : ""}>&#9660;</button></li>`).join("")}</ol>`;
    const score = this.st.filter(s => s.ok).length, done = this.st.filter(s => s.done).length;
    b.innerHTML = `<div class="qnav">${nav}</div><div class="row" style="justify-content:space-between"><span class="badge">${TIERS.find(t => t[0] === this.tier)[1]} &middot; Question ${this.i + 1} of ${this.qs.length}</span><span class="badge">Score ${score}/${done}</span></div>
      <div class="qtext">${q.q}</div>${body}
      <div class="hint${st.hint ? " show" : ""}">&#128161; ${q.hint || "Read the question again slowly."}</div>
      <div class="feedback${st.done ? " show " + (st.ok ? "good" : "bad") : ""}">${st.done ? `<b>${st.ok ? "Correct!" : "Not quite."}</b> ${!st.ok && q.type === "fill" ? `Answer: <b>${q.ans[0]}</b>. ` : ""}${!st.ok && q.type === "order" ? `Correct order: ${q.items.join(" &rarr; ")}. ` : ""}<div style="margin-top:4px">${q.sol || ""}</div>` : ""}</div>
      <div class="row" style="margin-top:12px"><button class="btn" id="chkBtn">${st.done ? (this.i < this.qs.length - 1 ? "Next question &#8594;" : "See result") : "Check"}</button><button class="btn sec" id="hintBtn" ${st.done ? "disabled" : ""}>Hint</button><button class="btn sec" id="newBtn">New set</button></div>
      <div class="kbdtip">Keys: <kbd>1</kbd>&ndash;<kbd>4</kbd> choose &middot; <kbd>Enter</kbd> check/next &middot; <kbd>&larr;</kbd><kbd>&rarr;</kbd> questions &middot; <kbd>H</kbd> hint</div>
      <div id="resultBox"></div>`;
    $$(".qnav button", b).forEach(x => x.onclick = () => { this.i = +x.dataset.k; this.show(); });
    $$(".opt", b).forEach(x => x.onclick = () => { if (!st.done){ st.ans = +x.dataset.k; this.show(); } });
    $$("[data-up]", b).forEach(x => x.onclick = () => { const p = +x.dataset.up; [q.cur[p - 1], q.cur[p]] = [q.cur[p], q.cur[p - 1]]; this.show(); });
    $$("[data-dn]", b).forEach(x => x.onclick = () => { const p = +x.dataset.dn; [q.cur[p + 1], q.cur[p]] = [q.cur[p], q.cur[p + 1]]; this.show(); });
    const fi = $("#fillIn", b); if (fi){ fi.oninput = () => st.ans = fi.value; if (!st.done) setTimeout(() => fi.focus(), 0); }
    $("#chkBtn", b).onclick = () => this.enter();
    $("#hintBtn", b).onclick = () => { st.hint = true; this.show(); };
    $("#newBtn", b).onclick = () => { this.newSet(); this.show(); };
    if (this.st.every(s => s.done)) this.result();
  },
  check(){
    const q = this.qs[this.i], st = this.st[this.i];
    if (q.type === "mcq"){ if (st.ans == null) return false; st.ok = st.ans === q.correct; }
    else if (q.type === "fill"){ if (!st.ans || !String(st.ans).trim()) return false; st.ok = Practice.fillOK(q, st.ans); }
    else if (q.type === "order"){ st.ok = q.cur.every((v, i) => v === i); }
    st.done = true; return true;
  },
  fillOK(q, a){ const n = norm(a); if (q.ans.some(x => norm(x) === n)) return true; const isNum = x => /^\s*-?[\d,]*\.?\d+\s*(%|years?|m|crore|lakh|seats?|rupees?)?\s*$/i.test(String(x)); const num = x => parseFloat(String(x).replace(/[^0-9.\-]/g, "")); return isNum(q.ans[0]) && isNum(a) && Math.abs(num(a) - num(q.ans[0])) < 1e-6; },
  enter(){
    const st = this.st[this.i];
    if (!st.done){ if (this.check()) this.show(); return; }
    const nxt = this.st.findIndex((s, k) => k > this.i && !s.done);
    const any = nxt >= 0 ? nxt : this.st.findIndex(s => !s.done);
    if (any >= 0){ this.i = any; this.show(); } else this.result(true);
  },
  result(scroll){
    const ok = this.st.filter(s => s.ok).length, pct = Math.round(ok / this.qs.length * 100);
    Store.setTier(this.ch.id, this.tier, pct); App.sidebar();
    const pass = pct >= 70;
    $("#resultBox", this.box).innerHTML = `<div class="card" style="margin-top:14px;background:var(--hl)"><h3 style="margin-top:0">${pass ? "★ Level cleared!" : "Keep going!"}</h3><p>You scored <b>${ok}/${this.qs.length}</b> (${pct}%). ${pass ? "You earned the star for this level." : "70% or more earns the star &mdash; try a new set."}</p>
      <div class="row"><button class="btn" id="againBtn">New set</button>${pass && this.tier !== "challenge" ? `<button class="btn sec" id="upBtn">Next level &#8594;</button>` : ""}${Store.stars(this.ch.id) === 3 ? `<button class="btn sec" id="certBtn">&#127942; Get certificate</button>` : ""}</div></div>`;
    $("#againBtn").onclick = () => { this.newSet(); this.show(); };
    const up = $("#upBtn"); if (up) up.onclick = () => { this.tier = this.tier === "warm" ? "practice" : "challenge"; this.qs = []; this.render(this.el, this.ch); };
    const cb = $("#certBtn"); if (cb) cb.onclick = () => App.go("ch", this.ch.id, "cert");
    if (scroll) $("#resultBox").scrollIntoView({ behavior: "smooth", block: "center" });
  },
  key(e, tag){
    const q = this.qs[this.i], st = this.st[this.i]; if (!q) return;
    if (e.key === "Enter"){ e.preventDefault(); this.enter(); return; }
    if (tag === "input") return;
    if (e.key === "ArrowRight"){ e.preventDefault(); if (this.i < this.qs.length - 1){ this.i++; this.show(); } }
    else if (e.key === "ArrowLeft"){ e.preventDefault(); if (this.i > 0){ this.i--; this.show(); } }
    else if (/^[1-6]$/.test(e.key) && q.type === "mcq" && !st.done){ const k = +e.key - 1; if (k < q.shown.length){ st.ans = k; this.show(); } }
    else if (e.key.toLowerCase() === "h" && !st.done){ st.hint = true; this.show(); }
  }
};

      const net = (pump - rech) / 10; // metres per year change
      let d = 5; const pts = [];

{
  title: "1919–1922: massacre and non-cooperation",
  text: "The end of World War I brought no freedom. Food had been exported for the war effort and prices had soared.",
  steps: ["The <b>Rowlatt Act (1919)</b> let the police detain anyone <b>without trial</b>. Gandhi called a nationwide protest with prayer and fasting, urging Hindus and Muslims to unite.",
          "<b>13 April 1919, Jallianwala Bagh, Amritsar</b>: a crowd had gathered for Baisakhi and to protest peacefully. <b>Brigadier-General Dyer</b>'s troops sealed the main exit and fired about <b>1,650 rounds</b> for about ten minutes.",
          "British counts admitted nearly <b>400 dead</b> and over 1,200 wounded; Indian estimates put the dead at over <b>1,000</b>. Tagore returned his knighthood in protest. Britain has never apologised.",
          "<b>Khilafat Movement (1919)</b>: the Ali brothers and <b>Maulana Abul Kalam Azad</b> sought to protect the authority of the Caliph in Turkey. In 1920 Gandhi allied the Congress with them, for both Khilafat and Swaraj.",

          "<b>February 1922, Chauri Chaura</b>: protesters set a police station on fire, killing policemen. Gandhi <b>called off</b> the movement. Motilal Nehru and C.R. Das formed the <b>Swaraj Party</b>."],

  text: "In <b>rock-cut architecture</b>, builders do not put stones together &mdash; they <b>carve directly into a rock hill</b>. It was efficient and very durable, and complexes grew over centuries.",
  steps: ["Builders chipped rock <b>away</b> to leave rooms, pillars and statues. Nothing could be added back, so every cut had to be planned.",
          "The <b>Udayagiri&ndash;Khandagiri</b> caves near Bhubaneswar (Odisha) were begun in the <b>2nd century BCE</b>. Most were homes for <b>Jain monks</b>; one holds <b>Khāravela's</b> famous inscription.",
          "<b>Ellora's Cave no. 10</b> (Maharashtra) is huge. At its end, a seated <b>Buddha</b> in a teaching pose leans against a <b>stupa</b>; the arched roof imitates <b>timber beams</b>.",
          "Monks walked around the stupa along the <b>aisle</b>, the corridor outside the row of pillars. This <b>pradakṣhiṇa</b> (going around clockwise) continued in later temples.",

{
  title: "The temple as the cosmic person",
  text: "Temple design also carries ideas. A temple is planned as a picture of the human body &mdash; of <b>Puruṣha</b>, the cosmic being.",
  steps: ["In north Indian temples the tower over the garbhagṛiha is called the <b>śhikhara</b>; it curves upward.",

{
  title: "Population growth simulator",
  desc: "A town starts with 100 thousand people. Set the birth rate, death rate and net migration (all per 1,000 people per year) and watch the population over 50 years. Try the presets for each stage of demographic transition.",
  mount(el){
    const SL = [["Birth rate", "pgB", 5, 50, 30], ["Death rate", "pgD", 2, 40, 10], ["Net migration", "pgM", -10, 10, 0]];
    el.innerHTML = `<div class="row">${[["Stage 1", 40, 37, 0], ["Stage 2", 40, 12, 0], ["Stage 3", 17, 8, 0], ["Shrinking", 8, 12, 0], ["Migrant city", 16, 6, 8]].map(p => `<button class="btn small sec" data-p="${p.slice(1).join(",")}">${p[0]}</button>`).join("")}</div>` +
      SL.map(x => `<div class="row"><span style="width:110px;font-weight:bold">${x[0]}</span><input type="range" class="slider" id="${x[1]}" min="${x[2]}" max="${x[3]}" value="${x[4]}"><span class="readout" id="${x[1]}v"></span></div>`).join("") +
      `<div class="animwrap" style="margin-top:10px"><svg id="pgSvg" viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg"></svg></div><p id="pgMsg" style="margin-bottom:0"></p>`;
    const run = () => {
      const b = +$("#pgB", el).value, d = +$("#pgD", el).value, m = +$("#pgM", el).value;
      $("#pgBv", el).textContent = b + " per 1,000"; $("#pgDv", el).textContent = d + " per 1,000"; $("#pgMv", el).textContent = (m > 0 ? "+" : "") + m + " per 1,000";
      const g = (b - d + m) / 1000, pts = []; for (let y = 0; y <= 50; y++) pts.push(100 * Math.pow(1 + g, y));
      const mx = Math.max(...pts), top = mx <= 150 ? 150 : mx <= 300 ? 300 : mx <= 600 ? 600 : 1200;
      const X = y => 70 + y * 10, Y = v => 260 - v / top * 230;
      let sv = `<rect width="600" height="300" fill="var(--svgbg)"/>`;
      for (let k = 0; k <= 4; k++){ const v = top * k / 4; sv += `<line x1="70" y1="${Y(v)}" x2="570" y2="${Y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="62" y="${Y(v) + 4}" font-size="11" text-anchor="end" fill="var(--svgmuted)">${Math.round(v)}</text>`; }
      for (let y = 0; y <= 50; y += 10) sv += `<text x="${X(y)}" y="280" font-size="11" text-anchor="middle" fill="var(--svgmuted)">year ${y}</text>`;
      sv += `<line x1="70" y1="${Y(100)}" x2="570" y2="${Y(100)}" stroke="var(--svgmuted)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="16" y="150" font-size="11" fill="var(--svgmuted)" transform="rotate(-90 16 150)" text-anchor="middle">thousand people</text>`;
      const col = g > 0.0005 ? COL.green : g < -0.0005 ? COL.red : COL.grey;
      sv += `<polyline points="${pts.map((v, y) => X(y) + "," + Y(v).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="3.5"/><circle cx="${X(50)}" cy="${Y(pts[50])}" r="5" fill="${col}"/>`;
      $("#pgSvg", el).innerHTML = sv;
      const net = b - d + m, end = Math.round(pts[50]);
      const stage = net < 0 ? "Births (plus migrants) are fewer than deaths, so the population <b>shrinks</b> &mdash; as in Italy, Japan or South Korea." : b >= 30 && d >= 25 ? "Both rates are high: this looks like <b>Stage 1</b> &mdash; slow growth." : b >= 25 && d <= 15 ? "Death rate low but birth rate high: this looks like <b>Stage 2</b> &mdash; rapid growth." : b < 25 && d <= 15 ? "Both rates are fairly low: this looks like <b>Stage 3</b> &mdash; slow growth." : "";
      $("#pgMsg", el).innerHTML = `Each year: ${b} births &minus; ${d} deaths ${m >= 0 ? "+" : "&minus;"} ${Math.abs(m)} migrants = <b>${net >= 0 ? "+" : "&minus;"}${Math.abs(net)} per 1,000</b>, a growth rate of <b>${(net / 10).toFixed(1)}% a year</b>. After 50 years: <b>${end} thousand</b> people (started at 100). ${stage}`;
    };
    $$("input", el).forEach(x => x.oninput = run);
    $$("[data-p]", el).forEach(bt => bt.onclick = () => { const v = bt.dataset.p.split(","); $("#pgB", el).value = v[0]; $("#pgD", el).value = v[1]; $("#pgM", el).value = v[2]; run(); });
    run();
  }
},
{
  title: "Population pyramid explorer",
  desc: "See India's real 2021 pyramid from the book's table, compare it with three model shapes, then test yourself: can you tell a young, a stable and an ageing population apart?",
  mount(el){
    const norm100 = a => { const s = a.reduce((x, y) => x + y, 0); return a.map(v => +(v * 100 / s).toFixed(2)); };
    const young = AGES.map((_, i) => 13 * Math.pow(.86, i)), stable = AGES.map((_, i) => i < 11 ? 7.2 : 7.2 * Math.pow(.72, i - 10)), aged = [2.8, 3.0, 3.3, 3.6, 3.9, 4.3, 4.8, 5.5, 6.6, 7.2, 6.6, 6.2, 6.4, 7.0, 8.0, 6.0, 7.5];
    const DS = { india: ["India 2021 (book's table)", IND_M, IND_F], young: ["Model: young and growing", norm100(young), norm100(young.map((v, i) => v * (1 + i * .004)))], stable: ["Model: stable", norm100(stable), norm100(stable.map((v, i) => v * (1 + i * .006)))], aged: ["Model: ageing", norm100(aged), norm100(aged.map((v, i) => v * (1 + i * .02)))] };
    const NOTE = { india: "A bell shape: the base is narrowing and the working-age middle is wide &mdash; India's <b>demographic dividend</b>.", young: "A wide base: many children are being born. Typical of a <b>young, growing</b> population, like India in the 1950s or Nigeria.", stable: "Fairly straight sides: each group of children is about as big as the adults. A <b>stable</b> population.", aged: "Top-heavy: more older people than children. An <b>ageing</b> population, like Japan." };
    let cur = "india", quiz = null, qmsg = "";
    const sum = (a, i0, i1) => a.slice(i0, i1).reduce((x, y) => x + y, 0);
    const svg = (m, f) => { let sv = `<rect width="600" height="320" fill="var(--svgbg)"/><text x="160" y="18" font-size="13" font-weight="bold" text-anchor="middle" fill="${MALE}">Male</text><text x="440" y="18" font-size="13" font-weight="bold" text-anchor="middle" fill="${FEM}">Female</text>`;
      AGES.forEach((a, i) => { const y = 296 - (i + 1) * 16, wm = m[i] * 19, wf = f[i] * 19; sv += `<rect x="${272 - wm}" y="${y + 1}" width="${wm}" height="14" rx="2" fill="${grpCol(i)}"/><rect x="328" y="${y + 1}" width="${wf}" height="14" rx="2" fill="${grpCol(i)}" opacity=".75"/><text x="300" y="${y + 12}" font-size="11" text-anchor="middle" fill="var(--svgink)">${a}</text>`; });
      [0, 5, 10].forEach(v => sv += `<text x="${272 - v * 19}" y="312" font-size="11" text-anchor="middle" fill="var(--svgmuted)">${v}%</text><text x="${328 + v * 19}" y="312" font-size="11" text-anchor="middle" fill="var(--svgmuted)">${v}%</text>`);
      return sv; };
    const draw = () => {
      const k = quiz || cur, d = DS[k], m = d[1], f = d[2];
      const kid = (sum(m, 0, 3) + sum(f, 0, 3)) / 2, wk = (sum(m, 3, 12) + sum(f, 3, 12)) / 2, old = (sum(m, 12, 17) + sum(f, 12, 17)) / 2;
      el.innerHTML = `<div class="row">${Object.keys(DS).map(x => `<button class="btn small ${x === cur && !quiz ? "" : "sec"}" data-d="${x}">${DS[x][0]}</button>`).join("")}<button class="btn small ${quiz ? "" : "sec"}" id="pyQ">🎯 Quiz me</button></div>
        <div class="animwrap" style="margin-top:10px"><svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">${svg(m, f)}</svg></div>
        ${quiz ? `<p><b>What kind of population is this?</b></p><div class="row">${[["young", "Young and growing"], ["stable", "Stable"], ["aged", "Ageing"]].map(x => `<button class="btn small sec" data-a="${x[0]}">${x[1]}</button>`).join("")}</div><p>${qmsg}</p>` :
        `<p style="margin-bottom:4px"><b>${d[0]}</b>: <span style="color:${KID};font-weight:bold">0&ndash;14: ${kid.toFixed(1)}%</span> &middot; <span style="color:${WORK};font-weight:bold">15&ndash;59: ${wk.toFixed(1)}%</span> &middot; <span style="color:${OLD};font-weight:bold">60+: ${old.toFixed(1)}%</span></p><p style="margin-top:0">${NOTE[k]}</p>`}`;
      $$("[data-d]", el).forEach(b => b.onclick = () => { cur = b.dataset.d; quiz = null; draw(); });
      $("#pyQ", el).onclick = () => { const prev = quiz; do quiz = R.pick(Math.random, ["young", "stable", "aged"]); while (quiz === prev); qmsg = ""; draw(); };
      $$("[data-a]", el).forEach(b => b.onclick = () => { if (b.dataset.a === quiz){ const was = quiz; do quiz = R.pick(Math.random, ["young", "stable", "aged"]); while (quiz === was); qmsg = `<b style="color:var(--good)">✓ Right! That was ${DS[was][0].replace("Model: ", "")}.</b> Here is another one&hellip;`; } else qmsg = `<b style="color:var(--bad)">✗ Not quite.</b> Look at the base and the top: which is wider?`; draw(); });
    };
    draw();
  }
},

    ], [{ id: "pull", name: "🧲 Pull: attracts to a new place" }, { id: "push", name: "🚪 Push: drives away from home" }], { win: "Jobs and education pull; disasters, unrest and lack of facilities push." });

const mc = (q, opts, hint, sol) => ({ type: "mcq", q, opts, hint, sol });
const fill = (q, ans, hint, sol, ph) => ({ type: "fill", q, ans, hint, sol, ph });

  fill("Indians make up around ____ per cent of the world's population.", ["17"], "Roughly 1 in 6.", "About <b>17</b> per cent.", "%"),
  fill("The replacement level fertility rate is ____ children per woman.", ["2.1"], "A little more than two.", "<b>2.1</b> children per woman replaces the parents.", "number"),
  mc("Sex ratio means:", ["The number of females per 1,000 males", "The number of males per 1,000 females", "The number of children per family", "The number of births per 1,000 people"], "Females are counted against 1,000 males.", "Sex ratio = females per 1,000 males."),
  fill("India's sex ratio in Census 2011 was ____ females per 1,000 males.", ["943"], "It improved from 933 in 2001.", "It rose from 933 (2001) to <b>943</b> (2011).", "number"),

  mc("What is the median age of India's population, according to the book?", ["28 years", "50 years", "40 years", "18 years"], "India is young.", "India's median age is 28; Japan's is 50."),

];

  mc("A country's fertility rate stays at 1.5 for many years. What is likely to happen?", ["Its population may start to shrink over time", "Its population will grow quickly", "Its population will stay exactly the same", "Its birth rate will rise automatically"], "Compare with 2.1.", "Below the replacement level of 2.1, a population may shrink over time."),
  mc("Which is a reason the book gives for falling fertility rates?", ["More girls getting education and women in formal jobs", "More antibiotics and vaccines", "Fewer cities", "Lower cost of living in cities"], "Think about women's lives.", "Educated, working women tend to marry later and have fewer children; city life is also costly."),

  mc("A population pyramid is wider at the top than at the bottom. Which country does the book give as an example?", ["Japan", "Nigeria", "India", "Bihar"], "An ageing country.", "A wide top means an ageing population, as in Japan."),

  rng => { const b = R.int(rng, 14, 36), d = R.int(rng, 5, 13); return R.pick(rng, [
    fill(`A country's birth rate is ${b} and its death rate is ${d} (both per 1,000 people per year). With no migration, by how many people per 1,000 does it grow each year?`, [String(b - d)], "Births minus deaths.", `${b} &minus; ${d} = <b>${b - d}</b> more people per 1,000 each year.`, "per 1,000"),
    fill(`Birth rate ${b} and death rate ${d} per 1,000 people per year, and no migration. What is the yearly growth rate in per cent?`, [String((b - d) / 10)], "Per 1,000 ÷ 10 = per cent.", `${b} &minus; ${d} = ${b - d} per 1,000 = <b>${(b - d) / 10}</b>% a year.`, "%")]); },
  rng => { const m = R.pick(rng, [2000, 4000, 5000, 8000, 10000]), sr = R.int(rng, 880, 1020), f = m * sr / 1000; return fill(`A district has ${m} males and ${f} females. What is its sex ratio (females per 1,000 males)?`, [String(sr)], "Females ÷ males × 1,000.", `${f} ÷ ${m} &times; 1,000 = <b>${sr}</b> females per 1,000 males.`, "per 1,000"); },
  rng => { const tot = R.pick(rng, [200, 400, 500, 800, 1000]), p = R.int(rng, 2, 20), part = tot * p / 100; return fill(`A country has ${tot} lakh people, and ${part} lakh of them live in one state. What percentage of the country's people live in that state?`, [String(p), p + "%"], "Part ÷ total × 100.", `${part} ÷ ${tot} &times; 100 = <b>${p}%</b>.`, "%"); }
];
const challenge = [
  rng => { const P = R.pick(rng, [10000, 20000, 40000, 50000]), b = R.int(rng, 15, 30), d = R.int(rng, 5, 12), i = R.int(rng, 1, 9) * 50, o = R.int(rng, 1, 9) * 50; const B = P * b / 1000, D = P * d / 1000, ans = P + B - D + i - o;

  mc("Which step best helps India turn its demographic dividend into lasting progress?", ["Invest in education, skilling, healthcare and childcare such as daycare", "Encourage everyone to retire at 40", "Stop all migration to cities", "Reduce the number of schools"], "Prepare the young.", "Skilled, healthy workers, and support so women can work, make the most of the dividend."),

  rng => { const L = R.pick(rng, [[30, 70, "life expectancy rose from 30 years at Independence to 70 years in 2024", "years"], [5.7, 1.9, "India's fertility rate fell from 5.7 (1950) to 1.9 (2025)", "children"], [7.5, 1, "China's fertility rate fell from 7.5 (1963) to 1 (2025)", "children"], [933, 943, "India's sex ratio went from 933 (2001) to 943 (2011)", "females per 1,000 males"]]); const df = +Math.abs(L[1] - L[0]).toFixed(1); return fill(`The book says ${L[2]}. By how much did it change?`, [String(df)], "Find the difference.", `|${L[1]} &minus; ${L[0]}| = <b>${df}</b> ${L[3]}.`, L[3]); }

{

{

          "A few royal women stood out. <b>Razia Sultan</b> (first half of the 13th c.), the only woman ruler of the Delhi Sultanate, led campaigns, set up educational institutions and appeared unveiled at court. <b>Nur Jahan</b> (early 17th c.) issued royal orders; coins were minted in her name.",
          "In <b>south India</b> old norms mostly continued. Elite women issued grants and influenced politics. At Vijayanagara, <b>Fernão Nunes</b> saw women as wrestlers, astrologers, accountants, record-writers and musicians. Women donated villages to temples and built wells and community halls."],

          "<b>Kanchipuram</b> and <b>Sringeri</b> were famous for philosophy and mathematics; the <b>Kerala School</b> laid the seeds of infinite series and calculus. Vijayanagara's rulers followed <b>pūrvamaryade</b> (Kannada: following established practice) and supported temples and maṭhas.",

          "Crafts were taught by <b>apprenticeship</b> in the <b>jāti and śhreṇi</b> system. Weavers (the <b>Koshtis</b>) from Gujarat moved to <b>Banaras</b> with Akbar's encouragement; the Mughals brought <b>zarī/zardozī</b> and brocade. <b>Pashmina</b> shawls of Ladakh and Kashmir carried Persian floral motifs like the būtā (paisley)."],
