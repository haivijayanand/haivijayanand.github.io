<!DOCTYPE html>
<!--
TOOL:    xfoil-improvements-convergence-multielement.html - technical paper page (generated by build.py from Markdown via pandoc)
FAMILY:  technical-papers / xfoil-improvements-convergence-multielement
VERSION: 1.0.0
DATE:    2026-11-28
CHAT:    XFOIL improvements, history, branches and multi-element airfoils (2026-11-28)
CHANGES: 1.0.0 - first version: wide layout, contents sidebar (M to hide), light/dark theme, full screen, PDF link
STATUS:  draft for review
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
:root{--bg:#ffffff;--fg:#1d1f23;--muted:#5b6270;--line:#d9dde3;--panel:#f5f7fa;--accent:#0b5cad;--code:#eef1f5}
html[data-theme=dark]{--bg:#15181d;--fg:#e4e7ec;--muted:#9aa3b2;--line:#2d333c;--panel:#1c2027;--accent:#6cb0f5;--code:#232831}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.62 "Georgia","Times New Roman",serif}
header.bar{position:sticky;top:0;z-index:5;display:flex;gap:.5rem;align-items:center;padding:.45rem 1rem;background:var(--panel);border-bottom:1px solid var(--line);font:14px system-ui,sans-serif}
header.bar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
header.bar button,header.bar a{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.3rem .7rem;cursor:pointer;text-decoration:none}
header.bar button:hover,header.bar a:hover{border-color:var(--accent)}
.wrap{display:flex;max-width:1700px;margin:0 auto}
nav#toc{position:sticky;top:42px;align-self:flex-start;height:calc(100vh - 42px);overflow:auto;width:300px;flex:0 0 300px;padding:1rem 1rem 2rem;border-right:1px solid var(--line);font:14px/1.45 system-ui,sans-serif}
nav#toc ul{list-style:none;padding-left:.8rem;margin:.2rem 0}
nav#toc>ul{padding-left:0}
nav#toc a{color:var(--fg);text-decoration:none}
nav#toc a:hover{color:var(--accent)}
body.notoc nav#toc{display:none}
main{flex:1;min-width:0;padding:2rem 3.5rem 4rem;max-width:1250px}
h1.title{font-size:2.1rem;line-height:1.2;margin:.2rem 0 .3rem;text-align:center}
p.subtitle{font-size:1.3rem;text-align:center;margin:0 0 1rem;color:var(--muted)}
p.author{text-align:center;font-size:1.1rem;margin:.2rem 0}
p.date{text-align:center;color:var(--muted);margin:0 0 2rem}
.abstract,.keywords{background:var(--panel);border-left:4px solid var(--accent);padding:.8rem 1.2rem;margin:1rem 0}
.keywords{margin-top:-.6rem}
main{counter-reset:sec}
section.level1:not(.unnumbered){counter-increment:sec;counter-reset:sub}
section.level1:not(.unnumbered)>h1::before{content:counter(sec,upper-roman) ". "}
section.level1:not(.unnumbered) section.level2{counter-increment:sub}
section.level1:not(.unnumbered) section.level2>h2::before{content:counter(sub,upper-alpha) ". "}
h1{font-size:1.45rem;font-variant:small-caps;border-bottom:1px solid var(--line);padding-bottom:.2rem;margin-top:2.4rem}
h2{font-size:1.15rem;font-style:italic;margin-top:1.6rem}
a{color:var(--accent)}
figure{margin:1.6rem auto;text-align:center;max-width:760px}
figure img,figure svg{width:100%;height:auto;background:#fff;border-radius:6px;padding:6px}
figcaption{font-size:.92rem;color:var(--muted);text-align:left;margin-top:.4rem}
table{border-collapse:collapse;margin:1.4rem auto;font-size:.92rem;max-width:100%;display:block;overflow-x:auto}
caption{caption-side:top;font-size:.92rem;font-variant:small-caps;padding-bottom:.4rem;color:var(--muted)}
th,td{border-bottom:1px solid var(--line);padding:.35rem .7rem;vertical-align:top}
thead th{border-bottom:2px solid var(--fg);background:var(--panel)}
math[display=block]{margin:.8rem 0;font-size:1.08em;overflow-x:auto}
.refs p{padding-left:2.4em;text-indent:-2.4em;font-size:.93rem;margin:.3rem 0}
@media (max-width:900px){nav#toc{display:none}main{padding:1rem 1.1rem 3rem}}
@media print{header.bar,nav#toc{display:none}main{padding:0;max-width:none}body{font-size:11pt}}
</style>
</head>
<body>
<header class="bar">
  <button id="btoc" title="Show or hide contents (M)">☰ Contents</button>
  <span class="t">$title$</span>
  <a href="$slug$.pdf" download>Download PDF</a>
  <button id="btheme" title="Light / dark theme">◐ Theme</button>
  <button id="bfs" title="Full screen (F)">⛶ Full screen</button>
</header>
<div class="wrap">
<nav id="toc"><strong>Contents</strong>
$table-of-contents$
</nav>
<main>
<h1 class="title">$title$</h1>
<p class="subtitle">$subtitle$</p>
<p class="author">$author$</p>
<p class="date">$date$</p>
$body$
</main>
</div>
<script>
(function(){
  var root=document.documentElement, KEY='paper-theme';
  try{var t=localStorage.getItem(KEY); if(t) root.setAttribute('data-theme',t);}catch(e){}
  document.getElementById('btheme').onclick=function(){
    var t=root.getAttribute('data-theme')==='dark'?'light':'dark'; root.setAttribute('data-theme',t);
    try{localStorage.setItem(KEY,t);}catch(e){}
  };
  function toggleToc(){document.body.classList.toggle('notoc');}
  function toggleFs(){
    if(!document.fullscreenElement){(document.documentElement.requestFullscreen||function(){}).call(document.documentElement);}
    else{document.exitFullscreen();}
  }
  document.getElementById('btoc').onclick=toggleToc;
  document.getElementById('bfs').onclick=toggleFs;
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT'||e.ctrlKey||e.metaKey||e.altKey) return;
    if(e.key==='m'||e.key==='M') toggleToc();
    if(e.key==='f'||e.key==='F') toggleFs();
  });
})();
</script>
</body>
</html>
