<!DOCTYPE html>
<!--
TOOL    : speaks/_blogger_redirect.html — snippet for the Blogger theme of vijayanandspeaks.blogspot.com
FAMILY  : SITE
VERSION : 1.0.0
DATE    : 2026-10-05
CHAT    : Blogger to GitHub migration (Vijay Anand Speaks)
CHANGES : v1.0.0  sends every Blogger post to the same path under haivijayanand.github.io/speaks/
STATUS  : working

Use only AFTER the /speaks/ pages are live on GitHub Pages.
Blogger → Theme → ▾ (next to Customise) → Edit HTML → find <head> → paste the <script> below
on the line straight after <head> → Save. To undo, delete it again.

  /2026/09/slug.html (also ?m=1)   →  https://haivijayanand.github.io/speaks/2026/09/slug.html
  home page, labels, archive, search →  https://haivijayanand.github.io/speaks/
  Blogger static pages (/p/...)     →  left alone
Jekyll skips files that start with "_", so this file is not published.
-->
<script>
//<![CDATA[
(function () {
  var p = location.pathname, base = "https://haivijayanand.github.io/speaks";
  if (/^\/\d{4}\/\d{2}\/[^\/]+\.html$/.test(p)) { location.replace(base + p); return; }
  if (/^\/p\//.test(p)) return;
  location.replace(base + "/");
})();
//]]>
</script>
