<style>
:root{
  --bg:#f5f1e8; --card:#fffdf8; --ink:#1f1b16; --muted:#6b6257; --rule:#e2d9c8;
  --accent:#7a1f2b; --accent2:#a8462f; --gold:#9a7412; --ok:#2e7d4f; --bad:#b3261e; --info:#2c5d8a;
  --side:#2a1d1f; --side-ink:#f3e9e4; --side-muted:#c9b6ae; --hl:#f6e7c1; --chip:#efe6d6;
  --shadow:0 1px 3px rgba(40,25,10,.08); --bar:#7a1f2b; --bar2:#a8462f;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f; --card:#211b16; --ink:#efe7dc; --muted:#a99c8c; --rule:#3a3129;
  --accent:#e0828d; --accent2:#e59a7c; --gold:#e0bf5a; --ok:#6cc58e; --bad:#ff8a80; --info:#8ab8e6;
  --side:#0f0b09; --side-ink:#efe7dc; --side-muted:#a99c8c; --hl:#4a3b1c; --chip:#2c241d; --bar:#4e1520; --bar2:#6e2a1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130f; --card:#211b16; --ink:#efe7dc; --muted:#a99c8c; --rule:#3a3129;
  --accent:#e0828d; --accent2:#e59a7c; --gold:#e0bf5a; --ok:#6cc58e; --bad:#ff8a80; --info:#8ab8e6;
  --side:#0f0b09; --side-ink:#efe7dc; --side-muted:#a99c8c; --hl:#4a3b1c; --chip:#2c241d; --bar:#4e1520; --bar2:#6e2a1f; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,-apple-system,sans-serif}
h1,h2,h3,h4{font-family:Georgia,"Times New Roman",serif;line-height:1.25}
a{color:var(--info)}
button{font:inherit;cursor:pointer}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--bar);color:#fff;box-shadow:var(--shadow)}
#top h1{margin:0;font-size:19px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top h1 small{font-family:"Segoe UI",system-ui,sans-serif;font-weight:400;opacity:.85;font-size:13px;margin-left:8px}
.tbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 11px;font-size:14px}
.tbtn:hover{background:rgba(255,255,255,.26)}
.tbtn kbd{font-size:11px;opacity:.8;margin-left:4px}
#prog{font-size:13px;opacity:.9;white-space:nowrap}
#wrap{display:flex;min-height:calc(100vh - 50px)}
#side{width:270px;flex:0 0 270px;background:var(--side);color:var(--side-ink);padding:14px 10px 30px;position:sticky;top:50px;height:calc(100vh - 50px);overflow:auto}
body.sb-hidden #side{display:none}
#side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--side-muted);margin:16px 8px 6px}
#side a{display:flex;align-items:center;gap:8px;color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:8px;font-size:14.5px}
#side a:hover{background:rgba(255,255,255,.08)}
#side a.on{background:rgba(255,255,255,.16);font-weight:600}
#side a .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.12);font-size:12px;flex:0 0 22px}
#side a .done{margin-left:auto;color:#8fd6a8;font-size:13px}
#main{flex:1;min-width:0;padding:22px 32px 60px}
.inner{max-width:1500px;margin:0 auto}
@media (max-width:900px){
  #side{position:fixed;left:0;top:50px;z-index:30;box-shadow:4px 0 20px rgba(0,0,0,.3)}
  body:not(.sb-open) #side{display:none}
  body.sb-open.sb-hidden #side{display:block}
  #main{padding:16px}
  #top h1 small,#prog{display:none}
}
.hero{background:linear-gradient(120deg,var(--bar),var(--bar2));color:#fff;border-radius:14px;padding:22px 26px;margin-bottom:20px}
.hero h2{margin:0 0 6px;font-size:28px}
.hero p{margin:4px 0;opacity:.95;max-width:900px}
.unitban{border-left:6px solid var(--accent);background:var(--card);border-radius:10px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.unitban .k{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);font-weight:700}
.unitban h2{margin:2px 0 6px;font-size:26px}
.unitban p{margin:0;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1150px){.two{grid-template-columns:minmax(0,1fr)}} .two>*{min-width:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:20px;color:var(--accent)}
.card{overflow-x:auto} .row>*{max-width:100%} select{max-width:100%} .q,.qt,.opt{overflow-wrap:anywhere}
.card h4{margin:14px 0 6px;font-size:17px}
.lab{border-top:4px solid var(--gold)}
.lab h3{color:var(--gold)}
.lab h3::before{content:"LAB · ";font-family:"Segoe UI",system-ui,sans-serif;font-size:12px;letter-spacing:.1em;vertical-align:middle}
.key{background:var(--hl);border-radius:10px;padding:12px 16px;margin:10px 0;border-left:4px solid var(--gold)}
.key b:first-child{color:var(--gold)}
.ex{background:var(--chip);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:15px}
.ex::before{content:"Example  ";font-weight:700;color:var(--info);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
table.t{border-collapse:collapse;width:100%;margin:8px 0;font-size:15px}
table.t th,table.t td{border:1px solid var(--rule);padding:7px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--chip)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:13px;margin:2px 3px 2px 0}
.btn{background:var(--bar);color:#fff;border:0;border-radius:8px;padding:7px 14px;margin:3px 4px 3px 0;font-size:14.5px}
.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--chip);color:var(--ink);border:1px solid var(--rule)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:default}
.fb{margin-top:8px;padding:8px 12px;border-radius:8px;font-size:15px}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border-left:4px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);border-left:4px solid var(--bad)}
.fb.info{background:color-mix(in srgb,var(--info) 13%,transparent);border-left:4px solid var(--info)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:6px 9px}
textarea{width:100%;min-height:64px;resize:vertical}
input[type=text]{min-width:0}
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ucard{background:var(--card);border:1px solid var(--rule);border-top:4px solid var(--accent);border-radius:12px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink);text-decoration:none;display:block}
.ucard:hover{border-color:var(--accent);transform:translateY(-1px)}
.ucard .k{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ucard b{display:block;font-family:Georgia,serif;font-size:18px;margin:2px 0 4px}
.ucard span{color:var(--muted);font-size:14px}
.ucard .st{display:block;margin-top:6px;font-size:13px;color:var(--ok)}
.anim .stage{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:8px;overflow:auto}
.anim svg{width:100%;height:auto;display:block;max-height:560px}
.anim .cap{min-height:3.2em;margin:8px 2px;font-size:15.5px}
.anim .hint{font-size:12.5px;color:var(--muted)}
.anim .hint kbd,.kbd{color:var(--ink);background:var(--chip);border:1px solid var(--rule);border-radius:4px;padding:0 5px;font-size:12px;font-family:ui-monospace,Consolas,monospace}
svg .node rect{fill:var(--card);stroke:var(--rule);stroke-width:1.5}
svg .node text{fill:var(--ink);font:600 20px "Segoe UI",system-ui,sans-serif}
svg .node .sub{fill:var(--muted);font:15px "Segoe UI",system-ui,sans-serif;font-weight:400}
svg .node.hi rect{stroke:var(--accent);stroke-width:3;fill:var(--hl)}
svg .edge{stroke:var(--muted);stroke-width:1.6;fill:none}
svg .edge.hi{stroke:var(--accent);stroke-width:3.5}
svg .fade{opacity:0;transition:opacity .45s}
svg .show{opacity:1}
.sentence{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--rule)}
.sentence.ok select{border-color:var(--ok);outline:2px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.sentence.bad select{border-color:var(--bad);outline:2px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.sentence .why{grid-column:1/-1;font-size:14px;color:var(--muted)}
.act{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;font-family:Georgia,serif;font-size:15.5px}
.act .part{cursor:pointer;border-radius:4px;padding:1px 2px;transition:background .15s}
.act .part:hover{background:var(--hl)}
.act .part.sel{background:var(--hl);outline:2px solid var(--gold)}
.act .c{text-align:center}
.order li{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;margin:5px 0}
.order li span{flex:1}
.order li.ok{border-color:var(--ok)} .order li.bad{border-color:var(--bad)}
.flash{perspective:1200px;max-width:720px;margin:10px auto}
.fc{position:relative;height:260px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid var(--rule);box-shadow:var(--shadow)}
.fc .front{background:var(--card)}
.fc .front b{font-family:Georgia,serif;font-size:30px;color:var(--accent)}
.fc .back{background:var(--hl);transform:rotateY(180deg);font-size:18px}
.fc small{color:var(--muted);margin-top:10px;font-size:13px}
.q{margin:12px 0;padding:12px 16px;background:var(--bg);border:1px solid var(--rule);border-radius:10px}
.q .qt{font-weight:600;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--card))}
.score{font-size:22px;font-family:Georgia,serif}
.btn.right{background:color-mix(in srgb,var(--ok) 28%,var(--card));border-color:var(--ok);color:var(--ink);opacity:1}
.btn.wrong{background:color-mix(in srgb,var(--bad) 24%,var(--card));border-color:var(--bad);color:var(--ink);opacity:1}
.casecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.cc{background:var(--card);border:1px solid var(--rule);border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px}
.cc b{font-family:Georgia,serif;font-size:16.5px}
.cc .cit{font:13px ui-monospace,Consolas,monospace;color:var(--muted);display:block;margin:2px 0 6px}
.cc p{margin:4px 0;font-size:14.5px}
.search{width:100%;max-width:420px}
.foot{margin-top:30px;color:var(--muted);font-size:13px;border-top:1px solid var(--rule);padding-top:10px}
.decode{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.decode div{background:var(--chip);border-radius:8px;padding:8px 10px}
.decode div small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.decode div b{font-size:17px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
@media print{#top,#side,.noprint{display:none!important}#main{padding:0}.card{break-inside:avoid;box-shadow:none}}

<script>
"use strict";
/* ============================================================
   DATA AND UNIT PAGES (Sociology II)
   ============================================================ */
/*
TOOL:    ba-helpers.js — shared helpers for the B.A. LL.B. explorers (home page, footer, ordering lab, flow and ring animations)
FAMILY:  law-explorers
VERSION: 1.0.0
DATE:    2026-11-22
CHAT:    Kaavya Study Materials – TNNLU B.A. LL.B. Semester I and II explorers (claude.ai, 2026-11-22)
CHANGES: 1.0.0 - first version
*/
/* Each course content file defines HOME = {title, intro:[...], tips:[...], about:"..."} and FOOT = "footer text". */
function footer(){ return `<div class="foot">${FOOT}</div>`; }
function homeView(){
  const done=S.d.done;
  return `<div class="hero"><h2>${HOME.title}</h2>${HOME.intro.map(p=>`<p>${p}</p>`).join("")}</div>
  <div class="ucards">${UNITS.map(u=>`<a class="ucard" data-go="${u.id}"><span class="k">Unit ${u.n}</span><b>${u.title}</b><span>${u.short}</span>${done[u.id]?'<span class="st">✓ Done</span>':""}</a>`).join("")}
  ${EXTRAS.map(x=>`<a class="ucard" data-go="${x.id}" style="border-top-color:var(--gold)"><span class="k" style="color:var(--gold)">${x.ic} Revise</span><b>${x.title}</b></a>`).join("")}</div>
  <div class="two" style="margin-top:18px">
   <div class="card"><h3>How to study this course</h3><ol>${HOME.tips.map(t=>`<li>${t}</li>`).join("")}</ol></div>
   <div class="card"><h3>Keyboard</h3><table class="t">
   <tr><td><span class="kbd">M</span></td><td>Show or hide the unit list</td></tr>
   <tr><td><span class="kbd">P</span> / <span class="kbd">S</span> / <span class="kbd">X</span></td><td>Play, step, pause the animation on the page</td></tr>
   <tr><td><span class="kbd">F</span></td><td>Full screen</td></tr>
   <tr><td><span class="kbd">←</span> <span class="kbd">→</span> <span class="kbd">Space</span></td><td>Flashcards: previous, next, flip</td></tr>
   <tr><td><span class="kbd">[</span> <span class="kbd">]</span></td><td>Previous or next unit</td></tr></table>
   <p style="font-size:13.5px;color:var(--muted)">Works offline once opened. Sign in (top right) to keep progress and certificates on every device. The 🎓 button shows progress and the certificate.</p></div></div>
  <div class="card"><h3>About this syllabus</h3><p>${HOME.about}</p></div>
  ${footer()}`;
}

/* ---------------- ordering lab: put items in the right order ---------------- */
function orderLab(sel, items, note){
  const box=$(sel); let cur=shuffle(items.map((t,i)=>i));
  const draw=(checked)=>{
    const all=cur.every((k,i)=>k===i);
    box.innerHTML=`<ol class="order">${cur.map((k,pos)=>`<li class="${checked?(k===pos?"ok":"bad"):""}"><span>${checked?(k===pos?"✔ ":"✖ "):""}${esc(items[k])}</span><button class="btn sm sec" data-up="${pos}" ${pos===0?"disabled":""}>↑</button><button class="btn sm sec" data-dn="${pos}" ${pos===cur.length-1?"disabled":""}>↓</button></li>`).join("")}</ol>

/* ---------------- flow animation: a vertical chain of boxes ----------------
   items = [[title, subtitle], ...]; steps = one caption per box */
function flowSVG(p, items, label){
  const w=560, h=58, gap=20, x=40, H=items.length*(h+gap)-gap+12;
  let s=`<svg viewBox="0 0 640 ${H}" class="lg" role="img" aria-label="${esc(label||"")}"><defs><marker id="${p}mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  items.forEach((t,i)=>{ const y=6+i*(h+gap);
    s+=`<g id="${p}${i}" class="node fade"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/><text x="${x+w/2}" y="${y+(t[1]?25:36)}" text-anchor="middle">${t[0]}</text>${t[1]?`<text class="sub" x="${x+w/2}" y="${y+47}" text-anchor="middle">${t[1]}</text>`:""}</g>`;
    if(i<items.length-1) s+=`<path id="${p}a${i}" class="edge fade" d="M320 ${y+h+1} V${y+h+gap-2}" marker-end="url(#${p}mk)" style="color:var(--muted)"/>`;
  });
  return s+`</svg>`;
}
/* ring animation: boxes round a circle with arrows from each to the next (a cycle) */
function ringSVG(p, items, label, centre){
  const n=items.length, cx=320, cy=232, R=n<=4?185:200, bw=n<=4?212:160, bh=54;
  const ang=i=>-Math.PI/2+2*Math.PI*i/n, at=a=>[cx+R*Math.cos(a), cy+R*Math.sin(a)];
  /* gap (radians) left at each box so the arc starts and ends just outside it */
  const gap=a=>{ const c=Math.abs(Math.cos(a)), s=Math.abs(Math.sin(a)); return Math.min(Math.PI/n*0.85, (bw/2*s+bh/2*c+14)/R); };
  let s=`<svg viewBox="0 0 640 470" class="lg" role="img" aria-label="${esc(label||"")}"><defs><marker id="${p}mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>`;
  if(centre){ const L=centre.split("|"); s+=`<text x="${cx}" y="${cy+6-(L.length-1)*11}" text-anchor="middle" class="big">${L.map((l,i)=>`<tspan x="${cx}" dy="${i?22:0}">${l}</tspan>`).join("")}</text>`; }
  for(let i=0;i<n;i++){ const a1=ang(i)+gap(ang(i)), a2=ang(i+1)-gap(ang(i+1)); const [x1,y1]=at(a1), [x2,y2]=at(a2);
    s+=`<path id="${p}a${i}" class="edge fade" d="M${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}" marker-end="url(#${p}mk)" style="color:var(--muted)"/>`; }
  items.forEach((t,i)=>{ const [x,y]=at(ang(i));
    s+=`<g id="${p}${i}" class="node fade"><rect x="${(x-bw/2).toFixed(1)}" y="${(y-bh/2).toFixed(1)}" width="${bw}" height="${bh}" rx="10"/><text x="${x.toFixed(1)}" y="${(y+(t[1]?-3:7)).toFixed(1)}" text-anchor="middle">${t[0]}</text>${t[1]?`<text class="sub" x="${x.toFixed(1)}" y="${(y+18).toFixed(1)}" text-anchor="middle">${t[1]}</text>`:""}</g>`; });
  return s+`</svg>`;
}
/* drive a flow or ring: box k shows when step >= k; arrow k shows once box k+1 is shown (ring: last arrow closes the loop) */
function flowAnim(boxId, p, n, steps, ring){
  return makeAnim("#"+boxId, steps, i=>{
    for(let k=0;k<n;k++){ const g=document.getElementById(p+k); if(g){ g.classList.toggle("show",k<=i); g.classList.toggle("hi",k===i); } }
    for(let k=0;k<n;k++){ const e=document.getElementById(p+"a"+k); if(e) e.classList.toggle("show", ring ? (k<i || (k===n-1 && i===steps.length-1 && steps.length>n-1)) : k<i); }
  });
}

function makeAnim(rootSel, steps, apply){
  const root=$(rootSel); let i=-1, timer=null;
  const cap=$(".cap",root), ctr=$(".ctr",root);
  function show(k){ i=Math.max(-1,Math.min(steps.length-1,k)); apply(i); cap.innerHTML = i<0?"Press <b>P</b> to play or <b>S</b> to step through.":steps[i]; ctr.textContent=(i+1)+" / "+steps.length; }
  const ctl = {
    step(){ if(i>=steps.length-1){ this.pause(); return;} show(i+1); },
    back(){ show(i-1); },
    play(){ if(timer) return; if(i>=steps.length-1) show(-1); timer=setInterval(()=>{ if(i>=steps.length-1){ctl.pause();return;} show(i+1);},2200); ctl.step(); },
    pause(){ clearInterval(timer); timer=null; },
    reset(){ this.pause(); show(-1); },
    stop(){ this.pause(); }
  };
  $$("[data-a]",root).forEach(b=>b.addEventListener("click",()=>ctl[b.dataset.a]()));
  show(-1);
  return ctl;
}

 <h4>Objectivity and values</h4><p>Weber: values legitimately guide the <b>choice of topic</b>, but analysis should be <b>value-neutral</b>. Gunnar Myrdal: state your values openly so readers can judge. Reflexivity: be aware of how your caste, gender and class shape what you see.</p>
 <h4>Types of research</h4><ul><li><b>Pure</b> (builds theory) and <b>applied</b> (solves a practical problem).</li><li><b>Exploratory</b>, <b>descriptive</b>, <b>explanatory</b>.</li><li><b>Quantitative</b> (numbers) and <b>qualitative</b> (meanings); mixed methods combine them.</li></ul>
 <h4>Legal research</h4><p><b>Doctrinal</b> – what the law is (statutes, cases, commentary). <b>Non-doctrinal / socio-legal / empirical</b> – how law works in practice and its effects. Upendra Baxi and the Indian Law Institute encouraged socio-legal research from the 1970s; the Law Commission and Supreme Court increasingly rely on empirical data (e.g. on pendency and prisons).</p></div>
</div><div>
 ${animBox("rpAnim","The research process",RP_SVG)}
 <div class="card lab"><h3>Doctrinal or empirical?</h3><div id="lab1"></div></div>
</div></div>`+unitFoot(1)+footer(); },
 init(){
  anim=flowAnim("rpAnim","rp",7,[
   "<b>Choose the problem.</b> Start from curiosity or a policy gap, but check feasibility: time, access, money, ethics.",
   "<b>Review the literature.</b> Find what is already known, the theories used and the gap your work will fill.",
   "<b>State hypotheses or research questions</b>, with concepts defined and variables operationalised.",
   "<b>Design the research.</b> Decide the type of study, the population, sample, methods and tools.",
   "<b>Collect data</b> – pre-test (pilot) the tools first, then go to the field or the archive.",
   "<b>Analyse.</b> Edit and code data, tabulate, test hypotheses or find themes; interpret carefully.",
   "<b>Report.</b> Present findings honestly with limitations and suggestions for policy or further research."]);
  choiceLab("#lab1",[
   ["Analysing all Supreme Court judgments on Article 21 since 1978 to trace the meaning of 'life'.","D","Library-based study of legal texts."],
   ["Interviewing 200 litigants in Tiruchirappalli family court on delay.","E","Fieldwork on how law works."],
   ["Comparing the Hindu Marriage Act and the Special Marriage Act provisions on divorce.","D","Doctrinal comparison."],
   ["Using NCRB data to see whether conviction rates changed after a new law.","E","Empirical, quantitative."]
  ],{D:"Doctrinal",E:"Empirical / socio-legal"});
  miniQuiz(1);
 }};

/* ---------------- UNIT 2 ---------------- */
VIEWS.u2 = { html(){ return unitHead(2)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">A study is only as good as its <b>question</b>. Turn a broad interest into a narrow, researchable problem; define your <b>concepts</b>; state a testable <b>hypothesis</b> linking an <b>independent</b> and a <b>dependent</b> variable; then choose a <b>design</b> that can answer it.</div>
 <h4>Selecting a problem</h4><p>Criteria: interest, novelty, importance, feasibility (time, money, access), availability of data, ethical acceptability. From topic to problem: 'Legal aid' → 'Why do undertrials in Tiruchirappalli Central Prison not use free legal aid?'</p>
 <h4>Concepts and variables</h4><p>A <b>concept</b> is an abstract idea (poverty, access to justice); <b>operationalise</b> it into measurable <b>indicators</b> (household income below a line; distance to court). Variables: <b>independent</b> (cause), <b>dependent</b> (effect), <b>intervening</b> and <b>control</b> variables.</p>
 <h4>Hypothesis</h4><p>A tentative, testable statement about the relation between variables. Good hypotheses are clear, specific, testable, related to theory and value-free. Types: <b>descriptive</b>, <b>relational</b>, <b>causal</b>; <b>null</b> (H₀: no relationship) and <b>alternative</b> (H₁).</p>
 <h4>Research designs</h4><table class="t"><tr><th>Design</th><th>Use</th></tr>
 <tr><td>Experimental / quasi-experimental</td><td>Test causes with treatment and control groups</td></tr><tr><td>Cross-sectional survey</td><td>Snapshot of many cases at one time</td></tr>
 <tr><td>Longitudinal (panel, trend, cohort)</td><td>Change over time</td></tr><tr><td>Case study</td><td>In-depth study of one unit – a village, a court, a movement</td></tr>
 <tr><td>Comparative</td><td>Compare groups, regions or countries</td></tr></table></div>
</div><div>
 <div class="card lab"><h3>Find the variables</h3><p>Pick the <b>independent</b> variable (the cause) in each hypothesis.</p><div id="lab2"></div></div>
 <div class="card lab"><h3>Good hypothesis?</h3><div id="lab2b"></div></div>
</div></div>`+unitFoot(2)+footer(); },
 init(){
  const H=[["Women with more years of schooling are more likely to know about the Domestic Violence Act.",["Years of schooling","Knowledge of the Act","Women","Domestic violence"],0],
   ["Undertrials represented by private lawyers get bail faster than those with legal-aid lawyers.",["Type of lawyer","Time to get bail","Undertrials","Bail"],0],
   ["Villages with a nyaya panchayat file fewer civil suits in the district court.",["Presence of a nyaya panchayat","Number of civil suits filed","District court","Villages"],0],
   ["Law students who moot more score higher in oral examinations.",["Mooting experience","Oral examination scores","Law students","Examinations"],0]];
  $("#lab2").innerHTML=H.map((h,i)=>qHTML([2,h[0],h[1],h[2],`Independent: ${h[1][0]}; dependent: ${h[1][1]}.`],"hv"+i)).join(""); bindQ($("#lab2"));
  choiceLab("#lab2b",[
   ["'Justice is good.'","N","Not testable – a value statement."],
   ["'Literacy rates are positively related to voter turnout in Tamil Nadu districts.'","Y","Clear, specific, testable."],
   ["'Courts are sometimes slow and sometimes not.'","N","Vague – cannot be wrong."],
   ["'Fast-track courts reduce the average time to verdict in sexual-offence trials.'","Y","Causal and testable."]
  ],{Y:"Good hypothesis",N:"Not a good hypothesis"});
  miniQuiz(2);
 }};

/* ---------------- UNIT 3 ---------------- */
VIEWS.u3 = { html(){ return unitHead(3)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">We rarely study everyone. A <b>sample</b> lets us learn about a <b>population</b> – but only if it is chosen so that it represents that population. <b>Probability</b> samples allow us to estimate error; <b>non-probability</b> samples are quicker but riskier.</div>
 <h4>Probability sampling</h4><table class="t"><tr><th>Method</th><th>How</th><th>Example</th></tr>
 <tr><td>Simple random</td><td>Lottery or random numbers – equal chance</td><td>200 names from the voters' list by computer</td></tr>
 <tr><td>Systematic</td><td>Every k-th unit after a random start</td><td>Every 10th case file in the register</td></tr>
 <tr><td>Stratified</td><td>Random within strata</td><td>Equal numbers of urban and rural litigants</td></tr>
 <tr><td>Cluster / multi-stage</td><td>Randomly choose groups, then units</td><td>NFHS: districts → villages → households</td></tr></table>
 <h4>Non-probability sampling</h4><table class="t"><tr><th>Method</th><th>How</th><th>Risk</th></tr>
 <tr><td>Convenience</td><td>Whoever is easy to reach</td><td>Strong bias</td></tr><tr><td>Purposive (judgemental)</td><td>Chosen for expertise or typicality</td><td>Depends on judgement</td></tr>
 <tr><td>Quota</td><td>Fill set numbers of each type</td><td>Non-random within quotas</td></tr><tr><td>Snowball</td><td>Respondents refer others</td><td>Network bias; useful for hidden groups</td></tr></table>
 <h4>Sample size and error</h4><p>Sampling error falls as sample size rises (roughly with √n), but a large biased sample is still wrong – the 1936 <i>Literary Digest</i> poll of 2.4 million wrongly predicted Roosevelt's defeat because its frame (telephone and car owners) over-represented the rich.</p></div>
</div><div>
 <div class="card lab"><h3>Sampling simulator</h3><p>A town of 1,000 adults: <b>30%</b> have used legal aid. People near the court (the first 200 on the list) use it far more. Draw samples and compare the estimate with the truth.</p>
  <div class="row"><label>Sample size <input type="range" id="smN" min="20" max="400" step="20" value="100"></label><span id="smNv"></span></div>
  <div class="row"><button class="btn" id="smR">Random sample</button><button class="btn sec" id="smC">Convenience sample (near the court)</button><button class="btn sec sm" id="smClr">Clear</button></div>
  <div id="smG"></div><div id="smOut" class="fb info">Draw a few samples of each kind.</div></div>
 <div class="card lab"><h3>Name the sampling method</h3><div id="lab3"></div></div>
</div></div>`+unitFoot(3)+footer(); },
 init(){
  const POP=[]; for(let i=0;i<1000;i++){ const nearP=i<200?0.75:0.1875; POP.push(Math.random()<nearP?1:0); }
  const truth=POP.reduce((a,b)=>a+b)/10; let R=[],C=[];
  const draw=()=>{ $("#smNv").textContent=" "+$("#smN").value;
   const X=v=>40+v*5, s=`<svg viewBox="0 0 560 170" class="graph"><line class="axis" x1="40" y1="120" x2="540" y2="120"/>${[0,20,40,60,80,100].map(v=>`<text class="tick" x="${X(v)}" y="140" text-anchor="middle">${v}%</text>`).join("")}
    <line class="ctl" x1="${X(truth)}" y1="20" x2="${X(truth)}" y2="120"/><text class="ctlt" x="${X(truth)+5}" y="32">true ${truth.toFixed(1)}%</text>
    ${R.map(v=>`<circle class="dotp" cx="${X(v)}" cy="${70+(Math.random()*20-10)}" r="6"/>`).join("")}${C.map(v=>`<rect class="boxp" x="${X(v)-6}" y="${95+(Math.random()*14-7)}" width="12" height="12"/>`).join("")}
    <text class="tick" x="44" y="62">● random</text><text class="tick" x="44" y="160">■ convenience</text></svg>`;
   $("#smG").innerHTML=s; };
  const sample=conv=>{ const n=+$("#smN").value; let k=0; for(let j=0;j<n;j++){ const idx=conv?Math.floor(Math.random()*Math.min(250,1000)):Math.floor(Math.random()*1000); k+=POP[idx]; } return 100*k/n; };
  const report=()=>{ const avg=a=>a.length?(a.reduce((x,y)=>x+y)/a.length).toFixed(1)+"%":"–";
   $("#smOut").innerHTML=`Random samples average <b>${avg(R)}</b>; convenience samples average <b>${avg(C)}</b>; the truth is <b>${truth.toFixed(1)}%</b>. Random estimates scatter around the truth and tighten as the sample grows. Convenience estimates are biased – a bigger sample does not cure that.`; };
  $("#smR").onclick=()=>{ R.push(sample(false)); draw(); report(); };
  $("#smC").onclick=()=>{ C.push(sample(true)); draw(); report(); };
  $("#smClr").onclick=()=>{ R=[];C=[]; draw(); $("#smOut").textContent="Draw a few samples of each kind."; };
  $("#smN").oninput=draw; draw();
  choiceLab("#lab3",[
   ["Every 20th FIR from the station register after picking the first at random.","SY","Systematic."],
   ["Interviewing whoever comes out of the court building between 10 and 12.","CO","Convenience."],
   ["Randomly choosing 10 districts, then 5 villages in each, then 10 households per village.","CL","Multi-stage cluster."],
   ["Asking each bonded labourer interviewed to introduce others.","SN","Snowball."],
   ["Dividing lawyers by years of practice and drawing a random sample from each band.","ST","Stratified."]
  ],{SY:"Systematic",ST:"Stratified",CL:"Cluster",CO:"Convenience",SN:"Snowball"});
  miniQuiz(3);
 }};

/* ---------------- UNIT 4 ---------------- */
VIEWS.u4 = { html(){ return unitHead(4)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">Choose the method that fits the question: <b>surveys</b> for 'how many', <b>observation and interviews</b> for 'how and why', <b>documents</b> for what institutions record. Combine methods to check one against another (<b>triangulation</b>).</div>
 <table class="t"><tr><th>Method</th><th>Strength</th><th>Weakness</th><th>Example</th></tr>
 <tr><td>Participant observation</td><td>Rich, inside view</td><td>Time; observer effect; bias</td><td>M.N. Srinivas, <i>The Remembered Village</i></td></tr>
 <tr><td>Non-participant observation</td><td>Less intrusive</td><td>Misses meanings</td><td>Watching bail hearings from the gallery</td></tr>
 <tr><td>Structured interview / schedule</td><td>Comparable answers; works with non-literate respondents</td><td>Costly; interviewer bias</td><td>Census, NFHS</td></tr>
 <tr><td>Unstructured / in-depth interview</td><td>Depth, unexpected insights</td><td>Hard to compare</td><td>Life histories of prisoners</td></tr>
 <tr><td>Questionnaire (mailed/online)</td><td>Cheap, wide reach, anonymous</td><td>Low response; literate only</td><td>Student surveys</td></tr>
 <tr><td>Case study</td><td>Holistic depth</td><td>Hard to generalise</td><td>One village panchayat</td></tr>
 <tr><td>Focus group</td><td>Group views and interaction</td><td>Dominant voices</td><td>Women's views on a new law</td></tr>
 <tr><td>Secondary data</td><td>Quick, large</td><td>Not made for your question</td><td>Census, NCRB, NJDG, NSSO</td></tr>
 <tr><td>Content analysis</td><td>Systematic study of texts</td><td>Only what is written</td><td>Coding judgments or news reports</td></tr></table>
 <h4>Writing good questions</h4><ul><li>Simple words; one idea per question.</li><li>No leading, loaded or double-barrelled questions.</li><li>Clear time frames ('in the last 12 months').</li><li>Sensitive questions later, after rapport.</li><li>Always <b>pre-test</b> (pilot) the tool.</li></ul></div>
</div><div>
 <div class="card lab"><h3>Fix the survey question</h3><div id="lab4"></div></div>
 <div class="card lab"><h3>Which method fits?</h3><div id="lab4b"></div></div>
</div></div>`+unitFoot(4)+footer(); },
 init(){
  choiceLab("#lab4",[
   ["'Are the police in your area honest and efficient?'","DB","Two questions in one – ask separately."],
   ["'Don't you agree that corrupt judges should be jailed?'","LE","Suggests the answer."],
   ["'How many times have you visited the taluk court in the last 12 months?'","OK","Clear, single, with a time frame."],
   ["'What is your opinion on the jurisprudential underpinnings of the adversarial system?'","JA","Jargon – use simple words."],
   ["'Have you stopped bribing officials?'","LE","Loaded – assumes the respondent did."]
  ],{OK:"Good question",DB:"Double-barrelled",LE:"Leading / loaded",JA:"Jargon"});
  choiceLab("#lab4b",[
   ["How many households in Tamil Nadu own land titled in a woman's name?","SV","A large survey or secondary data."],
   ["How do transgender persons experience applying for identity certificates?","IN","In-depth interviews."],
   ["How do High Court judgments describe rape survivors over 20 years?","CA","Content analysis of judgments."],
   ["How does a village panchayat actually settle land disputes?","PO","Participant or non-participant observation and case study."]
  ],{SV:"Survey",IN:"In-depth interviews",CA:"Content analysis",PO:"Observation"});
  miniQuiz(4);
 }};

/* ---------------- UNIT 5 ---------------- */
VIEWS.u5 = { html(){ return unitHead(5)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">Measurement turns observations into data. The <b>level of measurement</b> decides which statistics you may use; <b>reliability</b> and <b>validity</b> decide whether the data can be trusted.</div>
 <h4>Levels of measurement</h4><table class="t"><tr><th>Level</th><th>Property</th><th>Example</th><th>Average</th></tr>
 <tr><td>Nominal</td><td>Categories only</td><td>Religion, state of residence</td><td>Mode</td></tr>
 <tr><td>Ordinal</td><td>Ordered categories</td><td>Satisfaction: low / medium / high</td><td>Median</td></tr>
 <tr><td>Interval</td><td>Equal intervals, no true zero</td><td>Temperature in °C</td><td>Mean</td></tr>
 <tr><td>Ratio</td><td>Equal intervals and true zero</td><td>Income, age, days in jail</td><td>Mean</td></tr></table>
 <h4>Scales</h4><p><b>Likert</b> (agree–disagree, usually 5 points), <b>Bogardus social distance</b> scale (willingness to accept groups as neighbours, friends, relatives – used in caste studies), <b>Thurstone</b> and <b>Guttman</b> scales.</p>
 <h4>Reliability and validity</h4><p><b>Reliability</b>: consistency (test–retest, inter-coder agreement). <b>Validity</b>: accuracy – does it measure what it claims? A clock that is always 10 minutes fast is reliable but not valid.</p>
 <h4>Processing and analysis</h4><ol><li><b>Editing</b> – check completeness and consistency.</li><li><b>Coding</b> – give numbers or labels to answers.</li><li><b>Tabulation</b> – frequency tables and cross-tabulations.</li><li><b>Statistics</b> – percentages, mean, median, mode, correlation, tests of significance.</li><li><b>Qualitative analysis</b> – thematic coding of interviews, finding patterns and quotes.</li><li><b>Interpretation</b> – what the findings mean; correlation is not causation.</li></ol></div>
</div><div>
 <div class="card lab"><h3>Which level of measurement?</h3><div id="lab5"></div></div>
 <div class="card lab"><h3>Quick statistics</h3><p>Enter numbers (e.g. days each undertrial spent in jail before bail), separated by commas.</p><input type="text" id="stIn" value="12, 30, 45, 7, 90, 30, 365, 21, 30, 60" style="width:100%"><div class="row"><button class="btn" id="stGo">Compute</button></div><div id="stOut"></div></div>
</div></div>`+unitFoot(5)+footer(); },
 init(){
  choiceLab("#lab5",[
   ["Mother tongue of respondents.","NO","Categories only."],
   ["Ranking of satisfaction with legal aid: poor, fair, good, excellent.","OR","Ordered."],
   ["Number of hearings before judgment.","RA","Counts have a true zero."],
   ["Year of birth (calendar year).","IN","Equal intervals, but year 0 is not 'no time'."],
   ["Monthly household income in rupees.","RA","True zero."]
  ],{NO:"Nominal",OR:"Ordinal",IN:"Interval",RA:"Ratio"});
  $("#stGo").onclick=()=>{ const a=$("#stIn").value.split(/[ ,;]+/).map(Number).filter(x=>!isNaN(x)&&x!==""); if(!a.length){ $("#stOut").innerHTML=""; return; }
   const s=a.slice().sort((x,y)=>x-y), n=s.length, mean=a.reduce((x,y)=>x+y)/n, med=n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;
   const f={}; a.forEach(x=>f[x]=(f[x]||0)+1); const mx=Math.max(...Object.values(f)); const mode=Object.keys(f).filter(k=>f[k]===mx);
   const sd=Math.sqrt(a.reduce((t,x)=>t+(x-mean)**2,0)/n);
   $("#stOut").innerHTML=`<table class="t"><tr><td>n</td><td>${n}</td></tr><tr><td>Mean</td><td>${mean.toFixed(1)}</td></tr><tr><td>Median</td><td>${med}</td></tr><tr><td>Mode</td><td>${mx>1?mode.join(", "):"none (all values different)"}</td></tr><tr><td>Range</td><td>${s[0]} – ${s[n-1]}</td></tr><tr><td>Standard deviation</td><td>${sd.toFixed(1)}</td></tr></table><div class="fb info">${mean>med*1.3?"The mean is well above the median – a few very large values (like 365 days) pull it up. For skewed data such as time in jail, report the <b>median</b>.":"Mean and median are close – the data are fairly symmetric."}</div>`; };
  $("#stGo").click();
  miniQuiz(5);
 }};

VIEWS.u6 = { html(){ return unitHead(6)+`
<div class="two"><div>
 <div class="card"><h3>Key idea</h3><div class="key">Research involves real people. Respect their <b>autonomy</b> (informed consent), protect them from <b>harm</b>, keep their <b>confidence</b>, and report <b>honestly</b> – including what did not work.</div>
 <h4>Ethical principles</h4><ul><li><b>Informed consent</b> – purpose, procedures, risks, the right to refuse or withdraw; special care with children, prisoners and people in distress.</li><li><b>Confidentiality and anonymity</b> – remove identifying details; secure the data. The Digital Personal Data Protection Act, 2023 governs personal data processing.</li><li><b>No harm</b> – avoid re-traumatising survivors; give referral information for support.</li><li><b>Deception</b> only when unavoidable and approved, with debriefing.</li><li><b>Integrity</b> – no fabrication, falsification or plagiarism (UGC Regulations, 2018).</li><li><b>Ethics review</b> – many universities require approval by an institutional ethics committee before fieldwork.</li></ul>
 <h4>Structure of a research report</h4><ol><li>Title, acknowledgements, abstract</li><li>Introduction – problem, objectives, research questions or hypotheses</li><li>Review of literature</li><li>Methodology – design, sample, tools, limitations</li><li>Findings and analysis (tables, quotes)</li><li>Conclusion and suggestions</li><li>Bibliography and appendices (questionnaire, consent form)</li></ol>
 <h4>Empirical legal research in India – examples</h4><ul><li><b>Project 39A</b> (NLU Delhi), <i>Death Penalty India Report</i> (2016) – interviews with prisoners sentenced to death.</li><li><b>India Justice Report</b> (Tata Trusts and partners, from 2019) – ranks States on police, prisons, judiciary and legal aid using official data.</li><li><b>DAKSH</b> studies of court delay using National Judicial Data Grid data.</li><li>Law Commission reports that use field data (e.g. on arrears and bail).</li></ul></div>
</div><div>
 <div class="card lab"><h3>Ethical or not?</h3><div id="lab6"></div></div>
 <div class="card lab"><h3>Put the report in order</h3><div id="lab6b"></div></div>
</div></div>`+unitFoot(6)+footer(); },
 init(){
  choiceLab("#lab6",[
   ["Recording interviews with undertrials secretly to get 'honest' answers.","U","No consent."],
   ["Replacing respondents' names with codes and storing the key separately.","E","Protects confidentiality."],
   ["Telling a survivor she cannot stop the interview once it has begun.","U","The right to withdraw must be respected."],
   ["Explaining the study in Tamil, answering questions, then taking written or recorded consent.","E","Informed consent in the respondent's language."],
   ["Dropping cases that do not fit the hypothesis from the analysis without mentioning it.","U","Falsification."]
  ],{E:"Ethical",U:"Unethical"});
  orderLab("#lab6b",["Abstract","Introduction and research questions","Review of literature","Methodology","Findings and analysis","Conclusion and suggestions","Bibliography and appendices"],"The standard order of a research report.");
  miniQuiz(6);
 }};

 <div class="card"><h3>Related</h3><p><a href="/tools/llb-sociology.html?prog=ba">Sociology I</a> · <a href="/tools/llb-research-tools.html">Research Tools (B.Com. LL.B.)</a> – more statistics labs.</p></div></div></div>`+footer(); }};

/* ---------------- CASES (torts version: Indian cases → Indian Kanoon, English → BAILII search) ---------------- */
VIEWS.cases = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Leading cases</h2><p>${CASES.length} cases. Indian cases link to Indian Kanoon; English and other cases link to a web search (internet needed).</p></div>
 <div class="card"><div class="row"><input type="text" id="csS" class="search" placeholder="Search cases…"><select id="csU"><option value="0">All units</option>${UNITS.map(u=>`<option value="${u.n}">Unit ${u.n}: ${u.title}</option>`).join("")}</select><select id="csI"><option value="">Indian and foreign</option><option value="1">Indian only</option><option value="0">Foreign only</option></select></div></div><div class="casecards" id="csB"></div>`+footer(); },
 init(){ const draw=()=>{ const q=$("#csS").value.toLowerCase(), u=+$("#csU").value, ind=$("#csI").value; $("#csB").innerHTML=CASES.filter(c=>(c.n+c.c+c.p).toLowerCase().includes(q)&&(!u||c.u===u)&&(ind===""||String(c.in)===ind)).map(c=>`<div class="cc"><b><a href="${c.in?"https://indiankanoon.org/search/?formInput="+encodeURIComponent(c.n):"https://duckduckgo.com/?q="+encodeURIComponent(c.n+" "+c.c)}" target="_blank" rel="noopener">${esc(c.n)}</a></b><span class="cit">${esc(c.c)} · Unit ${c.u} · ${c.in?"India":"Foreign"}</span><p>${esc(c.p)}</p></div>`).join(""); }; draw(); $("#csS").oninput=draw; $("#csU").onchange=draw; $("#csI").onchange=draw; }};

/* ---------------- FLASHCARDS ---------------- */
let fIdx=0, fDeck=FLASH.slice();
VIEWS.flash = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Flashcards</h2><p>${FLASH.length} key terms. Click the card or press Space to flip; use ← → to move.</p></div>
 <div class="card"><div class="flash"><div class="fc" id="fc"><div class="front"><b id="fFront"></b><small>Click or Space to see the meaning</small></div><div class="back"><div id="fBack"></div><small id="fCount"></small></div></div></div>
 <div class="row" style="justify-content:center"><button class="btn sec" id="fPrev">← Previous</button><button class="btn" id="fFlip">Flip</button><button class="btn sec" id="fNext">Next →</button><button class="btn sec" id="fShuf">Shuffle</button><span id="fPos" style="margin-left:10px;color:var(--muted)"></span></div></div>`+footer(); },
 init(){ fIdx=0; this.show(); $("#fc").onclick=()=>$("#fc").classList.toggle("flip"); $("#fFlip").onclick=()=>$("#fc").classList.toggle("flip"); $("#fPrev").onclick=()=>this.move(-1); $("#fNext").onclick=()=>this.move(1); $("#fShuf").onclick=()=>{fDeck=shuffle(FLASH); fIdx=0; this.show();}; },
 show(){ const c=fDeck[fIdx]; $("#fc").classList.remove("flip"); $("#fFront").textContent=c[0]; $("#fBack").textContent=c[1]; $("#fPos").textContent=`${fIdx+1} / ${fDeck.length}`; },
 move(d){ fIdx=(fIdx+d+fDeck.length)%fDeck.length; this.show(); }
};

/* ---------------- MAXIMS ---------------- */
VIEWS.maxims = { html(){ return `<div class="unitban"><div class="k">Revise</div><h2>Latin maxims and terms</h2><p>Phrases you will meet in judgments from the first week. Search to filter.</p></div>
 <div class="card"><input type="text" id="mxS" class="search" placeholder="Search maxims…"><table class="t" style="margin-top:10px"><thead><tr><th>Maxim</th><th>Literal meaning</th><th>How it is used</th></tr></thead><tbody id="mxB"></tbody></table></div>`+footer(); },
 init(){ const draw=q=>{ q=(q||"").toLowerCase(); $("#mxB").innerHTML=MAXIMS.filter(m=>m.join(" ").toLowerCase().includes(q)).map(m=>`<tr><td><b><i>${esc(m[0])}</i></b></td><td>${esc(m[1])}</td><td>${esc(m[2])}</td></tr>`).join(""); }; draw(); $("#mxS").oninput=e=>draw(e.target.value); }};

/* ---------------- QUIZ ---------------- */
VIEWS.quiz = { html(){ return `<div class="unitban"><div class="k">Test yourself</div><h2>Quiz</h2><p>${QUIZ.length} questions in the bank. Pick a unit or take a mixed set of 10.</p></div>
 <div class="card"><div class="row"><select id="qU"><option value="0">All units (10 random)</option>${UNITS.map(u=>`<option value="${u.n}">Unit ${u.n}: ${u.title}</option>`).join("")}</select><button class="btn" id="qStart">Start</button><span id="qBest" style="color:var(--muted)"></span></div></div>
 <div class="card" id="qBox" hidden><div id="qList"></div><div class="row" style="margin-top:10px"><span class="score" id="qScore"></span></div></div>`+footer(); },
 init(){
  const best=()=>{ const b=S.d.best, u=$("#qU").value; $("#qBest").textContent = b[u]!=null ? `Best: ${b[u]}%` : ""; };
  $("#qU").onchange=best; best();
  $("#qStart").onclick=()=>{
    const u=+$("#qU").value; const pool = u? QUIZ.filter(q=>q[0]===u) : QUIZ; const set = shuffle(pool).slice(0, u?pool.length:10);
    let got=0, ans=0; $("#qBox").hidden=false; $("#qList").innerHTML=set.map((q,i)=>qHTML(q,"q"+i)).join(""); $("#qScore").textContent=`0 / ${set.length}`;
    bindQ($("#qList"), ok=>{ ans++; if(ok) got++; $("#qScore").textContent=`${got} / ${set.length}` + (ans===set.length?`  ·  ${Math.round(100*got/set.length)}%`:"");
      if(ans===set.length){ const pct=Math.round(100*got/set.length), k=String(u); if(S.d.best[k]==null||pct>S.d.best[k]){S.d.best[k]=pct; S.save();} best(); toast(pct>=80?"Excellent!":pct>=50?"Good – revise the ones you missed.":"Revisit the units and try again."); } });
  };
 }};

/* ---------------- CASE BRIEF BUILDER ---------------- */
const BF = [["name","Case name"],["cit","Citation"],["court","Court and bench (judges)"],["facts","Facts (material facts only)"],["issues","Issues"],["argsP","Arguments – petitioner / appellant"],["argsR","Arguments – respondent"],["held","Held (decision)"],["ratio","Ratio decidendi"],["obiter","Obiter dicta"],["notes","My comments – do I agree? Is it still good law?"]];
let briefEdit = -1;
VIEWS.brief = { html(){ return `<div class="unitban"><div class="k">Practise</div><h2>Case brief builder</h2><p>Brief every judgment taught in class. Briefs are saved in this browser; download them as text to keep a copy.</p></div>
 <div class="two"><div class="card"><h3 id="bfTitle">New brief</h3>${BF.map(([k,l])=>`<label style="display:block;margin:8px 0 2px;font-weight:600;font-size:14px">${l}</label>${k==="name"||k==="cit"||k==="court"?`<input type="text" id="bf_${k}" style="width:100%">`:`<textarea id="bf_${k}"></textarea>`}`).join("")}
 <div class="row" style="margin-top:10px"><button class="btn" id="bfSave">Save brief</button><button class="btn sec" id="bfNew">Clear</button><button class="btn sec" id="bfDl">Download as .txt</button><button class="btn sec" onclick="window.print()">Print</button></div></div>
 <div class="card"><h3>Saved briefs</h3><div id="bfList"></div><div class="key" style="margin-top:14px"><b>Tip.</b> Keep each brief to one page. If you cannot state the ratio in two sentences, read the judgment's analysis again.</div></div></div>`+footer(); },
 init(){ briefEdit=-1; this.list(); $("#bfSave").onclick=()=>this.save(); $("#bfNew").onclick=()=>{briefEdit=-1; BF.forEach(([k])=>$("#bf_"+k).value=""); $("#bfTitle").textContent="New brief";}; $("#bfDl").onclick=()=>this.dl(); },
 collect(){ const o={}; BF.forEach(([k])=>o[k]=$("#bf_"+k).value.trim()); return o; },
 save(){ const o=this.collect(); if(!o.name){toast("Add a case name first"); return;} if(briefEdit>=0) S.d.briefs[briefEdit]=o; else S.d.briefs.push(o); S.save(); briefEdit=S.d.briefs.indexOf(o); toast("Brief saved"); this.list(); },
 list(){ const b=S.d.briefs; $("#bfList").innerHTML = b.length ? b.map((x,i)=>`<div class="row" style="border-bottom:1px solid var(--rule);padding:6px 0"><span style="flex:1"><b>${esc(x.name)}</b><br><small style="color:var(--muted)">${esc(x.cit||"")}</small></span><button class="btn sm sec" data-ed="${i}">Open</button><button class="btn sm sec" data-del="${i}">Delete</button></div>`).join("") : `<p style="color:var(--muted)">No briefs yet.</p>`;
   $$("[data-ed]").forEach(btn=>btn.onclick=()=>{ briefEdit=+btn.dataset.ed; const x=S.d.briefs[briefEdit]; BF.forEach(([k])=>$("#bf_"+k).value=x[k]||""); $("#bfTitle").textContent="Editing: "+x.name; });
   $$("[data-del]").forEach(btn=>btn.onclick=()=>{ S.d.briefs.splice(+btn.dataset.del,1); S.save(); briefEdit=-1; this.list(); }); },
 dl(){ const o=this.collect(); const txt=BF.map(([k,l])=>l.toUpperCase()+"\n"+(o[k]||"-")+"\n").join("\n"); const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([txt],{type:"text/plain"})); a.download=(o.name||"case-brief").replace(/[^\w\- ]+/g,"").slice(0,60)+".txt"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
};

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", e=>{
  const g=e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const d=e.target.closest("[data-done]"); if(d){ const id=d.dataset.done; S.d.done[id]=!S.d.done[id]; S.save(); d.textContent=S.d.done[id]?"✓ Marked as done":"Mark this unit as done"; renderSide(); toast(S.d.done[id]?"Unit marked as done":"Unit unmarked"); }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea,select")||e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key.toLowerCase();
  if(k==="m"){ setSidebar(!sidebarHidden(), true); }
  else if(k==="f"){ toggleFS(); }
  else if(anim && k==="p"){ anim.play(); }
  else if(anim && k==="s"){ anim.pause(); anim.step(); }
  else if(anim && k==="x"){ anim.pause(); }
  else if(cur==="flash" && (e.key==="ArrowRight"||e.key==="ArrowLeft")){ VIEWS.flash.move(e.key==="ArrowRight"?1:-1); }
  else if(cur==="flash" && e.key===" "){ e.preventDefault(); $("#fc").classList.toggle("flip"); }
  else if(k==="["||k==="]"){ const i=UNITS.findIndex(u=>u.id===cur); const ni = i<0 ? (k==="]"?0:-1) : i+(k==="]"?1:-1); if(ni>=0&&ni<UNITS.length) go(UNITS[ni].id); }
});
$("#sbBtn").onclick=()=>setSidebar(!sidebarHidden(), true);
$("#fsBtn").onclick=toggleFS;
$("#themeBtn").onclick=()=>{ const dark = document.documentElement.getAttribute("data-theme")==="dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme:dark)").matches); setTheme(dark?"light":"dark"); };
document.addEventListener("fullscreenchange",()=>{ $("#fsBtn").textContent = document.fullscreenElement ? "⛶ Exit full screen" : "⛶ Full screen"; });
(function boot(){
  try{ const t=localStorage.getItem("llb_theme"); if(t) setTheme(t); }catch(e){}
  let h=false; try{ h=localStorage.getItem(SBKEY)==="1"; }catch(e){}
  setSidebar(window.innerWidth<=900 ? true : h, false);
  const start=(location.hash||"").slice(1);
  go(VIEWS[start]?start:"home", false);
})();
</script>
