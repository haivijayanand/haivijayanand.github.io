<!DOCTYPE html>
<!--
TOOL: Offset Press
FAMILY: games
VERSION: 1.0.0
DATE: 2026-10-02
CHAT: Business sim game set (claude.ai, 2026-10-02)
CHANGES: 1.0.0 - first release: weekly offset-press sim (job board quotes, queue + shifts, Weibull breakdowns, paper market, receivables/overdraft, 4-colour press), saves, Tech discussion tab with Monte Carlo
STATUS: playable
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f2">
<title>Offset Press</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one narrow column like a proof sheet on the press-room table. Cards carry crop marks at the corners,
   job enquiries look like docket slips, a CMYK colour bar is the divider, magenta is the only action colour. */
:root{
  --bg:#f3f3ef; --paper:#ffffff; --ink:#111316; --muted:#5a5f67; --line:#d5d6d8; --chip:#ebebe7; --crop:#8f9297;
  --acc:#c4006e; --acc-ink:#ffffff; --acc-soft:#fbe4f0; --acc-press:#8f0050;
  --good:#17784a; --bad:#c02c2c; --warn:#955800;
  --cy:#00a0db; --mg:#d6007e; --yl:#f4cf00; --ky:#141619;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --shadow:0 1px 0 rgba(0,0,0,.04);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif-condensed,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1b1c1e; --paper:#25272a; --ink:#f4f4f1; --muted:#a7acb3; --line:#3b3e43; --chip:#2e3135; --crop:#6f737a;
  --acc:#ff4aa6; --acc-ink:#1b1c1e; --acc-soft:#4a2036; --acc-press:#c21a72;
  --good:#45cf8b; --bad:#ff7b6d; --warn:#f0b34a;
  --cy:#1fb4ee; --mg:#ff3d9a; --yl:#ffd935; --ky:#050506;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 0 0 rgba(0,0,0,0); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1b1c1e; --paper:#25272a; --ink:#f4f4f1; --muted:#a7acb3; --line:#3b3e43; --chip:#2e3135; --crop:#6f737a;
  --acc:#ff4aa6; --acc-ink:#1b1c1e; --acc-soft:#4a2036; --acc-press:#c21a72;
  --good:#45cf8b; --bad:#ff7b6d; --warn:#f0b34a;
  --cy:#1fb4ee; --mg:#ff3d9a; --yl:#ffd935; --ky:#050506;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --shadow:0 0 0 rgba(0,0,0,0); color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
p{margin:0}
h1,h2,h3{margin:0}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:13.5px} .pos{color:var(--good)} .neg{color:var(--bad)} .warnc{color:var(--warn)}
section{display:flex;flex-direction:column;gap:18px}
/* crop-marked card */
.card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:2px;padding:14px 16px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;inset:-8px;pointer-events:none;
  background:
   linear-gradient(var(--crop),var(--crop)) left 0 top 7px/5px 1px no-repeat,
   linear-gradient(var(--crop),var(--crop)) left 7px top 0/1px 5px no-repeat,
   linear-gradient(var(--crop),var(--crop)) right 0 top 7px/5px 1px no-repeat,
   linear-gradient(var(--crop),var(--crop)) right 7px top 0/1px 5px no-repeat,
   linear-gradient(var(--crop),var(--crop)) left 0 bottom 7px/5px 1px no-repeat,
   linear-gradient(var(--crop),var(--crop)) left 7px bottom 0/1px 5px no-repeat,
   linear-gradient(var(--crop),var(--crop)) right 0 bottom 7px/5px 1px no-repeat,
   linear-gradient(var(--crop),var(--crop)) right 7px bottom 0/1px 5px no-repeat}
.reg{width:16px;height:16px;flex:none;color:var(--crop)}
.cbar{display:flex;height:6px;gap:2px}
.cbar i{flex:1}
.cbar .c{background:var(--cy)} .cbar .m{background:var(--mg)} .cbar .y{background:var(--yl)} .cbar .k{background:var(--ky);outline:1px solid var(--line)} .cbar .g{background:var(--line)}
/* tabs */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ink);margin-block:14px 6px;border-radius:2px;overflow:hidden}
.tabs button{border:0;background:var(--paper);padding:11px 6px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;color:var(--muted);min-height:44px}
.tabs button+button{border-left:1px solid var(--ink)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
/* status bar */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 8px;margin-bottom:14px}
.bar .row{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.iconbtn{border:1px solid var(--ink);background:var(--paper);border-radius:2px;padding:0 14px;min-height:44px;font-family:var(--f-display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.stats{display:grid;grid-template-columns:.8fr 1.35fr 1fr 1fr;gap:6px;margin-top:8px}
.stat{background:var(--paper);border:1px solid var(--line);padding:5px 8px;min-width:0}
.stat b{display:block;font-family:var(--f-num);font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-family:var(--f-display);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meter{height:5px;background:var(--chip);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink)}
.meter.acc i{background:var(--acc)}
.meter.bad i{background:var(--bad)}
.bar .cbar{margin-top:8px}
/* buttons */
.big{display:block;width:100%;border:0;border-radius:2px;padding:14px 16px;min-height:52px;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.05em;text-transform:uppercase;background:var(--acc);color:var(--acc-ink);cursor:pointer;box-shadow:0 3px 0 var(--acc-press)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--acc-press)}
.big:disabled{opacity:.45;cursor:not-allowed}
.ghost{width:100%;border:1px solid var(--ink);background:var(--paper);border-radius:2px;padding:10px 12px;min-height:46px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.ghost:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 140px}
.mini{border:1px solid var(--line);background:var(--chip);border-radius:2px;min-height:44px;min-width:44px;padding:0 10px;font-weight:600;cursor:pointer;font-size:14px}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mini:disabled{opacity:.35;cursor:not-allowed}
.seg{display:flex;gap:0;border:1px solid var(--ink);border-radius:2px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 1 0;border:0;background:var(--paper);padding:6px 6px;min-height:46px;font-size:14px;font-weight:600;cursor:pointer;color:var(--muted);line-height:1.15}
.seg button+button{border-left:1px solid var(--line)}
.seg button small{display:block;font-family:var(--f-num);font-size:11.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.segrow{display:flex;flex-direction:column;gap:5px;padding-block:6px}
.segrow>span{font-weight:600;font-size:15px}
/* docket slip */
.docket{position:relative;background:var(--paper);border:1px solid var(--ink);border-radius:2px;box-shadow:var(--shadow)}
.docket.skip{opacity:.62}
.docket .top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--ink)}
.docket .jno{font-family:var(--f-num);font-weight:600;font-size:13px;letter-spacing:.04em}
.tag{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:1px 7px;border:1px solid currentColor;border-radius:2px;white-space:nowrap}
.tag.acc{color:var(--acc)} .tag.good{color:var(--good)} .tag.bad{color:var(--bad)} .tag.warn{color:var(--warn)} .tag.ink{color:var(--ink)}
.docket .body{padding:10px 12px 4px}
.docket .what{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.05;text-transform:uppercase}
.docket .who{font-size:14.5px;color:var(--muted);margin-top:2px}
.fields{display:grid;grid-template-columns:1fr 1fr;margin-top:8px;border-top:1px solid var(--line)}
.fields>div{padding:5px 0;border-bottom:1px solid var(--line);min-width:0}
.fields>div:nth-child(odd){padding-right:8px;border-right:1px solid var(--line)}
.fields>div:nth-child(even){padding-left:10px}
.fields .lbl{display:block;font-size:11.5px}
.fields b{font-family:var(--f-num);font-weight:600;font-size:14px;display:block;overflow-wrap:anywhere}
.inks{display:inline-flex;gap:3px;vertical-align:middle;margin-right:6px}
.inks i{width:12px;height:12px;display:inline-block;outline:1px solid var(--line)}
.inks .c{background:var(--cy)} .inks .m{background:var(--mg)} .inks .y{background:var(--yl)} .inks .k{background:var(--ky)}
.perf{border-top:2px dashed var(--line);margin:8px 0 0;position:relative}
.quoterow{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.qline{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ctl{display:flex;align-items:center;gap:6px;flex:none}
.ctl button{width:44px;height:44px;border-radius:2px;border:1px solid var(--ink);background:var(--paper);font-size:22px;font-weight:600;cursor:pointer;line-height:1}
.ctl output{min-width:96px;text-align:center;font-family:var(--f-num);font-size:17px;font-weight:600}
details.costs{font-size:13.5px}
details.costs summary{cursor:pointer;color:var(--muted);min-height:32px;display:flex;align-items:center}
.kv{width:100%;border-collapse:collapse;font-size:14px}
.kv td{padding:5px 0;border-bottom:1px dashed var(--line)}
.kv td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.kv tr.total td{font-weight:700;border-bottom:0;font-size:16px;border-top:1px solid var(--ink)}
.kv tr.head td{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-top:10px}
/* queue rows */
.qrow{display:grid;grid-template-columns:auto 1fr;gap:10px;padding-block:10px;border-top:1px dashed var(--line)}
.qrow:first-of-type{border-top:0}
.qrow .mv{display:flex;flex-direction:column;gap:4px}
.qrow .mv button{width:44px;height:40px;border:1px solid var(--line);background:var(--chip);border-radius:2px;cursor:pointer;font-size:16px}
.qrow .mv button:disabled{opacity:.3}
.qrow .ttl{font-weight:600;line-height:1.25}
.qrow .meta{font-size:13.5px;color:var(--muted);margin-top:2px}
.qrow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.prog{height:4px;background:var(--chip);margin-top:5px}.prog i{display:block;height:100%;background:var(--acc)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-top:1px dashed var(--line)}
.row2:first-of-type{border-top:0}
.row2 .txt{min-width:0}
.event{border-left:3px solid var(--acc);padding:6px 10px;background:var(--acc-soft);margin-top:10px;font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--chip);padding:9px 11px;min-width:0;border-left:3px solid var(--line)}
.kpi b{display:block;font-family:var(--f-num);font-size:20px;line-height:1.2;font-weight:600;overflow-wrap:anywhere}
.kpi .small{display:block}
/* log */
.log{font-family:var(--f-num);font-size:13.5px;display:flex;flex-direction:column;gap:10px}
.log .h{display:grid;grid-template-columns:76px 1fr;gap:8px}
.log .t{color:var(--muted);font-weight:600}
.log .q{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:14px;margin-top:2px}
.log .warn{color:var(--bad)} .log .good{color:var(--good)}
@keyframes pop{from{opacity:.15;transform:translateY(4px)}to{opacity:1;transform:none}}
.log .h{animation:pop .3s ease-out}
/* title */
.title-card{text-align:center;padding:30px 16px 22px}
.title-card h1{font-family:var(--f-display);font-weight:700;font-size:58px;line-height:.9;letter-spacing:.01em;text-transform:uppercase;margin:12px 0 10px}
.title-card h1 span{color:var(--acc)}
.title-card .regrow{display:flex;justify-content:space-between}
.lenpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lenpick button{border:1px solid var(--ink);background:var(--paper);border-radius:2px;padding:10px 4px;min-height:56px;cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.lenpick button small{display:block;font-family:var(--f-num);font-weight:500;font-size:12px;text-transform:none;letter-spacing:0;color:var(--muted)}
.lenpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lenpick button[aria-pressed="true"] small{color:var(--bg)}
/* sheet + toast */
.sheet{position:fixed;inset:0;background:rgba(10,10,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-top:3px solid var(--ink);padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet .hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot{display:flex;gap:8px;align-items:center;padding-block:8px;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot .info{flex:1;min-width:0;font-size:14px}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:2px;background:var(--paper);color:var(--ink);padding:8px;font-family:var(--f-num);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:2px;font-weight:600;z-index:30;max-width:90%}
.help p{margin-top:8px;font-size:14.5px}
.help p:first-child{margin-top:0}
/* tech */
#tech{display:flex;flex-direction:column;gap:20px;padding-top:12px}
#tech h2{font-size:24px}
.sec-n{font-family:var(--f-num);font-size:12px;color:var(--acc);font-weight:600;letter-spacing:.08em;margin-bottom:2px}
.prose{display:flex;flex-direction:column;gap:8px;max-width:65ch;font-size:15px}
.fld{display:flex;flex-direction:column;gap:0;padding-block:5px}
.fld label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px}
.fld output{font-family:var(--f-num);font-weight:600;white-space:nowrap}
input[type=range]{width:100%;height:36px;accent-color:var(--acc);margin:0}
.flds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:18px}
.tblwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.tt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:320px}
.tt th{font-family:var(--f-display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 4px;border-bottom:1px solid var(--ink);font-weight:600}
.tt th:first-child,.tt td:first-child{text-align:left}
.tt td{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tt td:first-child{font-family:var(--f-body)}
.tt tr.sum td{font-weight:700;border-bottom:0;border-top:1px solid var(--ink)}
.tt tr.hl td{background:var(--acc-soft)}
.formula{font-family:var(--f-num);font-size:12.5px;background:var(--chip);padding:10px 12px;line-height:1.7;overflow-x:auto;white-space:pre;border-left:3px solid var(--acc)}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--chip);font-size:14.5px}
.verdict i{flex:none;font-style:normal;font-family:var(--f-num);font-weight:600;font-size:12px;padding:2px 7px;margin-top:2px;border:1px solid currentColor}
.verdict.ok i{color:var(--good)} .verdict.no i{color:var(--bad)} .verdict.mid i{color:var(--warn)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .readout{font-family:var(--f-num);font-size:12.5px;min-height:2.7em;color:var(--ink);padding-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--muted);background:none}
.legend i.band{height:10px;opacity:.3}
svg .ax{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
svg .lab{font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--ink)}
svg .grid{stroke:var(--line);stroke-width:1;opacity:.7}
svg .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swot>div{padding:12px;background:var(--chip);min-width:0;border-top:3px solid var(--line)}
.swot h4{margin:0 0 6px;font-family:var(--f-display);font-size:20px;line-height:1;text-transform:uppercase;letter-spacing:.04em}
.swot ul{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:5px}
.swot .S{border-top-color:var(--good)} .swot .W{border-top-color:var(--bad)} .swot .O{border-top-color:var(--cy)} .swot .T{border-top-color:var(--warn)}
.busy{font-family:var(--f-num);font-size:12px;color:var(--muted)}
@media (max-width:440px){.swot{grid-template-columns:1fr}.title-card h1{font-size:50px}}
@media (max-width:380px){.stats{grid-template-columns:.75fr 1.4fr 1fr 1fr;gap:4px}.stat{padding:4px 6px}.stat b{font-size:13.5px}}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.log .h{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="tabs" role="tablist" aria-label="Sections"><button role="tab" data-act="tab" data-tab="play" id="tab_play">Play</button><button role="tab" data-act="tab" data-tab="tech" id="tab_tech">Tech discussion</button></nav>
  <header class="bar" id="bar" hidden>
    <div class="row">
      <div class="brand"><svg class="reg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 1v22M1 12h22" stroke="currentColor" stroke-width="1.5"/></svg>Offset Press</div>
      <button class="iconbtn" data-act="menu" id="menuBtn">Menu</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="cbar" aria-hidden="true"><i class="c"></i><i class="m"></i><i class="y"></i><i class="k"></i><i class="g"></i><i class="c"></i><i class="m"></i><i class="y"></i><i class="k"></i><i class="g"></i></div>
  </header>
  <main id="main"></main>

/* ---- random helpers (r is an injected uniform generator) ---- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function liveR(){const m=Math.random;return{b:m,q:m,p:m,f:m}}
function seedR(seed,w){return{b:mulberry32(seed*9973+w*7919+11),q:mulberry32(seed*6007+w*3571+23),p:mulberry32(seed*4441+w*1259+37),f:mulberry32(seed*2017+w*8669+51)}}
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const uni=(r,a,b)=>a+r()*(b-a);
const rint=(r,a,b)=>Math.floor(a+r()*(b-a+1));
const pickR=(r,a)=>a[Math.floor(r()*a.length)];
function normR(r){let u=r();if(u<1e-12)u=1e-12;return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r())}
function wpickA(r,a){let t=0;for(const x of a)t+=x[1];let u=r()*t;for(const x of a){u-=x[1];if(u<=0)return x[0]}return a[0][0]}
function wpick(r,w){let t=0;for(const k in w)t+=w[k];let x=r()*t;for(const k in w){x-=w[k];if(x<=0)return k}return Object.keys(w)[0]}
const r100=x=>Math.round(x/100)*100;

/* ---- calendar ---- */
const monthOf=w=>Math.min(11,Math.floor((w-1)*7/30.44));
const DAYN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

/* ---- job physics: the same functions feed estimates, the game and the simulator ---- */
function passesOn(cols,pk){return Math.ceil(cols/PRESSES[pk].units)}
function grossSheets(sheets,passes){return sheets*(1+C.SPOIL_RUN*passes)+C.SPOIL_MR*passes}
function kgPerSheet(t){return TYPES[t].a*TYPES[t].g/1000}
function inkCost(t,sheets,cols){const T=TYPES[t];return sheets*T.a*T.cov*cols*C.INK_G_M2/1000*C.INK_RS_KG}
function jobHours(j,pk,helper){
  const P=PRESSES[pk],n=passesOn(j.cols,pk),g=grossSheets(j.sheets,n);
  return C.JOB_MR+n*C.PASS_MR*P.mrF*(helper?C.HELP_MR:1)+n*g/(P.speed*TYPES[j.t].spf*(helper?C.HELP_SPEED:1));
}
function directCost(j,pk,idx,cutter){
  const n=passesOn(j.cols,pk),g=grossSheets(j.sheets,n),kg=g*kgPerSheet(j.t);
  const paper=kg*idx,plates=j.cols*C.PLATE,ink=inkCost(j.t,j.sheets,j.cols),cut=j.sheets/1000*(cutter?C.CUT_OWN:C.CUT_OUT);
  return{kg,paper,plates,ink,cut,direct:paper+plates+ink+cut};
}
function marketCost(j,idx){
  const g=grossSheets(j.sheets,1),kg=g*kgPerSheet(j.t);
  const h=C.MKT_JOB_MR+C.MKT_PASS_MR+g/(C.MKT_SPEED*TYPES[j.t].spf);
  return kg*idx+j.cols*C.PLATE+inkCost(j.t,j.sheets,j.cols)+j.sheets/1000*C.CUT_OWN+h*C.MKT_RATE;
}
function bh(s,j){if(j._np!==s.presses.length){const b=bestPress(s,j);j._bh=b.h;j._bpk=b.pk;j._np=s.presses.length}return j._bh}
function bestPress(s,j){let best=null,bh=1e9;for(const p of s.presses){const h=jobHours(j,p.k,false);if(h<bh){bh=h;best=p.k}}return{pk:best,h:bh}}
function estimate(s,j){
  const b=bestPress(s,j),d=directCost(j,b.pk,s.idx,s.cutter),mach=b.h*C.OWN_RATE,cost=d.direct+mach;
  return Object.assign(d,{pk:b.pk,hours:b.h,mach,cost,price:r100(cost*(1+C.MARKUP))});
}
/* going rate the trade knows (market rate before this client's own noise) and the quote that maximises expected margin */
function guideRate(s,j){return marketCost(j,s.idx)*(1+C.MKT_MARGIN)}
const S_EFF=Math.sqrt(C.WIN_S*C.WIN_S+C.MKT_SIG*C.MKT_SIG);
function winPexp(q,g,rep,regular){return C.WIN_MAX/(1+Math.exp((q/g-C.WIN_MID-C.REP_SHIFT*(rep-0.5)-(regular?C.REG_SHIFT:0))/S_EFF))}
function bestQuote(cost,g,rep,regular){
  const ev=x=>{const q=g*x;return q<cost?-1e9:winPexp(q,g,rep,regular)*(q-cost)};
  let bx=0.8,be=-1e9;for(let x=0.8;x<=1.401;x+=0.03){const e=ev(x);if(e>be){be=e;bx=x}}
  for(let x=bx-0.03;x<=bx+0.031;x+=0.005){if(x<0.8||x>1.4)continue;const e=ev(x);if(e>be){be=e;bx=x}}
  const q=be<=-1e9?r100(cost):r100(g*bx);return{q,p:winPexp(q,g,rep,regular),em:Math.max(0,be)}}
function winP(q,mr,rep,regular){return C.WIN_MAX/(1+Math.exp((q/mr-C.WIN_MID-C.REP_SHIFT*(rep-0.5)-(regular?C.REG_SHIFT:0))/C.WIN_S))}

/* ---- new game ---- */
function makeClients(r){
  const out=[];
  for(const t of TYPE_KEYS)for(const n of CLIENTS[t])out.push({n,t,rel:clamp(TYPES[t].rel+uni(r,-0.14,0.1),0.45,0.995),good:0,late:0,paid:0,slow:0});
  return out;
}
function newState(weeks,R){
  const s={v:1,weeks,week:1,cash:C.START_CASH,rep:C.START_REP,idx:C.PAPER0,idxPrev:C.PAPER0,paperKg:0,paperCost:C.PAPER0,

/* ---- enquiries ---- */
function genBoard(s,R){
  const r=R.b,m=monthOf(s.week),w=SEASON_A[m];
  if(!CPOOL){CPOOL={};s.clients.forEach((c,k)=>(CPOOL[c.t]=CPOOL[c.t]||[]).push(k))}
  let n=rint(r,C.ENQ[0],C.ENQ[1]);const x=r();
  if(x<s.rep-0.55)n++;else if(x<0.45-s.rep)n--;
  if(s.presses.some(p=>p.k==="p4")&&r()<0.6)n++;
  n=clamp(n,C.ENQ[0],C.ENQ[1]);
  const out=[];
  for(let i=0;i<n;i++){
    const t=wpickA(r,w),pool=CPOOL[t],regT=[];let ci;
    for(const k of pool)if(s.clients[k].good>0)regT.push(k);
    if(regT.length&&r()<Math.min(0.6,0.25*regT.length))ci=pickR(r,regT);else ci=pickR(r,pool);
    const T=TYPES[t],lo=Math.log(T.sh[0]),hi=Math.log(T.sh[1]);
    const sheets=Math.max(100,r100(Math.exp(uni(r,lo,hi))));
    const j={id:s.seq++,t,c:ci,sheets,cols:pickR(r,T.cols),dl:rint(r,T.dl[0],T.dl[1]),terms:wpickA(r,T.termsA),wk:s.week};
    j.mr=marketCost(j,s.idx)*(1+C.MKT_MARGIN)*Math.exp(C.MKT_SIG*normR(r));
    j.e=estimate(s,j);j.est=j.e.price;j.g=guideRate(s,j);j.e.marg=j.e.direct+j.e.hours*C.MARG_RATE;const bq=bestQuote(j.e.marg,j.g,s.rep,isReg(s,j));j.sug=bq.q;j.psug=bq.p;j.quote=j.sug;j.act="quote";
    out.push(j);
  }
  return out;
}
const isReg=(s,j)=>s.clients[j.c].good>0;

/* ---- quotes go out, replies come back ---- */
function resolveQuotes(s,R,L){
  const r=R.q,d0=(s.week-1)*7;const res=[];
  for(const j of s.board){
    const u=r();
    if(j.act!=="quote"){res.push({j,won:false,skip:true});continue}
    s.tot.quoted++;
    const p=winP(j.quote,j.mr,s.rep,isReg(s,j)),won=u<p;
    if(won){s.tot.won++;j.price=j.quote;j.adv=j.terms>0?Math.round(j.quote*C.ADVANCE):0;s.cash+=j.adv;j.due=d0+j.dl;j.remH=null;j.pk=null;j.done=false;j.rej=false;j.disc=0;j.out=false;s.queue.push(j)}
    res.push({j,won,p});
  }
  s.replies=res.map(x=>({j:x.j,won:x.won,skip:!!x.skip}));s.board=[];
  return res;
}

/* ---- crew: who runs which press, how many hours a day ---- */
function shiftHours(sh){return sh===2?[C.SHIFT_H,C.SHIFT_H]:[sh==="ot"?C.SHIFT_H+C.OT_H:C.SHIFT_H,0]}
const CREWC=new WeakMap();
function crew(s,sh){
  const key=sh+"|"+s.week+"|"+s.ops.length+"|"+s.presses.length+"|"+s.ops.reduce((a,o)=>a+o.sk,0);let m=CREWC.get(s);if(!m){m={};CREWC.set(s,m)}if(m[key])return m[key];
  return m[key]=crew0(s,sh);
}
function crew0(s,sh){
  const order=s.presses.map((p,i)=>i).sort((a,b)=>(s.presses[b].k==="p4")-(s.presses[a].k==="p4"));
  const ops=s.ops.slice().sort((a,b)=>b.sk-a.sk);let k=0;
  const out=s.presses.map(()=>({hd:0,sk:0,n:0,helper:false,day:null,night:null}));
  const [hd,hn]=shiftHours(sh);
  for(const i of order){if(k<ops.length){const o=ops[k++];out[i].day=o.n;out[i].hd+=hd;out[i].sk+=o.sk;out[i].n++}}
  if(sh===2)for(const i of order){if(k<ops.length){const o=ops[k++];out[i].night=o.n;out[i].hd+=hn;out[i].sk+=o.sk-C.NIGHT_SKILL;out[i].n++}}
  for(const i of order){if(k<ops.length&&out[i].day&&!out[i].night){k++;out[i].helper=true}}
  for(const c of out)c.sk=c.n?c.sk/c.n:0;
  return out;
}
function weekCapacity(s,sh){return crew(s,sh).reduce((a,c)=>a+c.hd*C.DAYS,0)}

/* ---- paper ---- */
function supOwed(s){return s.pay.reduce((a,p)=>a+p.amt,0)}
function payPaper(s,amt,acc){const room=Math.max(0,C.SUP_LIMIT-supOwed(s)),cr=Math.min(room,amt);
  if(cr>0)s.pay.push({amt:cr,due:s.week+C.SUP_WEEKS});s.cash-=amt-cr;if(acc)acc.cashPaper+=amt-cr}
function bulkDisc(kg){let d=0;for(const [k,x] of C.BULK)if(kg>=k)d=x;return d}
function bookPaper(s,kg,acc){
  const price=s.idx*(1-bulkDisc(kg)),amt=kg*price;
  s.paperCost=(s.paperKg*s.paperCost+amt)/(s.paperKg+kg);s.paperKg+=kg;payPaper(s,amt,acc);return price;
}
function issuePaper(s,kg,acc){
  const take=Math.min(kg,s.paperKg),short=kg-take;let v=take*s.paperCost;s.paperKg-=take;
  if(short>0){const amt=short*s.idx*(1+C.SMALL_LOT);payPaper(s,amt,acc);v+=amt}
  acc.paper+=v;return{take,short};
}

/* ---- deterministic projection (no breakdowns, no rejects): used for the plan screen and suggestions ---- */
function project(s,plan){
  const cr=crew(s,plan.shifts),d0=(s.week-1)*7,res={};
  const ps=s.presses.map((p,i)=>({k:p.k,hd:cr[i].hd,helper:cr[i].helper,t:Math.min(C.DAYS,p.downD)*cr[i].hd+(plan.pm[i]?C.PM_H:0)}));
  const cut=s.cutter?C.CUT_OWN_DAYS:C.CUT_OUT_DAYS;
  for(const j of s.queue){
    if(j.done)continue;
    if(plan.out&&plan.out[j.id]&&j.remH==null){const del=d0+C.OUT_DAYS;res[j.id]={del,late:Math.max(0,Math.floor(del)-j.due),pi:-1,out:true};continue}
    let bi=-1,bf=1e9,bh=0;
    for(let i=0;i<ps.length;i++){if(!ps[i].hd)continue;if(j.pk!=null&&j.pi!==i&&j.remH!=null)continue;
      const h=j.remH!=null?j.remH:jobHours(j,ps[i].k,ps[i].helper);const f=ps[i].t+h;
      const fd=f/ps[i].hd;if(fd<bf){bf=fd;bi=i;bh=h}}
    if(bi<0){res[j.id]={del:Infinity,late:99,pi:-1};continue}
    const P=ps[bi];P.t+=bh;
    const days=P.t/P.hd,wk=Math.floor(days/C.DAYS),rem=days-wk*C.DAYS;   // spill into later weeks (6 working days of 7)
    const del=d0+wk*7+rem+cut;
    res[j.id]={del,late:Math.max(0,Math.floor(del)-j.due),pi:bi,h:bh,thisWeek:wk===0};
  }
  return res;
}

/* ---- the week ---- */
function hhmm(h){const H=Math.floor(h),M=Math.floor((h-H)*60/10)*10;return String(H).padStart(2,"0")+":"+String(M).padStart(2,"0")}
function runWeek(s,R,L){
  const r=R.p,w=s.week,d0=(w-1)*7,P=s.plan,sh=P.shifts,startH=sh===2?6:8;
  const acc={rev:0,paper:0,plates:0,ink:0,cut:0,out:0,wages:0,ot:0,night:0,rent:C.RENT,power:C.POWER_BASE,misc:C.MISC,repair:0,pm:0,interest:0,bad:0,depr:0,hire:s.extra.hire,train:s.extra.train,pen:0,disc:0,cashPaper:0,collected:0,cashSales:0,paidSup:0};
  s.extra={hire:0,train:0};
  const ev=[];const add=(k,x,c,q)=>{ev.push({k,x,c,q})};
  const stamp=(day,h)=>DAYN[Math.min(5,day)]+" "+hhmm(h);
  const cl=j=>s.clients[j.c].n,jn=j=>"Job "+String(j.id).padStart(4,"0");
  const rep0=s.rep,cash0=s.cash,kg0=s.paperKg;
  const delivered=[],stats={late:0,onTime:0,breaks:0,rejects:0,lateDays:0};

    const need=s.queue.reduce((a,j)=>a+(j.remH==null&&!p.out[j.id]?directCost(j,"p2",s.idx,s.cutter).kg:0),0);
    const short=need-s.paperKg;
    if(short>300&&s.idx<=s.idxPrev*1.02){let kg=0;for(const [k] of C.BULK)if(k<=Math.max(500,short*1.3))kg=k;if(headroom(s)-kg*s.idx>90000)p.buyKg=kg}
  }
}
function applyPolicyUpgrades(s,pol,R){
  const ev=[];
  if(pol.buy4&&!s.presses.some(p=>p.k==="p4")&&s.hist.length>=4){
    const h=s.hist.slice(-4),u=h.reduce((a,x)=>a+x.util,0)/4,bl=h[h.length-1].backlog;
    if(u>=pol.buy4.util&&bl>=pol.buy4.backlog&&s.week<=s.weeks-pol.buy4.minLeft&&headroom(s)-PRESSES.p4.price*C.DOWN>=pol.buy4.reserve){
      if(!buyPress4(s,"loan")){if(pol.hire&&s.ops.length<3)hireOp(s,R);ev.push("p4")}
    }
  }
  if(pol.cutter&&!s.cutter&&s.week>=4&&headroom(s)-C.CUTTER_PRICE>=pol.cutterReserve){if(!buyCutter(s))ev.push("cut")}
  return ev;
}
/* one complete simulated game with the same functions the game uses */
function simGame(seed,weeks,pol,opt){
  opt=opt||{};
  const R0=seedR(seed,0),s=newState(weeks,R0);
  const st=opt.start;
  if(st){if(st.cash!=null)s.cash=st.cash;if(st.rep!=null)s.rep=st.rep;if(st.idx)s.idx=s.idxPrev=st.idx;if(st.age!=null)s.presses[0].age=st.age;
    if(st.p4){s.presses.push({k:"p4",age:st.age4||0,downD:0,breaks:0,hrs:0});if(st.loan){s.loan=st.loan;s.emi=st.emi||0}}
    if(st.cutter)s.cutter=true;while(st.ops&&s.ops.length<st.ops)hireOp(s,R0);s.extra={hire:0,train:0};s.board=genBoard(s,R0)}
  const base=equity(s)-C.START_CASH;
  const out={profit:[],eq:[],cash:[],rev:[],util:[],late:[],pen:[],backlog:[],dead:-1,buy4:-1,minCash:s.cash,lateJobs:0,jobs:0,lateDays:0,crunch:false};
  while(s.phase!=="final"&&s.phase!=="bankrupt"){
    const R=seedR(seed,s.week);
    if(opt.order)pol=Object.assign({},pol,{order:opt.order});
    suggestQuotes(s,pol);resolveQuotes(s,R,null);
    const ev=applyPolicyUpgrades(s,pol,R);if(ev.includes("p4"))out.buy4=s.week;
    suggestPlan(s,pol);runWeek(s,R,null);
    const h=s.hist[s.hist.length-1];
    out.profit.push(h.profit);out.eq.push(h.eq-C.START_CASH-base);out.cash.push(h.cash);out.rev.push(h.rev);out.util.push(h.util);out.late.push(h.late);out.pen.push(h.pen);out.backlog.push(h.backlog);
    out.lateJobs+=h.late;out.jobs+=h.late+h.onTime;out.lateDays+=h.lateDays;if(h.cash<-0.8*odLimit(s))out.crunch=true;
    if(h.cash<out.minCash)out.minCash=h.cash;
    if(s.phase==="bankrupt"){out.dead=s.week;break}
    nextWeek(s,R);
  }
  out.final=score(s)-base;out.base=base;out.weeksPlayed=s.hist.length;out.rep=s.rep;out.bad=s.tot.bad;out.breaks=s.tot.breaks;
  return out;
}

function emi4(){const L=PRESSES.p4.price*(1-C.DOWN),i=C.LOAN_RATE/52;return L*i/(1-Math.pow(1+i,-C.LOAN_WEEKS))}

/* ---------- run + report ---------- */
function logHTML(n){return s.log.slice(0,n).map(l=>`<div class="h"><span class="t">${esc(l.t)}</span><div><div class="${l.c||""}">${esc(l.x)}</div>${l.q?`<div class="q">${esc(l.q)}</div>`:""}</div></div>`).join("")}
function renderRunInner(){

  ${done?`<button class="big" data-act="finish">${s.after==="bankrupt"?"See what happened":"See the week's accounts"}</button>`:`<button class="ghost" data-act="skip">Skip ahead</button>`}`;
}
function renderRunPart(){
  if(view!=="game"||!s||s.phase!=="run"||tab!=="play")return;
  const sec=$("runsec");if(!sec){render();return}
  sec.innerHTML=renderRunInner();
  const last=sec.querySelector(".log .h:last-child");if(last&&last.scrollIntoView)last.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function notes(){
  const r=s.report,a=r.acc,st=r.stats,t=[];
  if(st.late)t.push(`${plural(st.late,"job")} went out late, costing ${money(a.pen)} in penalties and some of your name. Put the earliest due date first, add overtime or a second shift, or outsource a job you can't make.`);
  if(r.breaks)t.push(`The press broke down ${plural(r.breaks,"time")}. Wear builds with running hours, and the chance of a failure climbs faster as it ages. A ${money(C.PM_COST)} service resets it.`);
  if(st.rejects)t.push(`${plural(st.rejects,"batch")} failed the quality check. Skilled operators and a freshly serviced press make fewer rejects.`);
  if(r.util<0.35&&s.queue.length===0)t.push(`The press ran only ${Math.round(r.util*100)}% of its crewed hours. Idle hours still pay rent and wages, so quote a little sharper next week.`);
  if(r.backlog>weekCapacity(s,1)*0.8)t.push(`${r.backlog.toFixed(0)} hours of work are still waiting. That needs more shifts or outsourcing to stay on time.`);
  if(-s.cash>odLimit(s)*0.6)t.push(`The overdraft is ${Math.round(-s.cash/odLimit(s)*100)}% of the bank's limit. Prefer cash and 30-day jobs until bills come in.`);
  if(a.bad)t.push(`A client defaulted and ${money(a.bad)} was written off. Watch clients who pay late; they are the ones who disappear.`);
  if(s.jump&&s.idx>s.idxPrev)t.push(`Paper goes up to ₹${s.idx.toFixed(1)}/kg next week. Quotes rise with it, but stock you already hold is cheaper.`);
  else if(s.jump)t.push(`Paper drops to ₹${s.idx.toFixed(1)}/kg next week. A good week to book a bulk lot.`);
  if(!t.length)t.push("A clean week. Keep an eye on the press hours and the overdraft as the season changes.");
  return t.slice(0,4);
}
function renderReport(){

    ${a.disc?`<tr><td class="small muted">after quality discounts of</td><td class="small muted">${money(a.disc)}</td></tr>`:""}
    <tr class="head"><td>Costs</td><td></td></tr>
    ${row("Paper used",-a.paper,"neg")}${row("Plates and ink",-(a.plates+a.ink),"neg")}${row("Cutting",-a.cut,"neg")}${row("Outsourced printing",-a.out,"neg")}
    ${row("Wages",-a.wages,"neg")}${row("Overtime and night allowance",-(a.ot+a.night),"neg")}${row("Rent, power and sundries",-(a.rent+a.power+a.misc),"neg")}
    ${row("Repairs and servicing",-(a.repair+a.pm),"neg")}${row("Hiring and training",-(a.hire+a.train),"neg")}${row("Interest",-a.interest,"neg")}${row("Bad debts",-a.bad,"neg")}${row("Depreciation",-a.depr,"neg")}

  <button class="big" data-act="next">${s.week>=s.weeks?"See the final results":`Start week ${s.week+1}`}</button>
  </section>`;
}
function grade(sc,weeks,dead){
  if(dead)return"Shutters down";
  const t=weeks>=52?[900000,650000,300000,0]:[300000,200000,100000,0];
  return sc>=t[0]?"Press baron":sc>=t[1]?"Busy press":sc>=t[2]?"Steady printer":sc>t[3]?"Scraping by":"Ink on the floor";
}
function profitChart(){
  const H=s.hist;if(!H.length)return"";
  return `<div class="chart" id="c_final"></div>`;
}
function drawFinal(){
  const el=$("c_final");if(!el)return;const H=s.hist,f=chartFrame(el,200);
  const vals=H.map(h=>h.profit),mx=Math.max(1,...vals),mn=Math.min(0,...vals),tk=niceTicks(mn,mx,4);
  const lo=tk[0],hi=tk[tk.length-1],Y=v=>f.t+(hi-v)/(hi-lo)*(f.H-f.t-f.b),gw=(f.W-f.l-f.r)/H.length,bw=Math.max(2,gw-2);
  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Profit by week">`;
  tk.forEach(v=>svg+=`<line class="grid" x1="${f.l}" x2="${f.W-f.r}" y1="${Y(v)}" y2="${Y(v)}"/><text class="ax" x="${f.l-6}" y="${Y(v)+4}" text-anchor="end">${kfmt(v)}</text>`);
  svg+=`<line x1="${f.l}" x2="${f.W-f.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  H.forEach((h,i)=>{const x=f.l+i*gw+1,v=h.profit;svg+=barPath(x,bw,Y(0),Y(v),v>=0?"var(--s1)":"var(--s2)")});
  const st=H.length>26?8:4;for(let i=0;i<H.length;i+=st)svg+=`<text class="ax" x="${f.l+(i+.5)*gw}" y="${f.H-8}" text-anchor="middle">W${i+1}</text>`;
  svg+=`<line class="guide" y1="${f.t}" y2="${f.H-f.b}" style="display:none"/></svg>`;
  el.innerHTML=`<div class="legend"><span><i style="background:var(--s1);height:10px;width:10px"></i>Profit week</span><span><i style="background:var(--s2);height:10px;width:10px"></i>Loss week</span></div>${svg}<div class="readout"></div>`;
  hookHover(el,x=>{const i=clamp(Math.floor((x-f.l)/gw),0,H.length-1),h=H[i];return{x:f.l+(i+.5)*gw,text:`Week ${h.week}: profit ${money(h.profit)} · sales ${money(h.rev)} · cash ${money(h.cash)}`}},"Tap a bar to read a week.");
}
function renderFinal(){
  const dead=s.phase==="bankrupt",sc=s.final!=null?s.final:Math.round(score(s)),best=(LS.get(K_BEST)||{})[String(s.weeks)];
  const tot=s.hist.reduce((a,h)=>({rev:a.rev+h.rev,late:a.late+h.late,on:a.on+h.onTime}),{rev:0,late:0,on:0});

  <div class="card title-card"><div class="regrow">${REG}${REG}</div><div class="lbl">${dead?`Closed in week ${s.dead.week}`:`${s.weeks} weeks done`}</div><h1>${grade(sc,s.weeks,dead)}</h1>
    ${dead?`<p>The overdraft stayed past the bank's ${money(s.dead.limit||odLimit(s))} limit for two Saturdays running and the wage cheques bounced. The bank sold the stock and called in what clients owed at half value.</p>`:""}
    <p style="margin-top:8px">${dead?"What you walked away with":"Net worth gained"}: <b class="num ${sc>=0?"pos":"neg"}">${money(sc)}</b></p>

  <div class="card"><h3>Final position</h3><table class="kv">
    <tr><td>Cash at bank</td><td>${money(s.cash)}</td></tr><tr><td>Owed to you</td><td>${money(s.recv.reduce((a,e)=>a+e.amt,0))}</td></tr>
    <tr><td>Paper stock</td><td>${money(s.paperKg*s.paperCost)}</td></tr><tr><td>Machines (book value)</td><td>${money(s.assets.reduce((a,x)=>a+x.book,0))}</td></tr>
    <tr><td>Owed to the paper dealer</td><td>${money(-supOwed(s))}</td></tr><tr><td>Bank loan</td><td>${money(-s.loan)}</td></tr>

function decodeSave(t){t=t.trim();if(!t.startsWith("PRESS1:"))throw 0;const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(7)))));if(!o||o.v!==1||!o.presses||!o.clients||!o.weeks)throw 0;return o}
function fmtTime(ts){try{return new Date(ts).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}catch(e){return""}}
function openSheet(mode){sheetMode=mode;$("sheet").hidden=false;renderSheet();$("panel").scrollTop=0}

function renderSheet(){
  const p=$("panel");
  if(sheetMode==="help"){

    <p><b>Each week</b> has three steps. Quote for the enquiries on the board, plan the shop floor for the jobs you won, then run the week and read the accounts.</p>
    <p><b>Enquiries.</b> Three to seven arrive each week. The mix follows the season: weddings in Aavani, Thai and Chithirai, cartons before Diwali, calendars at the year end, books and notebooks before schools reopen. Each docket shows quantity, colours, paper, deadline and payment terms.</p>
    <p><b>Quoting.</b> Every job has a going rate in the trade. Quote under it and you usually win; quote over it and you usually lose. Your name in the trade shifts the odds, and regular clients give you a little extra room. The suggested quote balances the chance of winning against the margin. Every client has a hidden reliability: some pay late and a few never pay.</p>
    <p><b>Costs of a job.</b> Paper is most of it. Each colour needs a plate. Every pass through the press starts with a makeready of about two hours (plates, ink, registration), then runs at the press speed. Your 2-colour press needs two passes for 4-colour work, so it is slow and dear on colour jobs. Some sheets are spoiled on every makeready.</p>
    <p><b>Production.</b> Jobs run in queue order; move them up or down. One shift gives 48 hours a press, overtime 66, two shifts 96 if you have the operators. Late jobs pay a penalty of ${Math.round(C.LATE_PEN*100)}% of the price a day (up to ${Math.round(C.LATE_MAX*100)}%) and cost you name. On-time jobs build name and turn clients into regulars. You can outsource a job to a friend's press at the trade price.</p>
    <p><b>Quality.</b> Each job can come out with a bad batch. Skilled operators and a recently serviced press reject less. You choose to reprint (paper and time) or send it with a discount (clients remember).</p>
    <p><b>Breakdowns.</b> The press wears with running hours. The chance of a failure grows faster the longer it runs since its last service (a Weibull wear-out curve). A service takes ${C.PM_H} hours and ${money(C.PM_COST)} and resets the clock. A breakdown costs repairs, lost hours, and sometimes days waiting for spares from Sivakasi.</p>
    <p><b>Paper market.</b> The price per kg wanders week to week and the mill sometimes changes its list price sharply. Booking 1,000 kg or more gets a discount; paper bought at the counter for a single job costs ${Math.round(C.SMALL_LOT*100)}% extra.</p>
    <p><b>Money.</b> Cash clients pay on delivery. Credit clients pay ${Math.round(C.ADVANCE*100)}% advance and the rest after 30, 60 or 90 days, if they pay. The paper dealer gives up to ${money(C.SUP_LIMIT)} of credit for ${C.SUP_WEEKS} weeks. The bank gives an overdraft of ${money(C.OD_BASE)} plus half of what clients owe you that isn't badly overdue, at ${Math.round(C.OD_RATE*100)}% a year. Rent, wages and power go out every Saturday.</p>
    <p><b>Going bust.</b> If the overdraft is over the limit on a Saturday, the bank warns you. If it is still over the next Saturday, the wage cheques bounce and the game ends.</p>

    <p><b>Taxes.</b> GST and income tax are left out to keep the sums readable. All prices are before tax.</p>
    <p><b>Score.</b> Net worth gained: cash, money owed to you, paper stock and machines, less what you owe. If the bank closes you down, it is what is left after a forced sale.</p>

    </div>`;

  </div>
  <div class="card"><h3>Save code</h3><p class="small muted" style="margin-bottom:8px">Copy this text into a note or message to keep the game safe or move it to another phone.</p>
    ${inGame?`<label for="codeOut" class="lbl">Your code</label><textarea id="codeOut" readonly>${encodeSave(s)}</textarea><button class="ghost" data-act="copy" style="margin-top:8px">Copy code</button>`:`<p class="small muted">Start or continue a game to get a code.</p>`}
    <label for="codeIn" class="lbl" style="display:block;margin-top:12px">Paste a code to load</label>
    <textarea id="codeIn" placeholder="PRESS1:..."></textarea><button class="ghost" data-act="codeload" style="margin-top:8px">Load from code</button>
  </div>
  <div class="card"><h3>Theme</h3><div class="seg">${[["auto","Follow phone"],["light","Proof sheet"],["dark","Light table"]].map(([v,n])=>`<button data-act="theme" data-v="${v}" aria-pressed="${th===v}">${n}</button>`).join("")}</div></div>

document.addEventListener("click",e=>{

function runBatch(key,n,fn){if(SIMCACHE[key])return SIMCACHE[key];const out=[];withC({OD_BASE:T.odBase,SUP_LIMIT:T.supLimit},()=>{for(let i=1;i<=n;i++)out.push(fn(i))});SIMCACHE[key]=out;
  const ks=Object.keys(SIMCACHE);if(ks.length>24)delete SIMCACHE[ks[0]];return out}
function pct(a,q){if(!a.length)return NaN;const b=Float64Array.from(a).sort();const i=(b.length-1)*q,lo=Math.floor(i);return b[lo]+(b[Math.min(lo+1,b.length-1)]-b[lo])*(i-lo)}
function normCdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const P100=x=>isFinite(x)?(x>0&&x<0.01?"<1%":x<1&&x>0.99?">99%":Math.round(x*100)+"%"):"—";
const kfmt=v=>{const a=Math.abs(v),sg=v<0?"−":"";return a>=100000?sg+"₹"+(a/100000).toFixed(a>=1000000?0:1).replace(/\.0$/,"")+"L":a>=1000?sg+"₹"+(a/1000).toFixed(a>=10000?0:1).replace(/\.0$/,"")+"k":sg+"₹"+Math.round(a)};
function niceStep(raw){const mag=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)}
function niceTicks(lo,hi,n){if(hi<=lo)hi=lo+1;const st=niceStep((hi-lo)/n),a=Math.floor(lo/st)*st,out=[];for(let v=a;v<=hi+st*0.999;v+=st)out.push(Math.round(v*1e6)/1e6);return out}

/* ---- §3 enquiry sampling (season-averaged) ---- */
function sampleEnquiries(n,rep){
  const r=mulberry32(4242),mix={};let sx=0,sx2=0,sh=0,sv=0;const fake={idx:T.paper,presses:[{k:"p2"}],cutter:false};
  for(let i=0;i<n;i++){
    const m=Math.floor(r()*12),t=wpickA(r,SEASON_A[m]),Ty=TYPES[t];
    const sheets=Math.max(100,r100(Math.exp(uni(r,Math.log(Ty.sh[0]),Math.log(Ty.sh[1])))));
    const j={t,sheets,cols:pickR(r,Ty.cols)},e=estimate(fake,j),g=guideRate(fake,j);
    const marg=e.direct+e.hours*C.MARG_RATE,bq=bestQuote(marg,g,rep,false),vc=e.direct+e.hours*PRESSES.p2.pw;
    const mr=g*Math.exp(C.MKT_SIG*normR(r)),p=winP(bq.q,mr,rep,false),x=p*(bq.q-vc);
    const o=mix[t]||(mix[t]={n:0,val:0,p:0,h:0,x:0,ph:0});o.n++;o.val+=g;o.p+=p;o.h+=e.hours;o.x+=x;o.ph+=p*e.hours;
    // contribution of one enquiry is Bernoulli(p) × margin; moments for the compound sum
    sx+=x;sx2+=p*(bq.q-vc)*(bq.q-vc);sh+=p*e.hours;sv+=p*bq.q;
  }
  return{mix,EX:sx/n,EX2:sx2/n,EH:sh/n,EV:sv/n};
}
function weeklyFixed(){return C.RENT+2*C.WAGE+C.POWER_BASE+C.MISC}

/* ---- §4c reliability ---- */
function relCurve(eta,beta,Cp,Cf){
  const R=t=>Math.exp(-Math.pow(t/eta,beta)),pts=[];let integ=0,prevT=0,prevR=1,best={T:0,c:Infinity};
  const dt=Math.max(1,eta/200);
  for(let t=dt;t<=eta*2.6;t+=dt){const r=R(t);integ+=(prevR+r)/2*dt;prevR=r;const c=(Cp*r+Cf*(1-r))/integ;pts.push([t,c]);if(c<best.c)best={T:t,c,integ,R:r}}
  // mean time to failure (run to failure) by the same integral out to the tail
  let mttf=integ;for(let t=eta*2.6;t<eta*6;t+=dt)mttf+=R(t)*dt;
  return{pts,best,mttf,rtf:Cf/mttf};
}

/* §2 job costing */
function secCost(){
  const j=jobFor(),a=costSplit(j,"p2",T.paper,C.OWN_RATE),b=costSplit(j,"p4",T.paper,C.OWN_RATE),m=tradeSplit(j,T.paper),k=j.sheets/1000;
  const row=(n,x,y,z)=>`<tr><td>${n}</td><td>${money(x)}</td><td>${money(y)}</td><td>${money(z)}</td></tr>`;
  $("o_cost").innerHTML=`<tr><th>${fmtN(j.sheets)} sheets, ${j.cols} col</th><th>Your 2-col</th><th>4-col</th><th>Trade</th></tr>
   ${row("Paper",a.paper,b.paper,m.paper)}${row("Plates",a.plates,b.plates,m.plates)}${row("Ink",a.ink,b.ink,m.ink)}${row("Cutting",a.cut,b.cut,m.cut)}
   <tr><td>Makeready</td><td>${a.mrH.toFixed(1)} h · ${money(a.mr)}</td><td>${b.mrH.toFixed(1)} h · ${money(b.mr)}</td><td>${m.mrH.toFixed(1)} h · ${money(m.mr)}</td></tr>
   <tr><td>Running</td><td>${a.runH.toFixed(1)} h · ${money(a.run)}</td><td>${b.runH.toFixed(1)} h · ${money(b.run)}</td><td>${m.runH.toFixed(1)} h · ${money(m.run)}</td></tr>
   <tr class="sum"><td>Full cost</td><td>${money(a.total)}</td><td>${money(b.total)}</td><td>${money(m.total)}</td></tr>
   <tr><td>Per 1,000 sheets</td><td>${money(a.total/k)}</td><td>${money(b.total/k)}</td><td>${money(m.total/k)}</td></tr>
   <tr class="hl"><td>Going rate</td><td colspan="3" style="text-align:right">${money(m.rate)} (${money(m.rate/k)} per 1,000)</td></tr>`;
  const marg=a.direct+(a.mrH+a.runH)*C.MARG_RATE,cph=(m.rate-marg)/(a.mrH+a.runH),cph4=(m.rate-(b.direct+(b.mrH+b.runH)*C.MARG_RATE))/(b.mrH+b.runH);
  let be=null;for(const q of QTY){const jj={t:j.t,sheets:q,cols:j.cols};if(costSplit(jj,"p2",T.paper,C.OWN_RATE).total<=tradeSplit(jj,T.paper).rate){be=q;break}}
  $("o_costk").innerHTML=kpi(Math.round(a.mr/(a.total-a.paper-a.plates-a.ink-a.cut+a.plates)*100)+"%","Makeready share","of press + plate cost, 2-col")
    +kpi(be?fmtN(be):"none","Smallest run you beat the rate",be?"sheets, at full cost":"at full cost, on the 2-col press")
    +kpi(money(cph),"Contribution per press hour","2-col, at the going rate")+kpi(money(cph4),"Same on a 4-col","one pass for 4 colours");
  R_.cost={a,b,m,cph,cph4,be};
  drawCost();
}
function drawCost(){
  const el=$("c_cost"),f=chartFrame(el,220),xs=[];for(let i=0;i<=40;i++)xs.push(Math.round(300*Math.pow(20000/300,i/40)));

  const hi=Math.max(...s2.slice(0,1),...sm.slice(0,1))*1.05,lo=Math.min(...s4,...sm)*0.9,tk=niceTicks(lo,hi,4);
  const X=q=>f.l+Math.log(q/300)/Math.log(20000/300)*(f.W-f.l-f.r),Y=v=>f.t+(tk[tk.length-1]-clamp(v,tk[0],tk[tk.length-1]))/(tk[tk.length-1]-tk[0])*(f.H-f.t-f.b);
  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Cost per thousand sheets against run length">`+gridY(f,tk,Y,kfmt);
  [300,1000,3000,10000,20000].forEach(q=>svg+=`<text class="ax" x="${X(q)}" y="${f.H-8}" text-anchor="middle">${q>=1000?q/1000+"k":q}</text>`);
  [[sm,"--s3"],[s4,"--s2"],[s2,"--s1"]].forEach(([a,c])=>svg+=`<path d="${linePath(xs.map((q,i)=>[X(q),Y(a[i])]))}" fill="none" stroke="var(${c})" stroke-width="2" stroke-linejoin="round"/>`);
  const q0=QTY[T.qi];svg+=`<line x1="${X(q0)}" x2="${X(q0)}" y1="${f.t}" y2="${f.H-f.b}" stroke="var(--acc)" stroke-width="1.5" stroke-dasharray="4 3"/><text class="lab" x="${X(q0)+(X(q0)>f.W*0.7?-4:4)}" y="${f.t+10}" text-anchor="${X(q0)>f.W*0.7?"end":"start"}">This job</text>`;
  svg+=GUIDE(f)+`</svg>`;
  el.innerHTML=`<div class="legend"><span><i style="background:var(--s1)"></i>Your 2-col, full cost</span><span><i style="background:var(--s2)"></i>4-col, full cost</span><span><i style="background:var(--s3)"></i>Going rate</span></div>${svg}<div class="readout"></div>`;
  hookHover(el,x=>{const t=clamp((x-f.l)/(f.W-f.l-f.r),0,1),i=Math.round(t*40);return{x:X(xs[i]),text:`${fmtN(xs[i])} sheets: 2-col ${money(s2[i])} · 4-col ${money(s4[i])} · going rate ${money(sm[i])} per 1,000`}},
    "Short runs are dear because makeready is a fixed cost spread over few sheets. Tap the chart to read a run length.");

/* §4 quote optimisation */
function secQuote(){
  const j=jobFor(),a=costSplit(j,"p2",T.paper,C.OWN_RATE),m=tradeSplit(j,T.paper),g=m.rate,rep=T.rep/100;
  const cost=T.basis==="full"?a.total:a.direct+(a.mrH+a.runH)*C.MARG_RATE;
  const xs=[];for(let k=80;k<=130;k++)xs.push(k/100);
  const pw=xs.map(x=>winPexp(x*g,g,rep,false)),em=xs.map((x,i)=>pw[i]*(x*g-cost)),mw=xs.map(x=>x*g-cost);
  let bi=0;em.forEach((v,i)=>{if(v>em[bi])bi=i});
  const el=$("c_quote"),f=chartFrame(el,220),lo=Math.min(0,...em,mw[0]),hi=Math.max(...mw)*1.02,tk=niceTicks(lo,hi,4);
  const X=x=>f.l+(x-0.8)/0.5*(f.W-f.l-f.r),Y=v=>f.t+(tk[tk.length-1]-v)/(tk[tk.length-1]-tk[0])*(f.H-f.t-f.b),Yp=p=>f.t+(1-p)*(f.H-f.t-f.b);
  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Expected margin against quote">`+gridY(f,tk,Y,kfmt);
  if(tk[0]<0)svg+=`<line x1="${f.l}" x2="${f.W-f.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>`;
  [0.8,0.9,1,1.1,1.2,1.3].forEach(x=>svg+=`<text class="ax" x="${X(x)}" y="${f.H-8}" text-anchor="middle">${Math.round(x*100)}%</text>`);
  svg+=`<path d="${linePath(xs.map((x,i)=>[X(x),Yp(pw[i])]))}" fill="none" stroke="var(--s3)" stroke-width="2" stroke-dasharray="5 4"/>`;
  svg+=`<path d="${linePath(xs.map((x,i)=>[X(x),Y(mw[i])]))}" fill="none" stroke="var(--s2)" stroke-width="2"/>`;
  svg+=`<path d="${linePath(xs.map((x,i)=>[X(x),Y(em[i])]))}" fill="none" stroke="var(--s1)" stroke-width="2.5"/>`;
  const bx=X(xs[bi]),by=Y(em[bi]);svg+=`<circle cx="${bx}" cy="${by}" r="5" fill="var(--s1)" stroke="var(--paper)" stroke-width="2"/><text class="lab" x="${bx}" y="${by-10}" text-anchor="middle">Best ${Math.round(xs[bi]*100)}%</text>`;
  svg+=GUIDE(f)+`</svg>`;
  el.innerHTML=`<div class="legend"><span><i style="background:var(--s1)"></i>Expected margin</span><span><i style="background:var(--s2)"></i>Margin if won</span><span><i class="dash" style="border-color:var(--s3)"></i>Win chance (0–100%)</span></div>${svg}<div class="readout"></div>`;
  hookHover(el,x=>{const i=clamp(Math.round((x-f.l)/(f.W-f.l-f.r)*50),0,50);return{x:X(xs[i]),text:`Quote ${Math.round(xs[i]*100)}% of rate (${money(xs[i]*g)}): win ${Math.round(pw[i]*100)}%, margin ${money(mw[i])}, expected ${money(em[i])}`}},
    `Best quote ${money(xs[bi]*g)} (${Math.round(xs[bi]*100)}% of the going rate): wins ${Math.round(pw[bi]*100)}% of the time and earns ${money(em[bi])} on average.`);
  $("o_quote").innerHTML=`<tr><th>Quote</th><th>Win</th><th>Margin if won</th><th>Expected</th></tr>`+[0.9,0.95,1,1.05,1.1].map(x=>{const q=x*g,p=winPexp(q,g,rep,false);return `<tr${Math.abs(x-xs[bi])<0.026?' class="hl"':""}><td>${Math.round(x*100)}% · ${money(q)}</td><td>${P100(p)}</td><td>${money(q-cost)}</td><td>${money(p*(q-cost))}</td></tr>`}).join("");
  R_.quote={best:xs[bi],p:pw[bi],em:em[bi],cost,g};
}

/* §6 reliability */
function secRel(){
  const Cp=T.pmCost,Cf=T.failCost,rc=relCurve(T.eta,T.beta,Cp,Cf),F=t=>1-Math.exp(-Math.pow(t/T.eta,T.beta));
  // F(t) chart
  {const el=$("c_weib"),f=chartFrame(el,180),xm=T.eta*2,X=t=>f.l+t/xm*(f.W-f.l-f.r),Y=p=>f.t+(1-p)*(f.H-f.t-f.b),xs=[];for(let i=0;i<=80;i++)xs.push(xm*i/80);
   const wk=t=>F(t+T.hrsWk)-F(t)>0?(F(t+T.hrsWk)-F(t))/(1-F(t)):0;
   let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Weibull failure probability">`+gridY(f,[0,0.25,0.5,0.75,1],Y,v=>Math.round(v*100)+"%");
   niceTicks(0,xm,4).forEach(t=>{if(t<=xm)svg+=`<text class="ax" x="${X(t)}" y="${f.H-8}" text-anchor="middle">${t}h</text>`});
   svg+=`<path d="${linePath(xs.map(t=>[X(t),Y(F(t))]))}" fill="none" stroke="var(--s1)" stroke-width="2"/>`;
   svg+=`<path d="${linePath(xs.map(t=>[X(t),Y(wk(t))]))}" fill="none" stroke="var(--s2)" stroke-width="2"/>`;
   svg+=`<line x1="${X(rc.best.T)}" x2="${X(rc.best.T)}" y1="${f.t}" y2="${f.H-f.b}" stroke="var(--acc)" stroke-dasharray="4 3"/>`+GUIDE(f)+`</svg>`;
   el.innerHTML=`<div class="legend"><span><i style="background:var(--s1)"></i>Failed by this age</span><span><i style="background:var(--s2)"></i>Fails in the next ${T.hrsWk} h, if running now</span></div>${svg}<div class="readout"></div>`;
   hookHover(el,x=>{const t=clamp((x-f.l)/(f.W-f.l-f.r)*xm,0,xm);return{x:X(t),text:`At ${Math.round(t)} h since service: ${P100(F(t))} would have failed by now; ${P100(wk(t))} chance of failing in the next week`}},`From new, ${P100(F(T.hrsWk))} chance of a failure in the first week; at ${T.eta} h it is ${P100(wk(T.eta))} a week.`);}
  // cost-rate chart
  {const el=$("c_age"),f=chartFrame(el,200),pts=rc.pts.filter(p=>p[0]>=T.eta*0.08),xm=pts[pts.length-1][0],ymax=Math.min(Math.max(...pts.map(p=>p[1])),rc.best.c*4,rc.rtf*3),tk=niceTicks(0,ymax,4);
   const X=t=>f.l+t/xm*(f.W-f.l-f.r),Y=v=>f.t+(tk[tk.length-1]-clamp(v,0,tk[tk.length-1]))/tk[tk.length-1]*(f.H-f.t-f.b);
   let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Cost per running hour against service interval">`+gridY(f,tk,Y,v=>"₹"+Math.round(v));
   niceTicks(0,xm,4).forEach(t=>{if(t<=xm)svg+=`<text class="ax" x="${X(t)}" y="${f.H-8}" text-anchor="middle">${t}h</text>`});
   svg+=`<line x1="${f.l}" x2="${f.W-f.r}" y1="${Y(rc.rtf)}" y2="${Y(rc.rtf)}" stroke="var(--s2)" stroke-width="2" stroke-dasharray="6 4"/>`;
   svg+=`<path d="${linePath(pts.map(p=>[X(p[0]),Y(p[1])]))}" fill="none" stroke="var(--s1)" stroke-width="2"/>`;
   svg+=`<circle cx="${X(rc.best.T)}" cy="${Y(rc.best.c)}" r="5" fill="var(--s1)" stroke="var(--paper)" stroke-width="2"/><text class="lab" x="${X(rc.best.T)}" y="${Y(rc.best.c)-10}" text-anchor="middle">Service every ${Math.round(rc.best.T)} h</text>`+GUIDE(f)+`</svg>`;
   el.innerHTML=`<div class="legend"><span><i style="background:var(--s1)"></i>Service every T hours</span><span><i class="dash" style="border-color:var(--s2)"></i>Never service (run to failure)</span></div>${svg}<div class="readout"></div>`;
   hookHover(el,x=>{const t=clamp((x-f.l)/(f.W-f.l-f.r)*xm,pts[0][0],xm);let p=pts[0];for(const q of pts)if(Math.abs(q[0]-t)<Math.abs(p[0]-t))p=q;return{x:X(p[0]),text:`Service every ${Math.round(p[0])} h: ₹${p[1].toFixed(0)} per running hour (run to failure: ₹${rc.rtf.toFixed(0)})`}},
     T.beta<=1?"With β ≤ 1 the press does not wear out, so servicing cannot pay: the curve never dips below the dashed line.":`Cheapest at about ${Math.round(rc.best.T)} running hours between services: ₹${rc.best.c.toFixed(0)} per hour against ₹${rc.rtf.toFixed(0)} if you never service.`);}
  const mttr=C.REPAIR_MED*Math.exp(C.REPAIR_SIG*C.REPAIR_SIG/2)+C.SPARES_P*(C.SPARES_DAYS[0]+C.SPARES_DAYS[1])/2*C.SHIFT_H;
  const aPM=rc.best.integ/(rc.best.integ+C.PM_H*rc.best.R+mttr*(1-rc.best.R)),aRTF=rc.mttf/(rc.mttf+mttr);
  $("o_rel").innerHTML=kpi(Math.round(rc.best.T)+" h","Best service interval",`every ${(rc.best.T/T.hrsWk).toFixed(1)} weeks at ${T.hrsWk} h/week`)+kpi(money(rc.best.c*T.hrsWk),"Upkeep per week",`never servicing: ${money(rc.rtf*T.hrsWk)}`)
    +kpi(P100(aPM),"Availability with service",`mean repair ${mttr.toFixed(0)} h incl. spares`)+kpi(P100(aRTF),"Availability, run to failure",`mean life ${Math.round(rc.mttf)} h`);
  R_.rel={T:rc.best.T,saving:(rc.rtf-rc.best.c)*T.hrsWk,aPM,aRTF};
}

/* §7 working capital */
function wcAt(sales){
  const day=sales/7,cr=T.credit/100,adv=C.ADVANCE,dso=cr*(1-adv)*(T.days+3),dio=T.stockW*7,dpo=T.dpo,ps=T.pshare/100;
  const recv=day*dso,stock=day*ps*dio,pay=Math.min(T.supLimit,day*ps*dpo),need=recv+stock-pay,limit=Math.min(C.OD_MAX,T.odBase+C.OD_DP*recv);
  return{dso,dio,dpo,ccc:dso+dio*ps-dpo*ps,recv,stock,pay,need,limit};
}
function secWC(){
  const w=wcAt(T.sales),cash=T.startCash,od=Math.max(0,w.need-cash),gm=0.15;
  $("o_wc").innerHTML=kpi(w.ccc.toFixed(0)+" d","Cash conversion cycle",`receivable ${w.dso.toFixed(0)} + stock ${(w.dio*T.pshare/100).toFixed(0)} − payable ${(w.dpo*T.pshare/100).toFixed(0)}`)
   +kpi(money(w.need),"Working capital tied up",`owed to you ${kfmt(w.recv)}, stock ${kfmt(w.stock)}, less dealer ${kfmt(w.pay)}`)
   +kpi(money(od),"Overdraft needed","after your starting cash")+kpi(money(w.limit),"Bank's limit at this size",`${money(T.odBase)} + half of receivables`);
  const el=$("c_wc"),f=chartFrame(el,200),xs=[];for(let v=20000;v<=300000;v+=5000)xs.push(v);
  const need=xs.map(v=>Math.max(0,wcAt(v).need-cash)),lim=xs.map(v=>wcAt(v).limit),hi=Math.max(...need,...lim)*1.05,tk=niceTicks(0,hi,4);
  const X=v=>f.l+(v-20000)/280000*(f.W-f.l-f.r),Y=v=>f.t+(tk[tk.length-1]-v)/tk[tk.length-1]*(f.H-f.t-f.b);
  let cross=xs.find((v,i)=>need[i]>lim[i]);
  let svg=`<svg viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="Overdraft needed and bank limit by weekly sales">`+gridY(f,tk,Y,kfmt);

  svg+=`<path d="${linePath(xs.map((v,i)=>[X(v),Y(lim[i])]))}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-dasharray="6 4"/>`;

/* §3 probability */

  const varX=sm.EX2-sm.EX*sm.EX,mu=EN*sm.EX,sd=Math.sqrt(EN*varX+VN*sm.EX*sm.EX),F=weeklyFixed();
  const tot=Object.values(sm.mix).reduce((a,o)=>a+o.n,0);

    Object.keys(sm.mix).sort((a,b)=>sm.mix[b].n-sm.mix[a].n).map(k=>{const o=sm.mix[k];return `<tr><td>${TYPES[k].n}</td><td>${P100(o.n/tot)}</td><td>${kfmt(o.val/o.n)}</td><td>${P100(o.p/o.n)}</td><td>${(o.h/o.n).toFixed(1)}</td><td>${money(o.x/o.n)}</td></tr>`}).join("")+

  const H=simWeeks(),muH=H*(mu-F),sdH=Math.sqrt(H)*sd,pT=1-normCdf((T.target-muH)/sdH);

  $("o_clt").innerHTML=kpi(money(mu)+" ± "+money(sd),"Contribution per week","theory, mean ± 1σ")+kpi(money(F),"Fixed costs per week","rent, wages, power, sundries")
    +kpi(money(muH),`${H} weeks, theory`,`± ${money(sdH)} (1σ)`)+kpi(P100(pT),"P(≥ target), theory","normal approximation")
    +`<div class="kpi" id="o_cltsim"><span class="lbl">${H} weeks, simulated</span><b class="busy">…</b></div><div class="kpi" id="o_cltp"><span class="lbl">P(≥ target), simulated</span><b class="busy">…</b></div>`;
}

/* §10 SWOT */
function secSwot(){
  const c=R_.cost||{},q=R_.quote||{},r=R_.rel||{},w=R_.wc||{},m=R_.mc||{},x=R_.exp,sc=R_.sched||[],pr=R_.prob||{};
  const edf=sc[0],fc=sc[2];
  $("o_swot").innerHTML=`
   <div class="S"><h4>Strengths</h4><ul><li>Each press hour earns about ${money(c.cph||0)} over running cost at the going rate</li><li>The suggested plan gains a median ${kfmt(m.med||0)} over ${m.W||T.weeks} weeks</li><li>Servicing every ${Math.round(r.T||0)} h saves about ${money(r.saving||0)} a week against waiting for breakdowns</li><li>Earliest-due-first keeps late jobs to ${edf?(edf.late*100).toFixed(1):"0"}% even with a crowded queue</li></ul></div>
   <div class="W"><h4>Weaknesses</h4><ul><li>Fixed costs of ${money(pr.F||weeklyFixed())} a week run whether the press is busy or not</li><li>4-colour work needs two passes: ${c.a?c.a.n:2} makereadies on the 2-col press</li><li>Short runs cost ${c.a?money(c.a.total/(QTY[T.qi]/1000)):"—"} per 1,000 sheets at this size</li><li>Working capital: a ${w.w?w.w.ccc.toFixed(0):"—"}-day cash cycle at the chosen terms</li></ul></div>
   <div class="O"><h4>Opportunities</h4><ul><li>Pricing at about ${Math.round((q.best||1)*100)}% of the going rate wins ${P100(q.p||0)} of such jobs</li><li>Diwali cartons and year-end calendars are mostly 4-colour work</li><li>${x?`The 4-colour rule beats not buying in ${P100(x.win)} of paired runs (median ${kfmt(x.med)})`:"The 4-colour press is already running"}</li><li>Regular clients give 4 points of price room and come back more often</li></ul></div>
   <div class="T"><h4>Threats</h4><ul><li>${P100(m.dead||0)} of simulated games go bust; ${P100(m.crunch||0)} hit a cash crunch</li><li>${w.cross?`Sales above ${money(w.cross)}/week outgrow the bank's limit on these terms`:"Slow payers stretch the overdraft"}</li><li>Paper can jump ${C.PAPER_JUMP_SIZE.map(v=>Math.round(v*100)).join("–")}% in a week; it does so about ${Math.round(C.PAPER_JUMP*52)} times a year</li><li>First-come order lets ${fc?(fc.late*100).toFixed(1):"—"}% of jobs go late when busy</li></ul></div>`;
}

/* ---------- boot ---------- */
function boot(){
  applyTheme();
  const au=LS.get(K_AUTO);
  if(au&&au.v===1&&au.presses){s=au;view="title"}
  render();
  if(tab==="tech")renderTech();
}
boot();
</script>
