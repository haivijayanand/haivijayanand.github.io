<style>
/* Layout: one narrow steel-and-leaf column; sticky status bar; one phase at a time; thumb-sized controls */
:root{

:root[data-theme="dark"]{

.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.card.steel{background:linear-gradient(160deg,var(--card),var(--chip))}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;margin:0;text-wrap:balance;line-height:1.1}
h3{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.wx{display:flex;gap:14px;align-items:center}

.item.off .txt,.item.off .ctl{opacity:.45}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-right:3px;color:var(--muted)}
.big{display:block;width:100%;border:0;border-radius:16px;min-height:56px;padding:14px 16px;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15;background:var(--tur);color:var(--tur-ink);cursor:pointer;box-shadow:0 4px 0 var(--tur-deep)}

.big.alt{background:var(--leaf);color:var(--leaf-ink);box-shadow:0 4px 0 var(--leaf-deep)}

.ghost{width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;min-height:46px;padding:10px 12px;font-weight:700;cursor:pointer}

.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 130px}
details.card{padding:0}

details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"+";font-family:var(--f-num);font-size:20px;color:var(--muted)}
details.card[open]>summary::after{content:"−"}
details.card>summary .sum{font-weight:500;font-size:13px;color:var(--muted);text-align:right;flex:1;min-width:0}
details.card>.in{padding:0 16px 14px}
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:0;background:transparent;border-radius:9px;min-height:40px;padding:6px 8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shade)}
.segrow{display:flex;flex-direction:column;gap:4px;padding-block:8px;border-top:1px dashed var(--line)}
.segrow:first-child{border-top:0}
.segrow>span{font-weight:600;font-size:15px}
/* narration */
.log{font-family:var(--f-num);font-size:13.5px;display:flex;flex-direction:column;gap:9px}
.log .h{display:grid;grid-template-columns:50px 1fr;gap:10px}
.log .t{color:var(--time);font-weight:600}
.log .q{font-family:var(--f-body);font-style:italic;color:var(--muted);font-size:14.5px;margin-top:2px}
.log .warn{color:var(--bad)} .log .good{color:var(--good)}
.log .slot{font-family:var(--f-display);font-weight:800;font-size:18px;color:var(--leaf);border-bottom:2px solid var(--tur);padding-top:6px}
@keyframes pop{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.log .h{animation:pop .3s ease-out}
table{width:100%;border-collapse:collapse;font-size:15px}
td{padding:6px 0;border-bottom:1px dashed var(--line);vertical-align:top}
td:last-child{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:8px}
tr.total td{font-weight:700;border-bottom:0;font-size:17px}
tr.sub td{font-size:13px;color:var(--muted)}
.notes p{margin-bottom:8px;padding-left:14px;border-left:3px solid var(--tur)}
.title-card{text-align:center;padding:24px 16px}
.title-card h1{font-family:var(--f-display);font-weight:800;font-size:44px;margin:4px 0;line-height:.98}
.title-card h1 em{font-style:normal;color:var(--tur-deep)}
.title-card svg.hero{width:96px;height:96px;display:block;margin:0 auto}
.lenpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lenpick button{border:2px solid var(--line);background:var(--chip);border-radius:12px;min-height:56px;padding:8px 4px;font-weight:700;cursor:pointer}
.lenpick button[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf);color:var(--leaf-ink)}
.lenpick button[aria-pressed="true"] .muted{color:inherit;opacity:.85}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.slot{display:flex;gap:8px;align-items:center;padding-block:8px;border-top:1px dashed var(--line)}
.slot:first-of-type{border-top:0}
.slot .info{flex:1;min-width:0;font-size:14px}
.slot button{border:1px solid var(--line);background:var(--chip);border-radius:10px;min-height:44px;padding:8px 12px;font-weight:700;cursor:pointer}
.slot button:disabled{opacity:.4}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px;font-family:var(--f-num);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90%}
.help p{margin-bottom:10px}

.prose{display:flex;flex-direction:column;gap:8px;max-width:65ch}

.tblwrap{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
.tt{width:100%;border-collapse:collapse;font-size:13px;min-width:0}

.tt th:first-child,.tt td:first-child{text-align:left}
.tt td{padding:6px 4px;border-bottom:1px dashed var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tt td:first-child{font-family:var(--f-body);white-space:normal}
.tt td{white-space:normal}.tt.txt td:last-child,.tt.txt th:last-child{text-align:left;font-family:var(--f-body)}
.tt tr.sum td{font-weight:700;border-bottom:0}
.tt tr.hi td{background:var(--chip)}
.formula{font-family:var(--f-num);font-size:12.5px;background:var(--chip);border-radius:10px;padding:10px 12px;line-height:1.7;overflow-x:auto;white-space:pre}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi{background:var(--chip);border-radius:12px;padding:10px 12px;min-width:0}

.verdict{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--chip);font-size:15px;margin-top:8px}
.verdict i{flex:none;font-style:normal;font-family:var(--f-num);font-weight:600;font-size:12px;padding:2px 7px;border-radius:6px;margin-top:2px}

.verdict.no i{background:var(--bad);color:#fff}

.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chart .readout{font-family:var(--f-num);font-size:12.5px;min-height:2.6em;color:var(--ink);padding-top:4px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-bottom:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:4px;border-radius:2px;display:inline-block}
.legend i.dash{height:0;border-top:2px dashed var(--muted);border-radius:0;background:none}

svg .ax{font-family:var(--f-num);font-size:11px;fill:var(--muted)}
svg .lab{font-family:var(--f-body);font-size:12px;font-weight:700;fill:var(--ink)}
svg .grid{stroke:var(--line);stroke-width:1}
svg .guide{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 3}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.swot>div{border-radius:14px;padding:12px;background:var(--chip);min-width:0}
.swot h4{margin:0 0 6px;font-family:var(--f-display);font-size:20px;line-height:1}
.swot ul{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:5px}
.swot .S h4{color:var(--good)} .swot .W h4{color:var(--bad)} .swot .O h4{color:var(--time)} .swot .T h4{color:var(--tur-deep)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--chip);border-radius:999px;min-height:40px;padding:5px 14px;font-weight:700;font-size:13px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--tur);width:0}
@media (max-width:440px){.swot{grid-template-columns:1fr}}
:focus-visible{outline:3px solid var(--tur);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.log .h{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>

/* ---------- queueing: Erlang C and walk-aways ---------- */
function erlangC(c,a){ // probability an arrival waits in M/M/c, a = λ/μ < c

/* moneylender covers a negative cash balance in chunks; past the limit the shop is bankrupt */

/* ---------- strategy bots (balance tests and the Tech tab's Monte Carlo) ---------- */
function botPlan(st,P){
  const pl=defaultPlan();
  for(const id of K.ITEM_ORDER){const f=K.ITEMS[id].fair*(K.FAIR_REP[0]+K.FAIR_REP[1]*st.rep[K.ITEMS[id].cat]),stp=K.ITEMS[id].step;pl.price[id]=Math.max(stp,Math.round(f*P.k/stp)*stp)}
  if(P.noMeals)pl.on.meals=0;
  pl.cook=P.cook;pl.servers=P.servers;pl.clean=P.clean;pl.oilRule=P.oilRule;pl.credit=P.credit;pl.reorder=P.reorder;pl.emergency=P.emergency;
  pl.cater=P.cater&&P.cook&&repAll(st.rep)>=K.CATER.minRep?1:0;
  const sg=suggest(st,pl,P.buffer);pl.milk=sg.milk;pl.veg=sg.veg;pl.grind=sg.grind;
  if(P.fixedStock){pl.milk=P.fixedStock.milk;pl.veg=P.fixedStock.veg;pl.grind=P.fixedStock.grind}
  return pl;
}
function botLoans(st){ // repay the moneylender as soon as cash allows
  while(st.lender>0&&st.cash>K.LENDER.chunk+4000){st.lender-=K.LENDER.chunk;st.cash-=K.LENDER.chunk}
}
const POLICIES={
  sensible:{k:1.1,cook:1,servers:1,clean:150,oilRule:0.5,credit:"regulars",reorder:9,emergency:1,buffer:1.1},
  careless:{k:1.35,cook:0,servers:0,clean:0,oilRule:0,credit:"anyone",reorder:3,emergency:1,buffer:1.6},

/* seeded runs of the engine. Every day has its own random stream, so two runs with the same seed
   see the same weather, events and customers (common random numbers for paired comparisons). */
function simCtx(days,opt){
  const st=newState(days);if(opt&&opt.cash!=null)st.cash=opt.cash;if(opt&&opt.rep!=null)st.rep={tea:opt.rep,tiffin:opt.rep};
  return{st,st2:null,dead:false,o:{nw:new Float32Array(days),rev:new Float32Array(days),profit:new Float32Array(days),bank:-1,crunch:false,crunchDay:-1,open:-1,end:0,gasOut:0,black:0,walk:0,cust:0}};
}
function expReady(c,d,ex){return!!ex&&!c.st2&&d>=7&&repAll(c.st.rep)>=ex.trigger&&c.st.cash>=ex.setup+ex.reserve}
function simDay(c,d,P,ex,seed){
  const st=c.st,o=c.o,days=o.nw.length;
  const r=mulberry32((seed*2654435761+d*40503+17)>>>0);
  const two=()=>c.st2&&!c.st2.cater;
  const nw0=netWorth(st)+(two()?receivables(c.st2):0);
  startDay(st,r);
  if(expReady(c,d,ex)){
    if(ex.type==="outlet"){st.cash-=ex.setup;const s2=newState(days);s2.day=st.day;s2.cash=0;s2.rep={tea:st.rep.tea*ex.carry,tiffin:st.rep.tiffin*ex.carry};s2.foot=ex.foot2;s2.extraWage=ex.wage;s2.noSettle=true;st.foot=1-ex.cann;c.st2=s2}
    else{st.cash-=ex.setup;st.caterOn=true;c.st2={cater:true}}
    o.open=d;
  }
  const pl=botPlan(st,P);if(st.caterOn){pl.cater=1;pl.cook=1}
  st.noSettle=two();
  runDay(st,pl,r,false);
  if(two()){const s2=c.st2,r2=mulberry32((seed*2246822519+d*3266489917+99)>>>0);s2.day=st.day;startDay(s2,r2);s2.forecast=st.forecast;s2.cash=st.cash;runDay(s2,botPlan(s2,P),r2,false);st.cash=s2.cash;st.noSettle=false;settle(st,r,st.report)}
  if(st.lender>0&&!o.crunch){o.crunch=true;o.crunchDay=d}
  botLoans(st);
  const nw=netWorth(st)+(two()?receivables(c.st2):0);
  o.nw[d]=nw;o.profit[d]=nw-nw0;o.rev[d]=st.report.rev+(two()?c.st2.report.rev:0);o.walk+=st.report.walk;o.cust+=st.report.cust;
  if(st.report.gasOutAt!=null)o.gasOut++;o.black+=st.report.blackBuys;

  st.day++;

function simFinish(c){const o=c.o;o.end=o.nw[o.nw.length-1];o.rep=repAll(c.st.rep);return o}
function simRun(seed,days,P,opt){
  const c=simCtx(days,opt);for(let d=0;d<days&&!c.dead;d++)simDay(c,d,P,opt&&opt.exp,seed);return simFinish(c);
}
/* a run without and with an expansion rule; they share every day up to the moment the rule fires */
function cloneCtx(c){const o=c.o;return{st:JSON.parse(JSON.stringify(c.st)),st2:null,dead:c.dead,o:Object.assign({},o,{nw:o.nw.slice(),rev:o.rev.slice(),profit:o.profit.slice()})}}
function simPair(seed,days,P,ex){
  const a=simCtx(days);let b=null;
  for(let d=0;d<days;d++){
    if(!b&&!a.dead&&expReady(a,d,ex))b=cloneCtx(a);
    if(!a.dead)simDay(a,d,P,null,seed);
    if(b&&!b.dead)simDay(b,d,P,ex,seed);
  }
  return{base:simFinish(a),exp:b?simFinish(b):Object.assign({},a.o)};
}

  if(s.endNext){s.phase="final";recordBest();autosave();render();window.scrollTo(0,0);return}
  s.day++;startDay(s,rngLive);autosave();render();window.scrollTo(0,0);
}
function recordBest(){
  if(s.bestDone)return;s.bestDone=true;
  const best=LS.get(K_BEST)||{},k=String(s.days),prof=netWorth(s)-K.START_CASH;
  if(s.over!=="bankrupt"&&(best[k]==null||prof>best[k])){best[k]=Math.round(prof);LS.set(K_BEST,best);s.newBest=true}
}

/* ---------- night accounts ---------- */
function notes(r){
  const t=[],pl=s.lastPlan||s.plan;
  if(r.bankrupt)return["The moneylender will not lend more. The shop is closed."];
  if(r.walkFrac>0.08)t.push(`${Math.round(r.walk)} customers (${pctS(r.walkFrac)}) walked off from the queue. ${pl.cook?"":"A cook speeds up the counter by half. "}${pl.servers<3?"Another server adds a counter.":""}`);
  const lostIt=K.ITEM_ORDER.filter(id=>r.lost[id]>=4).sort((a,b)=>r.lost[b]-r.lost[a]);
  if(r.gasOutAt!=null)t.push(`The gas ran out at ${r.gasOutAt}:00 and the stove went cold. Raise the reorder point or keep the black-market option on.`);
  else if(r.blackBuys)t.push(`You paid black-market rates for gas. A reorder point of 8–10 kg covers the 1–2 day delivery wait.`);
  if(lostIt.length&&r.gasOutAt==null){const id=lostIt[0],g=Object.keys(K.ITEMS[id].use)[0];t.push(`You turned away ${r.lost[id]} ${K.ITEMS[id].name.replace(/ \(.*\)/,"").toLowerCase()} orders. Short of ${K.ING[g].name.toLowerCase()}${g==="batter"?": grind more tonight":""}.`)}
  if(r.milkWaste>=2)t.push(`${f1(r.milkWaste)} L of milk was thrown away (${money(r.milkWaste*K.ING.milk.price)}). Buy closer to the suggested amount.`);
  if(r.batterWaste>=1.5)t.push(`${f1(r.batterWaste)} kg of day-old batter went in the bin. Grind less tonight.`);
  if(r.oil[1]<0.5&&!(pl.oilRule>=0.5))t.push(`Frying oil is down to ${pctS(r.oil[1])}. Old oil makes vada and bajji taste bad and hurts hygiene.`);
  if(r.hyg[1]<0.5)t.push(`Hygiene is ${pctS(r.hyg[1])}. Spend more on cleaning before a food inspector walks in.`);
  const over=K.ITEM_ORDER.filter(id=>pl.on[id]&&pl.price[id]>K.REP.overAt*fairEff(s,id));
  if(over.length)t.push(`${over.map(id=>K.ITEMS[id].name).join(", ")} ${over.length>1?"are":"is"} priced well above fair. Customers grumble and reputation slips.`);
  if(r.cookIn===0&&pl.cook)t.push("The cook didn't come. Morale is "+pctS(r.mor[1])+"; tea money helps.");
  const toMonth=K.MONTH-((s.day-1)%K.MONTH)-1;
  if(toMonth>0&&toMonth<=4&&s.cash<K.RENT+K.ELEC)t.push(`Rent and bills of about ${money(K.RENT+K.ELEC)} are due in ${toMonth} day${toMonth>1?"s":""}. Keep cash for them.`);
  if(s.lender>0)t.push(`You owe the moneylender ${money(s.lender)} at ${(K.LENDER.rate*100).toFixed(1)}% a day. Repay it first.`);
  if(r.taste.tiffin!=null&&r.taste.tiffin<K.REP.mid&&!pl.cook)t.push("Tiffin tastes ordinary without a cook, so tiffin reputation drifts down.");
  if(!t.length)t.push("A steady day. Check tomorrow's forecast and the suggested stock before opening.");
  return t.slice(0,4);
}

    ${m?rowE(`Rent, electricity${m.lic?", licence renewal":""}`,ex.bills)+(m.lostK?rowE("Khata never repaid",m.lostK):""):""}

  <div class="card"><h3>Overnight</h3><table>
    <tr><td>Reputation: tea</td><td class="${d(r.rep1.tea-r.rep0.tea)}">${pctS(r.rep0.tea)} → ${pctS(r.rep1.tea)}</td></tr>

    <tr><td>Frying oil${r.oil[2]?" (changed this morning)":""}</td><td>${pctS(r.oil[1])}</td></tr>
    <tr><td>Milk thrown away</td><td>${f1(r.milkWaste)} L</td></tr>
    <tr><td>Day-old batter thrown away</td><td>${f1(r.batterWaste)} kg</td></tr>
    <tr><td>Vegetables thrown away</td><td>${f1(r.vegWaste)} kg</td></tr>
    <tr><td>Batter ground for tomorrow</td><td>${r.gCan} kg${r.gCan<r.gWant?" (cash ran short)":""}</td></tr>

function profitBars(){
  const h=s.history;if(!h.length)return"";
  return `<div class="chart" id="c_final"></div>`;
}
function drawFinal(){
  const el=$("c_final");if(!el)return;
  drawBars(el,{cats:s.history.map(x=>"D"+x.day),series:[{name:"Profit",color:"--s1",vals:s.history.map(x=>x.profit),signColor:true}],H:200,
    readout:i=>`Day ${s.history[i].day}: profit ${money(s.history[i].profit)}, sales ${money(s.history[i].rev)}, ${s.history[i].cust} customers, ${K.WX[s.history[i].wx].name.toLowerCase()}`,
    def:"Tap a day to see its profit.",labelEvery:Math.ceil(s.history.length/8)});
}
function renderFinal(){
  const prof=netWorth(s)-K.START_CASH,best=(LS.get(K_BEST)||{})[String(s.days)],per=prof/s.days,bk=s.over==="bankrupt";
  const grade=bk?"Closed by the moneylender":per>=2000?"Talk of the town":per>=1000?"Busy corner shop":per>=400?"Steady little shop":per>0?"Just about paying":"Shutters down";
  return `<section>
  <div class="card title-card">${tumbler("hero")}<div class="lbl">${bk?`Closed on day ${s.history.length} of ${s.days}`:`${s.days} days done`}</div><h1>${grade}</h1>
    <p>${bk?"Cash ran out and the moneylender's limit was reached. ":""}You end with <b class="num">${money(s.cash)}</b> in cash, <b class="num">${money(receivables(s))}</b> owed in the khata and <b class="num">${money(s.bank+s.lender)}</b> of loans.</p>
    <p style="margin-top:6px">Net result: <b class="num ${prof>=0?"pos":"neg"}">${money(prof)}</b> on the ${money(K.START_CASH)} you started with.</p>

/* ---- configuration seen by the engine while the tab computes ---- */
function cfgK(){const c=JSON.parse(JSON.stringify(K0));c.START_CASH=T.startCash;c.START_REP=T.startRep/100;c.DEFAULT.stranger=T.dflt/100;c.CATER.plates=T.plates;c.CATER.price=T.cprice;return c}
let TK=K0;
function withK(fn){const old=K;K=TK;try{return fn()}finally{K=old}}
function policy(){return{k:T.k/100,cook:T.cook,servers:T.servers,clean:T.clean,oilRule:T.oilRule/100,credit:T.credit,reorder:T.reorder,emergency:1,buffer:T.buffer/100}}
function probe(rep,day){const st=newState(30);st.rep={tea:rep,tiffin:rep};st.day=day||1;st.forecast="sunny";st.event=null;st.batter={fresh:0,old:0};st.veg={fresh:0,old:0};return st}
function planFor(st,over){const P=Object.assign(policy(),over||{});return botPlan(st,P)}
function wagesOf(pl){return pl.cook*K.WAGE.cook+pl.servers*K.WAGE.server}
function dayEcon(st,pl,ctx){
  const e=expectDay(st,pl,ctx);let gross=0,v=0,gas=K.GAS_IDLE*9,gasB=K.GAS_IDLE*3,fried=0;
  for(const id of K.ITEM_ORDER){const u=e.units[id];if(!u)continue;const m=(id==="meals"&&ctx.cater?((u-ctx.cater)*pl.price[id]+ctx.cater*K.CATER.price)/u:pl.price[id])-unitCost(id);gross+=u*m;v+=u*m*m;gas+=u*K.ITEMS[id].gas;fried+=u*(K.ITEMS[id].fried||0)}
  for(const h of e.hr)if(h.slot==="breakfast")K.ITEM_ORDER.forEach((id,j)=>gasB+=h.lam*(1-h.w)*h.p[j]*K.ITEMS[id].gas);
  return{e,gross,v,gas,gasB,fried,need:ingNeed(e.units)};
}
function fixedDay(pl,fried){
  const deg=K.OIL_DEG[0]+K.OIL_DEG[1]*(fried||0),oil=pl.oilRule>0?K.OIL_KADAI*K.ING.oil.price*deg/(1-pl.oilRule):0;
  return{rent:(K.RENT+K.ELEC)/K.MONTH,wages:wagesOf(pl),clean:pl.clean,oil,all:(K.RENT+K.ELEC)/K.MONTH+wagesOf(pl)+pl.clean+oil};
}
/* weather × weekday scenarios with probabilities */
function scenarios(){const out=[];for(const dt of ["wd","we"])for(const w of K.WX_ORDER)out.push({dt,wx:w,p:(dt==="wd"?5/7:2/7)*K.WX[w].w/100});return out}
function blended(rep,over){
  const st=probe(rep),pl=planFor(st,over);let E=0,E2=0,cust=0,walk=0,rev=0,gas=0,gas2=0,gasB=0,fried=0;const rows=[];
  for(const sc of scenarios()){const d=dayEcon(st,pl,{dt:sc.dt,wx:sc.wx,ev:null,cook:pl.cook,servers:pl.servers,cater:0});
    E+=sc.p*d.gross;E2+=sc.p*(d.v+d.gross*d.gross);cust+=sc.p*d.e.cust;walk+=sc.p*d.e.walk;rev+=sc.p*d.e.rev;gas+=sc.p*d.gas;gas2+=sc.p*d.gas*d.gas;gasB+=sc.p*d.gasB;fried+=sc.p*d.fried;rows.push(Object.assign({},sc,{d}))}
  return{st,pl,E,sd:Math.sqrt(Math.max(0,E2-E*E)),cust,walk,rev,gas,gasSdMix:Math.sqrt(Math.max(0,gas2-gas*gas)),gasB,fried,rows,fixed:fixedDay(pl,fried)};
}
function normCdf(z){const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);const p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p}
const normPdf=z=>0.3989423*Math.exp(-z*z/2);
function pct(a,q){if(!a.length)return NaN;const b=Float64Array.from(a).sort();const i=(b.length-1)*q,lo=Math.floor(i);return b[lo]+(b[Math.min(lo+1,b.length-1)]-b[lo])*(i-lo)}

/* ---- chart helpers ---- */
function niceStep(range,n){const raw=range/n||1,mag=Math.pow(10,Math.floor(Math.log10(raw)));return[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw)}
function niceTicks(lo,hi,n){if(hi<=lo)hi=lo+1;const st=niceStep(hi-lo,n),a=Math.floor(lo/st)*st,out=[];for(let v=a;v<=hi+st*0.999;v+=st)out.push(+v.toFixed(10));return out}
const kfmt=v=>Math.abs(v)>=1000?(v<0?"−":"")+"₹"+(Math.abs(v)>=100000?(Math.abs(v)/100000).toFixed(Math.abs(v)>=1000000?0:1).replace(/\.0$/,"")+"L":(Math.abs(v)/1000).toFixed(Math.abs(v)>=10000?0:1).replace(/\.0$/,"")+"k"):money(v);
function chartFrame(el,H){const W=Math.max(280,Math.round(el.clientWidth||340));return{W,H,l:48,r:12,t:14,b:28}}
function hookHover(el,pick,def){
  const svg=el.querySelector("svg"),out=el.querySelector(".readout"),g=svg.querySelector(".guide");out.textContent=def;
  const move=e=>{const bb=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,x=(e.clientX-bb.left)*vb.width/bb.width;const h=pick(x);if(!h)return;
    g.setAttribute("x1",h.x);g.setAttribute("x2",h.x);g.style.display="";out.textContent=h.text};
  svg.addEventListener("pointermove",move);svg.addEventListener("pointerdown",move);
  svg.addEventListener("pointerleave",()=>{g.style.display="none";out.textContent=def});
}
const linePath=pts=>pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
const legendHTML=items=>`<div class="legend">${items.map(([n,c,kind])=>`<span><i class="${kind||""}" style="${kind==="dash"?"":`background:var(${c})`}${kind==="sq"?";height:10px;width:10px":""}"></i>${n}</span>`).join("")}</div>`;
function drawLines(el,o){
  const f=chartFrame(el,o.H||220),xs=o.xs,n=xs.length,all=o.series.flatMap(s=>s.ys).filter(Number.isFinite);
  let lo=o.ymin!=null?o.ymin:Math.min(0,...all),hi=o.ymax!=null?o.ymax:Math.max(...all);if(hi<=lo)hi=lo+1;
  const tk=niceTicks(lo,hi,4),y0=tk[0],y1=tk[tk.length-1];
  const X=i=>f.l+i/(n-1)*(f.W-f.l-f.r),Y=v=>f.t+(y1-clamp(v,y0,y1))/(y1-y0)*(f.H-f.t-f.b);

function drawBars(el,o){
  const f=chartFrame(el,o.H||210),n=o.cats.length,S=o.series,all=S.flatMap(s=>s.vals).filter(Number.isFinite);

    S.forEach((s,j)=>{const v=s.vals[i];if(!Number.isFinite(v))return;const x=x0+j*(bw+1),yb=Y(0),y=Y(v),h=Math.abs(yb-y),r=Math.min(3,h/2,bw/2);
      const col=s.signColor&&v<0?"--bad":s.color;
      const d=v>=0?`M${x} ${yb}V${y+r}Q${x} ${y} ${x+r} ${y}H${x+bw-r}Q${x+bw} ${y} ${x+bw} ${y+r}V${yb}Z`:`M${x} ${yb}H${x+bw}V${y-r}Q${x+bw} ${y} ${x+bw-r} ${y}H${x+r}Q${x} ${y} ${x} ${y-r}Z`;
      svg+=`<path d="${d}" fill="var(${col})"/>`;if(o.values&&n*S.length<=8)svg+=`<text class="ax" x="${x+bw/2}" y="${v>=0?y-4:y+12}" text-anchor="middle" style="fill:var(--ink)">${kfmt(v)}</text>`})}

/* ---- Monte Carlo jobs (time-sliced so the page stays responsive) ---- */
let MC={key:null,done:false,base:null,exp:null,cred:null,ms:0},mcJob=null;
function mcKey(){return JSON.stringify([T.startCash,T.startRep,T.k,T.cook,T.servers,T.credit,T.clean,T.oilRule,T.reorder,T.buffer,T.dflt,T.runs,T.horizon,T.expType,T.trigger,T.setup,T.reserve,T.foot2,T.carry,T.cann,T.mwage,T.plates,T.cprice,T.csetup])}
function expOpt(){return T.expType==="outlet"?{type:"outlet",trigger:T.trigger/100,setup:T.setup,reserve:T.reserve,foot2:T.foot2/100,carry:T.carry/100,cann:T.cann/100,wage:T.mwage}
  :{type:"cater",trigger:Math.max(T.trigger/100,TK.CATER.minRep),setup:T.csetup,reserve:T.reserve}}
function startMC(){
  const key=mcKey();if(MC.key===key&&(MC.done||mcJob))return;
  if(mcJob)clearTimeout(mcJob.timer);
  const P=policy(),N=T.runs,H=T.horizon,nc=Math.max(50,Math.round(N/4)),ex=expOpt();
  const tasks=[];for(let i=0;i<N;i++)tasks.push(["pair",i]);
  for(const c of ["none","regulars","anyone"])if(c!==T.credit||H<30)for(let i=0;i<nc;i++)tasks.push(["cred",i,c]);
  MC={key,done:false,base:[],exp:[],cred:{none:[],regulars:[],anyone:[]},ms:0};
  const job={tasks,k:0,cache:new Map(),t0:performance.now(),cpu:0};mcJob=job;
  const slice=()=>{
    if(mcJob!==job)return;
    const a=performance.now(),oldK=K;K=TK;SUG_CACHE=job.cache;
    try{while(job.k<tasks.length&&performance.now()-a<24){const [kind,i,c]=tasks[job.k++];
      if(kind==="pair"){const pr=simPair(i+1,H,P,ex);MC.base.push(pr.base);MC.exp.push(pr.exp)}
      else MC.cred[c].push(simRun(i+1,30,Object.assign({},P,{credit:c})))}}
    finally{K=oldK;SUG_CACHE=null}
    job.cpu+=performance.now()-a;
    document.querySelectorAll(".mcstat").forEach(e=>e.innerHTML=`Simulating ${Math.round(job.k/tasks.length*100)}%<div class="prog"><i style="width:${job.k/tasks.length*100}%"></i></div>`);
    if(job.k<tasks.length){job.timer=setTimeout(slice,0);return}
    if(H>=30)MC.cred[T.credit]=MC.base.slice(0,nc); // same seeds, same first 30 days
    MC.done=true;MC.ms=job.cpu;mcJob=null;drawMC();
  };
  job.timer=setTimeout(slice,0);
}

function analytic(){
  const rep=T.qRep/100,B=blended(rep),st=B.st,pl=B.pl;
  A={B};
  /* 1 constraints */
  const st0=probe(T.startRep/100),pl0=planFor(st0),d0=dayEcon(st0,pl0,{dt:"wd",wx:"sunny",ev:null,cook:pl0.cook,servers:pl0.servers,cater:0});
  const n0=d0.need,cashDay=(n0.milk||0)*K.ING.milk.price+(n0.veg||0)*K.ING.veg.price+(n0.batter||0)*K.ING.batter.price+wagesOf(pl0)+pl0.clean+d0.gas*K.GAS_PRICE/K.GAS_CYL;
  const bk=d0.e.hr.filter(h=>h.slot==="breakfast"),pk=bk.reduce((a,h)=>h.lam>a.lam?h:a,bk[0]),walk0=d0.e.walk/Math.max(1,d0.e.cust);
  const gasDays=K.GAS_CYL/d0.gas,batNeed=n0.batter||0,bills=K.RENT+K.ELEC+K.ELEC_GRIND*30*batNeed;
  const repMul=(K.REP_ARR[0]+K.REP_ARR[1]*T.startRep/100)/(K.REP_ARR[0]+K.REP_ARR[1]);
  $("o_cons").innerHTML=`<tr><th>Constraint</th><th>Value</th><th>Effect</th></tr>
   <tr><td>Starting cash</td><td>${money(T.startCash)}</td><td>${(T.startCash/cashDay).toFixed(1)} days of costs</td></tr>
   <tr><td>Breakfast peak (8–9)</td><td>${Math.round(pk.lam)}/hr</td><td>can serve ${Math.round(pk.c*pk.mu)}/hr</td></tr>
   <tr><td>Walk-offs, day one</td><td>${P100(walk0)}</td><td>${Math.round(d0.e.walk)} customer${Math.round(d0.e.walk)===1?"":"s"} lost</td></tr>
   <tr><td>Batter ground last night</td><td>${K.START_BATTER} kg</td><td>day one needs ${f1(batNeed)} kg</td></tr>
   <tr><td>Gas in the cylinder</td><td>${K.GAS_CYL} kg</td><td>${gasDays.toFixed(1)} days; refill takes ${K.GAS_LEAD[0]}–${K.GAS_LEAD[1]}</td></tr>
   <tr><td>Rent and bills, day ${K.MONTH}</td><td>${money(bills)}</td><td>${money(bills/K.MONTH)}/day to set aside</td></tr>
   <tr><td>Reputation ${T.startRep}%</td><td>${P100(repMul)}</td><td>of the crowd a top shop gets</td></tr>`;
  const vs=[];
  if(walk0>0.1)vs.push(verdict("no","CAPACITY",`At the breakfast peak about <b>${Math.round(pk.lam)}</b> people an hour arrive, but the counter handles <b>${Math.round(pk.c*pk.mu)}</b>. ${P100(walk0)} of the day's customers walk off. Staff is the first limit.`));
  if(T.startCash<cashDay*2)vs.push(verdict("no","CASH",`${money(T.startCash)} covers only ${(T.startCash/cashDay).toFixed(1)} days of milk, batter, wages and gas at ${money(cashDay)} a day. One bad day sends you to the moneylender.`));
  if(batNeed>K.START_BATTER)vs.push(verdict("mid","BATTER",`Day one's tiffin needs about ${f1(batNeed)} kg of batter but only ${K.START_BATTER} kg was ground. Idli and dosa sell out early on day one.`));
  if(!vs.length)vs.push(verdict("ok","DEMAND",`Cash, staff and stock all cover day one. At ${T.startRep}% reputation the crowd is ${P100(repMul)} of what a top shop draws, so growing reputation is the job.`));
  $("o_bind").innerHTML=vs.join("");

  /* 2 unit economics */
  const fx=B.fixed;
  $("o_unit").innerHTML=`<tr><th>Item</th><th>Food</th><th>Other</th><th>Price</th><th>Margin</th><th>%</th></tr>`+K.ITEM_ORDER.map(id=>{const it=K.ITEMS[id],uc=unitCost(id),food=uc-it.extra-it.gas*K.GAS_PRICE/K.GAS_CYL,pr=pl.price[id];

  const perCust=B.E/Math.max(1,B.cust-B.walk),be=fx.all/Math.max(1,perCust);

  const yAll=prof(null),yWd=prof("wd"),yWe=prof("we"),bi=yAll.indexOf(Math.max(...yAll));A.bestK=ks[bi];A.yAll=yAll;A.ks=ks;

  /* 3 probability */
  $("o_scn").innerHTML=`<tr><th>Day</th><th>Chance</th><th>Customers</th><th>Sales</th><th>Gross ± σ</th></tr>`+B.rows.map(r=>`<tr><td>${r.dt==="wd"?"Weekday":"Weekend"}, ${K.WX[r.wx].name.toLowerCase()}</td><td>${P100(r.p)}</td><td>${Math.round(r.d.e.cust)}</td><td>${money(r.d.e.rev)}</td><td>${money(r.d.gross)} ± ${money(Math.sqrt(r.d.v))}</td></tr>`).join("")
    +`<tr class="sum"><td>Blended day</td><td>100%</td><td>${Math.round(B.cust)}</td><td>${money(B.rev)}</td><td>${money(B.E)} ± ${money(B.sd)}</td></tr>`;

    const pkh=hr.reduce((a,h)=>h.lam>a.lam?h:a,hr[0]),wsl=hr.reduce((a,h)=>a+h.lam*h.w,0)/hr.reduce((a,h)=>a+h.lam,0),rho=pkh.lam/(c*pkh.mu);

function money2(x){return(x<0?"−":"")+"₹"+Math.abs(x).toFixed(2)}

function newsvendor(st,pl){
  const isMilk=T.nvItem==="milk",g=isMilk?"milk":"batter",c=K.ING[g].price,salv=isMilk?0:0.5*c;
  const scs=T.nvKnow?[{dt:"wd",wx:"sunny",p:1}]:scenarios();
  const comps=[];let netRev=0,useTot=0;
  for(const sc of scs){const e=expectDay(st,pl,{dt:sc.dt,wx:sc.wx,ev:null,cook:pl.cook,servers:pl.servers,cater:0});let mu=0,v=0;
    for(const id of K.ITEM_ORDER){const u=K.ITEMS[id].use[g];if(!u||!e.units[id])continue;mu+=u*e.units[id];v+=u*u*e.units[id];
      netRev+=sc.p*e.units[id]*(pl.price[id]-(unitCost(id)-u*c));useTot+=sc.p*e.units[id]*u}
    comps.push({p:sc.p,mu,sd:Math.sqrt(Math.max(v,1e-6))})}
  const r=netRev/Math.max(1e-9,useTot),cu=r-c,co=c-salv,CR=cu/(cu+co);
  const F=x=>comps.reduce((a,m)=>a+m.p*normCdf((x-m.mu)/m.sd),0);
  const Eshort=Q=>comps.reduce((a,m)=>{const z=(Q-m.mu)/m.sd;return a+m.p*(m.sd*normPdf(z)+(m.mu-Q)*(1-normCdf(z)))},0); // E[(D−Q)+]
  const mu=comps.reduce((a,m)=>a+m.p*m.mu,0);
  const profit=Q=>{const sh=Eshort(Q),sold=mu-sh,left=Q-sold;return r*sold-c*Q+salv*left};
  let lo=0,hi=mu*3+10;for(let i=0;i<50;i++){const m=(lo+hi)/2;if(F(m)<CR)lo=m;else hi=m}const Qs=(lo+hi)/2;
  const sug=Math.ceil(mu*T.buffer/100),qmax=Math.max(Qs,sug,mu)*1.6+2,step=qmax>40?1:0.5,xs=[];for(let q=0;q<=qmax;q+=step)xs.push(q);
  const ys=xs.map(profit),iQ=Math.round(Qs/step),iS=Math.round(sug/step),unit=isMilk?"L":"kg";
  A.nv={CR,Qs,mu,item:g};
  $("o_nvk").innerHTML=kpi(money2(cu),"Underage cost c_u",`lost margin per ${unit} short`)+kpi(money2(co),"Overage cost c_o",isMilk?"milk poured away":"half lost: sold day-old, then binned")
    +kpi(P100(CR),"Critical ratio","c_u / (c_u + c_o)")+kpi(f1(Qs)+" "+unit,"Best amount",`expected need ${f1(mu)} ${unit}; P(run short) ${P100(1-CR)}`);
  drawLines($("c_nv"),{xs,xfmt:v=>v+" "+unit,series:[{name:"Expected profit",color:"--s3",ys}],label:"Expected profit against amount bought",
    marks:[{i:iQ,label:`Best ${f1(Qs)}`,color:"--ink"},{i:Math.min(iS,xs.length-1),label:`Your buffer ${sug}`,color:"--s4",row:1}],
    readout:i=>`Buy ${f1(xs[i])} ${unit}: expected profit ${money(ys[i])}, P(enough) ${P100(F(xs[i]))}, expected left over ${f1(Math.max(0,xs[i]-(mu-Eshort(xs[i]))))} ${unit}`,
    def:`Best ${f1(Qs)} ${unit} earns ${money(profit(Qs))}; your buffer of ${T.buffer}% (${sug} ${unit}) earns ${money(profit(sug))}.`});
}
function lpg(B){
  const mu=B.gas,sd=Math.sqrt(Math.max(0.01,B.gasSdMix*B.gasSdMix+0.15*mu)),fb=B.gasB/mu;
  const P=R=>{let p=0,n=0;for(const L of K.GAS_LEAD)for(let j=0;j<10;j++){const X=Math.max(0,R-mu*(j+0.5)/10),m=(L-1+fb)*mu,s2=Math.sqrt((L-1+fb)*sd*sd);p+=1-normCdf((X-m)/Math.max(0.05,s2));n++}return p/n};
  const Rs=[];for(let r=0;r<=19;r++)Rs.push(r);const ys=Rs.map(P),cycles=30*mu/K.GAS_CYL,pc=P(T.reorder);
  A.lpg={mu,pc,cycles};
  const prem=K.GAS_BLACK-K.GAS_PRICE;
  $("o_lpgk").innerHTML=kpi(f1(mu)+" kg","Gas per day",`± ${f1(sd)} kg; ${P100(fb)} of it by noon`)+kpi(cycles.toFixed(1),"Refills per month",`one ${K.GAS_CYL} kg cylinder every ${(K.GAS_CYL/mu).toFixed(1)} days`)
    +kpi(P100(pc),"Run dry per refill",`at R = ${T.reorder} kg`)+kpi(money(pc*cycles*prem),"Expected black-market cost",`a month, at ${money(prem)} extra per emergency cylinder`);
  drawLines($("c_lpg"),{xs:Rs,xfmt:v=>v+"kg",yfmt:v=>Math.round(v*100)+"%",ymin:0,ymax:1,series:[{name:"P(stock-out)",color:"--s2",ys}],label:"Chance of running out per refill cycle",
    marks:[{i:T.reorder,label:`R = ${T.reorder} kg`,color:"--ink"}],readout:i=>`R = ${Rs[i]} kg: runs dry in ${P100(ys[i])} of refill cycles, about ${(ys[i]*cycles).toFixed(1)} times a month`,
    def:`Lead-time use is ${f1(fb*mu)} kg (next-day delivery) or ${f1((1+fb)*mu)} kg (two-day). Below about ${Math.ceil((1+fb)*mu)} kg the risk climbs fast.`});
}
function creditTable(rep){

function drawHist(){

    `Solid bars reach the target. ${P100(pHit)} of runs make at least ${money(T.target)} in month ${T.month}; ${P100(Pf.filter(v=>v<0).length/Pf.length)} lose money.`);

function creditMC(){

  const st=pol.map(c=>{const R=MC.cred[c];const p=R.map(o=>{let a=0;for(let d=0;d<30;d++)a+=o.profit[d];return a});return{c,med:pct(p,.5),p10:pct(p,.1),crunch:R.filter(o=>o.crunch&&o.crunchDay<30).length/R.length,bank:R.filter(o=>o.bank>=0&&o.bank<30).length/R.length}});
  A.credMC=st;
  drawBars($("c_cred"),{cats:pol.map(c=>names[c]),series:[{name:"Median month-1 profit",color:"--s1",vals:st.map(x=>x.med)}],values:true,H:180,label:"Median first-month profit by credit policy",
    readout:i=>`${names[pol[i]]}: median ${money(st[i].med)}, 1 in 10 below ${money(st[i].p10)}, needed the moneylender in ${P100(st[i].crunch)} of runs`,def:"Tap a bar for the cash-crunch odds."});
  const best=st.reduce((a,b)=>b.med>a.med?b:a),any=st[2],reg=st[1];
  $("o_credv").innerHTML=verdict(best.c==="anyone"?"mid":"ok",best.c.toUpperCase(),`From ${T.startRep}% reputation, <b>${names[best.c]}</b> gives the best median first month (${money(best.med)}). Credit for anyone puts you with the moneylender in ${P100(any.crunch)} of runs against ${P100(reg.crunch)} for regulars only, because the money comes in after the rent is due.`);
}
function expansion(){
  const B=MC.base,X=MC.exp,N=B.length,opened=X.filter(o=>o.open>=0),od=opened.map(o=>o.open);
  let win=0;for(let i=0;i<N;i++)if(X[i].end>B[i].end)win++;
  const gain=X.map((o,i)=>o.end-B[i].end),bkB=B.filter(o=>o.bank>=0).length/N,bkX=X.filter(o=>o.bank>=0).length/N;
  A.exp={pOpen:opened.length/N,win:win/N,gain:pct(gain,.5)};
  $("o_exp").innerHTML=kpi(P100(opened.length/N),`Rule met within ${T.horizon} days`,od.length?`median day ${Math.round(pct(od,.5))+1}`:"never met")
    +kpi(P100(win/N),"Ends richer than one shop","same weather and customers")+kpi(money(pct(gain,.5)),"Median gain by day "+T.horizon,`1 in 10 below ${money(pct(gain,.1))}`)
    +kpi(`${P100(bkB)} → ${P100(bkX)}`,"Bankruptcy","without → with");
  const M=Math.floor(T.horizon/30),vb=[],vx=[];for(let m=0;m<M;m++){vb.push(pct(monthStats(B,m).Pf,.5));vx.push(pct(monthStats(X,m).Pf,.5))}
  drawBars($("c_exp"),{cats:vb.map((_,i)=>"Month "+(i+1)),series:[{name:"One shop",color:"--s1",vals:vb},{name:T.expType==="outlet"?"With the outlet rule":"With the catering rule",color:"--s2",vals:vx}],values:true,label:"Median monthly profit with and without expansion",
    readout:i=>`Month ${i+1}: one shop ${money(vb[i])} · with expansion ${money(vx[i])}`,def:"Paired runs: each pair shares the same random days."});
}
function swot(){
  const B=A.B,fx=B.fixed,gm=K.ITEM_ORDER.reduce((a,id)=>a+(B.pl.price[id]-unitCost(id))/B.pl.price[id],0)/K.ITEM_ORDER.length;
  const rain=K.WX.rain.w/100,cr=A.credMC||[];
  $("o_swot").innerHTML=`
   <div class="S"><h4>Strengths</h4><ul><li>Average item margin ${P100(gm)} at ${T.k}% of fair</li><li>Tiffin margins of ${P100((B.pl.price.dosa-unitCost("dosa"))/B.pl.price.dosa)} on dosa carry the slow hours</li><li>About ${Math.round(B.cust)} customers on a blended day at ${T.qRep}% reputation</li><li>Median net worth ${money(A.mc.endMed)} by day ${T.horizon}</li></ul></div>
   <div class="W"><h4>Weaknesses</h4><ul><li>${A.nv.item==="milk"?"Milk spoils nightly":"Batter lasts two days"}: the best ${A.nv.item} order still runs short on ${P100(1-A.nv.CR)} of days</li><li>${money(fx.all)} a day of fixed cost before the first tea</li><li>${P100(A.mc.walk)} of customers walk off in the simulation</li><li>Rent lands at month end, so ${P100(A.mc.cr)} of runs need the moneylender</li></ul></div>
   <div class="O"><h4>Opportunities</h4><ul><li>Best price level is ${A.bestK}% of fair</li><li>Best staffing: ${A.bestStaff.ck?"cook":"no cook"} + ${A.bestStaff.n} server${A.bestStaff.n===1?"":"s"} (${money(A.bestStaff.v)}/day)</li><li>Rain (${P100(rain)} of days) lifts tea ×${K.WX.rain.tea} and bajji ×${K.WX.rain.bajji}</li><li>${T.expType==="outlet"?"A second outlet":"Catering"} beats staying put in ${P100(A.exp.win)} of paired runs</li></ul></div>
   <div class="T"><h4>Threats</h4><ul><li>Gas runs dry in ${P100(A.lpg.pc)} of refill cycles at R = ${T.reorder} kg</li><li>Bus strikes halve the crowd; a rival stall cuts it ${Math.round((1-K.RIVAL_ARR)*100)}% for ${K.RIVAL_DAYS} days</li><li>${P100(K.DEFAULT.stranger)} of new faces never pay their khata</li><li>${P100(A.mc.bk)} of runs go bankrupt; inspectors fine dirty kitchens ${money(K.INSPECT.fine)}+</li></ul></div>`;
}

/* ---------- boot ---------- */
function boot(){
  $("brand").innerHTML=tumbler()+`<span>Chai <em>&amp;</em> Tiffin</span>`;
  const au=LS.get(K_AUTO);if(au&&au.v===1&&au.plan){s=au;view="title"}
  render();
  if(tab==="tech")renderTech();
}
boot();
</script>
