<svg width="1000" height="330" viewBox="0 0 1000 330" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" font-size="14">
 <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
 <text x="20" y="24" font-weight="600" fill="#1f5fa8">Level 1 — blend inside each layer</text>
 <g>
  <rect x="20" y="40" width="300" height="58" rx="6" fill="#e9f1fb" stroke="#2a78d6"/>
  <text x="34" y="64" font-weight="600">Layer A (outer)</text><text x="34" y="86" fill="#52514e" font-size="13">e.g. C8-LLDPE + mLLDPE + LDPE</text>
  <rect x="20" y="108" width="300" height="96" rx="6" fill="#fdeee6" stroke="#eb6834"/>
  <text x="34" y="132" font-weight="600">Layer B (core)</text><text x="34" y="154" fill="#52514e" font-size="13">e.g. LLDPE + HDPE + LDPE</text><text x="34" y="174" fill="#52514e" font-size="13">+ CaCO₃ / TiO₂ masterbatch</text>
  <rect x="20" y="214" width="300" height="58" rx="6" fill="#e6f6ef" stroke="#1baf7a"/>
  <text x="34" y="238" font-weight="600">Layer C (inner / seal)</text><text x="34" y="260" fill="#52514e" font-size="13">e.g. mLLDPE + 10 % LDPE</text>
  <text x="20" y="300" fill="#52514e" font-size="13">thickness fractions t<tspan baseline-shift="sub" font-size="10">A</tspan> : t<tspan baseline-shift="sub" font-size="10">B</tspan> : t<tspan baseline-shift="sub" font-size="10">C</tspan> (e.g. 1 : 2 : 1)</text>
 </g>
 <rect x="370" y="40" width="270" height="232" rx="8" fill="#f6f5f1" stroke="#bdbcb6"/>
 <text x="386" y="66" font-weight="600">For each layer</text>
 <text x="386" y="94" font-size="13">1. Expand masterbatches →</text><text x="404" y="112" font-size="13">carrier resin + filler φ</text>
 <text x="386" y="138" font-size="13">2. Power mean of order m</text><text x="404" y="156" font-size="13">(m = 1, 0 or −1 by property)</text>
 <text x="386" y="182" font-size="13">3. + pairwise excess terms</text><text x="404" y="200" font-size="13">(LDPE, HDPE pairs)</text>
 <text x="386" y="226" font-size="13">4. Filler correction</text><text x="404" y="244" font-size="13">(Guth; Nicolais–Narkis)</text>
 <line x1="324" y1="155" x2="364" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
 <line x1="644" y1="155" x2="684" y2="155" stroke="#52514e" stroke-width="2" marker-end="url(#ar)"/>
 <text x="690" y="24" font-weight="600" fill="#1f5fa8">Level 2 — layers in the film</text>
 <rect x="690" y="40" width="290" height="106" rx="8" fill="#e9f1fb" stroke="#2a78d6"/>
 <text x="704" y="64" font-weight="600">Stiffness &amp; strength</text>
 <text x="704" y="88" font-size="13">Iso-strain (parallel): P = Σ tᵢ Pᵢ</text>
 <text x="704" y="110" font-size="13">Density: ρ = Σ tᵢ ρᵢ (exact)</text>
 <text x="704" y="132" font-size="13">Confidence: high</text>
 <rect x="690" y="160" width="290" height="112" rx="8" fill="#fdeee6" stroke="#eb6834"/>
 <text x="704" y="184" font-weight="600">Dart &amp; tear (fracture)</text>
 <text x="704" y="208" font-size="13">Lower: 1 / Σ(tᵢ / Pᵢ)   Upper: Σ tᵢ Pᵢ</text>
 <text x="704" y="230" font-size="13">Central: exp Σ tᵢ ln Pᵢ</text>
 <text x="704" y="252" font-size="13">Confidence: low — screening only</text>
</svg>