<!DOCTYPE html>
<!--
TOOL: World Atlas Explorer
FAMILY: GEO
VERSION: 1.0.0
DATE: 2026-09-26
CHAT: Interactive offline world political map with country economics, rankings and associations
CHANGES: v1.0.0 initial build - map with country panel, sortable rankings, association groups, sources tab
STATUS: Data snapshot from World Bank WDI API (fetched 2026-09-26); boundaries Natural Earth 1:10m India point-of-view
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Atlas Explorer</title>
<style>
:root{
  --bg:#f6f7f9;--panel:#ffffff;--ink:#1b1f24;--ink2:#566070;--ink3:#8a93a1;--line:#e3e6eb;--line2:#d0d5dc;
  --accent:#1f6feb;--accent-soft:#e7f0ff;--sea:#dfeaf3;--land-nodata:#e9e7e2;--border:#ffffff;--sel:#d7263d;--hi:#f2a900;
  --bar:#1f6feb;--bar2:#9bb9ea;--good:#1a7f37;--warn:#b35900;--chip:#eef1f5;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--ink2:#a5b0bd;--ink3:#6e7781;--line:#262d36;--line2:#343c47;
  --accent:#4c9aff;--accent-soft:#152338;--sea:#0f1b27;--land-nodata:#2a2f36;--border:#0e1116;--sel:#ff5a6e;--hi:#ffc233;
  --bar:#4c9aff;--bar2:#2b4a78;--good:#3fb950;--warn:#e3a008;--chip:#20262e;--shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--ink2:#a5b0bd;--ink3:#6e7781;--line:#262d36;--line2:#343c47;
  --accent:#4c9aff;--accent-soft:#152338;--sea:#0f1b27;--land-nodata:#2a2f36;--border:#0e1116;--sel:#ff5a6e;--hi:#ffc233;
  --bar:#4c9aff;--bar2:#2b4a78;--good:#3fb950;--warn:#e3a008;--chip:#20262e;--shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:18px;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap}
header h1 small{font-weight:400;color:var(--ink3);font-size:12px;margin-left:8px}
nav{display:flex;gap:2px;background:var(--chip);padding:3px;border-radius:9px}
nav button{border:0;background:none;padding:6px 14px;border-radius:7px;cursor:pointer;color:var(--ink2);font-weight:550}
nav button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.sp{flex:1}
.iconbtn{border:1px solid var(--line2);background:var(--panel);border-radius:7px;padding:5px 10px;cursor:pointer}
main{flex:1;min-height:0;position:relative}
.tab{display:none;height:100%}
.tab.on{display:flex}
select,input[type=search],input[type=text]{background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:5px 8px;max-width:100%}
label.ck{display:inline-flex;gap:6px;align-items:center;color:var(--ink2);cursor:pointer;white-space:nowrap}
.muted{color:var(--ink3)} .small{font-size:12px}
.num{font-variant-numeric:tabular-nums}

/* ---------- MAP TAB ---------- */
#tab-map{flex-direction:row}
#mapwrap{flex:1;min-width:0;position:relative;display:flex;flex-direction:column}
.toolbar{display:flex;gap:10px;align-items:center;padding:8px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line);background:var(--panel)}
.toolbar .grp{display:flex;gap:6px;align-items:center}
.toolbar select,.rankbar select{width:250px}
.toolbar .lbl{color:var(--ink3);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
#map{flex:1;min-height:0;position:relative;background:var(--sea);overflow:hidden}
#map svg{display:block;width:100%;height:100%;cursor:grab}
#map svg:active{cursor:grabbing}
path.c{stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke;cursor:pointer;transition:opacity .15s}
path.c:hover{filter:brightness(1.08) saturate(1.1)}
path.c.dim{opacity:.18}
path.c.nb{stroke:var(--hi);stroke-width:1.6}
path.c.sel{stroke:var(--sel);stroke-width:2.2}
path.c.gm{stroke:var(--ink);stroke-width:1}
path.sphere{fill:none;stroke:var(--line2);stroke-width:.8;vector-effect:non-scaling-stroke}
path.grat{fill:none;stroke:var(--ink3);stroke-opacity:.18;stroke-width:.5;vector-effect:non-scaling-stroke}
#legend{position:absolute;left:12px;bottom:12px;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:11.5px;box-shadow:var(--shadow);max-width:300px}
#legend .t{font-weight:600;margin-bottom:5px;font-size:12px}
#legend .row{display:flex;align-items:center;gap:6px;line-height:1.6}
#legend .sw{width:14px;height:10px;border-radius:2px;flex:none}
#zoomctl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:4px}
#zoomctl button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;font-size:16px;line-height:1}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font-size:12.5px;box-shadow:var(--shadow);z-index:50;display:none;max-width:280px}
#tip b{font-size:13px}
#panel{width:410px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:0 0 30px}
#panel .empty{padding:40px 26px;color:var(--ink2)}
#panel .empty h3{margin:0 0 8px;color:var(--ink)}
.ph{padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;background:var(--panel);z-index:2}
.flag{width:54px;height:36px;flex:none;border-radius:4px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;background:var(--chip)}
.flag svg{width:100%;height:100%;display:block}
.flag.sm{width:22px;height:15px;font-size:13px;border-radius:2px}
.ph h2{margin:0;font-size:19px;line-height:1.2}
.ph .of{color:var(--ink2);font-size:12.5px}
.sec{padding:12px 18px;border-bottom:1px solid var(--line)}
.sec h4{margin:0 0 8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);font-weight:650;display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.kv .k{color:var(--ink2)}
.kv .v{text-align:right;font-variant-numeric:tabular-nums}
.rk{font-size:10.5px;color:var(--ink3);margin-left:4px;white-space:nowrap}
.yr{font-size:10.5px;color:var(--ink3)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:14px;background:var(--chip);border:1px solid var(--line);font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.pt{border-style:dashed}
.bars .b{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline;margin:7px 0;font-size:12.5px}
.bars .track{grid-column:1 / -1;height:7px;background:var(--chip);border-radius:4px;overflow:hidden}
.bars .fill{height:100%;background:var(--bar);border-radius:5px}
.bars .val{text-align:right;font-variant-numeric:tabular-nums}
.bars .val small{color:var(--ink3)}
.stack{display:flex;height:16px;border-radius:5px;overflow:hidden;margin:6px 0 4px;background:var(--chip)}
.stack div{height:100%}
.note{font-size:11.5px;color:var(--ink3);margin-top:6px}
.big{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--chip);border-radius:8px;padding:8px 10px}
.tile .l{font-size:11.5px;color:var(--ink2)}
.tile .v{font-size:16px;font-weight:650;font-variant-numeric:tabular-nums}
.src{font-size:10.5px;color:var(--ink3)}

/* ---------- RANK TAB ---------- */
#tab-rank,#tab-groups,#tab-src{flex-direction:column;min-height:0}
.rankbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.tblwrap{flex:1;overflow:auto;min-height:0}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.dt th{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line2);padding:8px 10px;text-align:right;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap;z-index:1;user-select:none}
table.dt th.l,table.dt td.l{text-align:left}
table.dt th:hover{color:var(--accent)}
table.dt th.s{color:var(--accent)}
table.dt th .ar{font-size:10px;margin-left:3px}
table.dt td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.dt tr:hover td{background:var(--accent-soft)}
table.dt td.cn{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:550}
table.dt td.cn:hover{color:var(--accent)}
table.dt td.sc{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.minibar{display:inline-block;height:6px;background:var(--bar);border-radius:3px;vertical-align:middle;margin-right:6px;opacity:.75}
.colpick{position:relative}
.colpick .dd{display:none;position:absolute;top:34px;left:0;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);padding:10px 12px;z-index:20;width:560px;max-height:60vh;overflow:auto;columns:2}
.colpick.open .dd{display:block}
.colpick .dd label{display:flex;gap:6px;align-items:center;padding:2px 0;break-inside:avoid;cursor:pointer}
.colpick .dd .gh{font-size:11px;text-transform:uppercase;color:var(--ink3);margin:6px 0 2px;letter-spacing:.5px;break-after:avoid}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{border:1px solid var(--line2);background:var(--panel);border-radius:14px;padding:3px 10px;cursor:pointer;font-size:12.5px}
.presets button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- GROUPS TAB ---------- */
#tab-groups{flex-direction:row}
#glist{width:330px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow-y:auto}
#glist .cat{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);padding:12px 16px 4px;font-weight:650}
#glist .gi{padding:8px 16px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;gap:8px}
#glist .gi:hover{background:var(--accent-soft)}
#glist .gi.on{background:var(--accent-soft);border-left-color:var(--accent)}
#glist .gi b{font-weight:600}
#glist .gi .n{color:var(--ink3);font-size:12px;white-space:nowrap}
#gdetail{flex:1;min-width:0;overflow-y:auto;padding:16px 22px 40px}
#gdetail h2{margin:0 0 2px}
.gstats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0}
.gstats .tile .v{font-size:18px}
#gmini{height:260px;background:var(--sea);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
#gmini svg{width:100%;height:100%}
#gmini path{stroke:var(--border);stroke-width:.4;vector-effect:non-scaling-stroke}
.gnote{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-weight:550}
.btn.ghost{background:transparent;color:var(--accent)}

/* ---------- SOURCES ---------- */
#tab-src{overflow-y:auto;display:none;padding:18px 26px 40px}
#tab-src.on{display:block}
#tab-src h2{margin-top:4px}
#tab-src table{border-collapse:collapse;font-size:13px;width:100%;max-width:1100px}
#tab-src td,#tab-src th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
#tab-src code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:12px}
#tab-src p,#tab-src li{max-width:1000px}

@media (max-width:900px){
  #tab-map{flex-direction:column}
  #panel{width:100%;border-left:0;border-top:1px solid var(--line);height:48%}
  #tab-groups{flex-direction:column}
  #glist{width:100%;height:35%;border-right:0;border-bottom:1px solid var(--line)}
  .colpick .dd{width:92vw;columns:1}
}
</style>
</head>
<body>
<header>
  <h1>World Atlas Explorer <small>offline · data snapshot Sep 2026</small></h1>
  <nav id="tabs">
    <button data-t="map" class="on">Map</button>
    <button data-t="rank">Rankings</button>
    <button data-t="groups">Associations</button>
    <button data-t="src">Sources &amp; notes</button>
  </nav>
  <div class="sp"></div>
  <button class="iconbtn" id="themeBtn" title="Toggle light / dark">◐ Theme</button>
</header>
<main>
<!-- MAP -->
<section class="tab on" id="tab-map">
  <div id="mapwrap">
    <div class="toolbar">
      <div class="grp"><span class="lbl">Colour by</span><select id="metricSel"></select></div>
      <div class="grp"><span class="lbl">Highlight</span><select id="hlSel"><option value="">— none —</option></select></div>
      <div class="grp"><input type="search" id="find" list="clist" placeholder="Find a country or capital…" style="width:220px"><datalist id="clist"></datalist></div>
    </div>
    <div id="map"><div id="legend"></div>
      <div id="zoomctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">−</button><button id="zreset" title="Reset view">⤢</button></div>
    </div>
  </div>
  <aside id="panel"></aside>
</section>

<!-- RANKINGS -->
<section class="tab" id="tab-rank">
  <div class="rankbar">
    <div class="grp"><span class="muted small">SORT BY</span> <select id="rSort"></select>
      <button class="iconbtn" id="rDir" title="Toggle order">↓ High → low</button></div>
    <div class="grp"><span class="muted small">REGION</span> <select id="rReg"><option value="">All</option></select></div>
    <div class="grp"><span class="muted small">GROUP</span> <select id="rGrp"><option value="">All countries</option></select></div>
    <input type="search" id="rFind" placeholder="Filter by name…" style="width:170px">
    <label class="ck"><input type="checkbox" id="rIndep" checked> Sovereign states only</label>
    <label class="ck"><input type="checkbox" id="rHideNA" checked> Hide rows without the sort value</label>
    <div class="colpick" id="colpick"><button class="iconbtn" id="colBtn">Columns ▾</button><div class="dd" id="colDD"></div></div>
    <button class="iconbtn" id="csvBtn" title="Download the current table as CSV">⬇ CSV</button>
    <div class="presets" id="presets"></div>
  </div>
  <div class="tblwrap"><table class="dt" id="rTable"></table></div>
</section>

<!-- GROUPS -->
<section class="tab" id="tab-groups">
  <div id="glist"></div>
  <div id="gdetail"></div>
</section>

<!-- SOURCES -->
<section class="tab" id="tab-src"></section>
</main>
<div id="tip"></div>

/* kind: usd | pct | num | tiv | area | pc ;  get(c) -> [value, year, estimated?] */
const pct = k => c => c[k] ? [c[k][0], c[k][1]] : null;
const usdOf = (k, base='gdp') => c => (c[k] && c[base]) ? [c[k][0] / 100 * c[base][0], c[k][1], true] : null;
const M = {
  pop:   {l:'Population', g:'Basics', kind:'num', get:pct('pop'), src:'POP', code:'SP.POP.TOTL', sch:'Blues', log:true},
  area:  {l:'Area (km²)', g:'Basics', kind:'area', get:c => c.area ? [c.area] : null, src:'WC', sch:'Greens'},
  dens:  {l:'Population density (/km²)', g:'Basics', kind:'num1', get:c => (c.pop && c.area) ? [c.pop[0]/c.area, c.pop[1], true] : null, src:'POP', sch:'Purples'},
  nbn:   {l:'No. of land neighbours', g:'Basics', kind:'int', get:c => [c.nb.length], src:'WC', sch:'Oranges'},
  gdp:   {l:'GDP (US$)', g:'Income', kind:'usd', get:pct('gdp'), src:'NA', code:'NY.GDP.MKTP.CD', sch:'Greens'},

  agrU:  {l:'Agriculture income ≈ US$', g:'Economy by sector', kind:'usd', get:usdOf('agr'), src:'NA', sch:'YlGn'},
  ind:   {l:'Industry (% of GDP)', g:'Economy by sector', kind:'pct', get:pct('ind'), src:'NA', code:'NV.IND.TOTL.ZS', sch:'Oranges'},
  indU:  {l:'Industry income ≈ US$', g:'Economy by sector', kind:'usd', get:usdOf('ind'), src:'NA', sch:'Oranges'},
  srv:   {l:'Services (% of GDP)', g:'Economy by sector', kind:'pct', get:pct('srv'), src:'NA', code:'NV.SRV.TOTL.ZS', sch:'Blues'},
  srvU:  {l:'Services income ≈ US$', g:'Economy by sector', kind:'usd', get:usdOf('srv'), src:'NA', sch:'Blues'},

  expU:  {l:'Govt expense ≈ US$', g:'Expenditure', kind:'usd', get:usdOf('exp'), src:'GFS', sch:'PuRd'},
  mil:   {l:'Defence (% of GDP)', g:'Expenditure', kind:'pct', get:pct('mil'), src:'SIPRI', code:'MS.MIL.XPND.GD.ZS', sch:'Reds'},
  milU:  {l:'Defence spending ≈ US$', g:'Expenditure', kind:'usd', get:usdOf('mil'), src:'SIPRI', sch:'Reds'},

const MK = Object.keys(M);
const val = (c, k) => { const r = M[k].get(c); return r && isFinite(r[0]) ? r : null; };

/* rank tables (sovereign states only) */
const RANK = {};
MK.forEach(k => {
  const arr = C.filter(c => c.indep && val(c, k)).sort((a, b) => val(b, k)[0] - val(a, k)[0]);
  RANK[k] = {n: arr.length, pos: new Map(arr.map((c, i) => [c.id, i + 1]))};
});

/* ============ formatting ============ */
function fUSD(v){ if(v==null) return '—'; const a=Math.abs(v);
  if(a>=1e12) return '$'+(v/1e12).toFixed(2)+' tn'; if(a>=1e9) return '$'+(v/1e9).toFixed(a>=1e11?0:1)+' bn';
  if(a>=1e6) return '$'+(v/1e6).toFixed(0)+' mn'; return '$'+Math.round(v).toLocaleString('en-US'); }
function fNum(v){ if(v==null) return '—'; const a=Math.abs(v);
  if(a>=1e9) return (v/1e9).toFixed(2)+' bn'; if(a>=1e7) return (v/1e6).toFixed(1)+' mn'; return Math.round(v).toLocaleString('en-US'); }
function fTIV(v){ if(v==null) return '—'; if(v>=1e9) return (v/1e9).toFixed(2)+' bn TIV'; return (v/1e6).toFixed(0)+' mn TIV'; }
function fmt(k, r){ if(!r) return '—'; const v=r[0]; switch(M[k].kind){
  case 'usd': return (r[2]?'≈ ':'')+fUSD(v); case 'usd0': return (r[2]?'≈ ':'')+'$'+Math.round(v).toLocaleString('en-US');

  const interp = d3['interpolate' + M[metric].sch] || d3.interpolateBlues;
  const nb = 7; const cols = d3.range(nb).map(i => interp(0.15 + 0.8 * i / (nb - 1)));

function renderRank(){

  const q = document.getElementById('rFind').value.trim().toLowerCase(), indep = document.getElementById('rIndep').checked, hide = document.getElementById('rHideNA').checked;
  const isName = rKey === '__name', isReg = rKey === '__reg';
  let rows = C.filter(c => (!indep || c.indep || (gm && gm.has(c.id))) && (!reg || c.reg === reg) && (!gm || gm.has(c.id)) && (!q || c.n.toLowerCase().includes(q) || (c.cap||'').toLowerCase().includes(q)));

  const arr = k => rKey === k ? `<span class="ar">${rDesc ? '▼' : '▲'}</span>` : '';
  let h = `<thead><tr><th class="l" data-k="__rank">#</th><th class="l ${isName?'s':''}" data-k="__name">Country${arr('__name')}</th><th class="l">Capital</th><th class="l ${isReg?'s':''}" data-k="__reg">Region${arr('__reg')}</th>`;
  rCols.forEach(k => h += `<th data-k="${k}" class="${rKey===k?'s':''}" title="${esc(M[k].l)} — ${esc(SRC[M[k].src])}">${esc(M[k].l)}${arr(k)}</th>`);

  rows.forEach((c, i) => {
    h += `<tr><td class="l muted">${i + 1}</td><td class="l cn" data-go="${c.id}">${flagHTML(c, 1)}${esc(c.n)}</td><td class="l muted">${esc(c.cap)}</td><td class="l muted">${esc(c.sub || c.reg)}</td>`;
    rCols.forEach(k => { const r = val(c, k); const sc = k === rKey;
      h += `<td class="${sc ? 'sc' : ''}" title="${r && r[1] ? 'Year ' + r[1] : ''}">${sc && r && r[0] > 0 ? `<span class="minibar" style="width:${Math.max(2, r[0] / maxv * 60)}px"></span>` : ''}${fmt(k, r)}</td>`; });
    h += `</tr>`;
  });
  h += `</tbody>`;
  const t = document.getElementById('rTable'); t.innerHTML = h;
}
document.getElementById('rTable').addEventListener('click', e => {
  const th = e.target.closest('th[data-k]');
  if (th && th.dataset.k !== '__rank') { const k = th.dataset.k; if (rKey === k) rDesc = !rDesc; else { rKey = k; rDesc = !(k === '__name' || k === '__reg'); } if (M[k]) rSort.value = k; renderRank(); return; }
  const td = e.target.closest('[data-go]'); if (td) selectCountry(td.dataset.go, true);
});
document.getElementById('csvBtn').onclick = () => {
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const head = ['Rank','Country','ISO3','Capital','Region', ...rCols.flatMap(k => [M[k].l, M[k].l + ' year'])];
  const lines = [head.map(q).join(',')];
  rRows.forEach((c, i) => lines.push([i + 1, c.n, c.id, c.cap, c.sub || c.reg, ...rCols.flatMap(k => { const r = val(c, k); return r ? [r[0], r[1] || ''] : ['', '']; })].map(q).join(',')));
  const b = new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `world_ranking_${rKey}.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

/* ============ GROUPS ============ */
let curGroup = null, gRendered = false, gSortK = 'gdp', gDesc = true;
const CATS = [...new Set(GROUPS.map(g => g.cat))];
{ let h = ''; CATS.forEach(cat => { h += `<div class="cat">${esc(cat)}</div>`; GROUPS.filter(g => g.cat === cat).forEach(g => h += `<div class="gi" data-g="${g.id}"><span><b>${esc(g.id)}</b><br><span class="small muted">${esc(g.name !== g.id ? g.name : 'Brazil, Russia, India, China, South Africa + new members')}</span></span><span class="n">${g.m.length}${g.p.length ? ' + ' + g.p.length : ''}</span></div>`); });
  document.getElementById('glist').innerHTML = h; }
document.getElementById('glist').addEventListener('click', e => { const t = e.target.closest('[data-g]'); if (t) selectGroup(t.dataset.g); });
const MINI = { svg: null };
function drawMini(g){
  const el = document.getElementById('gmini'); if (!el) return; const w = el.clientWidth || 700, h = el.clientHeight || 260;
  const set = new Set(g.m), pset = new Set(g.p);
  const feats = FEAT.filter(f => set.has(f.id3) || pset.has(f.id3));
  const pj = d3.geoNaturalEarth1(); const pa = d3.geoPath(pj);
  if (feats.length) pj.fitExtent([[14, 14], [w - 14, h - 14]], {type: 'FeatureCollection', features: feats}); else pj.fitSize([w, h], {type: 'Sphere'});
  const nd = css('--land-nodata'), ac = css('--accent');
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}">${FEAT.map(f => `<path d="${pa(f) || ''}" fill="${set.has(f.id3) ? ac : pset.has(f.id3) ? 'color-mix(in srgb,' + ac + ' 40%,transparent)' : nd}"><title>${esc(f.c ? f.c.n : f.properties.NAME)}</title></path>`).join('')}</svg>`;
}
const GCOLS = ['pop','area','gdp','gdppc','agrU','milU','mil','armx'];
function selectGroup(id){
  const g = GBY.get(id); if (!g) return; curGroup = g;
  document.querySelectorAll('#glist .gi').forEach(x => x.classList.toggle('on', x.dataset.g === id));
  const mem = g.m.map(x => byId.get(x)).filter(Boolean);
  const sum = k => d3.sum(mem, c => (val(c, k) || [0])[0]);
  const wS = k => d3.sum(C.filter(c => c.indep), c => (val(c, k) || [0])[0]);
  const share = (k) => (sum(k) / wS(k) * 100).toFixed(1) + '% of world';
  let h = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><div><h2>${esc(g.id)}${g.name !== g.id ? ' — ' + esc(g.name) : ''}</h2>
    <div class="muted">${esc(g.cat)}${g.est ? ' · founded ' + g.est : ''}${g.hq && g.hq !== '—' ? ' · secretariat/HQ: ' + esc(g.hq) : ''} · ${g.m.length} members${g.p.length ? ' + ' + g.p.length + ' partners' : ''}</div></div>
    <button class="btn" id="gOnMap">Show on world map</button></div>`;
  if (g.note) h += `<div class="gnote">${esc(g.note)}</div>`;
  h += `<div class="gstats">
    <div class="tile"><div class="l">Combined population</div><div class="v">${fNum(sum('pop'))}</div><span class="rk">${share('pop')}</span></div>
    <div class="tile"><div class="l">Combined GDP</div><div class="v">${fUSD(sum('gdp'))}</div><span class="rk">${share('gdp')}</span></div>
    <div class="tile"><div class="l">Combined area</div><div class="v">${fNum(sum('area'))} km²</div><span class="rk">${share('area')}</span></div>
    <div class="tile"><div class="l">Combined defence spend</div><div class="v">≈ ${fUSD(sum('milU'))}</div><span class="rk">${share('milU')}</span></div>
    <div class="tile"><div class="l">Agriculture income</div><div class="v">≈ ${fUSD(sum('agrU'))}</div><span class="rk">${share('agrU')}</span></div>
    <div class="tile"><div class="l">Arms exports</div><div class="v">${fTIV(sum('armx'))}</div><span class="rk">${share('armx')}</span></div>
  </div><div id="gmini"></div>
  <h3 style="margin:18px 0 6px">Member countries</h3><div class="tblwrap" style="overflow:auto"><table class="dt" id="gTable"></table></div>`;
  if (g.p.length) h += `<h3 style="margin:18px 0 6px">Partner countries</h3><div class="chips">${g.p.map(x => { const c = byId.get(x); return c ? `<span class="chip pt" data-go="${x}">${flagHTML(c, 1)}${esc(c.n)}</span>` : ''; }).join('')}</div>`;
  h += `<div class="note" style="margin-top:14px">Totals are sums over full members with available data; “≈” values are share-of-GDP × GDP. Membership as of mid-2026.</div>`;
  const D = document.getElementById('gdetail'); D.innerHTML = h; D.scrollTop = 0;
  document.getElementById('gOnMap').onclick = () => { hs.value = id; hlGroup = id; applyClasses(); showTab('map'); };
  drawMini(g); renderGTable();
}
function renderGTable(){
  const g = curGroup; const mem = g.m.map(x => byId.get(x)).filter(Boolean);
  mem.sort((a, b) => { if (gSortK === '__name') return gDesc ? b.n.localeCompare(a.n) : a.n.localeCompare(b.n);
    const x = (val(a, gSortK) || [null])[0], y = (val(b, gSortK) || [null])[0]; if (x == null) return 1; if (y == null) return -1; return gDesc ? y - x : x - y; });
  const arr = k => gSortK === k ? `<span class="ar">${gDesc ? '▼' : '▲'}</span>` : '';
  let h = `<thead><tr><th class="l">#</th><th class="l" data-k="__name">Country${arr('__name')}</th><th class="l">Capital</th>${GCOLS.map(k => `<th data-k="${k}" class="${gSortK===k?'s':''}">${esc(M[k].l)}${arr(k)}</th>`).join('')}</tr></thead><tbody>`;
  mem.forEach((c, i) => h += `<tr><td class="l muted">${i+1}</td><td class="l cn" data-go="${c.id}">${flagHTML(c, 1)}${esc(c.n)}</td><td class="l muted">${esc(c.cap)}</td>${GCOLS.map(k => `<td class="${gSortK===k?'sc':''}">${fmt(k, val(c, k))}</td>`).join('')}</tr>`);
  document.getElementById('gTable').innerHTML = h + '</tbody>';
}
document.getElementById('gdetail').addEventListener('click', e => {
  const th = e.target.closest('th[data-k]'); if (th) { const k = th.dataset.k; if (gSortK === k) gDesc = !gDesc; else { gSortK = k; gDesc = k !== '__name'; } renderGTable(); return; }
  const t = e.target.closest('[data-go]'); if (t) selectCountry(t.dataset.go, true);
});

/* ============ SOURCES TAB ============ */
(function(){
  let rows = MK.filter(k => M[k].code).map(k => { const n = C.filter(c => c.indep && val(c, k)).length; const yrs = C.map(c => val(c, k)).filter(Boolean).map(r => r[1]).filter(Boolean);
    const my = yrs.length ? d3.mode(yrs) : ''; return `<tr><td>${esc(M[k].l)}</td><td><code>${M[k].code}</code></td><td>${esc(SRC[M[k].src])}</td><td class="num">${n}</td><td class="num">${my}</td></tr>`; }).join('');
  document.getElementById('tab-src').innerHTML = `<h2>Sources &amp; method notes</h2>
  <p>All figures are embedded in this file — nothing is fetched at run time. Economic indicators were pulled from the <b>World Bank World Development Indicators API</b> on ${BUILD}, taking each country's <i>most recent available year</i> (values older than 2010 are dropped). The year is shown next to each figure.</p>
  <table><thead><tr><th>Indicator</th><th>WDI code</th><th>Original source</th><th>Sovereign states with data</th><th>Most common year</th></tr></thead><tbody>${rows}
  <tr><td>Capital, area, land borders, currency, languages</td><td>—</td><td>${SRC.WC}</td><td class="num">${C.filter(c=>c.indep).length}</td><td></td></tr></tbody></table>
  <h3>Derived values</h3><ul>
  <li><b>“≈ US$” values</b> (revenue, expense, defence, health, education, R&amp;D, investment, sector income) = the indicator's % of GDP × the country's latest GDP in current US$. Where the two years differ this is an approximation.</li>
  <li><b>Interest payments % of GDP</b> = interest (% of revenue) × revenue (% of GDP). <b>Employee pay % of GDP</b> = compensation (% of expense) × expense (% of GDP).</li>
  <li><b>Government revenue, tax and expense</b> follow the IMF GFS definitions published by the World Bank, which for many countries cover <b>central government only</b>. Federal countries (India, USA, Germany, Brazil…) therefore show lower figures than their consolidated general-government budgets.</li>
  <li><b>Infrastructure</b>: there is no globally uniform dataset of government infrastructure outlays. Gross capital formation (economy-wide investment in buildings, machinery, roads, etc.) is shown as the closest comparable proxy and is labelled as such.</li>
  <li><b>Defence exports</b> are SIPRI Trend-Indicator Values (TIV) — a measure of the volume of major conventional weapons transferred, expressed in constant 1990 US$ units; they are not financial sales values.</li>
  <li><b>Rankings</b> (#n of N) are computed among sovereign states with data for that indicator.</li></ul>
  <h3>Boundaries</h3><p>Country outlines are Natural Earth 1:10m Admin-0 boundaries, <b>India point-of-view edition</b> (Jammu &amp; Kashmir including Gilgit-Baltistan and Aksai Chin shown as part of India), simplified for size. Other disputed areas follow that edition's depiction. Boundaries are for reference only and are not an authoritative depiction.</p>
  <h3>Associations</h3><p>${GROUPS.length} groupings, membership as of mid-2026, compiled from organisation websites; notable recent changes (BRICS 2024–25 expansion and partner tier, ASEAN–Timor-Leste 2025, SCO–Belarus 2024, Sahel states leaving ECOWAS 2025, Bulgaria joining the euro 2026) are included. Check the organisations' own sites for later changes.</p>
  <p class="muted small">Libraries embedded: d3 v7 (ISC), topojson-client (ISC). Country metadata: world-countries (ODbL). Map data: Natural Earth (public domain). Economic data: World Bank WDI (CC BY 4.0).</p>`;
})();

emptyPanel(); resizeMap(); recolor(); applyClasses(); renderRank();
</script>
